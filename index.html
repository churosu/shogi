/* ふつう・つよいモード：探索結果(ssBestMove)を aiExecutePlan が解釈できる形へ変換 */
/* 探索でモデル化済みの能力を持つ駒（これ以外は能力をヒューリスティックで補完） */
const SS_ABILITY_MODELED=new Set(["kyuhei","sogeki","jusoshi","bakudan","miko","wanashi","jutsushi","kusushi","chokyo","seishoku","majo","akuryo","ninja","esper","uchujin","ryoushu","sagishi","gunshi","kami","inseki","kitsune"]);
/* (tr,tc) へちょうど n 歩で行く経路（寄り道・戻りを含む）。罠がありそうなマスを避ける経路を優先 */
function aiExactPath(p,tr,tc,n){
  const dirs=moveDirs(p);
  let best=null,bestRisk=Infinity;
  const path=[];
  const dfs=(r,c,k,risk)=>{
    if(Math.max(Math.abs(r-tr),Math.abs(c-tc))>n-k)return;   // 届かない枝は打ち切り
    if(k===n){ if(r===tr&&c===tc&&risk<bestRisk){bestRisk=risk;best=path.slice();} return; }
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(!inB(nr,nc))continue;
      const occ=visAt(nr,nc,p.owner); if(occ&&occ.id!==p.id)continue;
      if(wallAt(nr,nc)||territoryBlocks(p.owner,nr,nc))continue;
      if(!colorOk(p.owner,p.id,nr,nc))continue;
      path.push([nr,nc]); dfs(nr,nc,k+1,risk+(p.owner==="E"?trapProbAt(nr,nc):0)); path.pop();
    }
  };
  dfs(p.r,p.c,0,0);
  return best;
}
function deepPlanFromRes(res){
  if(!res||!res.plan)return {plan:null, resign:!!(res&&res.resign)};
  const best=res.plan;
  const p=byId(best.pieceId);
  if(!p)return {plan:null, resign:res.resign};
  const reach=reachWithPaths(p);
  const key=best.destR+","+best.destC;
  let path=[],jump=false;
  let hops=null;
  if(reach[key]){ path=reach[key].path||[]; jump=!!reach[key].jump; hops=reach[key].hops||null; }
  else{ path=[]; }
  // 行動力を使い切るルール：最短経路で行動力が余るなら、寄り道してちょうど使い切る経路にする
  const needFull=!(SS_WAITERS.has(p.type)||p.type==="boken"||(p.type==="taka"&&jump));
  const apUsing=best.ability&&!["slow","bind"].includes(best.ability.kind);
  if(needFull&&!jump&&!apUsing&&path.length<p.ap){
    const ex=aiExactPath(p,best.destR,best.destC,p.ap);
    if(ex)path=ex;
  }
  let ability=best.ability;
  if(!ability && !SS_ABILITY_MODELED.has(p.type)){
    ability=heuristicAbilityFor(p, best.destR, best.destC);
  }
  return {plan:{pieceId:best.pieceId, path, jump, hops, ability, attack:best.attack, score:0}, resign:res.resign};
}
function deepPlan(){
  return deepPlanFromRes(ssBestMove(aiDepth));
}
function deepPlanAsync(onDone){
  ssBestMoveAsync(aiDepth, res=>onDone(deepPlanFromRes(res)));
}
/* つよいモード：有用な手を5候補に絞り、各手を15手先まで相手の応手も含めて徹底検証。
   自分が指した後の相手の立場での最善応手まで読み切り、最終結果が最良の手を選ぶ。 */
function deepPlanStrongAsync(onDone){
  ssBestMoveStrongAsync(res=>onDone(deepPlanFromRes(res)));
}
function ssBestMoveStrongAsync(onDone){
  ssNodeCap=SS_NODE_CAP_STRONG;
  const prep=ssBestPrepare();
  if(!prep){onDone({resign:false, plan:null, allLose:false});return;}
  const {applied, fbPlan}=prep;
  const STRONG_BUDGET=ssBudget(19000,29000);   // 全体で最大約19秒。相手の打てる手が多い局面は最大約29秒まで延ばす
  const WIDE_BUDGET=Math.round(STRONG_BUDGET*7/19); // 全候補を読む段の目安（ふつうモード以上の深さを先に確保）
  const NARROW_N=5;                        // 以降は上位この数の候補に絞って深く読む
  const t0=performance.now();
  const overallDeadline=t0+STRONG_BUDGET;
  ssDeadline=overallDeadline;
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  let active=order.slice();               // いま読んでいる候補
  let narrowed=false;
  const valById={};
  let depth=2, lastDone=0, lastDoneMs=0;
  aiThinkBegin(prep);
  const step=()=>{
    const now=performance.now();
    if(depth>AI_DEPTH_STRONG || now>overallDeadline){ finish(); return; }
    // 全候補で次の段を読む時間が足りなさそうなら（次の段は数倍かかるため早めに）、上位候補に絞る
    if(!narrowed && depth>4 && active.length>NARROW_N && (now-t0>WIDE_BUDGET || lastDoneMs*8>overallDeadline-now)){
      active=active.slice(0,NARROW_N); narrowed=true;
    }
    const s=performance.now();
    ssRunDepthAsync(applied, depth, active, valById, r=>{
      active=r.newOrder.filter(i=>active.includes(i));
      if(r.completedAny && r.localPlan){
        bestPlan=r.localPlan;
        aiThinkDepth(r, depth, !ssAbort);
        if(r.localBest>=1e6){ finish(); return; }
      }
      if(ssAbort){ finish(); return; }       // 時間切れ（途中まで読めた分は反映済み）
      lastDone=depth; lastDoneMs=performance.now()-s;
      depth++;
      setTimeout(step,0); // 描画に譲ってから次の深さへ
    });
  };
  const finish=()=>{
    G.aiLastDepth=lastDone;
    const evaluated=active.map(i=>valById[i]).filter(v=>v!==undefined);
    const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
    onDone({resign:allLose, plan:bestPlan, allLose});
  };
  setTimeout(step,0);
}
/* 指定駒が dest に移動した「と仮定して」最も有効な能力を1つ選ぶ（簡易） */
/* 魔女の入替プラン：味方同士 or 敵同士を入れ替えて最も得をする組を選ぶ */
function witchPlan(witch){
  const eAll=alive("E").filter(p=>p.id!==witch.id);
  const pAll=alive("P").filter(p=>!p.flags.invisible);
  // あるマスがプレイヤーの通常攻撃圏内か（簡易判定）
  const inDanger=(r,c)=>{
    for(const f of pAll){
      const dr=Math.abs(f.r-r), dc=Math.abs(f.c-c), man=dr+dc;
      if(f.flags.noAttack)continue; // 封じ中は脅威が薄い
      if(f.type==="kyuhei"&&man<=2)return true;
      if(f.type==="sogeki"&&dr===dc&&dr<=3)return true;
      if(f.type==="souhei"){ if(dr===1&&dc===1)return true; continue; } // 槍兵：斜めのみ
      if(man===1)return true; // 通常隣接
    }
    return false;
  };
  const risk=p=>(inDanger(p.r,p.c)?1:0)*(4-p.hp);
  const distTo=(r,c)=>{let m=99;for(const f of pAll)m=Math.min(m,Math.abs(f.r-r)+Math.abs(f.c-c));return m;};
  // その位置(r,c)から、そのターンのうちに通常攻撃で敵を討てるか＆火力を評価
  const attackValueAt=(piece,r,c)=>{
    if(!SS_ATTACKER.has(piece.type))return 0;
    const dmg=ssAtk({t:piece.type,hp:piece.hp,heroBoost:piece.flags.heroBoost},"melee")||1;
    let val=0;
    const dirs=piece.type==="souhei"?DIAG:ORTHO;
    for(const [dr,dc] of dirs){
      const f=pAll.find(x=>x.r===r+dr&&x.c===c+dc);
      if(!f)continue;
      // 入替直後に通常攻撃できる（swap→attack→相手ターンの順）
      let s=dmg*8;
      if(f.hp-dmg<=0)s+=30;                 // 討ち取れるなら大きく加点
      if(piece.type==="kyuketsuki")s+=6;    // 吸血鬼：攻撃しつつ回復
      if(piece.type==="kusushi")s+=4;       // 薬師：毒で攻撃＋味方回復運用
      val=Math.max(val,s);
    }
    return val;
  };
  let best=null,bestGain=0.5; // しきい値：少しでも得なら使う
  // (a) 味方ペア入替：危険な味方を安全マスへ退避、かつ火力の高い駒を前線(敵隣接)へ出撃させる
  for(let i=0;i<eAll.length;i++)for(let j=i+1;j<eAll.length;j++){
    const a=eAll[i],b=eAll[j];
    const before=risk(a)+risk(b);
    const afterA=(inDanger(b.r,b.c)?1:0)*(4-a.hp);
    const afterB=(inDanger(a.r,a.c)?1:0)*(4-b.hp);
    const after=afterA+afterB;
    // 攻撃役ほど、また攻撃力(ssAtk)が高いほど前線(敵に近い)へ出す価値を重視
    const atkVal=p=>{const g={t:p.type,hp:p.hp,heroBoost:p.flags.heroBoost}; return SS_ATTACKER.has(p.type)?(ssAtk(g,"melee")||1):0;};
    const aggrBefore = atkVal(a)*(-distTo(a.r,a.c)) + atkVal(b)*(-distTo(b.r,b.c));
    const aggrAfter  = atkVal(a)*(-distTo(b.r,b.c)) + atkVal(b)*(-distTo(a.r,a.c));
    // 入替後、火力駒が敵隣接に来て即攻撃できるなら大きく加点（剣士/戦士/覚醒勇者/薬師/吸血鬼の出撃）
    const strikeGain = Math.max(attackValueAt(a,b.r,b.c), attackValueAt(b,a.r,a.c)) * 0.15;
    const gain=(before-after)+(aggrAfter-aggrBefore)*0.35 + strikeGain;
    if(gain>bestGain){bestGain=gain;best={kind:"swap",aId:a.id,bId:b.id};}
  }
  // (b) 敵ペア入替：脆い敵をこちらの攻撃役の隣（＝攻撃圏の先頭）へ引き出して討ち取る
  for(let i=0;i<pAll.length;i++)for(let j=i+1;j<pAll.length;j++){
    const a=pAll[i],b=pAll[j];
    const myAtk=eAll.filter(e=>SS_ATTACKER.has(e.type));
    // その駒を、味方アタッカーが「そのターンに討ち取れる」位置に置けるか
    const killableAt=(victim,r,c)=>{
      for(const e of myAtk){
        if(Math.abs(e.r-r)+Math.abs(e.c-c)!==1)continue;
        const dmg=ssAtk({t:e.type,hp:e.hp,heroBoost:e.flags.heroBoost},"melee")||1;
        if(victim.hp-dmg<=0)return true;      // 入替先で撃破可能
      }
      return false;
    };
    // a を b の位置へ、または b を a の位置へ入れ替えたとき討ち取れるか
    let gain=0;
    if(killableAt(a,b.r,b.c)) gain=Math.max(gain, 2.0+(3-a.hp)*0.5); // 敵を攻撃圏の先頭へ
    if(killableAt(b,a.r,a.c)) gain=Math.max(gain, 2.0+(3-b.hp)*0.5);
    if(gain>bestGain){bestGain=gain;best={kind:"swap",aId:a.id,bId:b.id};}
  }
  return best;
}
const SS_ATTACKER=new Set(["kenshi","senshi","kiba","souhei","kyuketsuki","yusha","ninja","fushicho","kusushi"]);

/* 戦法シート由来の駒タイプ（役割）。数値は「前線へ出る度合い」の係数。
   出撃=前線で戦う / 強襲=積極的に距離を詰める / 迎撃=待ち構える / 牽制=後衛で支援・妨害 */

  souhei:"sortie", fushicho:"sortie", kyuketsuki:"sortie", yusha:"sortie", kemono:"sortie",

  kyuhei:"intercept", sogeki:"intercept",
  // 牽制（後衛で支援・妨害・盤面操作）
  jutsushi:"control", wanashi:"control", chokyo:"control", gunshi:"control",
  jusoshi:"control", miko:"control", esper:"control", seishoku:"control",

  kaizoku:"assault",    // 海賊：8方向機動の攻撃役
  taka:"assault",       // 鷹：8方向＋跳躍の機動役
  inseki:"control",     // 隕石：遠隔砲撃（流星群）型の後衛

  ryoushu:"sortie",     // 領主：近接＋領地化

  kami:"sortie"         // 神：近接＋超越

// 爆弾からの退避優先度（駒の価値）：高価値ほど強く逃がす

/* プレイヤー駒 f が次の手番に「移動→通常攻撃」で与えうる最大脅威を点数化。
   AI駒を撃破できるなら特大、ダメージのみなら中程度。悪霊の標的選定に使う。 */
function playerMeleeThreat(f){
  if(PIECES[f.type].noNormal||f.flags.invisible)return 0;
  const aiPieces=alive("E");
  if(!aiPieces.length)return 0;
  // f が到達しうるマス（行動力ぶん）＋その場
  const spots=reachSquares(f,f.maxAp,true);
  spots.push([f.r,f.c]);
  let best=0;
  for(const [mr,mc] of spots){
    const ghost={...f,r:mr,c:mc};
    // 移動先からの通常攻撃対象マス
    let dirs;
    if(f.type==="souhei")dirs=DIAG;
    else dirs=ORTHO;
    const dmg=atkDamage(ghost,"melee");
    for(const [dr,dc] of dirs){
      const tr=mr+dr, tc=mc+dc;
      const victim=aiPieces.find(e=>e.r===tr&&e.c===tc);
      if(!victim)continue;
      // 盾の防御方向は軽減されるが簡易化
      let score = dmg*45;                 // 与ダメージ
      if(victim.hp-dmg<=0) score += 260;  // 撃破できる位置は極めて危険
      score += (3-Math.max(0,victim.hp-dmg))*15; // 瀕死に追い込むほど加点
      if(score>best)best=score;
    }
  }
  return best;
}

function heuristicAbilityFor(p,dr,dc){
  const foes=alive("P").filter(f=>!f.flags.invisible);
  const allies=alive("E").filter(f=>f.id!==p.id);
  const adj=(r,c)=>ORTHO.some(([a,b])=>r+a===dr&&c+b===dc);
  switch(p.type){
    case "jutsushi":{ // 行動阻害（行0）：最も行動力の高い敵を狙う
      if(!foes.length)return null;
      // 相手が魔女を持つなら、魔女自身の行動力を奪う＝そもそも入れ替えさせないのが最有力。
      const witch=foes.find(f=>f.type==="majo");
      if(witch)return {kind:"slow",targetId:witch.id};
      // 調教師は自分では戦わない。獣がいるなら調教師ではなく獣を止める
      const pool=foes.filter(f=>!(f.type==="chokyo"&&foes.some(b=>b.type==="kemono"&&b.flags.beastOf===f.id)));
      const t=(pool.length?pool:foes).slice().sort((a,b)=>(b.maxAp-a.maxAp)||((b.type==="kemono")-(a.type==="kemono")))[0];
      return {kind:"slow",targetId:t.id};
    }
    case "akuryo":{ // 攻撃封じ（行0）：通常攻撃の脅威が突出して高い駒のみを封じる
      if(!foes.length)return null;
      // 各プレイヤー駒の「次の手番の通常攻撃脅威」を算出
      let bestFoe=null, bestThreat=0;
      for(const f of foes){
        if(PIECES[f.type].noNormal)continue; // 通常攻撃しない駒は封じても無意味
        const th=playerMeleeThreat(f);
        if(th>bestThreat){bestThreat=th;bestFoe=f;}
      }
      // 脅威が高い（＝AI駒を撃破しうる／大ダメージ）場合のみ発動。低ければ移動を優先
      if(bestFoe && bestThreat>=100) return {kind:"bind",targetId:bestFoe.id};
      return null;
    }
    case "kusushi":{ // 薬師：①隣接敵を毒1で倒せるなら最優先 ②瀕死の味方を回復 ③隣接敵に毒
      const adjFoes=foes.filter(f=>Math.abs(f.r-dr)+Math.abs(f.c-dc)===1);
      // ①トドメ：毒1ダメで撃破できる敵（HP<=1。不死鳥の初回復活は考慮）
      const lethal=adjFoes.filter(f=>f.hp<=1&&!(f.type==="fushicho"&&!f.flags.phoenix))
                          .sort((a,b)=>a.hp-b.hp)[0];
      if(lethal)return {kind:"poison",targetId:lethal.id};
      // ②瀕死の味方を回復
      const hurt=allies.filter(a=>a.hp<3&&Math.abs(a.r-dr)+Math.abs(a.c-dc)===1)
                        .sort((a,b)=>a.hp-b.hp)[0];
      if(hurt)return {kind:"heal",targetId:hurt.id};
      // ③それ以外は隣接敵に毒（HPの低い順）
      const en=adjFoes.sort((a,b)=>a.hp-b.hp)[0];
      if(en)return {kind:"poison",targetId:en.id};
      return null;
    }
    case "wanashi":{ // 罠師：移動後の周囲8マスで、敵に最も近い空きマスに罠を設置
      const mine=G.traps.filter(t=>t.setter===p.id).length;
      const cells=ALL8.map(([a,b])=>[dr+a,dc+b])
        .filter(([r,c])=>inB(r,c)&&!at(r,c)&&!G.traps.some(t=>t.r===r&&t.c===c));
      if(!cells.length||!foes.length)return null;
      const distF=(r,c)=>{let m=99;for(const f of foes)m=Math.min(m,Math.abs(f.r-r)+Math.abs(f.c-c));return m;};
      cells.sort((A,B)=>distF(A[0],A[1])-distF(B[0],B[1]));
      const best=cells[0];
      if(distF(best[0],best[1])<=2 || mine<2){
        return {kind:"trap",tr:best[0],tc:best[1]};
      }
      return null;
    }
    case "majo":{ // 魔女：リスク回避 or 有利対面構築のための入替
      return witchPlan(p);
    }
    case "chokyo":{ // 調教師：敵との間に獣を召喚して対面戦闘。先制を取れる位置を最優先
      if(!foes.length)return null;
      const hasBeast=alive("E").some(b=>b.type==="kemono"&&b.flags.beastOf===p.id);
      if(hasBeast)return null;                 // 獣は盤面に1体まで
      if(p.ap<1)return null;
      // 召喚候補：調教師の隣接空きマス（獣は移動先ではなく現在位置周りに湧く）
      const cells=ORTHO.map(([a,b])=>[p.r+a,p.c+b]).filter(([r,c])=>inB(r,c)&&!at(r,c));
      if(!cells.length)return null;
      // 各候補を「召喚した獣がそのターンに先制攻撃できるか」「敵に近いか」で評価
      let best=null,bestScore=-1e9;
      for(const [r,c] of cells){
        let score=0;
        // 敵に近い（＝間に置いて対面できる）ほど良い
        let md=99;for(const f of foes)md=Math.min(md,Math.abs(f.r-r)+Math.abs(f.c-c));
        score-=md*10;
        // その位置から獣(ORTHO隣接)が先制攻撃できる敵がいれば大きく加点
        for(const f of foes){
          if(Math.abs(f.r-r)+Math.abs(f.c-c)===1){
            score+=120;                        // 召喚即先制の好位置
            if(f.hp<=1)score+=150;             // HP1の敵を先手で仕留められる
          }
        }
        if(score>bestScore){bestScore=score;best=[r,c];}
      }
      if(best)return {kind:"summon",sr:best[0],sc:best[1]};
      return null;
    }
    case "yusha":{ // 勇者：魔王が退場していれば近接特攻はsim側で扱う。ここでは何もしない
      return null;
    }
    case "miko":{ // 巫女：味方に+1行動。撤退／追撃／遠距離射撃／討ち取りを後押しする（HP0.5消費）
      if(p.ap<1||p.hp<=0.5)return null;
      if(dr!==p.r||dc!==p.c)return null; // 巫女が移動すると行動力が残らず神楽を使えない
      const allies2=alive("E").filter(a=>a.id!==p.id&&a.type!=="miko");
      if(!allies2.length)return null;
      const threat=playerThreatMap();
      const enemyHasWitch=alive("P").some(f=>f.type==="majo");
      const foesV=alive("P").filter(f=>!f.flags.invisible);
      let best=null,bestScore=0;
      for(const a of allies2){
        const danger=threat[a.r*6+a.c]||0;
        let score=0;
        // ① 危険な位置の瀕死味方に+1行動＝早急に撤退させる
        if(a.hp<=1)score+=60;
        else if(a.hp<=1.5)score+=30;
        if(danger>0)score+=danger*40;
        if(enemyHasWitch)score+=25;
        // ② 遠距離駒（弓兵・狙撃手）に+1行動＝移動後に射撃 or 2回射撃できる
        if(a.type==="kyuhei"||a.type==="sogeki"){
          // 射程に敵がいる（すぐ撃てる）なら特に価値大（+1行動でもう一度撃つ／動いて撃つ）
          let canHit=false;
          for(const f of foesV){
            const inr=ssRangedCells({t:a.type,o:"E"},a.r,a.c).some(([rr,cc])=>rr===f.r&&cc===f.c);
            if(inr){canHit=true;break;}
          }
          score+= canHit?55:30;
        }
        // ③ 近接強駒に+1行動＝距離を詰めて先手／追撃、あるいは討ち取り
        if(["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(a.type)){
          const dmg=ssAtk({t:a.type,hp:a.hp,heroBoost:a.flags.heroBoost},"melee")||1;
          let md=99,tgt=null;
          for(const f of foesV){if(f.type==="kemono")continue;const d=Math.abs(a.r-f.r)+Math.abs(a.c-f.c);if(d<md){md=d;tgt=f;}}
          if(tgt){
            if(tgt.hp-dmg<=0 && md<=(a.maxAp||1)+1)score+=50; // +1行動で討ち取り圏に入る
            else if(md<=3)score+=25;                           // 距離を詰めて先手
          }
        }
        // 実際に動ける（隣接に空きがある）味方のみ有効
        const canMove=ORTHO.some(([dr,dc])=>inB(a.r+dr,a.c+dc)&&!at(a.r+dr,a.c+dc));
        if(!canMove && !(a.type==="kyuhei"||a.type==="sogeki"))score-=100;
        if(score>bestScore){bestScore=score;best=a;}
      }
      if(best&&bestScore>=40)return {kind:"kagura",targetId:best.id};
      return null;
    }
    case "seishoku":{ // 聖職者：味方全体のHP+0.5（1ゲーム1回）。急ぎの用が無い時に使う
      if(p.ap<1||p.flags.prayUsed)return null;
      const allies=alive("E").filter(a=>a.id!==p.id);
      if(!allies.length)return null;
      // 回復で「確定数（撃破に要する通常攻撃回数）」がズレる駒の数を数える。
      // HPが 0.5 増えると倒されにくくなる駒（＝端数がちょうど有効になる駒）を重視。
      let benefit=0, healable=0;
      for(const a of allies){
        if(a.hp>=3)continue;              // 満タンは回復されない（上限3）
        healable++;
        benefit+=1;                       // 1体でも回復価値あり
        // HPが .5 の端数を持つ／整数になる駒は確定数がズレやすい＝価値大
        const afterHp=Math.min(3,a.hp+0.5);
        if(Math.floor(afterHp)>Math.floor(a.hp))benefit+=1.2; // 整数の壁を越える＝耐久1段UP相当
        // 吸血鬼はHP2以下で使ってほしい（延命価値が高い）
        if(a.type==="kyuketsuki"&&a.hp<=2)benefit+=2.5;
        // 不死鳥が瀕死なら、復活させるより先に回復して延命する価値が高い
        if(a.type==="fushicho"&&a.hp<=1.5)benefit+=2.5;
      }
      if(healable===0)return null;
      // 複数体を同時回復できるほど加点（一度きりの祈祷を活かす）
      if(healable>=3)benefit+=2;
      else if(healable>=2)benefit+=1;
      // 「他に急務がない」判定：撃破できる隣接敵や、撃破されそうな味方の緊急退避が無いか
      const threat=playerThreatMap();
      const hasUrgentKill=alive("E").some(a=>{
        if(SS.noNormal.has(a.type)||a.flags.noAttack)return false;
        return ORTHO.some(([dr,dc])=>{const f=at(a.r+dr,a.c+dc);return f&&f.owner==="P"&&!SS.noNormal.has(a.type)&&f.hp<=(ssAtk({t:a.type,hp:a.hp,heroBoost:a.flags.heroBoost},"melee")||1);});
      });
      const hasUrgentFlee=alive("E").some(a=>{const d=threat[a.r*6+a.c]||0;return d>0&&a.hp-d<=0;});
      if(hasUrgentKill||hasUrgentFlee)return null; // 急務がある時は祈祷しない
      if(benefit>=2)return {kind:"pray"};
      return null;
    }
    case "ninja":{ // 忍者：透明化（相手手番終了まで被弾無効）。透明化してから移動して安全に攻める
      if(p.ap<1||p.flags.invisible)return null;
      // すでに敵を討てる隣接位置なら、透明化より攻撃を優先（透明中は通常攻撃不可）
      const canStrike=ORTHO.some(([dr,dc])=>{const f=at(p.r+dr,p.c+dc);return f&&f.owner==="P"&&!f.flags.invisible;});
      if(canStrike)return null;
      // 敵陣・前線へ切り込む価値があるほど透明化して前進したい。
      // 近くに敵がいて危険、または敵陣へ潜り込めば先手を取れる状況で使う。
      const dmin=(()=>{let m=99;for(const f of alive("P"))if(!f.flags.invisible)m=Math.min(m,Math.abs(p.r-f.r)+Math.abs(p.c-f.c));return m;})();
      if(dmin<=4)return {kind:"vanish"}; // 敵が射程圏内＝透明化して安全に間合いを詰める
      return null;
    }
    default:
      return null; // 罠師/爆弾魔/軍師/魔女/超能力者/不死鳥 等は移動・通常攻撃で運用
  }
}

/* =========================================================
   深層探索：アルファベータ探索（ふつう10手／つよい15手先読み）
   独立した軽量シミュレータ上で手番交代を含む先読みを行う。
   サポート駒：剣士/弓兵/騎馬/戦士/盾兵/狙撃手/吸血鬼/呪詛師
   （AIプール＝この8種なので全手を厳密展開できる）
   ========================================================= */
const SS={ // 静的データ（全24種対応）
  // 通常攻撃を持たない駒
  noNormal:new Set(["kyuhei","sogeki","miko","chokyo","majo","inseki"]),
  // 遠距離攻撃を「能力」として撃てる駒（探索で展開）
  ranged:new Set(["kyuhei","sogeki"]),
  // 行動力2の駒（騎馬・忍者・冒険者）
  ap2:new Set(["kiba","ninja","boken"]),
};
const SS_MAXAP={kiba:2,ninja:2,boken:2};
function ssClone(st){
  return {
    side:st.side, kP:st.kP, kE:st.kE, trapProb:st.trapProb, ninjaProb:st.ninjaProb, walls:st.walls, bombs:st.bombs, territories:st.territories, meteors:st.meteors,
    eTraps:st.eTraps, trapPen:st.trapPen||0, _tpMap:st._tpMap,
    pPend:st.pPend||0, pExtra:st.pExtra||0, pLock:!!st.pLock, ePend:st.ePend||0, eExtra:st.eExtra||0, eLock:!!st.eLock,
    ps:st.ps.map(p=>({id:p.id,t:p.t,o:p.o,r:p.r,c:p.c,hp:p.hp,cut:p.cut,cutNext:p.cutNext,beastOf:p.beastOf,noAtk:p.noAtk,maou:p.maou,henge:p.henge,
      healUsed:p.healUsed,prayUsed:p.prayUsed,prayCnt:p.prayCnt,futoUsed:p.futoUsed,esperMode:p.esperMode,heroP:p.heroP,
      block:p.block?{r:p.block.r,c:p.block.c}:null,phoenix:p.phoenix,maxAp:p.maxAp,heroBoost:p.heroBoost,invis:p.invis}))
  };
}
/* 現局面を探索用stateへ変換（プレイヤー手番開始時点を想定） */
/* CPUから見た相手の駒の種類（詐欺師は偽装先の駒に見える） */
function aiSeenType(p){ return (p.owner==="P"&&p.type==="sagishi"&&p.flags.disguiseAs)?p.flags.disguiseAs:p.type; }
function ssFromGame(side){
  // 透明化した敵(P)忍者の正確な位置はAIに見せない。予測マップ(ninjaProb)で扱う。
  const hiddenFoeNinja = (side==="E");
  const ps=G.pieces.filter(p=>!p.dead && !p.flags.pendingMeteor && !(hiddenFoeNinja && p.owner==="P" && p.type==="ninja" && p.flags.invisible)).map(p=>({
    id:p.id,t:aiSeenType(p),o:p.owner,r:p.r,c:p.c,hp:p.hp,
    block:p.flags.block?{r:p.flags.block.r,c:p.flags.block.c}:null,
    phoenix:!!p.flags.phoenix, maxAp:(aiSeenType(p)!==p.type?PIECES[aiSeenType(p)].ap:p.maxAp), heroBoost:!!p.flags.heroBoost,
    invis:!!p.flags.invisible, beastOf:p.flags.beastOf,
    noAtk:!!p.flags.noAttack,                                              // 悪霊の攻撃封じ（次の手番は通常攻撃不可）
    henge:!!p.flags.henge,                                                 // 狐の変化中
    healUsed:!!p.flags.healUsed, prayUsed:!!p.flags.prayUsed, prayCnt:p.flags.prayCount||0, futoUsed:!!p.flags.futokoroUsed, esperMode:p.flags.esperMode||"ortho", // 1回限りの能力・念動の向き
    maou:(p.owner==="E"&&p.type==="yusha"&&!p.flags.heroBoost)?p.flags.maouId:undefined, // CPUの勇者の魔王（相手の勇者の魔王は秘密）
    // 行動力-1（罠・術士）：手番中の自軍は現在の行動力、それ以外は次の手番に-1が掛かるか
    cut:(p.owner===G.turn && G.phase==="action") ? (p.ap<p.maxAp) : !!p.flags.apCut
  }));
  // 透明化した相手の忍者は、予測マップで最も潜んでいそうなマスに「見えない駒」として置いて読む。
  // 透明が解ける次の手番に攻撃してくること、透明中は攻撃も被弾もしないことを先読みに反映するため。
  if(hiddenFoeNinja){
    for(const p of G.pieces.filter(q=>!q.dead&&q.owner==="P"&&q.type==="ninja"&&q.flags.invisible)){
      const e=(G.ninjaProb||[]).find(x=>x.ninja===p.id); if(!e)continue;
      const cell=e.cells.filter(c=>!ps.some(q=>q.r===c.r&&q.c===c.c)).sort((a,b)=>b.prob-a.prob)[0]; if(!cell)continue;
      ps.push({id:p.id,t:"ninja",o:"P",r:cell.r,c:cell.c,hp:p.hp,block:null,phoenix:false,maxAp:p.maxAp,heroBoost:false,invis:true,guess:true,
        noAtk:false,cut:!!p.flags.apCut});
    }
  }
  // 罠の正確な位置はAIには見えない。罠師の位置から推定した「設置確率マップ」を持たせる。
  const trapProb=[];
  if(G.trapProb){
    for(const e of G.trapProb)for(const cl of e.cells)trapProb.push({r:cl.r,c:cl.c,prob:cl.prob});
  }
  // 透明忍者の潜伏位置も同様に「予測マップ」で持たせる（正確な位置は不明）。
  const ninjaProb=[];
  if(hiddenFoeNinja && G.ninjaProb){
    for(const e of G.ninjaProb)for(const cl of e.cells)ninjaProb.push({r:cl.r,c:cl.c,prob:cl.prob});
  }
  // CPU（E）の罠は自分の罠なので正確な位置を使う（相手には見えない）
  const eTraps=(G.traps||[]).filter(t=>t.owner==="E").map(t=>({r:t.r,c:t.c,setter:t.setter}));
  return {side, kP:G.kills.P, kE:G.kills.E, ps, trapProb, ninjaProb, eTraps, trapPen:0, walls:(G.walls||[]).map(w=>({r:w.r,c:w.c})), bombs:(G.bombs||[]).map(b=>({r:b.r,c:b.c,owner:b.owner,fuse:b.fuse})), territories:(G.territories||[]).map(t=>({r:t.r,c:t.c,owner:t.owner})), meteors:(G.meteors||[]).map(m=>{ const mp=byId(m.id); return {id:m.id,owner:m.owner,fuse:(m.fuse==null?0:m.fuse),hp:mp?mp.hp:3,cells:m.cells.map(c=>({r:c.r,c:c.c}))}; }),
    // 神の超越（連続ターン）の状態
    pPend:G.pPendingExtra||0, pExtra:G.pExtraTurns||0, pLock:!!G.pExtraActive,
    ePend:G.ePendingExtra||0, eExtra:G.eExtraTurns||0, eLock:!!G.eExtraActive};
}
const ssAt=(st,r,c)=>st.ps.find(p=>p.r===r&&p.c===c);
function ssMoveDirs(p){ const t=p.t; if(t==="ninja")return p.invis?ALL8:ORTHO; return (t==="kiba"||t==="kaizoku"||t==="taka")?ALL8:ORTHO; } // 忍者の斜め移動は透明中のみ
function ssColorOk(st,p,nr,nc){
  // 自陣3駒が同じ色の陣に偏ってはいけない（列0-2:左 / 3-5:右）
  const half=c=>c<3?0:1;
  const allies=st.ps.filter(q=>q.o===p.o&&q.t!=="kemono");   // 獣は主力に数えない（実ゲームのmainsと同じ）
  if(p.t==="kemono"||allies.length<3)return true;
  // 既に全主力が同じ色陣なら、この制約で縛らない（一方向しか動けない詰みを防ぐ）
  let curH=null,curSame=true;
  for(const q of allies){ if(curH===null)curH=half(q.c); else if(half(q.c)!==curH){curSame=false;break;} }
  if(curSame)return true;
  const h=half(nc);
  let same=1;
  for(const q of allies){ if(q.id!==p.id&&half(q.c)===h) same++; }
  return same<3;
}
function ssAtk(p,kind,target){
  let d=1;
  if(p.t==="kenshi"||p.t==="souhei")d+=0.5;
  if(p.t==="senshi"){if(p.hp<=1)d+=2;else if(p.hp<=2)d+=1;}
  if(p.t==="yusha"&&p.heroBoost&&kind==="melee")d=3;
  else if(p.t==="yusha"&&p.heroP&&kind==="melee")d=1+2*p.heroP;   // 覚醒しているかもしれない相手の勇者（期待値）
  // 猪：基本0.5ダメ。直進フルAP移動直後（charged）の通常攻撃のみ2ダメ。
  if(p.t==="inoshishi")d = (p.charged && kind==="melee") ? 2 : 0.5;
  // 海賊：通常攻撃の相手が自分よりHPが高い時（同数不可）、与ダメ+1。
  if(p.t==="kaizoku" && kind==="melee" && target && target.hp>p.hp)d+=1;
  return d;
}
function ssRangedCells(p,r,c){
  const out=[];
  // 射線上に壁があると奥は狙えない。壁はAIの手番中は不変なので現在のG.wallsを参照。
  const rayPush=(dr,dc,maxK)=>{
    for(let k=1;k<=maxK;k++){
      const rr=r+dr*k, cc=c+dc*k;
      if(!inB(rr,cc))break;
      if(wallAt(rr,cc))break;
      out.push([rr,cc]);
    }
  };
  if(p.t==="kyuhei"){
    for(const [dr,dc] of ORTHO)rayPush(dr,dc,2);
    for(const [dr,dc] of DIAG)rayPush(dr,dc,1);
  }else if(p.t==="sogeki"){
    for(const [dr,dc] of DIAG)rayPush(dr,dc,3);
  }
  return out.filter(([rr,cc])=>inB(rr,cc));
}
function ssNormalCells(p){
  if(SS.noNormal.has(p.t)||p.noAtk||p.invis)return [];   // 攻撃封じ・透明中は通常攻撃不可
  let dirs;
  if(p.t==="souhei")dirs=DIAG;
  else dirs=ORTHO;
  return dirs.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>inB(r,c));
}
/* ダメージ適用（撃破・不死鳥・吸血を処理）。撃破イベントを返す */
/* 探索内の撃破処理（実ゲームのkillPieceに合わせる）
   ・獣：得点にならない。主の調教師がHP-0.5
   ・調教師：自分の獣も消える
   ・聖職者：味方全員に1ダメージ（殉教） */
/* 行動ルール：選んだ駒は行動力を使い切る（動けなくなった場合を除く）。
   例外：待機を持つ駒（術士・悪霊・呪詛師）、1マス以上動いた冒険者、飛び越えた鷹。
   移動先 d で手番を終えてよいか */
function ssEndOk(st,p,d){
  if(d.trapped||d.full)return true;
  if(SS_WAITERS.has(p.t))return true;
  if(p.t==="boken"&&d.cost>=1)return true;
  if(p.t==="taka"&&d.jumped)return true;
  if(d.cost===0)return false;
  // 行動力が余っていても、そこからもう動けないなら終えてよい
  const mover={...p,r:d.r,c:d.c};
  for(const [dr,dc] of ssMoveDirs(p)){
    const r=d.r+dr,c=d.c+dc;
    if(r<0||r>5||c<0||c>5)continue;
    if(st.ps.some(q=>q.id!==p.id&&q.r===r&&q.c===c))continue;
    if(st.walls&&st.walls.some(w=>w.r===r&&w.c===c))continue;
    if(st.territories&&st.territories.some(t=>t.r===r&&t.c===c&&t.owner!==p.o))continue;
    if(!ssColorOk(st,mover,r,c))continue;
    return false;
  }
  return true;
}
function ssKill(st,t){
  if(t.dead)return;
  t.dead=true;
  if(t.t==="kemono"){
    const tm=st.ps.find(x=>!x.dead&&x.id===t.beastOf);
    if(tm)ssHurt(st,tm,0.5);
    return;
  }
  if(t.o==="P"){ st.kE++; st._respP=(st._respP||0)+1; } else { st.kP++; st._respE=(st._respE||0)+1; }   // 倒されたプレイヤーの駒は、手番の終わりに予想した駒で出し直す
  // 魔王が倒れた → その魔王を指定していた勇者が覚醒（近接攻撃3・HP+1）
  for(const y of st.ps) if(!y.dead&&y.t==="yusha"&&!y.heroBoost&&y.maou===t.id){ y.heroBoost=true; y.hp=Math.min(3,r2(y.hp+1)); }
  // 相手(P)の勇者の魔王はCPUには秘密。CPUの駒が倒れるたび「それが魔王だった」可能性（約1/3）を見込む
  if(t.o==="E") for(const y of st.ps) if(!y.dead&&y.o==="P"&&y.t==="yusha"&&!y.heroBoost&&y.maou===undefined){ y.heroP=1-(1-(y.heroP||0))*(2/3); }
  if(t.t==="chokyo") for(const b of st.ps) if(!b.dead&&b.t==="kemono"&&b.beastOf===t.id) b.dead=true;
  if(t.t==="seishoku") for(const a of st.ps) if(!a.dead&&a.o===t.o&&a.id!==t.id) ssHurt(st,a,1);
}
/* 攻撃以外のダメージ（呪い・爆発・罠・殉教など）。不死鳥の復活を考慮 */
function ssHurt(st,t,d){
  if(t.dead)return;
  if(t.hp-d<=0){
    if(t.t==="fushicho"&&!t.phoenix){t.phoenix=true;t.hp=0.5;return;}
    t.hp=0; ssKill(st,t); return;
  }
  t.hp=r2(t.hp-d);
}
function ssDealDamage(st,attacker,target,kind){
  if(target.block&&attacker&&attacker.r===target.block.r&&attacker.c===target.block.c)return;
  let d=ssAtk(attacker,kind,target);
  let killed=target.hp-d<=0;
  if(killed&&target.t==="fushicho"&&!target.phoenix){
    target.phoenix=true;target.hp=0.5;killed=false;
  }else{
    target.hp=r2(target.hp-d);
  }
  if(attacker.t==="kyuketsuki"&&kind==="melee"&&attacker.hp<3){
    attacker.hp=r2(Math.min(3,attacker.hp+0.5));
  }
  if(killed) ssKill(st,target);
}
function ssRemoveDead(st){
  st.ps=st.ps.filter(p=>!p.dead);
  // プレイヤーの駒を倒した：相手は手前の段に新しい駒を出してくる（予想した種類・最もCPUの駒に迫れる列）
  if(st._respP){ const n=st._respP; st._respP=0; if(st.kE<2&&SS_RESP_PRED) for(let i=0;i<n;i++) ssAddPredictedRespawn(st); }
  // CPUの駒が倒された：CPUも手前の段に出し直す（倒しきれる相手がいれば、それを倒せる駒と列を選ぶ）
  if(st._respE){ const n=st._respE; st._respE=0; if(st.kP<2) for(let i=0;i<n;i++) ssAddERespawn(st); }
}
/* CPUの出し直し（探索用）。実際の出し直し(aiRespawn)と同じく、次の手番で討ち取れる相手がいれば
   その駒と列を選ぶ（低HPの相手を泳がせておき、出し直した騎馬などで倒しきる狙いを読めるように）。
   討ち取れる相手がいなければ、探索開始時に決めた汎用の候補を、相手に近い列に出す */
const SS_ERESP_TYPES=["kiba","kenshi","senshi","kyuhei","sogeki","boken","ninja","kaizoku","inoshishi","taka","souhei","kyuketsuki"];
let SS_ERESP_DEFAULT=null;
function ssAddERespawn(st){
  const mainsE=st.ps.filter(q=>q.o==="E"&&q.t!=="kemono");
  const half=c=>c<3?0:1;
  const cols=[];
  for(let c=0;c<6;c++){
    if(ssAt(st,0,c))continue;
    if((st.territories||[]).some(t=>t.r===0&&t.c===c&&t.owner==="P"))continue;
    if((st.walls||[]).some(w=>w.r===0&&w.c===c))continue;
    if(mainsE.length>=2&&mainsE.every(q=>half(q.c)===half(c)))continue;
    if((st.meteors||[]).some(m=>m.owner==="P"&&m.cells.some(cl=>cl.r===0&&cl.c===c)))continue;   // 流星群の着弾候補には出さない
    cols.push(c);
  }
  if(!cols.length)return;
  const foes=st.ps.filter(q=>q.o==="P"&&q.t!=="kemono"&&!q.invis);
  const mk=(type,c)=>{ const info=PIECES[type]; return {id:-900-st.ps.length-(st.kP||0)*10,t:type,o:"E",r:0,c,hp:info.maxHp||3,cut:false,block:null,phoenix:false,
    maxAp:info.ap,heroBoost:false,invis:false,noAtk:false,esperMode:"ortho",resp:true}; };
  let best=null,bs=-1e9;
  if(foes.some(f=>f.hp<=1.5)){
    for(const type of SS_ERESP_TYPES){
      if(type==="yusha")continue;
      for(const c of cols){
        const q=mk(type,c);
        let kill=0;
        const spots=[{r:0,c},...ssReach(st,q)];
        for(const d of spots){
          const from={...q,r:d.r,c:d.c};
          for(const f of foes){
            if(ssHits(from,f)&&ssKillable(f,ssAtk(from,"melee",f))){kill=1;break;}
            if(SS.ranged.has(type)&&ssRangedCells(from,d.r,d.c).some(([r,c2])=>r===f.r&&c2===f.c)&&ssKillable(f,ssAtk(from,"ranged",f))){kill=1;break;}
          }
          if(kill)break;
        }
        const sc=kill*1000+(AI_WEIGHTS[type]||2);
        if(sc>bs){bs=sc;best=q;}
      }
    }
    if(bs<1000)best=null;
  }
  if(!best){
    const type=SS_ERESP_DEFAULT||"kenshi";
    let bc=cols[0],bd=1e9;
    for(const c of cols){ let d=99; for(const f of foes)d=Math.min(d,Math.abs(f.r)+Math.abs(f.c-c)); const sc=d*10+Math.abs(c-2.5); if(sc<bd){bd=sc;bc=c;} }
    best=mk(type,bc);
  }
  st.ps.push(best);
}
/* 相手(P)が出し直してくる駒の予想（探索の開始時に1回だけ決める） */
let SS_RESP_PRED=null;
function aiPredictPlayerRespawn(){
  const eTypes=alive("E").filter(p=>p.type!=="kemono").map(p=>p.type);
  const pTypes=mains("P").map(p=>aiSeenType(p));
  let freq={},tot=0;
  try{ if(learnActive()){ const A=learnAgg(); freq=A.pPick||{}; for(const k in freq)tot+=freq[k]; } }catch(e){}
  let best=null,bs=-1e9;
  for(const type of PICKABLE){
    if(type==="yusha"&&pTypes.includes("yusha"))continue;
    let sc=(AI_WEIGHTS[type]||2)*2;
    for(const et of eTypes) sc+=aiSetupCounter(type,et);      // CPUの駒に強い駒を出してくる
    if(tot>0) sc+=((freq[type]||0)/tot)*60;                    // 過去によく選んでいる駒
    sc-=pTypes.filter(t=>t===type).length*8;
    if(sc>bs){bs=sc;best=type;}
  }
  return best?{type:best}:null;
}
function ssAddPredictedRespawn(st){
  const type=SS_RESP_PRED.type, info=PIECES[type]; if(!info)return;
  const mainsP=st.ps.filter(q=>q.o==="P"&&q.t!=="kemono");
  const half=c=>c<3?0:1;
  const eP=st.ps.filter(q=>q.o==="E");
  let best=null,bd=1e9;
  for(let c=0;c<6;c++){
    if(ssAt(st,5,c))continue;
    if((st.territories||[]).some(t=>t.r===5&&t.c===c&&t.owner==="E"))continue;
    if((st.walls||[]).some(w=>w.r===5&&w.c===c))continue;
    if(mainsP.length>=2&&mainsP.every(q=>half(q.c)===half(c)))continue;
    let d=99; for(const e of eP)d=Math.min(d,Math.abs(e.r-5)+Math.abs(e.c-c));
    const score=d*10+Math.abs(c-2.5);   // CPUの駒に近い列ほど（同じなら中央寄り）
    if(score<bd){bd=score;best=c;}
  }
  if(best===null)return;
  st.ps.push({id:-800-(st.kE||0)-st.ps.length,t:type,o:"P",r:5,c:best,hp:info.maxHp||3,cut:false,block:null,phoenix:false,
    maxAp:info.ap,heroBoost:false,invis:false,noAtk:false,esperMode:"ortho",resp:true});
}
function ssTerminal(st){ return st.kP>=2||st.kE>=2; }

/* 1手番ぶんの合法手を列挙（移動+能力、その後ベスト通常攻撃を自動付与）
   戻り値：適用後stateの配列。手番側=st.side */
const SS_WAITERS=new Set(["jutsushi","akuryo","jusoshi"]);  // 「待機（残り行動力を消費）」を持つ駒
const SS_NEW_BEAST_ID=-777;   // 探索内で召喚した獣の仮ID
/* 行動力1の能力駒が「その場で」使える能力の候補（CPUの手番の最初の一手用。実ゲームのフラグを参照）
   薬師：隣接の味方HP+1／敵HP-1（ゲーム1回）、調教師：隣に獣を召喚、聖職者：味方全体HP+0.5（ゲーム1回）、
   魔女：味方同士 or 敵同士の入替（HP0.5消費） */
function ssStayAbilities(st,p,cheap){
  const out=[]; const fl={healUsed:p.healUsed,prayUsed:p.prayUsed,futokoroUsed:p.futoUsed,esperMode:p.esperMode};
  if((p.maxAp||1)-(p.cut?1:0)<1)return out;
  if(p.t==="kusushi"&&!fl.healUsed){
    for(const [dr,dc] of ORTHO){
      const t=ssAt(st,p.r+dr,p.c+dc); if(!t)continue;
      if(t.o===p.o){ if(t.hp<3)out.push({kind:"heal",targetId:t.id}); }
      else if(ssTargetable(t,p.o)) out.push({kind:"poison",targetId:t.id});
    }
  }
  if(p.t==="chokyo"&&!st.ps.some(b=>b.t==="kemono"&&b.beastOf===p.id)){
    for(const [dr,dc] of ORTHO){
      const r=p.r+dr,c=p.c+dc;
      if(r<0||r>5||c<0||c>5||ssAt(st,r,c))continue;
      if(st.walls&&st.walls.some(w=>w.r===r&&w.c===c))continue;
      out.push({kind:"summon",sr:r,sc:c});
    }
  }
  if(p.t==="seishoku"&&!fl.prayUsed&&st.ps.some(a=>a.o===p.o&&a.id!==p.id&&a.hp<3)) out.push({kind:"pray"});
  // 超能力者：射程（縦横 or 斜め2マス）内の駒を、周囲1マスへ動かす
  if(p.t==="esper"){
    const dirs=fl.esperMode==="diag"?DIAG:ORTHO;
    for(const [dr,dc] of dirs)for(let k=1;k<=2;k++){
      const t=ssAt(st,p.r+dr*k,p.c+dc*k);
      if(!t||!ssTargetable(t,p.o))continue;
      for(const [er,ec] of ALL8){
        const rr=t.r+er,cc=t.c+ec;
        if(rr<0||rr>5||cc<0||cc>5||ssAt(st,rr,cc))continue;
        if(st.walls&&st.walls.some(w=>w.r===rr&&w.c===cc))continue;
        if(st.territories&&st.territories.some(x=>x.r===rr&&x.c===cc&&x.owner!==t.o))continue;
        if(t.t!=="kemono"&&!ssColorOk(st,t,rr,cc))continue;
        out.push({kind:"psy",targetId:t.id,tr:rr,tc:cc});
      }
    }
  }
  // 宇宙人：縦1列を上 or 下へ1マス（HP0.5）
  if(p.t==="uchujin"&&p.hp>0.5){
    for(let col=0;col<6;col++){ if(!st.ps.some(q=>q.c===col))continue; out.push({kind:"warp",col,dir:-1}); out.push({kind:"warp",col,dir:1}); }
    for(let row=0;row<6;row++){ if(!st.ps.some(q=>q.r===row))continue; out.push({kind:"warp",axis:"row",row,dir:-1}); out.push({kind:"warp",axis:"row",row,dir:1}); }
  }
  // 領主：周囲8マスの1つを自分の領地に（自軍1つまで）
  if(p.t==="ryoushu"){
    for(const [dr,dc] of ALL8){
      const r=p.r+dr,c=p.c+dc;
      if(r<0||r>5||c<0||c>5||ssAt(st,r,c))continue;
      if(st.walls&&st.walls.some(w=>w.r===r&&w.c===c))continue;
      if(st.territories&&st.territories.some(x=>x.r===r&&x.c===c))continue;
      out.push({kind:"territory",tr:r,tc:c});
    }
  }
  // 詐欺師：懐入（ゲーム1回・行動力+1）→ 増えた行動力でしか届かないマスへ移動
  if(p.t==="sagishi"&&!fl.futokoroUsed){
    const base=(p.maxAp||1)-(p.cut?1:0);
    const mover={...p,maxAp:base+1+(p.cut?1:0)};
    for(const d of ssReach(st,mover)){
      if(d.cost<=base||!ssEndOk(st,mover,d))continue;
      out.push({kind:"futokoro",tr:d.r,tc:d.c,prisk:d.prisk||0});
    }
  }
  // 軍師：HP0.5で、このターン味方2体を行動させる（移動の組み合わせを上位だけ候補に）
  if(p.t==="gunshi"&&p.hp>0.5){
    for(const combo of (cheap?ssGunshiCombosCheap(st,p):ssGunshiCombos(st,p))) out.push({kind:"gunshi",moves:combo});
  }
  if(p.t==="majo"&&p.hp>0){
    const needKill=p.hp<=0.5;   // 使うと倒れる：確実に勝ち点に繋がる時だけ（判定は適用後）
    for(const side of ["E","P"]){
      const grp=st.ps.filter(x=>x.o===side&&!(x.invis&&x.o!=="E"));
      for(let i=0;i<grp.length;i++)for(let j=i+1;j<grp.length;j++)
        out.push({kind:"swap",aId:grp[i].id,bId:grp[j].id,requireKill:needKill});
    }
  }
  return out;
}
/* 軍師の2体行動：味方A→Bの順に移動する組み合わせを列挙し、すぐの評価で上位3つを返す */
function ssGunshiCombos(st,g){
  const allies=st.ps.filter(a=>a.o===g.o&&a.id!==g.id);
  const legal=(s0,a)=>ssReach(s0,a).filter(d=>(d.cost>0||d.full)&&ssEndOk(s0,a,d));
  const res=[];
  for(const A of allies)for(const B of allies){
    if(A.id===B.id)continue;
    for(const da of legal(st,A)){
      const s1=ssClone(st); const a1=s1.ps.find(x=>x.id===A.id); a1.r=da.r;a1.c=da.c; ssAfterMove(s1,a1,da);
      const b1=s1.ps.find(x=>x.id===B.id); if(!b1)continue;
      for(const db of legal(s1,b1)){
        const s2=ssClone(s1); const b2=s2.ps.find(x=>x.id===B.id); b2.r=db.r;b2.c=db.c; ssAfterMove(s2,b2,db);
        ssBestAttack(s2,g.o); ssRemoveDead(s2); s2.side=g.o==="E"?"P":"E";
        const v=ssEval(s2)*(g.o==="E"?1:-1);
        res.push({v,moves:[{id:A.id,r:da.r,c:da.c,prisk:da.prisk||0},{id:B.id,r:db.r,c:db.c,prisk:db.prisk||0}]});
      }
    }
  }
  res.sort((x,y)=>y.v-x.v);
  return res.slice(0,3).map(x=>x.moves);
}
/* 軍師の2体行動（探索の深い所用の軽量版）：攻撃に行く手と、離れる手の組み合わせだけを候補にする */
function ssGunshiCombosCheap(st,g){
  const allies=st.ps.filter(a=>a.o===g.o&&a.id!==g.id);
  const foes=st.ps.filter(a=>a.o!==g.o);
  const legal=(s0,a)=>ssReach(s0,a).filter(d=>(d.cost>0||d.full)&&ssEndOk(s0,a,d));
  const hitting=(a,ds)=>ds.filter(d=>foes.some(f=>ssHits({...a,r:d.r,c:d.c},f))).slice(0,3);
  const far=(ds)=>{ let b=null,bd=-1; for(const d of ds){ let m=99; for(const f of foes)m=Math.min(m,Math.abs(f.r-d.r)+Math.abs(f.c-d.c)); if(m>bd){bd=m;b=d;} } return b?[b]:[]; };
  const out=[];
  for(const A of allies)for(const B of allies){
    if(A.id===B.id)continue;
    const la=legal(st,A); const ha=hitting(A,la); if(!ha.length)continue;
    for(const da of ha){
      const lb=legal(st,B).filter(d=>!(d.r===da.r&&d.c===da.c));
      for(const db of [...hitting(B,lb).slice(0,1),...far(lb)])
        out.push([{id:A.id,r:da.r,c:da.c,prisk:da.prisk||0},{id:B.id,r:db.r,c:db.c,prisk:db.prisk||0}]);
    }
  }
  return out.slice(0,8);
}
/* 宇宙人の転移（探索用）：実ゲームのwarpColumnと同じ規則で、縦1列の駒を上下へ1マス */
function ssWarpColumn(ns,col,dir){
  const rows=dir<0?[0,1,2,3,4,5]:[5,4,3,2,1,0];
  const wall=r=>ns.walls&&ns.walls.some(w=>w.r===r&&w.c===col);
  const moved=new Set(), stayed=new Set(), moves=[];
  for(const r of rows){
    const p=ns.ps.find(q=>q.r===r&&q.c===col); if(!p)continue;
    const nr=r+dir;
    if(nr<0||nr>5||wall(nr)||stayed.has(nr)){stayed.add(r);continue;}
    const ahead=ns.ps.find(q=>q.r===nr&&q.c===col);
    if(ahead&&!moved.has(ahead.id)){stayed.add(r);continue;}
    if(ns.territories&&ns.territories.some(t=>t.r===nr&&t.c===col&&t.owner!==p.o)){stayed.add(r);continue;}
    moves.push({p,nr}); moved.add(p.id);
  }
  for(const m of moves){ m.p.r=m.nr; ssAfterMove(ns,m.p,{trapped:m.p.o==="P"&&ns.eTraps&&ns.eTraps.some(t=>t.r===m.nr&&t.c===col)}); }
}
/* 宇宙人の転移（横・探索用）：実ゲームのwarpRowと同じ規則 */
function ssWarpRow(ns,row,dir){
  const cols=dir<0?[0,1,2,3,4,5]:[5,4,3,2,1,0];
  const wall=c=>ns.walls&&ns.walls.some(w=>w.r===row&&w.c===c);
  const half=c=>c<3?0:1;
  const moved=new Set(), stayed=new Set(), moves=[], planned=new Map();
  const crossOk=(p,nc)=>{
    if(p.t==="kemono")return true;
    const ms=ns.ps.filter(q=>q.o===p.o&&q.t!=="kemono"); if(ms.length<3)return true;
    const colOf=q=>planned.has(q.id)?planned.get(q.id):q.c;
    if(ms.every(q=>half(colOf(q))===half(colOf(ms[0]))))return true;
    return !ms.every(q=>half(q.id===p.id?nc:colOf(q))===half(nc));
  };
  for(const c of cols){
    const p=ns.ps.find(q=>q.r===row&&q.c===c); if(!p)continue;
    const nc=c+dir;
    if(nc<0||nc>5||wall(nc)||stayed.has(nc)){stayed.add(c);continue;}
    const ahead=ns.ps.find(q=>q.r===row&&q.c===nc);
    if(ahead&&!moved.has(ahead.id)){stayed.add(c);continue;}
    if(ns.territories&&ns.territories.some(t=>t.r===row&&t.c===nc&&t.owner!==p.o)){stayed.add(c);continue;}
    if(half(c)!==half(nc)&&!crossOk(p,nc)){stayed.add(c);continue;}
    moves.push({p,nc}); moved.add(p.id); planned.set(p.id,nc);
  }
  for(const m of moves){ m.p.c=m.nc; ssAfterMove(ns,m.p,{trapped:m.p.o==="P"&&ns.eTraps&&ns.eTraps.some(t=>t.r===row&&t.c===m.nc)}); }
}
function ssApplyStayAbility(ns,np,ab){
  if(ab.kind==="heal"){ np.healUsed=true; const t=ns.ps.find(x=>x.id===ab.targetId); if(t)t.hp=Math.min(3,r2(t.hp+1)); }
  else if(ab.kind==="poison"){ np.healUsed=true; const t=ns.ps.find(x=>x.id===ab.targetId); if(t)ssHurt(ns,t,1); }
  else if(ab.kind==="summon"){ ns.ps=[...ns.ps,{id:SS_NEW_BEAST_ID,t:"kemono",o:np.o,r:ab.sr,c:ab.sc,hp:1,maxAp:1,beastOf:np.id}]; }
  else if(ab.kind==="pray"){ np.prayCnt=(np.prayCnt||0)+1; if(np.prayCnt>=2)np.prayUsed=true; for(const a of ns.ps) if(a.o===np.o&&a.id!==np.id) a.hp=Math.min(3,r2(a.hp+0.5)); }
  else if(ab.kind==="psy"){
    const t=ns.ps.find(x=>x.id===ab.targetId);
    if(t){ t.r=ab.tr;t.c=ab.tc; ssAfterMove(ns,t,{trapped:t.o==="P"&&ns.eTraps&&ns.eTraps.some(x=>x.r===ab.tr&&x.c===ab.tc)}); }
  }
  else if(ab.kind==="warp"){
    if(ab.axis==="row")ssWarpRow(ns,ab.row,ab.dir); else ssWarpColumn(ns,ab.col,ab.dir);
    if(np.hp-0.5<=0){np.hp=0;ssKill(ns,np);} else np.hp=r2(np.hp-0.5);
  }
  else if(ab.kind==="territory"){
    ns.territories=[...(ns.territories||[]).filter(t=>t.owner!==np.o),{r:ab.tr,c:ab.tc,owner:np.o}];
    // 領地にしたマスの爆弾・罠は壊れる
    ns.bombs=(ns.bombs||[]).filter(b=>!(b.r===ab.tr&&b.c===ab.tc));
    ns.eTraps=(ns.eTraps||[]).filter(t=>!(t.r===ab.tr&&t.c===ab.tc));
  }
  else if(ab.kind==="futokoro"){
    np.futoUsed=true; np.r=ab.tr;np.c=ab.tc; ssAfterMove(ns,np,{prisk:ab.prisk||0});
  }
  else if(ab.kind==="gunshi"){
    if(np.hp-0.5<=0){np.hp=0;ssKill(ns,np);} else np.hp=r2(np.hp-0.5);
    for(const m of ab.moves){ const a=ns.ps.find(x=>x.id===m.id); if(!a||a.dead)continue; a.r=m.r;a.c=m.c; ssAfterMove(ns,a,{prisk:m.prisk||0}); }
  }
  else if(ab.kind==="swap"){
    const a=ns.ps.find(x=>x.id===ab.aId), b=ns.ps.find(x=>x.id===ab.bId);
    if(a&&b){ const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c;b.r=ar;b.c=ac; }
    if(np.hp-0.5<=0){ np.hp=0; ssKill(ns,np); } else np.hp=r2(np.hp-0.5);
  }
}
/* CPUの罠師が罠を置けるマス（周囲8マスの空き。既に罠があるマスは除く） */
function ssTrapCells(st,p){
  const out=[];
  for(const [dr,dc] of ALL8){
    const r=p.r+dr,c=p.c+dc;
    if(r<0||r>5||c<0||c>5)continue;
    if(ssAt(st,r,c))continue;
    if(st.walls&&st.walls.some(w=>w.r===r&&w.c===c))continue;
    if((st.eTraps||[]).some(t=>t.r===r&&t.c===c))continue;
    if((st.territories||[]).some(t=>t.r===r&&t.c===c))continue;   // 領地には置けない
    out.push([r,c]);
  }
  return out;
}
function ssPlaceETrap(ns,setter,r,c){
  let arr=[...(ns.eTraps||[])];
  let mine=arr.filter(t=>t.setter===setter);
  while(mine.length>=2){ const old=mine[0]; arr=arr.filter(t=>t!==old); mine=arr.filter(t=>t.setter===setter); }
  arr.push({r,c,setter});
  ns.eTraps=arr;
}
/* 移動を適用した後の罠処理（探索用）
   ・CPU(E)の駒：相手の罠がありそうなマスを「通過」した危険度をペナルティとして加算
   ・相手(P)の駒：CPUの罠を踏んだら1ダメージ＋次の手番の行動力-1（その場で停止） */
function ssAfterMove(ns,np,d){
  if(!d)return;
  if(np.o==="E"&&d.prisk>0){
    ns.trapPen=(ns.trapPen||0)+d.prisk*(240+(np.hp<=1?400:0));
  }
  if(np.o==="P"&&d.trapped&&ns.eTraps){
    ns.eTraps=ns.eTraps.filter(t=>!(t.r===np.r&&t.c===np.c));
    np.cutNext=true;
    ssHurt(ns,np,1);
  }
}
/* 狐の変化（探索用）：盤上の駒の種類に化け、その駒の行動力で移動（弓兵・狙撃手なら射撃も）。
   種類ごとに、すぐの評価が良い行き先を2つまで候補にする */
function ssHengeOptions(st,p){
  const types=[...new Set(st.ps.filter(t=>t.id!==p.id&&t.t!=="kitsune"&&t.t!=="kemono"&&!(t.invis&&t.o!==p.o)).map(t=>t.t))];
  const out=[];
  for(const T of types){
    const tp={...p,t:T,maxAp:PIECES[T].ap,cut:false,henge:true};
    const cand=[];
    for(const d of ssReach(st,tp)){
      if(!((d.cost>0||d.full)&&ssEndOk(st,tp,d)) && !(SS.ranged.has(T)&&d.apLeft>=1))continue;
      const shotsList=[[]];
      if(SS.ranged.has(T)&&d.apLeft>=1){
        for(const [rr,cc] of ssRangedCells({...tp,r:d.r,c:d.c},d.r,d.c)){ const x=ssAt(st,rr,cc); if(x&&x.o!==p.o&&!(x.block&&x.block.r===d.r&&x.block.c===d.c)&&ssTargetable(x,p.o))shotsList.push([{tr:rr,tc:cc}]); }
      }
      for(const shots of shotsList){
        if(!shots.length&&!((d.cost>0||d.full)&&ssEndOk(st,tp,d)))continue;
        const ab={kind:"henge",toType:T,tr:d.r,tc:d.c,shots,prisk:d.prisk||0,charge:!!d.charge};
        const ns=ssClone(st); const np=ns.ps.find(x=>x.id===p.id); ssApplyHenge(ns,np,ab);
        ssBestAttack(ns,p.o); ssFoxRevert(ns,p.o); ssRemoveDead(ns); ns.side=p.o==="E"?"P":"E";
        cand.push({v:ssEval(ns)*(p.o==="E"?1:-1),ab});
      }
    }
    cand.sort((a,b)=>b.v-a.v);
    for(const c of cand.slice(0,2))out.push(c.ab);
  }
  return out;
}
/* 狐の変化（探索の深い所用の軽量版）：変化後に相手を攻撃・射撃できる行き先だけ */
function ssHengeOptionsCheap(st,p){
  const types=[...new Set(st.ps.filter(t=>t.id!==p.id&&t.t!=="kitsune"&&t.t!=="kemono"&&!(t.invis&&t.o!==p.o)).map(t=>t.t))];
  const foes=st.ps.filter(a=>a.o!==p.o&&ssTargetable(a,p.o));
  const out=[];
  for(const T of types){
    const tp={...p,t:T,maxAp:PIECES[T].ap,cut:false,henge:true};
    for(const d of ssReach(st,tp)){
      const at2={...tp,r:d.r,c:d.c};
      if((d.cost>0||d.full)&&ssEndOk(st,tp,d)&&foes.some(f=>ssHits(at2,f))) out.push({kind:"henge",toType:T,tr:d.r,tc:d.c,shots:[],prisk:d.prisk||0,charge:!!d.charge});
      if(SS.ranged.has(T)&&d.apLeft>=1) for(const [rr,cc] of ssRangedCells(at2,d.r,d.c)){ const x=foes.find(f=>f.r===rr&&f.c===cc); if(x) out.push({kind:"henge",toType:T,tr:d.r,tc:d.c,shots:[{tr:rr,tc:cc}],prisk:d.prisk||0}); }
    }
  }
  return out.slice(0,10);
}
function ssApplyHenge(ns,np,ab){
  np.t=ab.toType; np.maxAp=PIECES[ab.toType].ap; np.henge=true; np.heroBoost=false;
  np.r=ab.tr; np.c=ab.tc;
  if(np.t==="inoshishi")np.charged=!!ab.charge;
  ssAfterMove(ns,np,{prisk:ab.prisk||0});
  for(const sh of (ab.shots||[])){ const t=ns.ps.find(x=>!x.dead&&x.r===sh.tr&&x.c===sh.tc&&x.o!==np.o); if(t)ssDealDamage(ns,np,t,"ranged"); }
}
/* CPUの隕石が流星群を撃ってよいか。候補マスは相手に見えていて1手番に1体は逃がされるので、
   ・候補マスに相手が2体以上（1体しか逃がせない） ・逃げられない相手がいる（行動力0）
   ・神の超越で連続手番（相手に逃げる手番が無い）
   ・超能力者／宇宙人／魔女／軍師で、着弾の手番に相手を候補マスへ動かせる（候補マスの近くに相手がいる）
   ・隕石自身が攻撃圏にいて、消えて逃げる価値がある
   のどれかの時だけ撃つ（プレイヤー側の読みでは制限しない） */
function ssMeteorOk(st,p){
  if(p.o!=="E")return true;
  const cells=METEOR_OFFSETS.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>r>=0&&r<6&&c>=0&&c<6);
  const foes=st.ps.filter(f=>f.o!==p.o&&f.t!=="kemono"&&!f.invis);
  const on=foes.filter(f=>cells.some(([r,c])=>r===f.r&&c===f.c));
  if(on.length>=2)return true;
  if(on.some(f=>((f.maxAp||1)-(f.cut?1:0))<1))return true;
  if((st.eExtra||0)>0&&on.length>=1)return true;
  const helper=st.ps.some(q=>q.o===p.o&&q.id!==p.id&&(q.t==="esper"||((q.t==="uchujin"||q.t==="majo"||q.t==="gunshi")&&q.hp>0.5)));
  if(helper&&foes.some(f=>cells.some(([r,c])=>Math.max(Math.abs(f.r-r),Math.abs(f.c-c))<=1)))return true;
  const d=ssPlayerThreat(st)[p.r+","+p.c]||0;
  if(d>0&&p.hp>0.5)return true;
  return false;
}
/* 流星群の発動（探索用）：隕石を盤外へ出し、周囲8箇所を着弾候補にする */
function ssCastMeteor(ns,id){
  const p=ns.ps.find(x=>x.id===id); if(!p)return;
  const cells=METEOR_OFFSETS.map(([dr,dc])=>({r:p.r+dr,c:p.c+dc})).filter(c=>c.r>=0&&c.r<6&&c.c>=0&&c.c<6);
  ns.meteors=[...(ns.meteors||[]),{id:p.id,owner:p.o,fuse:1,hp:p.hp,cells}];
  ns.ps=ns.ps.filter(x=>x.id!==id);
}
/* 手番の交代（神の超越による連続ターンを反映）。次に指す陣営を返す */
function ssNextSide(ns,side){
  const op=side==="P"?"E":"P", k=side==="E"?"e":"p", ko=op==="E"?"e":"p";
  if((ns[k+"Extra"]||0)>0){ ns[k+"Extra"]--; return side; }          // 連続ターンが残っている
  if(!((ns[k+"Pend"]||0)>0)) ns[k+"Lock"]=false;                      // 連続ターンを終えた → 超越の再使用可
  if((ns[ko+"Pend"]||0)>0){ ns[ko+"Extra"]=ns[ko+"Pend"]-1; ns[ko+"Pend"]=0; } // 相手の超越の予約を有効化
  return op;
}
/* 隕石の着弾マスを選ぶ（探索用）：相手の駒を撃破・巻き込み、自分の駒は巻き込まない */
function ssMeteorPick(ns,m){
  const half=c=>c<3?0:1;
  const mates=ns.ps.filter(p=>p.o===m.owner&&p.t!=="kemono");
  let cells=m.cells.filter(c=>!(ns.walls&&ns.walls.some(w=>w.r===c.r&&w.c===c.c)));
  const okC=cells.filter(c=>!(mates.length>=2&&mates.every(p=>half(p.c)===half(c.c))));
  if(okC.length)cells=okC;
  let best=null,bv=-Infinity;
  for(const c of cells){
    let v=0;
    const d=ssAt(ns,c.r,c.c);
    if(d){ const w=4000+(SS_PIECE_WORTH[d.t]||20)*4; v+= d.o!==m.owner ? w : -w; }
    for(const [dr,dc] of ORTHO){
      const t=ssAt(ns,c.r+dr,c.c+dc); if(!t)continue;
      const w=(t.hp<=0.5&&!(t.t==="fushicho"&&!t.phoenix))?3500:40;
      v+= t.o!==m.owner ? w : -w;
    }
    if(v>bv){bv=v;best=c;}
  }
  return best;
}
/* 手番終了時の隕石処理：この陣営の流星群は導火線0なら着弾、それ以外は導火線-1（実ゲームと同じ） */
function ssMeteorTick(ns,side){
  if(!ns.meteors||!ns.meteors.some(m=>m.owner===side))return;
  const keep=[],boom=[];
  for(const m of ns.meteors){
    if(m.owner!==side){keep.push(m);continue;}
    if(m.fuse<=0)boom.push(m); else keep.push({...m,fuse:m.fuse-1});
  }
  ns.meteors=keep;
  for(const m of boom){
    const c=ssMeteorPick(ns,m); if(!c)continue;
    if(ns.territories)ns.territories=ns.territories.filter(t=>!(t.r===c.r&&t.c===c.c&&t.owner!==m.owner));
    const d=ssAt(ns,c.r,c.c);
    let hitFoe=!!(d&&d.o!==m.owner);
    if(d){ d.phoenix=true; d.hp=0; ssKill(ns,d); ns.ps=ns.ps.filter(x=>x.id!==d.id); }   // 着弾マスの駒は即撃破（不死鳥も復活しない）
    const ip={id:m.id,t:"inseki",o:m.owner,r:c.r,c:c.c,hp:m.hp,maxAp:1};
    ns.ps=[...ns.ps,ip];
    for(const [dr,dc] of ORTHO){ const t=ssAt(ns,c.r+dr,c.c+dc); if(t&&t.id!==ip.id){ if(t.o!==m.owner)hitFoe=true; ssHurt(ns,t,0.5); } }
    if(!hitFoe) ssHurt(ns,ip,0.5);   // 反動：相手に当てなかった時だけ0.5
  }
}
/* 手番終了時：変化していた狐が元に戻る（HP-1） */
function ssFoxRevert(ns,side){
  for(const p of ns.ps){
    if(p.o!==side||!p.henge||p.dead)continue;
    p.henge=false; p.t="kitsune"; p.maxAp=1; p.heroBoost=false; p.invis=false;
    if(p.hp-1<=0){p.hp=0;ssKill(ns,p);} else p.hp=r2(p.hp-1);
  }
}
/* 手番終了時のフラグ処理（実ゲームと同じ）
   ・この陣営の「攻撃封じ」は今回の手番で消化 → 解除
   ・相手陣営の「透明化」は、この陣営の手番終了まで → 解除
   ・この陣営の盾兵は、次の相手の手番に備えて盾の向きを決める */
function ssTurnEndFlags(ns,side){
  for(const p of ns.ps){
    if(p.o===side){ if(p.noAtk)p.noAtk=false; if(p.t==="tatehei")p.block=ssShieldDir(ns,p); }
    else if(p.invis)p.invis=false;
  }
}
/* 盾兵の盾の向き：攻撃してきそうな相手が立つ隣接マスを選ぶ（隣に居る攻撃役 ＞ 近づける攻撃役） */
function ssShieldDir(st,s){
  let best=null,bs=-1e9;
  for(const [dr,dc] of ORTHO){
    const r=s.r+dr,c=s.c+dc; if(r<0||r>5||c<0||c>5)continue;
    let sc=0;
    for(const f of st.ps){
      if(f.dead||f.o===s.o||SS.noNormal.has(f.t))continue;
      const atkr={...f,r,c,noAtk:false,invis:false};
      if(!ssNormalCells(atkr).some(([ar,ac])=>ar===s.r&&ac===s.c))continue;   // そのマスから盾兵を殴れる駒か
      const d=Math.abs(f.r-r)+Math.abs(f.c-c);
      const reach=(f.maxAp||1)+(f.t==="kiba"||f.t==="kaizoku"||f.t==="taka"?1:0);
      if(f.r===r&&f.c===c) sc=Math.max(sc, 100+ssAtk(f,"melee",s)*20);       // 既にそこに居る
      else if(d<=reach) sc=Math.max(sc, 40+ssAtk(f,"melee",s)*10-d*5);       // 次の手番に入れる
      else sc=Math.max(sc, 10-d);
    }
    if(sc>bs){bs=sc;best={r,c};}
  }
  return best;
}
/* 手番終了時の行動力-1の進行：今回の-1を消化し、この手番で踏んだ罠の-1を次の手番へ */
function ssCutTick(ns,side){
  for(const p of ns.ps){ if(p.o!==side)continue; if(p.cut)p.cut=false; if(p.cutNext){p.cut=true;p.cutNext=false;} }
}
/* 巫女の神楽（探索用）：巫女がその場で行動力1＋HP0.5を払い、味方1体（巫女以外）が行動力+1で行動する。
   受けた駒の「増えた行動力でしか届かないマスへの移動」「移動して射撃」を候補として列挙する。
   弓兵・狙撃手は「その場で2回射撃」も候補にする。
   返り値：[{allyId, dr, dc, cost, shots:[{tr,tc},...]}] */
function ssKaguraOptions(st,miko){
  const out=[];
  if(miko.t!=="miko"||(miko.maxAp||1)<1||miko.hp<=0.5)return out;
  for(const a of st.ps){
    if(a.o!==miko.o||a.id===miko.id||a.t==="miko")continue;
    const base=a.maxAp||1;
    const mover={...a,maxAp:base+1};
    const dests=ssReach(st,mover);
    if(!dests.some(d=>d.r===a.r&&d.c===a.c))dests.push({r:a.r,c:a.c,cost:0,apLeft:base+1});
    for(const d of dests){
      const extra=d.cost>base;                         // 神楽なしでは届かない
      if(extra)out.push({allyId:a.id,dr:d.r,dc:d.c,cost:d.cost,charge:!!d.charge,shots:[],prisk:d.prisk,trapped:d.trapped});
      if(SS.ranged.has(a.t)&&d.apLeft>=1){
        const np={...a,r:d.r,c:d.c};
        const tg=[];
        for(const [rr,cc] of ssRangedCells(np,d.r,d.c)){
          const t=ssAt(st,rr,cc);
          if(t&&t.o!==miko.o&&!(t.block&&t.block.r===d.r&&t.block.c===d.c)&&ssTargetable(t,miko.o))tg.push({tr:rr,tc:cc});
        }
        // 移動して1回射撃（神楽なしでは移動と射撃を両立できない）
        if(d.cost>=1) for(const x of tg) out.push({allyId:a.id,dr:d.r,dc:d.c,cost:d.cost,charge:false,shots:[x],prisk:d.prisk,trapped:d.trapped});
        // 射撃してから1マス移動（撃った後に安全な所へ下がる）
        if(d.cost===0&&base+1>=2){
          for(const x of tg) for(const [mr,mc] of ssMoveDirs(a).map(([dr,dc])=>[a.r+dr,a.c+dc])){
            if(mr<0||mr>5||mc<0||mc>5||ssAt(st,mr,mc))continue;
            if(st.walls&&st.walls.some(w=>w.r===mr&&w.c===mc))continue;
            if(!ssColorOk(st,a,mr,mc))continue;
            out.push({allyId:a.id,dr:mr,dc:mc,cost:1,charge:false,shots:[],shotsFirst:[x],prisk:0,trapped:false});
          }
        }
        // その場で2回射撃（同じ相手に2発 or 2体に1発ずつ）
        if(d.apLeft>=2){
          for(let i=0;i<tg.length;i++)for(let j=i;j<tg.length;j++)
            out.push({allyId:a.id,dr:d.r,dc:d.c,cost:d.cost,charge:false,shots:[tg[i],tg[j]]});
        }
      }
    }
  }
  // 本来「移動か能力」の駒も、神楽で移動しながら能力を使える（両陣営とも。CPUも実際に使う）
  {
    const kinds=["kusushi","chokyo","seishoku","majo","esper","uchujin","ryoushu","bakudan"];
    if(miko.o==="E")kinds.push("wanashi");   // 相手の罠は見えないので、罠師はCPU側のみ
    for(const a of st.ps){
      if(a.o!==miko.o||a.id===miko.id||a.t==="miko"||SS.ranged.has(a.t))continue;
      if(!kinds.includes(a.t))continue;
      for(const d of ssReach(st,a)){
        if(d.cost<1)continue;
        const moved={...a,r:d.r,c:d.c};
        const tmp={...st,ps:st.ps.map(q=>q.id===a.id?moved:q)};
        const skills=a.t==="bakudan"
          ? ORTHO.map(([dr,dc])=>[d.r+dr,d.c+dc]).filter(([r,c])=>r>=0&&r<6&&c>=0&&c<6&&!ssAt(tmp,r,c)&&!(tmp.bombs||[]).some(b=>b.r===r&&b.c===c)&&!(tmp.territories||[]).some(t=>t.r===r&&t.c===c)).map(([r,c])=>({kind:"bomb",tr:r,tc:c}))
          : a.t==="wanashi" ? ssTrapCells(tmp,moved).map(([r,c])=>({kind:"trap",tr:r,tc:c}))
          : ssStayAbilities(tmp,moved,true).filter(x=>!x.requireKill&&x.kind!=="futokoro"&&x.kind!=="gunshi");
        for(const sk of skills.slice(0,miko.o==="E"?12:6)) out.push({allyId:a.id,dr:d.r,dc:d.c,cost:d.cost,charge:false,shots:[],skill:sk,prisk:0,trapped:!!d.trapped});
      }
    }
  }
  return out;
}
/* 神楽を探索用stateへ適用 */
function ssApplyKagura(ns,mikoId,opt){
  const m=ns.ps.find(x=>x.id===mikoId), a=ns.ps.find(x=>x.id===opt.allyId);
  if(!m||!a)return;
  m.hp=r2(m.hp-0.5);
  for(const sh of (opt.shotsFirst||[])){ const t=ns.ps.find(x=>!x.dead&&x.r===sh.tr&&x.c===sh.tc&&x.o!==a.o); if(t)ssDealDamage(ns,a,t,"ranged"); }
  a.r=opt.dr;a.c=opt.dc;
  if(a.t==="inoshishi")a.charged=!!opt.charge;
  ssAfterMove(ns,a,{prisk:opt.prisk||0,trapped:!!opt.trapped});
  if(a.dead)return;
  for(const sh of (opt.shots||[])){
    const t=ns.ps.find(x=>!x.dead&&x.r===sh.tr&&x.c===sh.tc&&x.o!==a.o);
    if(t)ssDealDamage(ns,a,t,"ranged");
  }
  if(opt.skill){
    if(opt.skill.kind==="bomb") ns.bombs=[...(ns.bombs||[]),{owner:a.o,r:opt.skill.tr,c:opt.skill.tc,fuse:1}];
    else if(opt.skill.kind==="trap") ssPlaceETrap(ns,a.id,opt.skill.tr,opt.skill.tc);
    else ssApplyStayAbility(ns,a,opt.skill);
  }
}
function ssGenerate(st){
  const side=st.side;
  const mine=st.ps.filter(p=>p.o===side);
  const out=[];
  const pushState=(ns)=>{
    // 手番内のベスト通常攻撃を1回付与（神の超越を使った手番は通常攻撃なし）
    if(!ns._noAtk) ssBestAttack(ns,side); else delete ns._noAtk;
    ssMeteorTick(ns,side);    // 手番終了：この陣営の流星群が着弾／導火線が進む
    ssBombTick(ns,side);      // 手番終了：この陣営の爆弾が爆発／導火線が進む
    ssFoxRevert(ns,side);     // 変化していた狐が戻る（HP-1）
    ssCutTick(ns,side);       // 行動力-1の進行
    ssTurnEndFlags(ns,side);  // 攻撃封じ・透明の解除、盾の向きの更新
    ssRemoveDead(ns);
    ns.side=ssNextSide(ns,side);
    out.push(ns);
  };
  for(const p of mine){
    // 到達マス（BFS, 色制約あり）
    const dests=ssReach(st,p);
    for(const d of dests){
      // 移動のみ
      const ns=ssClone(st);
      const np=ns.ps.find(x=>x.id===p.id);
      np.r=d.r;np.c=d.c;
      if(p.t==="inoshishi")np.charged=!!d.charge; // 猪：直進フルAPで突進可能になる
      ssAfterMove(ns,np,d);                        // 罠（通過の危険／CPUの罠を踏む）
      // 行動ルール：選んだ駒は行動力を使う必要がある。その場に留まるだけ（移動も能力もなし）は
      // 「待機」を持つ駒（術士・悪霊・呪詛師）以外は不可
      if((d.cost>0||SS_WAITERS.has(p.t)||d.full)&&ssEndOk(st,p,d)) pushState(ns);
      // 悪霊：移動に加えて、相手1体は次の手番に通常攻撃できない（行動力0・毎ターン1回）
      if(p.t==="akuryo"&&!np.dead){
        for(const f of st.ps){
          if(f.o===side||f.noAtk||SS.noNormal.has(f.t)||!ssTargetable(f,side))continue;
          const nb=ssClone(st);
          const a=nb.ps.find(x=>x.id===p.id); a.r=d.r;a.c=d.c;
          ssAfterMove(nb,a,d);
          const tg=nb.ps.find(x=>x.id===f.id); if(tg&&!a.dead)tg.noAtk=true;
          pushState(nb);
        }
      }
      // 術士：移動に加えて、相手1体の次の手番の行動力-1（行動力0・毎ターン1回）
      if(p.t==="jutsushi"&&!np.dead){
        for(const f of st.ps){
          if(f.o===side||f.cut||!ssTargetable(f,side))continue;   // 減速は重ならない
          const nsl=ssClone(st);
          const a=nsl.ps.find(x=>x.id===p.id); a.r=d.r;a.c=d.c;
          ssAfterMove(nsl,a,d);
          const tg=nsl.ps.find(x=>x.id===f.id); if(tg&&!a.dead)tg.cut=true;
          pushState(nsl);
        }
      }
      // 遠距離（弓兵・狙撃）：移動後に残APがあれば
      if(SS.ranged.has(p.t)&&d.apLeft>=1){
        const cells=ssRangedCells(np,d.r,d.c);
        for(const [rr,cc] of cells){
          const t=ssAt(ns,rr,cc);
          if(t&&t.o!==side&&!(t.block&&t.block.r===d.r&&t.block.c===d.c)&&ssTargetable(t,side)){
            const ns2=ssClone(st);
            const a2=ns2.ps.find(x=>x.id===p.id); a2.r=d.r;a2.c=d.c;
            ssAfterMove(ns2,a2,d);
            const t2=ns2.ps.find(x=>x.r===rr&&x.c===cc&&x.o!==side);
            if(t2)ssDealDamage(ns2,a2,t2,"ranged");
            pushState(ns2);
          }
        }
      }
      // 罠師（CPU側のみ）：その場で周囲8マスに罠を設置（1人2個まで、超過は最古を撤去）
      if(side==="E"&&p.t==="wanashi"&&d.cost===0&&d.apLeft>=1){
        for(const [tr,tc] of ssTrapCells(st,p)){
          const nt=ssClone(st);
          ssPlaceETrap(nt,p.id,tr,tc);
          pushState(nt);
        }
      }
      // 忍者：透明化（行動力1）→ 残りの行動力で斜めも含めて1マスずつ移動（両陣営とも読む）
      if(p.t==="ninja"&&!p.invis&&d.cost===0){
        const ap=(p.maxAp||1)-(p.cut?1:0);
        if(ap>=1){
          let outs=ap>=2?ssReach(st,{...p,invis:true,maxAp:ap-1,cut:false}).filter(x=>x.cost>=1):[];
          if(!outs.length)outs=[{r:p.r,c:p.c,prisk:0}];
          for(const o of outs){ const nv=ssClone(st); const q=nv.ps.find(x=>x.id===p.id); q.invis=true; q.r=o.r; q.c=o.c; ssAfterMove(nv,q,o); pushState(nv); }
        }
      }
      // その場で使う能力（薬師・調教師・聖職者・魔女・超能力者・宇宙人・領主・軍師）を両陣営とも読む
      if(d.cost===0){
        for(const ab of ssStayAbilities(st,p,true)){
          if(ab.requireKill||ab.kind==="futokoro")continue;
          const na=ssClone(st); const ap2=na.ps.find(x=>x.id===p.id);
          ssApplyStayAbility(na,ap2,ab); pushState(na);
        }
        // 狐：変化して、その駒の動きで攻撃できる位置へ
        if(p.t==="kitsune"&&d.apLeft>=1){
          for(const ab of ssHengeOptionsCheap(st,p)){ const nh=ssClone(st); const hp2=nh.ps.find(x=>x.id===p.id); ssApplyHenge(nh,hp2,ab); pushState(nh); }
        }
      }
      // 神：超越（通常攻撃なしで即ターンエンド → 相手の手番の後、自分が2回続けて指す）
      if(p.t==="kami"&&d.cost===0&&d.apLeft>=1&&!st[(side==="E"?"e":"p")+"Lock"]){
        const nk=ssClone(st); const k=side==="E"?"e":"p";
        nk[k+"Pend"]=2; nk[k+"Lock"]=true; nk._noAtk=true;
        pushState(nk);
      }
      // 隕石：流星群（盤外へ → 次の自分の手番の終わりに8箇所のどこかへ着弾）
      if(p.t==="inseki"&&d.cost===0&&d.apLeft>=1&&ssMeteorOk(st,p)){ const nm=ssClone(st); ssCastMeteor(nm,p.id); pushState(nm); }
      // 巫女：その場で神楽 → 味方1体が行動力+1で移動／射撃（攻撃はpushStateで付与）
      if(p.t==="miko"&&d.cost===0){
        for(const opt of ssKaguraOptions(st,p)){
          const nk=ssClone(st);
          ssApplyKagura(nk,p.id,opt);
          pushState(nk);
        }
      }
      // 爆弾魔：その場（cost0）で縦横の隣接空きマスに爆弾設置（行動力1）
      if(p.t==="bakudan"&&d.cost===0&&(p.maxAp||1)>=1){
        for(const [dr,dc] of ORTHO){
          const br=p.r+dr,bc=p.c+dc;
          if(br<0||br>5||bc<0||bc>5||ssAt(st,br,bc)||(st.bombs||[]).some(x=>x.r===br&&x.c===bc)||(st.territories||[]).some(t=>t.r===br&&t.c===bc))continue;
          const nb=ssClone(st);
          nb.bombs=[...(nb.bombs||[]),{owner:side,r:br,c:bc,fuse:1}];
          pushState(nb);
        }
      }
      // 呪詛師：その場（cost0）で全体-0.5（HP>=1.5、自壊すれば相手の勝ち点）
      if(p.t==="jusoshi"&&d.cost===0&&np.hp>=1.5){
        const ns3=ssClone(st);
        const a3=ns3.ps.find(x=>x.id===p.id);
        for(const t of ns3.ps.filter(x=>x.o!==side)) ssHurt(ns3,t,0.5);
        if(a3.hp-1.5<=0){a3.hp=0;ssKill(ns3,a3);} else a3.hp=r2(a3.hp-1.5);   // 自壊は相手の得点（不死鳥ではないので復活なし）
        pushState(ns3);
      }
    }
  }
  if(out.length===0){ // 手詰まり：パス
    const ns=ssClone(st);ssBestAttack(ns,side);ssMeteorTick(ns,side);ssBombTick(ns,side);ssFoxRevert(ns,side);ssCutTick(ns,side);ssTurnEndFlags(ns,side);ssRemoveDead(ns);
    ns.side=ssNextSide(ns,side);out.push(ns);
  }
  return out;
}
/* BFS到達（color制約・遮断あり）→ {r,c,cost,apLeft} */
/* 推定罠確率（P罠）のマス別合成値（1-Π(1-p)）。stごとにキャッシュ */
function ssTrapProbMap(st){
  if(st._tpMap)return st._tpMap;
  const m={};
  for(const tp of (st.trapProb||[])){ const k=tp.r+","+tp.c; m[k]=1-(1-(m[k]||0))*(1-(tp.prob||0)); }
  st._tpMap=m; return m;
}
function ssReach(st,p){
  const ap=Math.max(0,(p.maxAp||1)-(p.cut?1:0));   // 罠・術士による行動力-1
  const res={[p.r+","+p.c]:{cost:0,risk:0,prisk:0}};
  let frontier=[{r:p.r,c:p.c}];
  const dirs=ssMoveDirs(p);
  // 盤面の情報は最初に36マスの表にしておき、各マスの判定を速くする（探索の高速化）
  const occG=new Uint8Array(36), wallG=new Uint8Array(36), terrG=new Uint8Array(36), trapG=new Uint8Array(36);
  for(const q of st.ps) if(q.id!==p.id&&q.r>=0&&q.r<6&&q.c>=0&&q.c<6) occG[q.r*6+q.c]=1;
  if(st.walls) for(const w of st.walls) wallG[w.r*6+w.c]=1;                       // 錬金術師の壁
  if(st.territories) for(const t of st.territories) if(t.owner!==p.o) terrG[t.r*6+t.c]=1; // 相手の領地には入れない
  if(p.o==="P"&&st.eTraps) for(const t of st.eTraps) trapG[t.r*6+t.c]=1;          // CPUの罠：相手(P)の駒はそこで止まる
  const occupied=(r,c)=>occG[r*6+c]===1;
  const wall=(r,c)=>wallG[r*6+c]===1;
  const terrBlock=(r,c)=>terrG[r*6+c]===1;
  const eTrapAt=(r,c)=>trapG[r*6+c]===1;
  // 色陣の偏り判定（ssColorOk と同じ判定を前計算）
  let colorFree=true; const halfCnt=[0,0];
  if(p.t!=="kemono"){
    const allies=st.ps.filter(q=>q.o===p.o&&q.t!=="kemono");
    if(allies.length>=3){
      const h0=allies[0].c<3?0:1;
      if(allies.some(q=>(q.c<3?0:1)!==h0)){ colorFree=false; for(const q of allies) if(q.id!==p.id) halfCnt[q.c<3?0:1]++; }
    }
  }
  const colOk=(nr,nc)=>colorFree||(1+halfCnt[nc<3?0:1])<3;
  // 相手の罠（推定）：CPU(E)の駒が通るマスの危険度
  const tpm=(p.o==="E"&&st.trapProb&&st.trapProb.length)?ssTrapProbMap(st):null;
  for(let s=0;s<ap;s++){
    const nf=[];
    for(const cur of frontier){
      const ck=cur.r+","+cur.c, cr=res[ck];
      if(cr.trapped)continue;                 // 罠を踏んだマスからは進めない
      for(const [dr,dc] of dirs){
        let nr=cur.r+dr,nc=cur.c+dc;
        let wrap=false;
        if(p.t==="boken"&&nc!==((nc+6)%6)){ nc=(nc+6)%6; wrap=true; } // 冒険者：左右ループ（コスト0）
        if(!inB(nr,nc))continue;
        const k=nr+","+nc;
        const stepCost=wrap?0:1;
        const ncost=cr.cost+stepCost;
        const nrisk=tpm?1-(1-cr.risk)*(1-(tpm[k]||0)):0;
        if(res[k]){
          // 同じ手数で行けるなら、罠の危険が小さい経路を採用
          if(tpm&&res[k].cost===ncost&&cr.risk<res[k].prisk-1e-9){ res[k].prisk=cr.risk; res[k].risk=nrisk; }
          continue;
        }
        if(occupied(nr,nc))continue;
        if(wall(nr,nc))continue;              // 壁のマスには入れない
        if(terrBlock(nr,nc))continue;         // 相手の領地には入れない
        if(!colOk(nr,nc))continue;
        res[k]={cost:ncost,risk:nrisk,prisk:cr.risk,trapped:eTrapAt(nr,nc)};
        nf.push({r:nr,c:nc});
      }
    }
    frontier=nf;
  }
  // 騎馬跳躍
  if(p.t==="kiba"&&ap>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(nr,nc))continue;
      if(wall(mr,mc))continue;                // 中間が壁なら飛び越え不可
      if(!occupied(mr,mc))continue;           // 中間に駒がある時のみ跳躍
      if(occupied(nr,nc))continue;
      if(wall(nr,nc))continue;                // 着地マスが壁なら不可
      if(terrBlock(nr,nc))continue;           // 相手の領地には着地不可
      if(!colOk(nr,nc))continue;
      const k=nr+","+nc;
      if(!res[k]||res[k].cost>2)res[k]={cost:2,risk:0,prisk:0,trapped:eTrapAt(nr,nc)};
    }
  }
  // 鷹跳躍：隣接の障害物（駒・壁）を1つ飛び越えて、すぐ先の空きマスへ着地（1AP）
  if(p.t==="taka"&&ap>=1){
    const obstacle=(r,c)=>occupied(r,c)||wall(r,c);
    for(const [dr,dc] of ALL8){
      const or=p.r+dr,oc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(or,oc)||!inB(nr,nc))continue;
      if(!obstacle(or,oc))continue;           // 隣が障害物の時のみ跳躍
      if(obstacle(nr,nc))continue;            // 着地先が空きでない＝不可
      if(terrBlock(nr,nc))continue;
      if(!colOk(nr,nc))continue;
      const k=nr+","+nc;
      if(!res[k]||res[k].cost>1)res[k]={cost:1,risk:0,prisk:0,trapped:eTrapAt(nr,nc),jumped:true};
    }
    // 連続飛び越え：着地した隣にさらに飛び越えられる障害物があれば行動力+1 → もう一度飛ぶ／1マス動く
    const canLand=(r,c)=>inB(r,c)&&!obstacle(r,c)&&!terrBlock(r,c)&&colOk(r,c);
    const jumpsFrom=(r0,c0)=>{ const o=[]; for(const [dr,dc] of ALL8){ if(!inB(r0+dr,c0+dc)||!obstacle(r0+dr,c0+dc))continue; const lr=r0+dr*2,lc=c0+dc*2; if(canLand(lr,lc))o.push([lr,lc]); } return o; };
    const seen=new Set();
    const chain=(r0,c0,depth)=>{
      const js=jumpsFrom(r0,c0); if(!js.length||depth>3)return;   // 連続できない
      for(const [lr,lc] of js){ const k=lr+","+lc; if(!res[k]||res[k].cost>1)res[k]={cost:1,risk:0,prisk:0,trapped:eTrapAt(lr,lc),jumped:true}; if(!seen.has(k)){seen.add(k);chain(lr,lc,depth+1);} }
      for(const [dr,dc] of ALL8){ const sr=r0+dr,sc=c0+dc; if(!canLand(sr,sc))continue; const k=sr+","+sc; if(!res[k]||res[k].cost>1)res[k]={cost:1,risk:0,prisk:0,trapped:eTrapAt(sr,sc),jumped:true}; }
    };
    for(const [dr,dc] of ALL8){ const lr=p.r+dr*2,lc=p.c+dc*2; if(inB(p.r+dr,p.c+dc)&&obstacle(p.r+dr,p.c+dc)&&canLand(lr,lc)){ const k=lr+","+lc; if(!seen.has(k)){seen.add(k);chain(lr,lc,1);} } }
  }
  // 猪の突進：直進でフルAP移動したマスを「突進可能(charge)」としてタグ付け（到達した場合のみ）
  const chargeSet=new Set();
  if(p.t==="inoshishi"){
    for(const [dr,dc] of ORTHO){
      let ok=true;
      for(let s=1;s<=ap;s++){
        const rr=p.r+dr*s, cc=p.c+dc*s;
        if(!inB(rr,cc)||occupied(rr,cc)||wall(rr,cc)||terrBlock(rr,cc)){ok=false;break;}
      }
      // 突進は「本来の行動力（2）ぶん直進」が条件。罠・術士で行動力が減っていると突進できない
      if(ok&&ap>0&&ap>=(p.cut?99:2)){ const lr=p.r+dr*ap, lc=p.c+dc*ap; if(res[lr+","+lc])chargeSet.add(lr+","+lc); }
    }
  }
  // ちょうど行動力を使い切って到達できるマス（寄り道・戻りを含む）。行動力は必ず使い切るルール用
  const full=new Set();
  if(p.t!=="boken"){
    let layer=new Set([p.r+","+p.c]);
    for(let s=0;s<ap;s++){
      const nx=new Set();
      for(const k0 of layer){
        if(res[k0]&&res[k0].trapped)continue;
        const [r0,c0]=k0.split(",").map(Number);
        for(const [dr,dc] of dirs){
          const nr=r0+dr,nc=c0+dc;
          if(!inB(nr,nc)||occupied(nr,nc)||wall(nr,nc)||terrBlock(nr,nc)||!colOk(nr,nc))continue;
          nx.add(nr+","+nc);
        }
      }
      layer=nx;
    }
    for(const k0 of layer)full.add(k0);
  }
  return Object.keys(res).map(k=>{
    const [r,c]=k.split(",").map(Number);
    const x=res[k];
    return {r,c,cost:x.cost,apLeft:x.trapped?0:ap-x.cost, charge:chargeSet.has(k)&&!x.trapped, prisk:x.prisk||0, trapped:!!x.trapped,
            jumped:!!x.jumped, full:full.has(k)||x.cost>=ap, ap};
  });
}
/* 手番側のベスト通常攻撃を1回だけ適用 */
/* 攻撃側sideから見て、この駒を狙えるか（敵の透明忍者は狙えない） */
function ssTargetable(t,bySide){ return !(t.invis && t.o!==bySide); }
function ssBestAttack(st,side){
  let best=null,bs=-1;
  for(const a of st.ps.filter(x=>x.o===side&&!SS.noNormal.has(x.t))){
    for(const [r,c] of ssNormalCells(a)){
      const t=st.ps.find(x=>x.r===r&&x.c===c&&x.o!==side);
      if(!t)continue;
      if(!ssTargetable(t,side))continue; // 透明忍者は攻撃不可
      if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
      const d=ssAtk(a,"melee",t);
      const kills=t.hp-d<=0&&!(t.t==="fushicho"&&!t.phoenix);
      let s=(kills?1000:0)+d*200+(3-Math.max(0,t.hp-d))*40;
      if(t.t==="kemono")s=s*0.08-30; // 獣は撃破価値が低い（即再召喚）→調教師本体を優先
      if(s>bs){bs=s;best={a,t};}
    }
  }
  if(best)ssDealDamage(st,best.a,best.t,"melee");
}

/* 相手の駒が詐欺師で、懐入（ゲーム1回の行動力+1）を使ってくる可能性の見込み */
const AI_SAGISHI_RISK=0.1;
/* 静的評価（E視点：高いほどEに有利） */
/* 後手からでも殴り勝てる（防御側でも強い）駒 */
const SS_COUNTER_STRONG=new Set(["kenshi","senshi","kyuketsuki","fushicho","kusushi","kaizoku"]);
/* トラップ／不可視攻撃を仕掛けうる駒（居た場所の周囲が危険） */
const SS_TRAPPER=new Set(["wanashi","bakudan","ninja","esper"]);

/* プレイヤーの脅威マップ：各マスへ「次のプレイヤー手番で入りうる最大被ダメージ」を算出。
   移動→通常攻撃、遠距離、軍師/巫女による追加行動・射程延長も概算で加味する。 */
function ssPlayerThreat(st){
  if(st._danger)return st._danger;
  const danger={}; // "r,c" -> 予想被ダメージ
  const ext={};    // 詐欺師の懐入（行動力+1）を使われた場合の被ダメージ
  const bumpTo=(m,r,c,d)=>{const k=r+","+c;if(!m[k]||m[k]<d)m[k]=d;};
  const pP=st.ps.filter(p=>p.o==="P");
  // 巫女：味方1体に行動力+1（2マス移動、移動しながら能力、弓・狙撃の2回射撃や移動して射撃）。
  // 減速中やHP0.5の巫女は神楽を使えない
  const hasMiko=pP.some(p=>p.t==="miko"&&p.hp>0.5&&((p.maxAp||1)-(p.cut?1:0))>=1);
  const extraMove=(hasMiko?1:0);
  const scan=(m,plus)=>{
    for(const p of pP){
      const mover={...p, maxAp:p.maxAp+extraMove+plus};
      const reach=ssReach(st,mover);
      reach.push({r:p.r,c:p.c,cost:0,apLeft:mover.maxAp-(p.cut?1:0)}); // その場も含む
      for(const d of reach){
        const from={...p,r:d.r,c:d.c,charged:!!d.charge};   // 猪：直進突進後は2ダメージ
        if(!SS.noNormal.has(p.t)){
          for(const [ar,ac] of ssNormalCells(from)){
            const tg=st.ps.find(q=>q.r===ar&&q.c===ac&&q.o!=="P");   // 海賊：HPが高い相手には+1
            bumpTo(m,ar,ac, ssAtk(from,"melee",tg||{hp:0}));
          }
        }
        if(SS.ranged.has(p.t)&&d.apLeft>=1){
          const dm=d.apLeft>=2?2:1;   // 行動力が2残る（巫女の神楽など）なら同じ相手に2回射撃
          for(const [ar,ac] of ssRangedCells(from,d.r,d.c)) bumpTo(m,ar,ac,dm);
        }
      }
    }
  };
  scan(danger,0);
  // どの駒も「実は詐欺師で、懐入（行動力+1）を使ってくる」可能性を少しだけ見込む。
  // 1マス多く動ければ、攻撃が届くマスも1マス広がる（危険マップを縦横1マス広げて近似）
  for(const k in danger){ const [r,c]=k.split(",").map(Number); bumpTo(ext,r,c,danger[k]);
    for(const [dr,dc] of ORTHO){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<6&&nc>=0&&nc<6)bumpTo(ext,nr,nc,danger[k]); } }
  st._danger=danger; st._dangerExt=ext;
  return danger;
}

/* E駒 e が、爆弾魔 bm の爆風圏(bmからチェビシェフ2以内)の外へ、
   自分の行動力で移動して逃げられるか。逃げられれば true。 */
function ssCanEscapeBlast(st,e,bm){
  // 現在チェビシェフ距離。爆風圏を出るのに必要な最小マス数の下限は (3 - cheb) 以上。
  const cheb=Math.max(Math.abs(e.r-bm.r),Math.abs(e.c-bm.c));
  const needed=3-cheb;            // cheb2→1歩, cheb1→2歩, cheb0→3歩 で圏外(cheb>2)
  if(needed<=0)return true;       // 既に圏外
  if(e.maxAp<needed)return false; // 行動力が足りず物理的に逃げられない
  // 行動力が足りる場合のみBFSで実際に圏外へ出られるか確認
  const reach=ssReach(st,e);
  for(const d of reach){
    if(Math.max(Math.abs(d.r-bm.r),Math.abs(d.c-bm.c))>2)return true;
  }
  return false;
}
/* 爆弾1発（1.5ダメージ）を受けた時の損失の大きさ */
function ssBombHitValue(p){
  if(p.t==="kemono")return 15;
  const w=SS_PIECE_WORTH[p.t]||10;
  const lethal=(p.hp-1.5<=0)&&!(p.t==="fushicho"&&!p.phoenix);
  return lethal ? 4000+w*4 : 90+w;
}
/* 駒pが自分の1手で爆心(br,bc)の爆風圏(3×3)の外へ出られるか */
function ssCanEscapeCell(st,p,br,bc){
  if(Math.max(Math.abs(p.r-br),Math.abs(p.c-bc))>1)return true;
  for(const d of ssReach(st,p)) if(Math.max(Math.abs(d.r-br),Math.abs(d.c-bc))>1) return true;
  return false;
}
/* 爆風圏の同陣営の駒(pieces)のうち、爆発までに moves 体だけ逃がせるとした時の損失。
   逃がせる駒は価値の高い順に逃がし、残りは確定で被弾するとみなす */
function ssBlastLoss(st,br,bc,pieces,moves){
  const items=pieces.map(p=>({val:ssBombHitValue(p),esc:moves>0&&ssCanEscapeCell(st,p,br,bc)})).sort((a,b)=>b.val-a.val);
  let loss=0,left=moves;
  for(const it of items){
    if(it.esc&&left>0){left--;loss+=18;}   // 逃げられるが1手を取られる
    else loss+=it.val;                     // 逃がしきれない＝確定被弾
  }
  return loss;
}
/* 手番終了時の爆弾処理（実ゲームのexplodeBombsと同じ：その陣営の爆弾は導火線0なら爆発、それ以外は導火線-1） */
function ssBombTick(st,side){
  if(!st.bombs||!st.bombs.some(b=>b.owner===side))return;
  const keep=[],boom=[];
  for(const b of st.bombs){
    if(b.owner!==side){keep.push(b);continue;}
    if(b.fuse<=0)boom.push(b); else keep.push({r:b.r,c:b.c,owner:b.owner,fuse:b.fuse-1});
  }
  st.bombs=keep;
  for(const b of boom){
    // 爆風の範囲の罠は壊れる
    const inBlast=x=>Math.max(Math.abs(x.r-b.r),Math.abs(x.c-b.c))<=1;
    if(st.eTraps&&st.eTraps.some(inBlast)) st.eTraps=st.eTraps.filter(x=>!inBlast(x));
    if(st.trapProb&&st.trapProb.some(inBlast)) { st.trapProb=st.trapProb.filter(x=>!inBlast(x)); st._tpMap=null; }
    for(const t of st.ps){
      if(t.dead||Math.max(Math.abs(t.r-b.r),Math.abs(t.c-b.c))>1)continue;
      ssHurt(st,t,1.5);
    }
  }
}
/* 駒aが今の位置から駒fを通常攻撃できるか（攻撃範囲・槍兵の形・盾・攻撃封じ・透明を考慮） */
function ssHits(a,f){
  if(SS.noNormal.has(a.t)||a.noAtk||a.invis)return false;
  if(f.block&&f.block.r===a.r&&f.block.c===a.c)return false;
  return ssNormalCells(a).some(([r,c])=>r===f.r&&c===f.c);
}
/* 止めて動けない駒 tg を、Eが次の手番で確実に討ち取れるか（Eの駒が届く位置から一撃で倒せる） */
function ssTamerCatchable(st,tg){
  for(const q of st.ps){
    if(q.o!=="E"||q.dead||q.t==="kemono")continue;
    const spots=[{r:q.r,c:q.c},...ssReach(st,{...q,cut:false,noAtk:false})];
    for(const d of spots){
      const from={...q,r:d.r,c:d.c,cut:false,noAtk:false};
      if(!SS.noNormal.has(q.t)&&ssHits(from,tg)&&ssKillable(tg,ssAtk(from,"melee",tg)))return true;
      if(SS.ranged.has(q.t)&&ssRangedCells(from,d.r,d.c).some(([r,c])=>r===tg.r&&c===tg.c)&&ssKillable(tg,ssAtk(from,"ranged",tg)))return true;
    }
  }
  return false;
}
/* その一撃で討ち取れるか（不死鳥の復活が残っていれば討ち取りにならない） */
function ssKillable(f,dmg){ return f.hp-dmg<=0 && !(f.t==="fushicho"&&!f.phoenix); }
function ssEval(st){
  if(st.kE>=2)return 1e7;
  if(st.kP>=2)return -1e7;
  let v=(st.kE-st.kP)*5000;
  const eP=st.ps.filter(p=>p.o==="E"), pP=st.ps.filter(p=>p.o==="P");
  // === 瀕死の駒のリスク ===
  // HP1以下の駒は、次の一撃で倒されやすい。相手があと1体倒せば勝ちの時（交換で1対1になった後など）は特に危ない。
  // 交換で得点が並んでも、残りの駒に瀕死がいれば大きなリスクとして評価する（相手側も同様に、こちらの好機として加点）
  {
    const frag=p=>p.t!=="kemono"&&p.hp<=1&&!(p.t==="fushicho"&&!p.phoenix);
    const fragE=st.ps.filter(p=>p.o==="E"&&frag(p)).length, fragP=st.ps.filter(p=>p.o==="P"&&frag(p)).length;
    v-=fragE*(st.kP>=1?900:200);
    v+=fragP*(st.kE>=1?900:200);
  }
  // 駒の存在＋HP総量（E加点・P減点）
  for(const p of eP)v+=120+p.hp*80;
  for(const p of pP){
    // 獣(kemono)は倒しても調教師HP-0.5＆即再召喚されるため、標的価値をほぼ無視する
    if(p.t==="kemono"){ v-=10; continue; }
    v-=120+p.hp*80;
  }
  const dist=(a,arr)=>{let m=99;for(const b of arr)m=Math.min(m,Math.abs(a.r-b.r)+Math.abs(a.c-b.c));return m;};

  // === 調教師の戦法：獣を召喚して対面戦闘。獣未召喚の調教師は戦力が遊んでいる ===
  for(const tamer of eP.filter(x=>x.t==="chokyo")){
    const myBeast=eP.find(b=>b.t==="kemono");
    if(!myBeast && pP.length){
      // まだ獣を出していない＝早く召喚すべき。敵が近いほど「早く出して対面したい」ので減点
      v-=30;
      const dEnemy=dist(tamer,pP);
      if(dEnemy<=3)v-=(4-dEnemy)*10; // 敵が接近しているのに獣未召喚はさらに損
    }
    // 調教師は強襲タイプ(騎馬・忍者・冒険者)が苦手。獣が距離を詰め返す前に本体を襲われる。
    // 強襲駒が近いほど強く警戒し、調教師を逃がす／距離を取る判断を促す。
    for(const f of pP){
      if(f.t==="kiba"||f.t==="ninja"||f.t==="boken"){
        const man=Math.abs(tamer.r-f.r)+Math.abs(tamer.c-f.c);
        if(man<=3)v-=(4-man)*22; // 強襲駒が接近＝調教師本体が危ない
      }
    }
  }
  // E側の獣が敵に先制攻撃できる位置にいれば加点（獣で先手を取る戦法）
  for(const b of eP.filter(x=>x.t==="kemono")){
    for(const f of pP){
      if(Math.abs(b.r-f.r)+Math.abs(b.c-f.c)===1){
        v+=20;                        // 獣が敵と対面＝牽制になっている
        if(f.hp<=1)v+=40;             // HP1の敵を獣で仕留めうる
      }
    }
  }

  const beasts=pP.filter(p=>p.t==="kemono");
  if(beasts.length){
    const tamers=pP.filter(p=>p.t==="chokyo");
    // 獣は「逃げる対象」ではない。倒しても勝ち点にならず即再召喚されるため、
    // 獣を避けるのではなく、親（調教師）を討つことを狙う。全ての攻撃駒が調教師へ寄る。
    const attackerTypes=new Set(["kenshi","senshi","kiba","souhei","kyuketsuki","ninja","boken","yusha","fushicho","kusushi"]);
    if(tamers.length){
      for(const e of eP){
        if(SS.noNormal.has(e.t))continue;     // 攻撃できない後衛は寄せない（が、逃げもしない）
        const dt=dist(e,tamers);
        const pull = attackerTypes.has(e.t)?18:10; // 強襲・近接は特に強く親へ向かう
        v-=dt*pull;
        if(dt===1)v+=55;                       // 調教師に隣接＝討ち取り目前
      }
    }
  }

  // === 対盾：盾を持つ敵駒に対しては、盾で塞がれていないマスから攻める ===
  // 盾は隣接1マスからの攻撃だけを防ぐ。行動力2の駒や斜め移動できる駒は、盾の無いマスへ
  // 回り込んで攻撃できる。AIはその位置取り（盾の利かない隣接マス）を高く評価する。
  for(const tgt of pP){
    if(!tgt.block)continue;                 // 盾で守っている敵駒のみ対象
    for(const e of eP){
      if(SS.noNormal.has(e.t))continue;     // 通常攻撃を持たない駒は対象外
      const adj = Math.abs(e.r-tgt.r)+Math.abs(e.c-tgt.c)===1; // 直交で隣接しているか
      if(!adj)continue;
      const blocked = (e.r===tgt.block.r && e.c===tgt.block.c); // 盾で塞がれたマスにいるか
      const dmg=ssAtk(e,"melee")||1;
      const wouldKill = tgt.hp-dmg<=0 && !(tgt.t==="fushicho"&&!tgt.phoenix);
      if(!blocked){
        // 盾の利かないマスから隣接＝有効打。討ち取れるなら大きく加点
        v += wouldKill ? 90 : 30;
      }else{
        // 盾で塞がれたマスからの隣接は無効打。回り込みを促すため、わずかに減点
        v -= 12;
      }
    }
  }

  // === スコア状況による守備倍率 ===
  // 勝ち点をプレイヤーに先行されている（kP>kE）＝あと1つ取られると負け。
  // この時は駒を失わないことの価値をやや引き上げるが、過度に守りに入って
  // 逃げ回るのは本末転倒（勝つには2点取る必要がある）なので控えめに。
  let defMul=1.0;
  if(st.kP>st.kE){
    defMul = (st.kP>=1) ? 1.35 : 1.2; // 以前は2.2/1.6で守りすぎだった
  }

  // === プレイヤーの脅威マップ：危険マスに居るE駒を強く割り引く ===
  const danger=ssPlayerThreat(st);
  const dangerExt=st._dangerExt||{};
  for(const p of eP){
    // 相手のどれかが詐欺師で懐入（行動力+1）を使ってきた場合の追加の危険（約10%で見込む）
    const ex=dangerExt[p.r+","+p.c]||0, base=danger[p.r+","+p.c]||0;
    if(ex>base){
      let pe=(ex-base)*70; if(p.hp-ex<=0&&p.hp-base>0)pe+=340;
      v-=pe*AI_SAGISHI_RISK*defMul;
    }
  }
  for(const p of eP){
    const dmg=danger[p.r+","+p.c]||0;
    if(dmg>0){
      // 被弾の見込みを減点。撃破されうる（HP<=dmg）なら特に重く
      let pen=dmg*70;
      if(p.hp-dmg<=0){
        // 次手番で取られる位置。ただし不死鳥は復活が残っていれば失点しない
        pen+= (p.t==="fushicho"&&!p.phoenix) ? 90 : 340;
        // 後手からでも殴り勝てる駒は、あえて踏み込む価値があるので緩和
        if(SS_COUNTER_STRONG.has(p.t)&&!(p.t==="fushicho"&&p.phoenix))pen-=120;   // 復活を使った不死鳥は除く
      }
      v-=pen*defMul;
    }
  }

  // === 追い詰め検知：脅威下のE駒の逃げ方を評価する ===
  // 重要：隣接戦闘から「ただ逃げる」だけでは、行動力差が無い限り追いつかれて不利になるだけ。
  //   逃げるなら“援護のある”マスへ逃げる必要がある：
  //   (A) 自軍の弓兵・狙撃手の射程に追手が入る位置（＝逃げ込めば追手を撃てる）
  //   (B) 自軍の剣士・戦士がカバー（隣接して反撃）に行ける位置
  //   これらを満たす退避は加点、満たさない「ただ逃げるだけ」の退避は評価しない。
  const eRanged=eP.filter(p=>p.t==="kyuhei"||p.t==="sogeki");
  const eCover =eP.filter(p=>p.t==="kenshi"||p.t==="senshi"||p.t==="souhei"||p.t==="kiba");
  // マス(r,c)に逃げた駒を追う「追手候補」＝そのマスに隣接攻撃で届くプレイヤー駒
  const pursuersOf=(r,c)=>pP.filter(f=>!SS.noNormal.has(f.t)&&!f.noAtk&&ssNormalCells(f).some(([ar,ac])=>ar===r&&ac===c));
  // 追手がいる位置pに対して、自軍が援護（射程/カバー）できるか
  const isSupported=(r,c)=>{
    const pursuers=pursuersOf(r,c);
    if(!pursuers.length)return false;
    for(const pu of pursuers){
      // (A) 弓兵・狙撃手の射程に追手が入るか
      for(const rg of eRanged){
        if(ssRangedCells({t:rg.t,o:"E"},rg.r,rg.c).some(([rr,cc])=>rr===pu.r&&cc===pu.c))return true;
      }
      // (B) 剣士・戦士・槍兵・騎馬が、追手の隣接マスへ1手で入れるか（カバー）
      for(const cv of eCover){
        if(cv.id===undefined)continue;
        // 追手の隣接空きマスに、カバー駒が可動域(maxAp)内で到達できるか（簡易：チェビシェフ距離）
        const reach=cv.maxAp||1;
        for(const [dr,dc] of ORTHO){
          const ar=pu.r+dr, ac=pu.c+dc;
          if(!inB(ar,ac))continue;
          if(st.ps.some(q=>q.r===ar&&q.c===ac))continue; // 空きマスのみ
          const cheb=Math.max(Math.abs(cv.r-ar),Math.abs(cv.c-ac));
          const man=Math.abs(cv.r-ar)+Math.abs(cv.c-ac);
          const step=(cv.t==="kiba")?cheb:man; // 騎馬は斜め可
          if(step<=reach)return true;
        }
      }
    }
    return false;
  };
  for(const p of eP){
    const here=danger[p.r+","+p.c]||0;
    // 撃破圏内にいる駒だけを対象（HP<=被ダメ）
    if(here>0 && p.hp-here<=0){
      // ただし、この駒が隣接する敵を「先制で討てる」なら、逃げより攻撃が優先。
      // その場合は追い詰め減点を課さない（攻めに転じるべき局面）。
      let canKillNow=false;
      for(const f of pP){
        if(f.t!=="kemono"&&ssHits(p,f)&&ssKillable(f,ssAtk(p,"melee",f))){canKillNow=true;break;}
      }
      if(canKillNow)continue; // 先制撃破できるなら逃げ評価しない
      const dests=ssReach(st,p);
      let safeSupported=0, safeBare=0, total=0;
      for(const d of dests){
        if(d.r===p.r&&d.c===p.c)continue;
        total++;
        const dd=danger[d.r+","+d.c]||0;
        if(p.hp-dd>0){
          if(pursuersOf(d.r,d.c).length===0) safeSupported++;
          else if(isSupported(d.r,d.c))       safeSupported++;
          else                                safeBare++;
        }
      }
      if(total>0){
        if(safeSupported===0 && safeBare===0){
          v-=160*defMul;      // どこへ動いても取られる → ほぼ確定で失う
        }else if(safeSupported===0){
          v-=55*defMul;       // 逃げてもただ追われるだけ（以前-120→緩和）
        }else if(safeSupported<=1){
          v-=25*defMul;
        }
      }
    }
  }
  // 援護退避を促す加点：脅威下のE駒が「援護マス」に居るなら評価を上げる
  for(const p of eP){
    const here=danger[p.r+","+p.c]||0;
    if(here>0 && p.hp-here>0){ // 被弾圏だが今は生存（＝踏みとどまっている）
