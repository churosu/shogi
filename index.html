<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>攻城戦 — 三駒勝負</title>
<style>
:root{
  --bg:#15110b;
  --panel:#211a10;
  --panel2:#2a2114;
  --frame:#4a371f;
  --gold:#c9a53f;
  --shu:#c73e2e;
  --ink:#efe6d0;
  --sub:#a89878;
  --cellL:#c2a171;   /* 左陣（茜の木地） */
  --cellL2:#b6935f;
  --cellR:#8e9aac;   /* 右陣（藍鼠の石畳） */
  --cellR2:#7f8c9f;
  --good:#5fae5f;
  --bad:#d2543f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  -webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding:8px 8px 24px}

header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
h1{font-size:22px;margin:0;letter-spacing:.35em;color:var(--gold);font-weight:600;text-shadow:0 0 14px rgba(201,165,63,.25)}
h1 small{font-size:11px;letter-spacing:.15em;color:var(--sub);display:block;margin-top:2px}
#scoreBox{display:flex;gap:8px;align-items:center;font-size:12px}
.scorePill{background:var(--panel);border:1px solid #3a2f1d;border-radius:14px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.scorePill b{font-size:15px;color:var(--gold)}
.scorePill.enemy b{color:var(--shu)}
#helpBtn,#muteBtn{background:var(--panel);color:var(--sub);border:1px solid #3a2f1d;border-radius:50%;width:30px;height:30px;font-size:14px;font-family:inherit}

#phaseBar{background:linear-gradient(90deg,transparent,rgba(201,165,63,.12),transparent);
  border-top:1px solid #3a2f1d;border-bottom:1px solid #3a2f1d;
  text-align:center;padding:7px 4px;font-size:14px;letter-spacing:.12em;min-height:34px}
#phaseBar .turnP{color:var(--gold)} #phaseBar .turnE{color:#e0705e}

#boardWrap{display:flex;justify-content:center;padding:12px 0 8px;position:relative}
#fxLayer{position:absolute;inset:12px 0 8px 0;display:flex;justify-content:center;pointer-events:none;z-index:20}
#board{
  display:grid;grid-template-columns:repeat(6,1fr);
  width:min(94vw,480px);aspect-ratio:1;
  border:6px solid #1c1409;outline:1px solid var(--gold);
  box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 0 24px rgba(0,0,0,.45);
  background:#000}
.cell{position:relative;border:1px solid rgba(20,12,4,.55)}
.cell.L{background:linear-gradient(135deg,var(--cellL),var(--cellL2))}
.cell.R{background:linear-gradient(135deg,var(--cellR),var(--cellR2))}
.cell.homeP::after,.cell.homeE::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(201,165,63,.25);pointer-events:none}

.cell .hl{position:absolute;inset:0;pointer-events:none;z-index:3}
.cell.hl-move .hl{box-shadow:inset 0 0 0 3px rgba(110,200,110,.95);background:rgba(110,200,110,.22);animation:pulse 1.1s infinite}
.cell.hl-jump .hl{box-shadow:inset 0 0 0 3px rgba(110,180,230,.95);background:rgba(110,180,230,.25);animation:pulse 1.1s infinite}
.cell.hl-atk .hl{box-shadow:inset 0 0 0 3px rgba(220,70,50,.95);background:rgba(220,70,50,.25);animation:pulse .9s infinite}
.cell.hl-tgt .hl{box-shadow:inset 0 0 0 3px rgba(231,196,87,.95);background:rgba(231,196,87,.28);animation:pulse 1.1s infinite}
.cell.hl-meteor .hl{box-shadow:inset 0 0 0 3px rgba(255,60,40,.98);background:rgba(255,60,40,.35);animation:pulse .7s infinite}
.cell.hl-meteor-warn .hl{box-shadow:inset 0 0 0 2px rgba(255,70,40,.7);background:rgba(255,60,30,.18);animation:pulse 1.4s infinite}
.cell.hl-sel .hl{box-shadow:inset 0 0 0 3px #fff;}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.45}}
.spinner{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;
  border:2px solid rgba(201,165,63,.3);border-top-color:var(--gold);border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* マーカー（爆弾・罠・盾）：セル下部に横並びで自動整列 */
.mkRow{position:absolute;left:0;right:0;bottom:2px;z-index:6;
  display:flex;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}
.marker{display:flex;align-items:center;justify-content:center;
  width:clamp(15px,4.6vw,22px);height:clamp(15px,4.6vw,22px);
  border-radius:5px;font-size:clamp(11px,3.4vw,16px);line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.55);border:1px solid rgba(0,0,0,.35)}
.mk-trap{background:#b23a1a;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.mk-bomb{background:#222;color:#ffcf3f}
.wallCell{background:repeating-linear-gradient(45deg,#6b5636,#6b5636 6px,#5a4830 6px,#5a4830 12px)!important;box-shadow:inset 0 0 0 2px #3a2f1c}
.wallLife{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:3}
.wallLife i{width:5px;height:5px;border-radius:1px;background:#3b82f6;box-shadow:0 0 2px rgba(59,130,246,.8);display:block}
.pvpCard{border-color:#7a5cff!important;box-shadow:0 0 0 1px rgba(122,92,255,.35)}
.pvpTag{font-size:10px;background:#7a5cff;color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.mk-block{background:#2b3da0;color:#fff}

.piece{position:absolute;left:7%;top:6%;width:86%;height:88%;z-index:4;
  clip-path:polygon(50% 0%,96% 28%,84% 100%,16% 100%,4% 28%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;cursor:pointer;
  transition:transform .15s}
.piece.P{background:linear-gradient(180deg,#f4e3bd,#d9b87c 60%,#bb9354);color:#241404;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.piece.E{background:linear-gradient(180deg,#5a2a23,#3c1a14 60%,#2a100b);color:#f3d9a8;
  transform:rotate(180deg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.5)}
.piece .kj{font-size:clamp(15px,5.2vw,24px);line-height:1}
.piece .hpRow{display:flex;gap:1px;margin-top:2px}
.piece .hpRow i{width:5px;height:5px;border-radius:1px;background:#3f7d3f;display:block}
.piece.E .hpRow i{background:#d98a4a}
.piece .hpRow i.half{opacity:.55;transform:scaleY(.5)}
.piece .apRow{position:absolute;bottom:1px;display:flex;gap:2px}
.piece .apRow i{width:4px;height:4px;border-radius:50%;background:#1d4ed8;display:block}
.piece.E .apRow i{background:#93c5fd}
.piece .badges{position:absolute;top:0;right:2%;display:flex;flex-direction:column;font-size:9px;line-height:1.15}
.piece.E .badges{transform:none}
.piece.invis{opacity:.45;filter:saturate(.4)}
.piece.actorNow{outline:2px solid #fff;outline-offset:-2px}
/* 魔王オーラ（指定した本人にのみ見える紫の輝き）：加算(screen)レイヤーでもやもや表現 */
.piece.maouAura::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, rgba(190,110,255,.85), rgba(150,70,240,.45) 55%, rgba(120,50,220,0) 75%);
  mix-blend-mode:screen;pointer-events:none;z-index:6;
  animation:maouPulse 1.8s ease-in-out infinite;filter:blur(1.5px)}
@keyframes maouPulse{
  0%,100%{transform:scale(.92);opacity:.7}
  50%{transform:scale(1.12);opacity:1}}
/* 覚醒した勇者：キラキラ光るエフェクト（加算レイヤーの金色の輝き＋星粒） */
.piece.awakened::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%, rgba(255,240,170,.9), rgba(255,205,80,.5) 50%, rgba(255,180,40,0) 72%);
  mix-blend-mode:screen;pointer-events:none;z-index:6;animation:awGlow 1.1s ease-in-out infinite}
@keyframes awGlow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}
.piece.awakened .kj{position:relative}
.piece.awakened .kj::after{content:"✦";position:absolute;top:-6px;right:-7px;font-size:11px;
  color:#fff3b0;text-shadow:0 0 5px #ffd24a,0 0 8px #ffae2e;z-index:7;
  animation:awSpark 1.4s linear infinite}
@keyframes awSpark{0%{opacity:.3;transform:scale(.7) rotate(0deg)}
  50%{opacity:1;transform:scale(1.15) rotate(90deg)}
  100%{opacity:.3;transform:scale(.7) rotate(180deg)}}
/* 術士の効果を受けた駒：灰色で重たそうな見た目 */
.piece.slowed{filter:grayscale(.85) brightness(.72) contrast(.95);
  box-shadow:inset 0 -4px 7px rgba(0,0,0,.55), 0 2px 3px rgba(0,0,0,.4)}
.piece.slowed .kj{color:#c9c9c9;text-shadow:0 1px 1px rgba(0,0,0,.6)}
/* 悪霊に取り憑かれた駒：顔面蒼白＋周囲を人魂が回る */
.piece.haunted{filter:grayscale(.6) brightness(1.18) saturate(.4)}
.piece.haunted .kj{color:#e8ecf2;text-shadow:0 0 4px rgba(180,200,220,.8)}
.piece.haunted::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:radial-gradient(circle,rgba(230,240,255,.35),rgba(210,225,245,0) 68%);
  mix-blend-mode:screen;pointer-events:none;z-index:5;animation:hauntPulse 2s ease-in-out infinite}
@keyframes hauntPulse{0%,100%{opacity:.4}50%{opacity:.75}}
/* 人魂：駒の周りを公転する青い炎の球 */
.hauntGhost{position:absolute;inset:0;pointer-events:none;z-index:7;animation:ghostOrbit 3s linear infinite}
.hitodama{position:absolute;top:-10%;left:50%;width:11px;height:14px;transform:translateX(-50%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 65%, #dff3ff 0%, #7fd4ff 35%, #2f9bff 60%, #1560d8 85%);
  box-shadow:0 0 6px 2px rgba(90,180,255,.85),0 0 12px 4px rgba(60,140,255,.5);
  animation:damaFlicker 1.1s ease-in-out infinite;filter:blur(.3px)}
.hitodama::before{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  width:4px;height:9px;border-radius:0 0 50% 50%;
  background:linear-gradient(180deg,rgba(120,200,255,.9),rgba(60,140,255,0));
  animation:damaTail 1.1s ease-in-out infinite}
@keyframes ghostOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes damaFlicker{0%,100%{opacity:.7;transform:translateX(-50%) scale(.92)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}
@keyframes damaTail{0%,100%{opacity:.4;height:7px}50%{opacity:.85;height:11px}}
/* 巫女の加護：やる気に満ちた駒（温かい光のオーラ＋立ち上る気） */
.piece.motivated{filter:brightness(1.12) saturate(1.25)}
.motiAura{position:absolute;inset:0;pointer-events:none;z-index:7}
.motiAura::before{content:"";position:absolute;inset:-4px;border-radius:50%;
  background:radial-gradient(circle at 50% 60%, rgba(255,230,140,.6), rgba(255,190,70,.25) 55%, rgba(255,170,40,0) 74%);
  mix-blend-mode:screen;animation:motiGlow 1.3s ease-in-out infinite}
@keyframes motiGlow{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:.95;transform:scale(1.08)}}
.motiAura i{position:absolute;bottom:6%;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,#fff2b0,#ffca4a);box-shadow:0 0 4px #ffd45a;
  animation:motiRise 1.4s ease-in infinite}
.motiAura i:nth-child(1){left:26%;animation-delay:0s}
.motiAura i:nth-child(2){left:50%;animation-delay:.45s}
.motiAura i:nth-child(3){left:74%;animation-delay:.9s}
@keyframes motiRise{0%{opacity:0;transform:translateY(4px) scale(.6)}
  30%{opacity:1}
  100%{opacity:0;transform:translateY(-16px) scale(1)}}
/* 超能力者の射程モード印（両者に見える） */
.espMark{position:absolute;inset:0;pointer-events:none;z-index:5;color:rgba(120,210,255,.95);
  font-weight:700;font-size:clamp(9px,2.8vw,13px);text-shadow:0 0 3px #04202e,0 0 2px #04202e}
.espMark span{position:absolute;transform:translate(-50%,-50%);line-height:1}
/* 十字（縦横）モード：上下左右に印 */
.espMark.ortho .u{left:50%;top:11%}.espMark.ortho .d{left:50%;top:89%}
.espMark.ortho .l{left:11%;top:50%}.espMark.ortho .r{left:89%;top:50%}
/* 斜めモード：四隅に印 */
.espMark.diag .ul{left:15%;top:15%}.espMark.diag .ur{left:85%;top:15%}
.espMark.diag .dl{left:15%;top:85%}.espMark.diag .dr{left:85%;top:85%}
.piece.flash{animation:hitflash .6s}
@keyframes hitflash{
  0%,40%{filter:brightness(1.9) sepia(1) saturate(14) hue-rotate(-38deg) drop-shadow(0 0 9px #ff2a1a)}
  20%,60%{filter:none}
  80%{filter:brightness(1.7) sepia(1) saturate(12) hue-rotate(-38deg) drop-shadow(0 0 7px #ff2a1a)}
  100%{filter:none}}
/* 砕け散る死亡演出 */
.shatterWrap{position:absolute;inset:0;z-index:12;pointer-events:none}
.shatterWrap .core{position:absolute;inset:8%;border-radius:5px;
  background:radial-gradient(circle,#fff,#ffd76a 40%,#c73e2e 75%,transparent);
  animation:coreBurst .5s ease-out forwards}
@keyframes coreBurst{
  0%{transform:scale(1);opacity:.9;filter:brightness(2)}
  30%{transform:scale(1.25);opacity:1}
  100%{transform:scale(.2);opacity:0}}
.shard{position:absolute;left:50%;top:50%;width:22%;height:22%;
  background:linear-gradient(135deg,#f6e6c0,#b6935f 60%,#6b4a24);
  clip-path:polygon(50% 0,100% 62%,20% 100%);
  animation:shardFly .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes shardFly{
  0%{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.35);opacity:0}}
.piece.spawn{animation:spawn .3s}
@keyframes spawn{0%{transform:scale(.2)}100%{transform:scale(1)}}
.piece.E.spawn{animation:spawnE .3s}
@keyframes spawnE{0%{transform:rotate(180deg) scale(.2)}100%{transform:rotate(180deg) scale(1)}}

#peekBack{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  box-shadow:0 4px 20px rgba(0,0,0,.7);animation:pulse 1.4s infinite}

#ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0 8px;min-height:44px}
button.act{font-family:inherit;font-size:14px;letter-spacing:.08em;
  background:linear-gradient(180deg,#3a2d18,#2a2012);color:var(--ink);
  border:1px solid #5b4827;border-radius:8px;padding:9px 14px;cursor:pointer}
button.act:disabled{opacity:.35}
button.act.primary{border-color:var(--gold);color:#ffe9b0;box-shadow:0 0 10px rgba(201,165,63,.18)}
button.act.danger{border-color:var(--shu);color:#ffb9a8}

#infoPanel{background:var(--panel);border:1px solid #3a2f1d;border-radius:10px;
  padding:10px 12px;margin:4px 0;font-size:13px;min-height:50px;line-height:1.6}
#infoPanel .pname{font-size:16px;color:var(--gold);letter-spacing:.1em}
#infoPanel .stat{color:var(--sub);font-size:12px;margin-left:8px}
#infoPanel .desc{margin-top:4px;color:#d9cdb2}
#infoPanel .statusRow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#infoPanel .statusTag{font-size:11px;padding:3px 8px;border-radius:999px;line-height:1.3;white-space:nowrap}
#infoPanel .statusTag.buf{background:rgba(70,130,60,.28);border:1px solid #4f8a3f;color:#cde7b8}
#infoPanel .statusTag.deb{background:rgba(150,60,60,.28);border:1px solid #a24d4d;color:#f0c9c9}
#infoPanel .abilBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#infoPanel .abilBtns button{font-size:12.5px;padding:7px 11px}

#logPanel{background:var(--panel);border:1px solid #3a2f1d;border-radius:10px;margin-top:8px}
#logHead{padding:6px 12px;font-size:12px;color:var(--sub);letter-spacing:.2em;border-bottom:1px solid #3a2f1d}
#log{max-height:130px;overflow-y:auto;padding:8px 12px;font-size:12.5px;line-height:1.7}
#log .lp{color:#e7d8ae} #log .le{color:#e59a86} #log .ls{color:#9aa6b5}

/* modal */
#modalBack{position:fixed;inset:0;background:rgba(8,5,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modalBack.hidden{display:none}
#modal{background:linear-gradient(180deg,#272014,#1c150c);border:1px solid var(--gold);
  border-radius:12px;max-width:520px;width:100%;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 10px 50px rgba(0,0,0,.8)}
#modalTitle{padding:14px 16px 8px;font-size:17px;letter-spacing:.2em;color:var(--gold);text-align:center}
#modalBody{padding:6px 14px;overflow-y:auto;font-size:13.5px;line-height:1.7}
#modalBtns{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}

.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.pCard{background:var(--panel2);border:1px solid #4a3a20;border-radius:8px;padding:8px 9px;cursor:pointer}
.pCard.locked{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
.pCard.locked .nm{color:#888}
.pCard:active{background:#3a2e1a}
.pCard .t{display:flex;justify-content:space-between;align-items:baseline}
.pCard .nm{font-size:14.5px;color:#f0dfb4}
.pCard .ap{font-size:11px;color:#8fb8e8}
.pCard .d{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.45}

.choiceList{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.choiceList button{text-align:left}

.ruleSec{margin-bottom:10px}
.ruleSec h3{color:var(--gold);font-size:14px;margin:10px 0 4px;letter-spacing:.15em}
.ruleSec p,.ruleSec li{color:#d9cdb2;font-size:12.5px}
.ruleSec table{width:100%;border-collapse:collapse;font-size:11.5px}
.ruleSec td,.ruleSec th{border:1px solid #3a2f1d;padding:4px 6px;text-align:left;vertical-align:top}
.ruleSec th{color:var(--gold);white-space:nowrap}

#overBanner{font-size:30px;letter-spacing:.4em;text-align:center;padding:10px 0;color:var(--gold)}
#overBanner.lose{color:var(--shu)}
.zoneLabel{display:flex;justify-content:space-between;width:min(94vw,480px);margin:0 auto;font-size:10px;color:var(--sub);letter-spacing:.3em;padding:0 4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>攻城戦<small>— 三駒勝負 —</small></h1>
    <div id="scoreBox">
      <div class="scorePill">自軍 <b id="scoreP">0</b>/2</div>
      <div class="scorePill enemy">敵軍 <b id="scoreE">0</b>/2</div>
      <button id="muteBtn" title="効果音">♪</button>
      <button id="helpBtn" title="ルール">？</button>
    </div>
  </header>
  <div id="phaseBar">…</div>
  <div id="boardWrap"><div id="board"></div><div id="fxLayer"></div></div>
  <div class="zoneLabel"><span>◀ 左陣</span><span>右陣 ▶</span></div>
  <div id="ctrl"></div>
  <div id="infoPanel">駒を選択すると詳細が表示されます。</div>
  <div id="logPanel"><div id="logHead">戦 況 記 録</div><div id="log"></div></div>
</div>

<div id="modalBack" class="hidden">
  <div id="modal">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
"use strict";
/* =========================================================
   攻城戦 — 三駒勝負  (6x6 / 3駒 / 2撃破先取)
   ========================================================= */

const PIECES = {
  kenshi:    {name:"剣士",  k:"剣", ap:1, desc:"この駒の攻撃ダメージ+0.5"},
  kyuhei:    {name:"弓兵",  k:"弓", ap:1, noNormal:true, desc:"行動力1：縦横2マス・斜め1マスの範囲に遠距離攻撃。通常攻撃不可"},
  tatehei:   {name:"盾兵",  k:"盾", ap:1, desc:"攻撃フェーズ後、隣接1マスを指定。そのマスからの攻撃を受けない"},
  kiba:      {name:"騎馬",  k:"馬", ap:2, desc:"斜め移動可。行動力2を消費して駒を1つ飛び越えられる"},
  senshi:    {name:"戦士",  k:"戦", ap:1, desc:"体力2以下で与ダメ+1、体力1以下で与ダメ+2"},

const PICKABLE = Object.keys(PIECES).filter(t=>t!=="kemono" && !PIECES[t].pvpOnly); // CPUや通常選出は仮駒を除外
const PVP_PIECES = Object.keys(PIECES).filter(t=>PIECES[t].pvpOnly);                 // 対人戦のみ選べる仮駒
const ORTHO=[[1,0],[-1,0],[0,1],[0,-1]];
const DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
const ALL8=[...ORTHO,...DIAG];
// 隕石の着弾候補：5×5の四隅＋中心線上（駒中心の距離2）の計8箇所

/* ランダムな駒種と配置を3つ生成（重複可・色制約を満たす列を選ぶ） */
function makeRandomDeal(){
  const pick=()=>PICKABLE[Math.floor(Math.random()*PICKABLE.length)];
  const cols=()=>{
    // 6列から3列を選び、色制約（3駒すべて同じ陣はNG）を満たすまで再抽選
    for(let tries=0;tries<60;tries++){
      const all=[0,1,2,3,4,5];
      for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
      const c=all.slice(0,3);
      const left=c.filter(x=>x<3).length;
      if(left>=1&&left<=2)return c; // 左右に分散
    }
    return [0,2,4];
  };
  const pc=cols(), ec=cols();
  const mk=(c)=>{const type=pick();const o={type,c};if(type==="esper")o.em=Math.random()<0.5?"ortho":"diag";return o;};
  return {
    P:[0,1,2].map(i=>mk(pc[i])),
    E:[0,1,2].map(i=>mk(ec[i])),
  };
}
function applyRandomDealSolo(){
  const deal=makeRandomDeal();
  // プレイヤー：手前row5、敵：奥row0
  for(const d of deal.P){
    const p=makePiece(d.type,"P",5,d.c); G.pieces.push(p);
    if(d.type==="esper")p.flags.esperMode=d.em||"ortho";
  }
  for(const d of deal.E){
    const p=makePiece(d.type,"E",0,d.c); G.pieces.push(p);
    if(d.type==="esper")p.flags.esperMode=d.em||"ortho";
  }
  G.setupCount={P:3,E:3};
  G.aiTypes=deal.E.map(d=>d.type);
  log("自軍："+deal.P.map(d=>PIECES[d.type].name).join("・")+" が配られた","p");
  log("敵軍："+deal.E.map(d=>PIECES[d.type].name).join("・")+" が配られた","e");
  startMaouPhase();
  render();
}

/* ---------- helpers ---------- */
const inB=(r,c)=>r>=0&&r<6&&c>=0&&c<6;
const half=c=>c<3?0:1;
const opp=o=>o==="P"?"E":"P";
const r2=v=>Math.round(v*2)/2;
const byId=id=>G.pieces.find(p=>p.id===id&&!p.dead);
const alive=o=>G.pieces.filter(p=>!p.dead&&p.owner===o);
/* この駒が「プレイヤー自身の勇者が指定した魔王」か（本人にのみ表示） */
function isPlayerMaou(target){
  if(!target||target.dead)return false;
  for(const h of G.pieces){
    if(h.dead)continue;
    if(h.owner==="P" && h.type==="yusha" && !h.flags.heroBoost && h.flags.maouId===target.id)
      return true;
  }
  return false;
}
const mains=o=>alive(o).filter(p=>p.type!=="kemono");
const at=(r,c)=>G.pieces.find(p=>!p.dead&&p.r===r&&p.c===c);
const wallAt=(r,c)=>G.walls&&G.walls.some(w=>w.r===r&&w.c===c); // 錬金術師の壁があるマスか
/* ターンエンドごとに壁の寿命を1減らし、0になった壁を破壊する（3回のターンエンドで消滅） */
function decayWalls(){
  if(!G.walls||!G.walls.length)return;
  for(const w of G.walls)w.life=(w.life==null?3:w.life)-1;
  const before=G.walls.length;
  G.walls=G.walls.filter(w=>w.life>0);
  if(G.walls.length<before)log("錬金術師の壁が崩れ去った","s");
}
function visAt(r,c,forOwner){ // 駒があるか（forOwnerの視点。敵の透明忍者は見えない）

function frontDr(owner){return owner==="P"?-1:1;}
function colorOk(owner, moveId, nr, nc){
  // moveId の駒が (nr,nc) に居ると仮定して、主力3駒が同色陣に揃わないか
  const ms=mains(owner);
  if(ms.length<3) return true;
  let h=null,same=true;
  for(const p of ms){
    const c=(p.id===moveId)?nc:p.c;
    if(h===null)h=half(c); else if(half(c)!==h){same=false;break;}
  }
  return !same;
}

/* 罠師が (pr,pc) で罠を設置したとき、周囲8マスのどこに罠がある「確率」を推定して保存する。
   ・罠は罠師の周囲8マスのいずれかにある。
   ・自軍(E)の近い駒への経路上（罠師から見て敵駒方向）のマスほど設置確率が高い。
   ・さらにその隣接マスも次に高い。
   ・罠は最大2個なので、確率上位2マスだけを保存する。 */
function recordTrapProbability(setterId, pr, pc){
  const cand=[];
  for(const [dr,dc] of ALL8){
    const r=pr+dr, c=pc+dc;
    if(!inB(r,c))continue;
    if(at(r,c))continue;                 // 駒がいるマスには罠を置けない
    cand.push({r,c,w:1});                // 基本重み
  }
  if(!cand.length){ return; } // 置ける候補が無ければ何も記録しない
  // 敵(E=AI)の駒のうち、この罠師に最も近い駒たちの方向を「経路方向」とみなす
  const foes=alive("E");
  for(const cell of cand){
    // 罠師から各E駒への直線経路上にあるか（罠師→E駒 のベクトル方向に近いマスほど高確率）
    for(const e of foes){
      const vr=e.r-pr, vc=e.c-pc;              // 罠師→E駒 方向
      const cr=cell.r-pr, cc=cell.c-pc;        // 罠師→候補マス 方向
      const distE=Math.abs(vr)+Math.abs(vc);
      if(distE===0)continue;
      // 候補マスがE駒方向を向いているか（内積が正＝同じ側）
      const dot=vr*cr+vc*cc;
      if(dot>0){
        // 経路上（E駒に近づく側）ほど加点。近いE駒ほど強く効かせる
        const near=Math.max(1,4-distE);
        cell.w += 3*near;
        // ちょうど経路の直線上（外積が0に近い）ならさらに加点
        const cross=Math.abs(vr*cc-vc*cr);
        if(cross===0)cell.w += 3*near;
        else if(cross<=1)cell.w += 1.5*near;
      }
    }
  }
  // 経路上マスの隣接マスも底上げ（隣接ボーナス）
  const base=cand.map(c=>({...c}));
  for(const cell of cand){
    for(const b of base){
      if(b.w<=1)continue;
      const man=Math.abs(cell.r-b.r)+Math.abs(cell.c-b.c);
      if(man===1)cell.w += b.w*0.15;    // 高確率マスの隣は少し確率が上がる
    }
  }
  // === 各マスの相対確率（この1個の罠がどのマスに置かれたか）===
  // 1回の設置イベントでは罠は1個なので、8候補マスの確率合計は1（100%）になる。
  const totalW=cand.reduce((s,c)=>s+c.w,0)||1;
  for(const c of cand)c.prob=c.w/totalW;
  // この設置イベントの「8マス分の分布」をそのまま1件として保存する。
  // 1人の罠師につき最大2件（＝罠は最大2個）まで保持し、古いものから捨てる。
  addTrapProbEvent(setterId, cand.map(c=>({r:c.r,c:c.c,prob:c.prob})));
}
/* 罠設置イベント（8マス分の確率分布）を1件追加する。
   1人の罠師につき最大2件（罠は最大2個）まで保持し、超えたら最も古い件を捨てる。 */
function addTrapProbEvent(setterId, cells){
  if(!G.trapProb)G.trapProb=[];
  G.trapProb.push({setter:setterId, cells});
  // この罠師のイベントが2件を超えたら古い順に削除
  const mine=G.trapProb.filter(e=>e.setter===setterId);
  while(mine.length>2){
    const oldest=mine.shift();
    const idx=G.trapProb.indexOf(oldest);
    if(idx>=0)G.trapProb.splice(idx,1);
  }
}
/* 指定マスに罠がある推定確率。複数の設置イベント（最大2件）に同じマスが含まれる場合は、
   各イベントの確率を独立事象として合成する： 1 - Π(1 - p_i)。
   （＝「どれかのイベントでこのマスに罠が置かれた」確率） */
function trapProbAt(r,c){
  if(!G.trapProb)return 0;
  let miss=1; // すべてのイベントで「このマスに罠が無い」確率
  for(const e of G.trapProb){
    for(const cell of e.cells){
      if(cell.r===r&&cell.c===c){ miss*=(1-cell.prob); break; }
    }
  }
  return 1-miss;
}
/* 罠師が倒れた／罠が実際に発動したら、その確率エントリを消す */
function clearTrapProbForSetter(setterId){
  if(!G.trapProb)return;
  G.trapProb=G.trapProb.filter(e=>e.setter!==setterId);
}
/* 透明化した忍者の潜伏位置を「予測」する（罠と同様、正確な位置はAIに見せない）。
   忍者は透明化した地点(fromR,fromC)から、残り行動力で移動して潜む。透明中はALL8で動ける。
   AIの駒（＝忍者から見た敵）へ近づく方向のマスほど、奇襲を狙って潜む確率が高いと推定する。 */
function recordNinjaProbability(ninjaId, fromR, fromC){
  const nj=byId(ninjaId);
  const moveRange = nj ? Math.max(1,(nj.maxAp||2)-1) : 1; // 透明化に1消費、残りで移動
  // 到達しうるマス（チェビシェフ距離 <= moveRange、盤内、駒がいない）
  const cand=[];
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){
    const cheb=Math.max(Math.abs(r-fromR),Math.abs(c-fromC));
    if(cheb>moveRange)continue;
    if(cheb>0 && at(r,c))continue;          // 元の位置以外は空きマスのみ
    cand.push({r,c,w:1});
  }
  if(!cand.length){ setNinjaProbEntry(ninjaId, [{r:fromR,c:fromC,prob:1}]); return; }
  // 忍者から見た敵＝AI(E)の駒。その方向・近くのマスほど潜伏確率が高い
  const foes=alive("E");
  for(const cell of cand){
    // 動かず留まる可能性も一定あるので、元位置には基礎重み
    if(cell.r===fromR&&cell.c===fromC)cell.w+=1.5;
    for(const e of foes){
      const vr=e.r-fromR, vc=e.c-fromC;      // 忍者→E駒 方向
      const cr=cell.r-fromR, cc=cell.c-fromC; // 忍者→候補マス 方向
      const distE=Math.abs(vr)+Math.abs(vc);
      if(distE===0)continue;
      const dot=vr*cr+vc*cc;                  // 同じ側か
      if(dot>0){
        const near=Math.max(1,4-distE);       // 近いE駒ほど強く効く
        cell.w+=2.5*near;
        // E駒に隣接するマス（次に踏み込んで3ダメージ奇襲を狙える）は特に高い
        const adj=Math.max(Math.abs(cell.r-e.r),Math.abs(cell.c-e.c));
        if(adj===1)cell.w+=3*near;
        if(adj===0)cell.w+=2*near;             // E駒に重なる位置（踏み込ませ狙い）
      }
    }
  }
  // 正規化：忍者は1体なので候補マスの確率合計を1にする（＝どこに潜んだかの分布）
  const total=cand.reduce((s,c)=>s+c.w,0)||1;
  for(const c of cand)c.prob=c.w/total;
  cand.sort((a,b)=>b.prob-a.prob);
  setNinjaProbEntry(ninjaId, cand.map(c=>({r:c.r,c:c.c,prob:c.prob})));
}
/* 忍者IDごとに予測マップを保存（忍者1体につき1エントリ） */
function setNinjaProbEntry(ninjaId, cells){
  if(!G.ninjaProb)G.ninjaProb=[];
  const idx=G.ninjaProb.findIndex(e=>e.ninja===ninjaId);
  const entry={ninja:ninjaId, cells};
  if(idx>=0)G.ninjaProb[idx]=entry; else G.ninjaProb.push(entry);
}
/* 指定マスに透明忍者がいる推定確率（全予測の中で最大値） */
function ninjaProbAt(r,c){
  if(!G.ninjaProb)return 0;
  let p=0;
  for(const e of G.ninjaProb)for(const cell of e.cells)if(cell.r===r&&cell.c===c)p=Math.max(p,cell.prob);
  return p;
}
/* 忍者が透明解除／死亡したら予測を消す */
function clearNinjaProb(ninjaId){
  if(!G.ninjaProb)return;
  G.ninjaProb=G.ninjaProb.filter(e=>e.ninja!==ninjaId);
}
/* マスを分かりやすい座標文字列にする（列A-F × 行1-6、盤面は6×6）。
   プレイヤー視点で下が手前になるよう、行は上から1..6で表記する。 */
function cellName(r,c){

/* 駒がfrom→現在位置へ移動したことをログに記録する */

/* ---------- sound ---------- */
let AC=null;
function ensureAC(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  return AC;
}
// 最初のタップ／クリックでオーディオを解放（モバイル対策）
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev,()=>{try{ensureAC();}catch(e){}},{once:true,passive:true}));
function sfx(kind){
  if(typeof NET!=="undefined"&&NET.on&&!NET.applying&&NET_SFX.has(kind))NET.sfxBuf.push(kind);
  if(!soundOn) return;
  try{
    ensureAC();
    const t=AC.currentTime;
    // --- 将棋の駒を打つ「パチッ」音（ノイズバースト＋短い木質の共鳴） ---
    if(kind==="move"||kind==="place"){
      const dur=0.06;
      const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);
      const ch=buf.getChannelData(0);
      for(let i=0;i<ch.length;i++){
        const env=Math.pow(1-i/ch.length,3);       // 鋭い減衰
        ch[i]=(Math.random()*2-1)*env;
      }
      const src=AC.createBufferSource();src.buffer=buf;
      const bp=AC.createBiquadFilter();bp.type="bandpass";
      bp.frequency.value=(kind==="place"?1500:2100);bp.Q.value=0.9;
      const g=AC.createGain();g.gain.value=(kind==="place"?0.5:0.42);
      src.connect(bp);bp.connect(g);g.connect(AC.destination);
      src.start(t);src.stop(t+dur);
      // 木の胴鳴り（短い低音）を重ねて“パチッ”に厚みを
      const o=AC.createOscillator(),og=AC.createGain();
      o.type="triangle";o.frequency.setValueAtTime(320,t);
      o.frequency.exponentialRampToValueAtTime(180,t+0.05);
      og.gain.setValueAtTime(0.18,t);og.gain.exponentialRampToValueAtTime(.0001,t+0.06);
      o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+0.07);
      return;
    }
    // --- 砕ける死亡音（ガラス/氷が割れるような複数の破片ノイズ） ---
    if(kind==="death"){
      const dur=0.5;
      // 破砕ノイズ
      const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);
      const ch=buf.getChannelData(0);
      for(let i=0;i<ch.length;i++){
        const p=i/ch.length;
        const env=Math.pow(1-p,1.6)*(0.5+0.5*Math.random());
        ch[i]=(Math.random()*2-1)*env;
      }
      const src=AC.createBufferSource();src.buffer=buf;
      const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=1400;
      const g=AC.createGain();g.gain.value=0.3;
      src.connect(hp);hp.connect(g);g.connect(AC.destination);
      src.start(t);src.stop(t+dur);
      // 破片が飛び散るような高音のきらめき（数粒）
      for(let k=0;k<5;k++){
        const st=t+0.02+Math.random()*0.22;
        const o=AC.createOscillator(),og=AC.createGain();
        o.type="triangle";
        const f=1800+Math.random()*2600;
        o.frequency.setValueAtTime(f,st);
        o.frequency.exponentialRampToValueAtTime(f*0.5,st+0.12);
        og.gain.setValueAtTime(0.12,st);og.gain.exponentialRampToValueAtTime(.0001,st+0.13);
        o.connect(og);og.connect(AC.destination);o.start(st);o.stop(st+0.14);
      }
      // 低い衝撃音
      const lo=AC.createOscillator(),lg=AC.createGain();
      lo.type="sawtooth";lo.frequency.setValueAtTime(120,t);
      lo.frequency.exponentialRampToValueAtTime(40,t+0.3);
      lg.gain.setValueAtTime(0.18,t);lg.gain.exponentialRampToValueAtTime(.0001,t+0.35);
      lo.connect(lg);lg.connect(AC.destination);lo.start(t);lo.stop(t+0.36);
      return;
    }
    // --- 能力ごとの効果音 ---
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const cfg={
      pick:[760,.06,"triangle",.08],
      hit:[170,.14,"sawtooth",.16], heal:[880,.5,"sine",.12],
      win:[660,.5,"triangle",.18], lose:[140,.7,"sawtooth",.18],
      bomb:[60,.5,"square",.25], trap:[300,.2,"square",.15],
      curse:[130,.55,"sawtooth",.18], slow:[300,.4,"sine",.14],
      bind:[110,.45,"square",.16], swap:[520,.3,"triangle",.14],
      buff:[700,.35,"sine",.14], teleport:[900,.3,"sine",.13],
      ranged:[640,.16,"triangle",.13],
    }[kind]||[440,.08,"sine",.08];
    o.type=cfg[2]; o.frequency.setValueAtTime(cfg[0],t);
    if(kind==="lose"||kind==="bomb"||kind==="curse"||kind==="bind") o.frequency.exponentialRampToValueAtTime(40,t+cfg[1]);
    if(kind==="win"){ o.frequency.setValueAtTime(880,t+.16); o.frequency.setValueAtTime(1170,t+.32); }
    if(kind==="heal"){ o.frequency.setValueAtTime(1100,t+.14); o.frequency.setValueAtTime(1320,t+.28); }
    if(kind==="swap"){ o.frequency.exponentialRampToValueAtTime(880,t+.15); o.frequency.exponentialRampToValueAtTime(520,t+.3); }
    if(kind==="slow"){ o.frequency.exponentialRampToValueAtTime(150,t+cfg[1]); }
    if(kind==="buff"){ o.frequency.exponentialRampToValueAtTime(1100,t+cfg[1]); }
    if(kind==="teleport"){ o.frequency.exponentialRampToValueAtTime(1600,t+cfg[1]); }
    g.gain.setValueAtTime(cfg[3],t);
    g.gain.exponentialRampToValueAtTime(.0001,t+cfg[1]);
    o.start(t); o.stop(t+cfg[1]+.02);
  }catch(e){}
}

/* ===== 砕け散る死亡演出 ===== */
const SHATTER_MS=520; // 演出の長さ（この間、次の画面遷移を待つ）
let shatterActive=0;  // 現在再生中の演出数
function spawnShatterAt(r,c,owner){
  try{
    const board=$("#board"), fx=$("#fxLayer");
    if(!board||!fx)return;
    const bw=board.clientWidth||board.offsetWidth;
    if(!bw)return;
    const cell=bw/6;
    // プレイヤー視点：自分は下段。盤の行rはそのまま上から数えた位置
    const wrap=document.createElement("div");
    wrap.className="shatterWrap";
    wrap.style.width=cell+"px";wrap.style.height=cell+"px";
    wrap.style.left="50%";
    wrap.style.transform=`translateX(-50%) translate(${(c-2.5)*cell}px, ${r*cell}px)`;
    wrap.style.top="0";
    // 中心のフラッシュ
    const core=document.createElement("div");core.className="core";wrap.appendChild(core);
    // 破片
    const N=9;
    for(let i=0;i<N;i++){
      const s=document.createElement("div");s.className="shard";
      const ang=(Math.PI*2*i)/N + Math.random()*0.6;
      const dist=cell*(0.5+Math.random()*0.6);
      s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
      s.style.setProperty("--dy",(Math.sin(ang)*dist+cell*0.2)+"px");
      s.style.setProperty("--rot",(Math.random()*720-360)+"deg");
      s.style.animationDelay=(Math.random()*0.05)+"s";
      wrap.appendChild(s);
    }
    fx.appendChild(wrap);
    shatterActive++;
    setTimeout(()=>{ wrap.remove(); shatterActive=Math.max(0,shatterActive-1); }, SHATTER_MS+80);
  }catch(e){}
}
/* 死亡演出の再生が終わるのを待ってから cb を実行 */
function afterShatter(cb){
  if(shatterActive<=0){ cb(); return; }
  setTimeout(cb, SHATTER_MS);
}

function makePiece(type,owner,r,c){
  const baseHp = type==="kemono" ? 1 : (PIECES[type].maxHp || 3);
  return {id:pid++,type,owner,r,c,hp:baseHp, maxHp:(PIECES[type].maxHp||3),
    ap:PIECES[type].ap,maxAp:PIECES[type].ap,dead:false,
    flags:{},spawn:true};
}

/* =========================================================
   オンライン対戦（PeerJS / ルームコード方式）
   ・各クライアントは常に自分を"P"として扱い、送受信時に
     盤面を上下反転＆所有者を入れ替えて同期する
   ========================================================= */
let NET={on:false,first:false,peer:null,conn:null,cont:null,lock:false,
         applying:false,logBuf:[],sfxBuf:[],overShown:false,sentOver:false};
const NET_SFX=new Set(["hit","heal","death","place","bomb","trap","move","win","lose","curse","slow","bind","swap","buff","teleport","ranged","pick"]);
const CODE_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genCode(){let s="";for(let i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}

function cleanupNet(){
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  NET={on:false,first:false,peer:null,conn:null,cont:null,lock:false,
       applying:false,logBuf:[],sfxBuf:[],overShown:false,sentOver:false};
}
function netSerialize(){
  return {
    pieces:G.pieces.map(p=>({id:p.id,type:p.type,owner:p.owner,r:p.r,c:p.c,
      hp:p.hp,ap:p.ap,maxAp:p.maxAp,dead:p.dead,flags:p.flags})),
    traps:G.traps,bombs:G.bombs,walls:(G.walls||[]).map(w=>({r:w.r,c:w.c,life:w.life})),meteors:(G.meteors||[]).map(m=>({id:m.id,owner:m.owner,cells:m.cells})),kills:G.kills,setupCount:G.setupCount,
    phase:G.phase,turn:G.turn,nphase:G.nphase,
    respawnQueue:G.respawnQueue,over:G.over
  };
}
function applyState(S){
  const seen=new Set();
  for(const sp of S.pieces){
    const fl={...sp.flags};
    if(fl.block)fl.block={r:5-sp.flags.block.r,c:sp.flags.block.c};
    let p=G.pieces.find(x=>x.id===sp.id);
    const isNew=!p;
    if(!p){p={flash:false,spawn:true};G.pieces.push(p);}
    Object.assign(p,{id:sp.id,type:sp.type,owner:opp(sp.owner),r:5-sp.r,c:sp.c,
      hp:sp.hp,ap:sp.ap,maxAp:sp.maxAp,dead:sp.dead,flags:fl});
    if(isNew&&p.dead)p.spawn=false;
    seen.add(sp.id);
  }
  G.pieces=G.pieces.filter(p=>seen.has(p.id));
  G.traps=S.traps.map(t=>({owner:opp(t.owner),r:5-t.r,c:t.c}));
  G.bombs=S.bombs.map(b=>({owner:opp(b.owner),r:5-b.r,c:b.c,fuse:b.fuse}));
  G.walls=(S.walls||[]).map(w=>({r:5-w.r,c:w.c,life:w.life}));
  G.meteors=(S.meteors||[]).map(m=>({id:m.id,owner:opp(m.owner),cells:m.cells.map(cc=>({r:5-cc.r,c:cc.c}))}));
  G.kills={P:S.kills.E,E:S.kills.P};
  G.setupCount={P:S.setupCount.E,E:S.setupCount.P};
  G.phase=S.phase;G.turn=opp(S.turn);G.nphase=S.nphase;
  G.respawnQueue=S.respawnQueue.map(o=>opp(o));
  G.over=S.over;
  for(const p of G.pieces)pid=Math.max(pid,p.id+1);
  updateScore();
}
function netSend(kind){
  if(!NET.conn||!NET.conn.open)return;
  const msg={t:kind,S:netSerialize(),logs:NET.logBuf,sfx:NET.sfxBuf};
  NET.logBuf=[];NET.sfxBuf=[];
  try{NET.conn.send(msg);}catch(e){}
}
function flushNetLogs(arr){
  if(!arr)return;
  for(const e of arr){
    const m=e.m.replace(/自軍/g,"\u0001").replace(/敵軍/g,"自軍").replace(/\u0001/g,"敵軍");
    const c=e.c==="p"?"e":e.c==="e"?"p":"s";
    log(m,c);
  }
}
function playNetSfx(arr){
  if(!arr)return;
  for(const k of arr.slice(0,5))sfx(k==="win"?"lose":k==="lose"?"win":k);
}
function waitBar(msg){
  UI={mode:"watch",sel:null,targets:new Set(),ability:null,extra:{}};
  setPhaseBar(`<span class="turnE">${msg}</span>`);
  render();
}
function myTurnToPlace(){
  return NET.first? G.setupCount.P<=G.setupCount.E : G.setupCount.P<G.setupCount.E;
}
function doMaouNet(next){
  const heroes=alive("P").filter(p=>p.type==="yusha"&&!p.flags.maouId&&!p.flags.heroBoost);
  const done=()=>{
    G.nphase=next;
    if(next==="battle")G.turn=NET.first?"P":"E";
    netSend("go");netDispatch();
  };
  if(heroes.length===0){done();return;}
  promptMaou(heroes,0,done);
}
function netDispatch(){
  if(!NET.on)return;
  if(G.over){
    if(!NET.overShown){NET.overShown=true;endGame(G.kills.P>=2?"P":"E");}
    return;
  }
  if(G.nphase==="setup"){beginSetupStep();return;}
  if(G.nphase==="maou1"){ if(NET.first)doMaouNet("maou2"); else waitBar("相手が準備中…"); return;}
  if(G.nphase==="maou2"){ if(!NET.first)doMaouNet("battle"); else waitBar("相手が準備中…"); return;}
  if(G.nphase==="battle"){
    if(G.turn==="P")startPlayerTurn();
    else waitBar("相手の手番…");
  }
}
function netOnData(msg){
  if(!msg)return;
  if(msg.t==="start"){
    NET.on=true;closeModal();
    newNetGame(!!msg.youFirst, !!msg.randomDeal, msg.deal||null);
    return;
  }
  if(msg.S){
    NET.applying=true;
    applyState(msg.S);
    flushNetLogs(msg.logs);
    playNetSfx(msg.sfx);
    render();
    NET.applying=false;
  }
  if(msg.t==="go"){netDispatch();return;}
  if(msg.t==="respawn"){
    // 自分の駒が倒された：召喚して制御を返す
    processRespawns(()=>{
      netSend("resume");
      if(!G.over)waitBar("相手の手番…");
    });
    return;
  }
  if(msg.t==="resume"){
    NET.lock=false;
    const c=NET.cont;NET.cont=null;
    if(c)processRespawns(c); // 残りの再召喚キューがあれば続けて処理
    return;
  }
  // msg.t==="watch"：状態反映のみ（観戦表示の更新）
}
function wireConn(conn){
  conn.on("data",netOnData);
  conn.on("close",()=>netClosed());
  conn.on("error",e=>netError(e));
}
function netClosed(){
  if(NET.on&&!G.over){
    openModal("通信切断","<p style='text-align:center'>相手との接続が切れました。</p>",
      [{label:"タイトルへ",cls:"primary",fn:()=>{closeModal();showStart();}}]);
  }
  NET.on=false;
}
function netError(err){
  const t=(err&&err.type)||"不明なエラー";
  cleanupNet();
  openModal("通信エラー",
    `<p style="text-align:center">接続できませんでした（${t}）。<br>ルームコードと通信状況を確認して、もう一度お試しください。</p>`,
    [{label:"戻る",cls:"primary",fn:()=>{closeModal();showStart();}}]);
}
function hostRoom(){
  if(typeof Peer==="undefined"){netError({type:"オフライン：通信ライブラリ未読込"});return;}
  cleanupNet();
  const code=genCode();
  const peer=new Peer("kojosen-v1-"+code);
  NET.peer=peer;
  openModal("ルーム作成",
    `<p style="text-align:center;color:var(--sub)">ルームコード</p>
     <div style="font-size:36px;text-align:center;letter-spacing:.35em;color:var(--gold);font-weight:bold">${code}</div>
     <p style="text-align:center;color:var(--sub);font-size:13px;margin-top:10px">相手にこのコードを伝えて、<br>「ルームに参加」から入力してもらってください。</p>
     <p id="netStat" style="text-align:center;color:var(--shu)">サーバーに接続中…</p>`,
    [{label:"やめる",fn:()=>{closeModal();showStart();}}]);
  peer.on("open",()=>{const s=$("#netStat");if(s)s.textContent="相手の参加を待っています…";});
  peer.on("error",e=>{
    if(e&&e.type==="unavailable-id"){hostRoom();return;}
    netError(e);
  });
  peer.on("connection",conn=>{
    if(NET.conn){try{conn.close();}catch(e){} return;} // 2人目以降は拒否
    NET.conn=conn;
    wireConn(conn);
    conn.on("open",()=>{
      NET.on=true;
      const hostFirst=Math.random()<0.5;
      const deal=randomDeal?makeRandomDeal():null;
      try{conn.send({t:"start",youFirst:!hostFirst,randomDeal,deal});}catch(e){}
      closeModal();
      newNetGame(hostFirst,randomDeal,deal);
    });
  });
}
function joinRoom(){
  if(typeof Peer==="undefined"){netError({type:"オフライン：通信ライブラリ未読込"});return;}
  openModal("ルームに参加",
    `<p style="text-align:center;color:var(--sub)">相手から聞いたルームコードを入力</p>
     <div style="text-align:center;margin:10px 0">
       <input id="roomCodeIn" maxlength="4" autocapitalize="characters" autocomplete="off"

        color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:8px;text-transform:uppercase">

     <p id="netStat" style="text-align:center;color:var(--sub);font-size:13px"></p>`,
    [{label:"戻る",fn:()=>{closeModal();showStart();}},
     {label:"参加する",cls:"primary",fn:()=>{

     }}]);

function newNetGame(first,rnd,deal){
  NET.first=first;NET.overShown=false;NET.sentOver=false;NET.cont=null;NET.lock=false;
  NET.logBuf=[];NET.sfxBuf=[];
  G={pieces:[],traps:[],bombs:[],kills:{P:0,E:0},
     phase:"setup",nphase:"setup",turn:"P",
     setupCount:{P:0,E:0},slotsLeft:1,currentActor:null,attackUsed:false,
     respawnQueue:[],over:false,trapProb:[],ninjaProb:[],walls:[],meteors:[],aiTypes:[]};
  UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
  pid=1; aiMoveHistory=[]; aiPosHistory={};
  $("#log").innerHTML="";
  log(`―― オンライン対戦 開戦。先手は${first?"あなた":"相手"}です ――`,"s",true);
  if(rnd&&deal){
    // 自分視点：first(=ホスト)ならdeal.Pが自分、joinならdeal.Eが自分
    const mine=NET.first?deal.P:deal.E;
    const theirs=NET.first?deal.E:deal.P;
    for(const d of mine){
      const p=makePiece(d.type,"P",5,d.c);G.pieces.push(p);
      if(d.type==="esper")p.flags.esperMode=d.em||"ortho";
    }
    for(const d of theirs){
      const p=makePiece(d.type,"E",0,d.c);G.pieces.push(p);
      if(d.type==="esper")p.flags.esperMode=d.em||"ortho";
    }
    G.setupCount={P:3,E:3};
    log("ランダム配布：自軍 "+mine.map(d=>PIECES[d.type].name).join("・"),"p",true);
    G.nphase="maou1";
    render();
    netDispatch();
    return;
  }
  render();
  netDispatch();
}
let watchTimer=null;
function scheduleWatch(){
  if(!NET.on||NET.applying||NET.lock||G.over)return;
  if(!(G.nphase==="battle"&&G.turn==="P"))return;
  if(watchTimer)return;
  watchTimer=setTimeout(()=>{
    watchTimer=null;
    if(NET.on&&!NET.applying&&!NET.lock&&!G.over&&G.turn==="P")netSend("watch");
  },250);
}

/* =========================================================
   セットアップ
   ========================================================= */
function beginSetupStep(){
  if(NET.on){
    if(G.setupCount.P>=3&&G.setupCount.E>=3){G.nphase="maou1";netDispatch();return;}
    if(myTurnToPlace()){
      openPiecePicker(`配置 ${G.setupCount.P+1}/3 — 駒を選択`,(type)=>{
        UI={mode:"setup-place",sel:null,targets:new Set(),ability:null,extra:{type}};
        const cells=[];
        for(let c=0;c<6;c++){
          if(at(5,c))continue;
          if(G.setupCount.P===2 && !colorOkPlacement("P",c))continue;
          cells.push("5,"+c);
        }
        UI.targets=new Set(cells);
        setPhaseBar(`<span class="turnP">${PIECES[type].name}を配置するマスを選択（手前の段）</span>`);
        render();
      });
    }else waitBar("相手が配置中…");
    return;
  }
  if(G.setupCount.P>=3 && G.setupCount.E>=3){ startMaouPhase(); return; }
  if(G.setupCount.P<=G.setupCount.E){
    // プレイヤーの番
    openPiecePicker(`配置 ${G.setupCount.P+1}/3 — 駒を選択`,(type)=>{
      UI={mode:"setup-place",sel:null,targets:new Set(),ability:null,extra:{type}};
      const cells=[];
      for(let c=0;c<6;c++){
        if(at(5,c))continue;
        if(G.setupCount.P===2 && !colorOkPlacement("P",c))continue;
        cells.push("5,"+c);
      }
      UI.targets=new Set(cells);
      setPhaseBar(`<span class="turnP">${PIECES[type].name}を配置するマスを選択（手前の段）</span>`);
      render();
    });
  }else{
    // AIの番
    setTimeout(()=>{
      aiPlaceSetup();
      render();
      setTimeout(beginSetupStep,350);
    },350);
  }
}
function colorOkPlacement(owner,c){
  const ms=mains(owner);
  if(ms.length<2) return true;
  return !(ms.every(p=>half(p.c)===half(c)));
}
function placePlayerPiece(r,c){
  const type=UI.extra.type;
  const p=makePiece(type,"P",r,c);
  G.pieces.push(p);
  G.setupCount.P++;
  sfx("place");
  log(`自軍：${PIECES[type].name}を配置`,"p");
  UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
  const after=()=>{
    if(NET.on){
      if(G.setupCount.P>=3&&G.setupCount.E>=3)G.nphase="maou1";
      render();
      netSend("go");
      netDispatch();
    }else{render();beginSetupStep();}
  };
  if(type==="esper"){ askEsperMode(p,after); } else after();
}
function askEsperMode(p,cb){
  openModal("超能力者のモード選択",
    `<div class="choiceList">
      <button class="act" data-m="ortho">縦横モード（十字方向2マスが射程）</button>
      <button class="act" data-m="diag">斜めモード（斜め方向2マスが射程）</button>
    </div>`,[]);
  $("#modalBody").querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{p.flags.esperMode=b.dataset.m;closeModal();cb();};

}

/* ---- 魔王指定 ---- */
function startMaouPhase(){
  // 敵AIの勇者がいれば、こっそりプレイヤーの駒1体を魔王に指定
  for(const h of alive("E").filter(p=>p.type==="yusha"&&!p.flags.maouId&&!p.flags.heroBoost)){
    const targets=alive("P");
    if(targets.length){
      // 主力（行動力2や高HP）を狙う
      const t=targets.slice().sort((a,b)=>(b.maxAp-a.maxAp)||(b.hp-a.hp))[0];
      h.flags.maouId=t.id;
      log("敵の勇者が密かに魔王を指定した…","e",true);
    }
  }
  const heroes=alive("P").filter(p=>p.type==="yusha" && !p.flags.maouId && !p.flags.heroBoost);
  if(heroes.length===0){ startPlayerTurn(); return; }
  promptMaou(heroes,0,()=>startPlayerTurn());
}
function promptMaou(heroes,i,done){
  if(i>=heroes.length){done();return;}
  const hero=heroes[i];
  UI={mode:"maou",sel:hero.id,targets:new Set(alive("E").map(p=>p.r+","+p.c)),ability:null,
      extra:{cb:(target)=>{
        hero.flags.maouId=target.id;
        log(`勇者は密かに魔王を指定した…`,"p",true);
        UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
        render();
        promptMaou(heroes,i+1,done);
      }}};
  setPhaseBar(`<span class="turnP">勇者：敵駒1つを「魔王」に指定してください（相手には非公開）</span>`);
  render();
}

/* =========================================================
   ダメージ / 死亡 / リスポーン
   ========================================================= */
const BYPASS=new Set(["bomb","curse","chain","trap","ninja","meteor"]);
function dealDamage(target,dmg,src,kind){
  if(!target||target.dead) return false;
  if(target.flags.invisible && !BYPASS.has(kind)){
    log(`${pieceLabel(target)}は透明で攻撃を無効化！`,target.owner==="P"?"p":"e");
    return false;
  }
  if(target.flags.block && src && (kind==="melee"||kind==="ranged")
     && src.r===target.flags.block.r && src.c===target.flags.block.c){
    log(`${pieceLabel(target)}は盾でそのマスからの攻撃を防いだ！`,target.owner==="P"?"p":"e");
    return false;
  }
  target.hp=r2(target.hp-dmg);
  target.flash=true;
  sfx(kind==="heal"?"heal":"hit");
  log(`${pieceLabel(target)}に${fmt(dmg)}ダメージ（残HP ${fmt(Math.max(0,target.hp))}）`,src&&src.owner==="P"?"p":"e");
  if(src && src.type==="kyuketsuki" && src.owner!==target.owner && !src.dead && kind==="melee" && src.hp<3){
    healPiece(src,0.5);
  }
  if(target.hp<=0){ killPiece(target,src,kind); }
  return true;
}
function healPiece(p,amount){
  if(!p||p.dead)return;
  p.hp=Math.min(p.maxHp||3,r2(p.hp+amount));
  sfx("heal");
  log(`${pieceLabel(p)}のHPが${fmt(amount)}回復（HP ${fmt(p.hp)}）`,p.owner==="P"?"p":"e");
}
/* 隕石の着弾を解決する。meteorId=隕石駒、(ir,ic)=選ばれた着弾マス。 */
function resolveMeteorImpact(meteorId, ir, ic){
  const p=byId(meteorId);
  G.meteors=(G.meteors||[]).filter(m=>m.id!==meteorId);
  log(`☄ 隕石が ${cellName(ir,ic)} に着弾！`,p&&p.owner==="P"?"p":"e");
  sfx("bomb");
  spawnShatterAt(ir,ic,p?p.owner:"P");
  // ① 着弾マスにいる駒は撃破（隕石本体を除く）
  const direct=at(ir,ic);
  if(direct && direct.id!==meteorId){ killPiece(direct,p,"meteor"); }
  // ② 隕石駒を着弾マスへ移動させ、消えていた状態を解除する
  if(p){
    p.flags.pendingMeteor=false;
    p.flags.invisible=false;
    p.flags.meteorOrigin=null;
    p.r=ir; p.c=ic;               // 着弾マスへ移動
  }
  // ③ 着弾マスの周囲十字4マスに1ダメージ
  for(const [dr,dc] of ORTHO){
    const r=ir+dr,c=ic+dc;
    if(!inB(r,c))continue;
    const t=at(r,c);
    if(t && t.id!==meteorId){ dealDamage(t,1,p,"meteor"); }
  }
  // ④ 隕石駒自身にも0.5ダメージ（反動）
  if(p && !p.dead){ dealDamage(p,0.5,null,"meteor"); }
}
function killPiece(p,src,kind){
  if(p.type==="fushicho" && !p.flags.phoenix){
    p.flags.phoenix=true; p.hp=0.5;
    log(`${pieceLabel(p)}は灰から蘇った！（HP0.5・失点なし）`,p.owner==="P"?"p":"e");
    return;
  }
  p.dead=true;
  spawnShatterAt(p.r,p.c,p.owner); // 砕け散る演出
  sfx("death");
  log(`◆ ${pieceLabel(p)}は倒れた！`,p.owner==="P"?"e":"p");
  // 罠師が倒れたら、その罠師の罠を全て解除
  if(p.type==="wanashi"){
    const before=G.traps.length;
    G.traps=G.traps.filter(t=>t.setter!==p.id);
    if(G.traps.length<before)log("罠師の死により、仕掛けられていた罠が消えた","s");
    clearTrapProbForSetter(p.id); // 推定確率マップも消す
  }
  // 忍者が倒れたら潜伏位置の予測を消す
  if(p.type==="ninja")clearNinjaProb(p.id);
  // 調教師が倒れたら、その調教師が召喚した獣も消滅
  if(p.type==="chokyo"){
    for(const beast of G.pieces){
      if(!beast.dead && beast.type==="kemono" && beast.flags.beastOf===p.id){
        beast.dead=true;
        spawnShatterAt(beast.r,beast.c,beast.owner);
        log("調教師の死により、獣も消え去った","s");
      }
    }
  }
  // 魔王チェック
  for(const h of G.pieces){
    if(!h.dead && h.type==="yusha" && h.flags.maouId===p.id && !h.flags.heroBoost){
      h.flags.heroBoost=true;
      healPiece(h,1);
      log(`★ 魔王が場を去った！${pieceLabel(h)}が覚醒（近接攻撃3）`,h.owner==="P"?"p":"e");
    }
  }
  // 聖職者の道連れ
  if(p.type==="seishoku"){
    log(`${pieceLabel(p)}の殉教…味方全てに1ダメージ`,"s");
    for(const o of alive(p.owner)) dealDamage(o,1,null,"chain");
  }
  if(p.type==="kemono"){
    const t=byId(p.flags.beastOf);
    if(t){ log("獣の死により調教師が傷ついた","s"); dealDamage(t,0.5,null,"chain"); }
    return; // 失点・再召喚なし
  }
  const scorer=opp(p.owner);
  G.kills[scorer]++;
  updateScore();
  if(G.kills[scorer]>=2){ G.over=true; afterShatter(()=>endGame(scorer)); return; }
  G.respawnQueue.push(p.owner);
}
function updateScore(){
  $("#scoreP").textContent=G.kills.P;
  $("#scoreE").textContent=G.kills.E;
}
function endGame(winner){
  G.over=true;
  if(NET.on){
    NET.overShown=true;
    if(!NET.applying&&!NET.sentOver){NET.sentOver=true;netSend("go");}
  }
  UI={mode:"over",sel:null,targets:new Set(),ability:null,extra:{}};
  sfx(winner==="P"?"win":"lose");
  setPhaseBar(winner==="P"?'<span class="turnP">勝利！</span>':'<span class="turnE">敗北…</span>');
  render();
  setTimeout(()=>{
    openModal("勝敗決す",
      `<div id="overBanner" class="${winner==="P"?"":"lose"}">${winner==="P"?"勝 利":"敗 北"}</div>
       <p style="text-align:center;color:var(--sub)">自軍 ${G.kills.P} — ${G.kills.E} 敵軍</p>`,
      [{label:"もう一度戦う",cls:"primary",fn:()=>{closeModal();showStart();}}]);
  },600);
}

/* ---- respawn ---- */
function processRespawns(cont){
  if(G.over)return;
  if(G.respawnQueue.length===0){cont();return;}
  // 砕け散る演出が終わってから召喚フェーズへ
  afterShatter(()=>{
    if(G.over)return;
    if(G.respawnQueue.length===0){cont();return;}
    if(NET.on&&G.respawnQueue[0]==="E"){
      NET.cont=cont;NET.lock=true;
      netSend("respawn");
      waitBar("相手が駒を召喚中…");
      return;
    }
    const owner=G.respawnQueue.shift();
    if(owner==="E"){
      aiRespawn();
      render();
      setTimeout(()=>processRespawns(cont),400);
    }else{
      openPiecePicker("駒が倒された — 新たな駒を召喚",(type)=>{
        UI={mode:"respawn-place",sel:null,targets:new Set(),ability:null,extra:{type,cont}};
        const cells=[];
        for(let c=0;c<6;c++){
          if(at(5,c))continue;
          if(mains("P").length>=2 && !respawnColorOk("P",c))continue;
          cells.push("5,"+c);
        }
        if(cells.length===0){for(let c=0;c<6;c++)if(!at(5,c))cells.push("5,"+c);}
        UI.targets=new Set(cells);
        setPhaseBar('<span class="turnP">召喚するマスを選択（手前の段）</span>');
        render();
      });
    }
  });
}
function respawnColorOk(owner,c){
  const ms=mains(owner);
  if(ms.length<2)return true;
  return !(ms.every(p=>half(p.c)===half(c)));
}
function placeRespawn(r,c){
  const {type,cont}=UI.extra;
  const p=makePiece(type,"P",r,c);
  G.pieces.push(p);
  sfx("place");
  log(`自軍：${PIECES[type].name}を召喚`,"p");
  UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
  const after=()=>{
    render();
    if(type==="yusha" && !p.flags.maouId){
      promptMaou([p],0,()=>processRespawns(cont));
    }else processRespawns(cont);
  };
  if(type==="esper") askEsperMode(p,after); else after();
}
function aiRespawn(){
  const threat=playerThreatMap();
  // 召喚可能な列
  const cols=[];
  for(let c=0;c<6;c++){
    if(at(0,c))continue;
    if(mains("E").length>=2 && !respawnColorOk("E",c))continue;
    cols.push(c);
  }
  if(cols.length===0){for(let c=0;c<6;c++)if(!at(0,c))cols.push(c);}
  if(cols.length===0)return;

  // 評価対象の駒タイプ（戦術的に意味のある候補＋汎用アタッカー）
  let CANDIDATES=["kenshi","senshi","kiba","souhei","kyuhei","sogeki","kyuketsuki",
                    "esper","jutsushi","akuryo","tatehei","fushicho","yusha","bakudan",
                    "ninja","boken","wanashi","kusushi","miko","seishoku","majo","chokyo","jusoshi","gunshi"];
  if(alive("E").some(p=>p.type==="yusha"))CANDIDATES=CANDIDATES.filter(t=>t!=="yusha"); // 勇者は1駒まで
  // プレイヤーの駒情報
  const foes=alive("P").filter(f=>!f.flags.invisible);
  // 危機にある自軍（次のプレイヤー手番で撃破されうる駒）
  const myPieces=alive("E");
  const inPeril=myPieces.filter(p=>{
    const dmg=threat[p.r*6+p.c]||0; return dmg>0 && p.hp-dmg<=0;
  });

  let best=null, bestScore=-1e9;
  for(const type of CANDIDATES){
    for(const c of cols){
      const s=aiEvalRespawn(type,0,c,threat,foes,inPeril);
      if(s>bestScore){bestScore=s;best={type,c};}
    }
  }
  if(!best){ best={type:aiWeightedPick([]), c:cols[0]}; }

  const p=makePiece(best.type,"E",0,best.c);
  if(best.type==="esper")p.flags.esperMode=aiEsperModeFor(0,best.c,foes);
  G.pieces.push(p);
  // 敵勇者なら魔王を指定
  if(best.type==="yusha" && foes.length){
    const t=foes.slice().sort((a,b)=>(b.maxAp-a.maxAp)||(b.hp-a.hp))[0];
    p.flags.maouId=t.id;
    log("敵の勇者が密かに魔王を指定した…","e",true);
  }
  log(`敵軍：${PIECES[best.type].name}を召喚`,"e");
  sfx("place");
}
/* 超能力者の射程モードを、押し出したい相手が多い方向で選ぶ */
function aiEsperModeFor(r,c,foes){
  let ortho=0,diag=0;
  for(const f of foes){
    const dr=Math.abs(f.r-r),dc=Math.abs(f.c-c),man=dr+dc;
    if(man<=2 && (f.r===r||f.c===c))ortho++;
    if(man<=2 && dr===dc)diag++;
  }
  return diag>ortho?"diag":"ortho";
}
/* 召喚した駒が「そのターン（＝次の敵手番）」にできる動きを見積もって点数化 */
function aiEvalRespawn(type,r,c,threat,foes,inPeril){
  const info=PIECES[type];
  let score=0;
  // 基本：召喚位置が危険でないほど良い（脆い駒を的にしない）
  const hereThreat=threat[r*6+c]||0;
  score-=hereThreat*40;
  // 仮の駒（移動・攻撃range計算用）
  const ghost={type,owner:"E",r,c,ap:info.ap,maxAp:info.ap,hp:type==="kemono"?1:3,flags:{}};
  // 到達できるマス（次の手番に動ける範囲。ここでは簡易にmaxAp歩）
  const reach=reachSquares(ghost,info.ap,true);

  // === 攻撃系：低HPのプレイヤー駒を仕留められるか ===
  if(!info.noNormal){
    // 新規召喚（HP3）での実際の通常攻撃ダメージ
    let dmg=1;
    if(type==="kenshi")dmg=1.5;   // 剣士：+0.5
    else if(type==="yusha"&&false)dmg=1; // 召喚直後の勇者は未覚醒
    // 戦士はHP3なので加算なし（=1）。覚醒勇者は召喚では無いので考慮不要
    let bestKill=0, bestHit=0;
    for(const [mr,mc] of reach){
      const dirs=type==="souhei"?[...DIAG,[frontDr("E"),0]]:ORTHO;
      for(const [dr,dc] of dirs){
        const tr=mr+dr,tc=mc+dc;
        const f=foes.find(x=>x.r===tr&&x.c===tc);
        if(!f)continue;
        if(f.hp-dmg<=0)bestKill=Math.max(bestKill,f.hp); // この駒なら仕留められる
        else bestHit=Math.max(bestHit,dmg);
      }
    }
    if(bestKill>0)score+=900+bestKill*60; // 召喚即撃破は最高評価（HPの高い相手を倒せるほど加点）
    else if(bestHit>0)score+=120+bestHit*30;
  }
  // 遠距離アタッカー（弓・狙撃）：射程に低HP駒が入るか
  if(type==="kyuhei"||type==="sogeki"){
    let kill=0,hit=0;
    for(const [mr,mc] of reach){
      for(const [rr,cc] of rangedCellsFrom(ghost,mr,mc)){
        const f=foes.find(x=>x.r===rr&&x.c===cc);
        if(!f)continue;
        if(f.hp-1<=0)kill=Math.max(kill,1);else hit=Math.max(hit,1);
      }
    }
    if(kill)score+=760; else if(hit)score+=140;
  }

  // === 危機対応：味方が追い詰められている時の対抗策 ===
  if(inPeril.length>0){
    // 超能力者：射程2以内の脅威駒を押し出して味方を守れる
    if(type==="esper"){
      // 危機の味方を脅かすプレイヤー駒が、超能力者の射程(2)内にいるか
      let usable=0;
      for(const f of foes){
        const man=Math.abs(f.r-r)+Math.abs(f.c-c);
        if(man<=2)usable++;
      }
      if(usable>0)score+=520+inPeril.length*60;
    }
    // 術士：相手の主力を減速（次ターンの追撃を鈍らせる）
    if(type==="jutsushi"){
      score+=380+inPeril.length*50;
    }
    // 悪霊：相手アタッカーの通常攻撃を封じる
    if(type==="akuryo"){
      score+=360+inPeril.length*50;
    }
    // 盾兵：壁として味方を守る配置
    if(type==="tatehei"){
      score+=180+inPeril.length*30;
    }
  }
  // 不死鳥：一度は失点なしで復活できる粘り（過剰選出を抑えるため控えめに）
  if(type==="fushicho")score+=25;
  // 勇者：魔王付与で将来の覚醒が狙える
  if(type==="yusha")score+=50;

  // === 相手構成へのカウンター（相性を見て選ぶ）===
  const foeTypes=foes.map(f=>f.type);
  const isRanged=(type==="kyuhei"||type==="sogeki");
  for(const ft of foeTypes){
    // 相手の近接主力には遠距離・盾・妨害
    if(["kenshi","senshi","kyuketsuki","fushicho"].includes(ft)){
      if(isRanged)score+=70;
      if(type==="tatehei")score+=50;
      if(type==="jutsushi"||type==="akuryo")score+=45;
    }
    // 相手の遠距離には機動力で寄せる
    if(ft==="kyuhei"||ft==="sogeki"){
      if(type==="kiba"||type==="ninja"||type==="boken")score+=60;
      if(type==="tatehei")score+=30;
    }
    // 相手の強襲には迎え撃つ近接・盾
    if(ft==="kiba"||ft==="ninja"||ft==="boken"){
      if(["kenshi","senshi","souhei","tatehei"].includes(type))score+=40;
    }
    // 相手の盤面操作（魔女・超能力）には妨害・粘り
    if(ft==="majo"||ft==="esper"){
      if(type==="jutsushi")score+=35;
      if(type==="fushicho")score+=20;
    }
    // 相手が調教師なら、獣ではなく本体を突ける強襲を評価
    if(ft==="chokyo"){
      if(type==="kiba"||type==="ninja"||type==="boken")score+=30;
    }
  }
  // 相手構成に合わせた重み付け（基本の強さ）。過度に強い駒に偏らないよう控えめ。
  score+=(AI_WEIGHTS[type]||2)*4;
  // 点を先行されている時（取り返しが必要）は攻撃的な駒を優先
  if(G.kills.P>G.kills.E && ["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(type))score+=30;

  // 汎用：前に出て攻め圧をかけられる（相手主力への距離）
  if(foes.length){
    let md=99;for(const f of foes)md=Math.min(md,Math.abs(r-f.r)+Math.abs(c-f.c));
    score-=md*3;
  }
  // 微小なランダムで硬直を防ぐ
  score+=Math.random()*8;
  return score;
}

/* =========================================================
   移動・トラップ・忍者
   ========================================================= */
function moveDirs(p){
  if(p.type==="kiba") return ALL8;
  if(p.type==="kaizoku") return ALL8;      // 海賊：周囲8マスへ移動可
  if(p.type==="taka") return ALL8;         // 鷹：常時8方向へ移動可
  if(p.type==="ninja"&&p.flags.invisible) return ALL8;
  return ORTHO;
}
/* 駒pが (r,c) へ1マス移動した後、残る行動力(apAfter)を確実に消費できるか（さらに動けるか）を判定。
   apAfterが0なら常にOK。1以上残るなら、その位置からさらに合法移動が1つでもあればOK。 */
function canSpendAPAfterStep(p, r, c, apAfter){
  if(apAfter<=0)return true;
  // pを仮に(r,c)へ移し、行動力apAfterでさらに動けるマスがあるか調べる
  const or=p.r, oc=p.c, oap=p.ap;
  p.r=r; p.c=c; p.ap=apAfter;
  let ok=false;
  for(const [dr,dc] of moveDirs(p)){
    let nr=p.r+dr,nc=p.c+dc;
    if(p.type==="boken" && (nc<0||nc>5))continue; // 端ワープはAP消費しないので「消費できる移動」に数えない
    if(!inB(nr,nc))continue;
    if(visAt(nr,nc,p.owner))continue;
    if(wallAt(nr,nc))continue;
    if(!colorOk(p.owner,p.id,nr,nc))continue;
    ok=true;break;
  }
  // 騎馬の跳躍でAP2を消費できるケースも救う（apAfter>=2のとき）
  if(!ok && p.type==="kiba" && apAfter>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,jr=p.r+dr*2,jc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(jr,jc))continue;
      if(wallAt(mr,mc))continue;               // 中間が壁なら飛び越え不可
      if(!visAt(mr,mc,p.owner))continue;       // 中間に駒がある時のみ跳躍
      if(visAt(jr,jc,p.owner))continue;
      if(wallAt(jr,jc))continue;
      if(!colorOk(p.owner,p.id,jr,jc))continue;
      ok=true;break;
    }
  }
  p.r=or; p.c=oc; p.ap=oap;
  return ok;
}
function stepOptions(p){
  const out=[];
  // 冒険者の端ワープ（左右端の行き来）は行動力を消費しない。
  // 2マス移動してAP0になった後でも、端にいれば1度だけ反対の端へワープできる。
  if(p.type==="boken" && !p.flags.bokenWrapUsed){
    if(p.c===0 || p.c===5){
      const wc = p.c===0 ? 5 : 0;
      if(inB(p.r,wc) && !visAt(p.r,wc,p.owner) && !wallAt(p.r,wc) && colorOk(p.owner,p.id,p.r,wc)){
        out.push([p.r,wc]);
      }
    }
  }
  if(p.ap<1)return out;
  for(const [dr,dc] of moveDirs(p)){
    let nr=p.r+dr,nc=p.c+dc;
    let isWrap=false;
    if(p.type==="boken" && (nc<0||nc>5)){ nc=(nc+6)%6; isWrap=true; } // 端ワープ（AP消費なし）
    if(isWrap)continue; // ワープは上で別途追加済み（重複回避）
    if(!inB(nr,nc))continue;
    if(visAt(nr,nc,p.owner))continue;
    if(wallAt(nr,nc))continue;               // 壁のあるマスには入れない
    if(!colorOk(p.owner,p.id,nr,nc))continue;
    const apAfter = p.ap-1;
    // 移動後に行動力が余り、かつそこから一切動けない「行き止まり」マスは候補から外す
    if(!canSpendAPAfterStep(p, nr, nc, apAfter))continue;
    out.push([nr,nc]);
  }
  return out;
}
function jumpOptions(p){
  const out=[];
  // 騎馬：隣接1マスの「駒」を飛び越えて2マス先へ（行動力2）。壁は飛び越えられない。
  if(p.type==="kiba"&&p.ap>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(nr,nc))continue;
      if(wallAt(mr,mc))continue;               // 中間が壁なら飛び越え不可
      if(!visAt(mr,mc,p.owner))continue;       // 中間に駒がある時のみ跳躍
      if(visAt(nr,nc,p.owner))continue;
      if(wallAt(nr,nc))continue;               // 着地マスが壁なら不可
      if(!colorOk(p.owner,p.id,nr,nc))continue;
      out.push([nr,nc]);
    }
    return out;
  }
  // 鷹：隣接する障害物（駒・壁）を、その先に続いても連続で飛び越え、
  //     最初の「駒も壁もない空きマス」に着地する（行動力1）。壁も飛び越え可能。
  if(p.type==="taka"&&p.ap>=1){
    const obstacle=(r,c)=>at(r,c)||wallAt(r,c); // 駒か壁が障害物
    for(const [dr,dc] of ALL8){
      const ar=p.r+dr, ac=p.c+dc;
      if(!inB(ar,ac))continue;
      if(!obstacle(ar,ac))continue;            // 隣が空き＝跳躍ではない（通常移動の範囲）
      // 隣接の障害物から先へ、連続する障害物（駒・壁）を飛び越え、最初の空きマスへ
      let k=2, landed=null;
      while(true){
        const rr=p.r+dr*k, cc=p.c+dc*k;
        if(!inB(rr,cc)){ break; }               // 盤外まで障害物が続く＝着地不可
        if(!obstacle(rr,cc)){ landed=[rr,cc]; break; } // 最初の空きマス＝着地点
        k++;                                     // まだ障害物が続く＝さらに飛び越える
      }
      if(!landed)continue;
      if(!colorOk(p.owner,p.id,landed[0],landed[1]))continue;
      out.push(landed);
    }
    return out;
  }
  return out;
}
/* マスに入る処理（罠・透明忍者を解決）戻り値: "ok"|"bounced"|"dead" */
function enterSquare(p,nr,nc){
  const prevR=p.r,prevC=p.c;
  // 透明忍者チェック
  const hidden=at(nr,nc);
  if(hidden && hidden!==p && hidden.flags.invisible && hidden.owner!==p.owner){
    hidden.flags.invisible=false;
    clearNinjaProb(hidden.id); // 露見したので予測不要
    log(`そこには透明の忍者が潜んでいた！`,"s");
    sfx("trap");
    dealDamage(p,3,null,"ninja");
    return p.dead?"dead":"bounced";
  }
  p.r=nr;p.c=nc;
  // 罠チェック
  const ti=G.traps.findIndex(t=>t.r===nr&&t.c===nc&&t.owner!==p.owner);
  if(ti>=0){
    const sprung=G.traps[ti];
    G.traps.splice(ti,1);
    // 発動して位置が判明したマスは確率マップから除去する
    if(G.trapProb){
      for(const e of G.trapProb)e.cells=e.cells.filter(cl=>!(cl.r===nr&&cl.c===nc));
      G.trapProb=G.trapProb.filter(e=>e.cells.length>0);
    }
    sfx("trap");
    log(`${pieceLabel(p)}は罠にかかった！（1ダメ・次のターン行動力-1）`,"s");
    p.flags.apCut=true; // 次のターン開始時に行動力-1
    dealDamage(p,1,null,"trap");
    if(p.dead)return "dead";
  }
  return "ok";
}
function tryStep(p,nr,nc){
  // 冒険者の左右端ワープ（列0↔5をまたぐ横移動）は行動力を消費しない（1ターン1回）
  const isWrap = p.type==="boken" && nr===p.r && Math.abs(nc-p.c)===5;
  // 猪の突進：直進で2マス移動した直後の通常攻撃は2ダメになる。方向転換すると不発。
  if(p.type==="inoshishi"){
    const dr=nr-p.r, dc=nc-p.c; // この1歩の方向（±1マス想定）
    const f=p.flags;
    if(f.chargeDir && f.chargeDir[0]===dr && f.chargeDir[1]===dc){
      f.chargeSteps=(f.chargeSteps||0)+1; // 同じ方向へ継続
    }else{
      f.chargeDir=[dr,dc]; f.chargeSteps=1; // 新しい方向で歩き直し
    }
    f.chargeReady=(f.chargeSteps>=2); // 直進2マス到達で突進準備完了
  }
  if(!isWrap)p.ap--;
  else p.flags.bokenWrapUsed=true;
  const res=enterSquare(p,nr,nc);
  if(res==="ok")sfx(isWrap?"teleport":"move");
  return res;
}

/* =========================================================
   攻撃
   ========================================================= */
function atkDamage(p,kind,target){
  let d=1;
  if(p.type==="kenshi")d+=0.5;
  if(p.type==="senshi"){ if(p.hp<=1)d+=2; else if(p.hp<=2)d+=1; }
  if(p.type==="yusha"&&p.flags.heroBoost&&kind==="melee")d=3;
  // 猪：通常攻撃は基本0.5ダメ。直進2マス移動直後（chargeReady）の突進攻撃のみ2ダメ。
  if(p.type==="inoshishi"){
    d = (p.flags.chargeReady && kind==="melee") ? 2 : 0.5;
  }
  // 海賊：通常攻撃の相手が自分よりHPが高い時（同数は不可）、与ダメ+1（合計2）
  if(p.type==="kaizoku" && kind==="melee" && target && target.hp>p.hp)d+=1;
  return d;
}
function normalAttackCells(p){
  if(PIECES[p.type].noNormal)return [];
  if(p.flags.invisible)return []; // 忍者：透明中は通常攻撃不可
  let dirs;
  if(p.type==="souhei") dirs=[...DIAG,[frontDr(p.owner),0]];
  else dirs=ORTHO;
  return dirs.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>inB(r,c));
}
function rangedCellsFrom(p,r,c){
  const out=[];
  // 射線上に壁があると、その壁のマス以降（奥）は狙えない（壁が射線を遮る）。
  const rayPush=(dr,dc,maxK)=>{
    for(let k=1;k<=maxK;k++){
      const rr=r+dr*k, cc=c+dc*k;
      if(!inB(rr,cc))break;
      if(wallAt(rr,cc))break; // 壁にぶつかったら、その先は射線が通らない
      out.push([rr,cc]);
    }
  };
  if(p.type==="kyuhei"){
    // 縦横は2マス直線（射線判定あり）、斜めは1マス
    for(const [dr,dc] of ORTHO)rayPush(dr,dc,2);
    for(const [dr,dc] of DIAG)rayPush(dr,dc,1);
  }else if(p.type==="sogeki"){
    // 斜め3マス直線（射線判定あり）
    for(const [dr,dc] of DIAG)rayPush(dr,dc,3);
  }
  return out.filter(([rr,cc])=>inB(rr,cc));
}
function performAttack(attacker,target,kind){
  const d=atkDamage(attacker,kind,target);
  log(`${pieceLabel(attacker)}の${kind==="ranged"?"遠距離攻撃":"攻撃"}！`,attacker.owner==="P"?"p":"e");
  dealDamage(target,d,attacker,kind);
  // 猪：突進ダメージは「移動直後の1回」だけ。攻撃したら突進状態を解除。
  if(attacker.type==="inoshishi"){ attacker.flags.chargeReady=false; attacker.flags.chargeDir=null; attacker.flags.chargeSteps=0; }
}

/* =========================================================
   ターン進行（プレイヤー）
   ========================================================= */
function startPlayerTurn(){
  if(G.over)return;
  G.turn="P"; G.phase="action";
  G.slotsLeft=1; G.currentActor=null; G.attackUsed=false; G.acted=false;
  for(const p of alive("P")){
    p.ap=Math.max(0,p.maxAp-(p.flags.apCut?1:0));
    if(p.flags.apCut){log(`${pieceLabel(p)}は術で行動力が下がっている`,"s");p.flags.slowedVisual=true;}
    else p.flags.slowedVisual=false;
    p.flags.apCut=false;
    p.flags.usedFree=false;
    p.flags.bokenWrapUsed=false;
    p.flags.chargeDir=null; p.flags.chargeSteps=0; p.flags.chargeReady=false;
    if(p.type==="tatehei")p.flags.block=null; // 盾は毎ターン更新（手番開始でリセット）
  }
  UI={mode:"action",sel:null,targets:new Set(),ability:null,extra:{}};
  // 隕石の着弾：このプレイヤーに着弾待ちの隕石があれば、着弾箇所を選ばせる
  const myMeteor=(G.meteors||[]).find(m=>m.owner==="P");
  if(myMeteor){
    const cells=myMeteor.cells.filter(c=>inB(c.r,c.c));
    UI={mode:"meteorTarget",sel:null,targets:new Set(cells.map(c=>c.r+","+c.c)),ability:{meteorId:myMeteor.id},extra:{}};
    setPhaseBar('<span class="turnP">隕石の着弾地点を選択してください（赤いマス）</span>');
    saveTurnSnapshot();
    render();
    return;
  }
  // 手番開始時点のスナップショットを保存（攻撃フェーズ移行前ならやり直し可能）
  saveTurnSnapshot();
  setPhaseBar('<span class="turnP">あなたの手番 — 行動フェーズ（駒1体を選んで移動／能力）</span>');
  render();
}
let turnSnapshot=null;
function saveTurnSnapshot(){
  if(NET.on){turnSnapshot=null;return;} // オンライン対戦ではやり直し不可
  turnSnapshot=JSON.stringify({
    pieces:G.pieces, traps:G.traps, bombs:G.bombs,
    kills:G.kills, pid:pid
  });
}
function restoreTurnSnapshot(){
  if(!turnSnapshot)return;
  const s=JSON.parse(turnSnapshot);
  G.pieces=s.pieces.map(p=>({...p,flags:{...p.flags}}));
  G.traps=s.traps; G.bombs=s.bombs; G.kills=s.kills; pid=s.pid;
  G.slotsLeft=1; G.currentActor=null; G.attackUsed=false; G.acted=false;
  G.phase="action"; G.turn="P";
  UI={mode:"action",sel:null,targets:new Set(),ability:null,extra:{}};
  log("手番をやり直しました","s");
  render();
}
function gotoAttackPhase(){
  if(!G.acted&&hasAnyPlayerAction()){
    log("先に駒1体を選んで移動か能力で行動力を消費してください","s");
    return;
  }
  if(actorCanStillAct()){
    log("選んだ駒の行動力をすべて使い切ってください","s");
    return;
  }
  G.phase="attack";
  UI={mode:"attack",sel:null,targets:new Set(),ability:null,extra:{}};
  setPhaseBar('<span class="turnP">攻撃フェーズ — 攻撃する駒を選択（スキップ可）</span>');
  render();
}
function afterPlayerAttack(){
  processRespawns(()=>{
    if(G.over)return;
    shieldPhase("P",()=>finishPlayerTurn());
  });
}
function shieldPhase(owner,cont){
  const shields=alive(owner).filter(p=>p.type==="tatehei");
  if(shields.length===0){cont();return;}
  if(owner==="E"){ // AIは脅威の高い方向を防ぐ
    for(const s of shields)aiSetShield(s);
    cont();return;
  }
  let i=0;
  const next=()=>{
    if(i>=shields.length){UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};cont();return;}
    const s=shields[i++];
    const opts=ORTHO.map(([dr,dc])=>[s.r+dr,s.c+dc]).filter(([r,c])=>inB(r,c));
    UI={mode:"shield",sel:s.id,targets:new Set(opts.map(o=>o.join(","))),ability:null,
        extra:{piece:s,next}};
    setPhaseBar('<span class="turnP">盾兵 — 防御するマスを指定（毎ターン設定。スキップすると今ターンは無防備）</span>');
    render();
  };
  next();
}
function finishPlayerTurn(){
  if(G.over)return;
  explodeBombs("P",()=>{
    if(G.over)return;
    decayWalls(); // 壁は3回のターンエンドで消滅
    // 相手（E）所有の透明解除：Pの手番終了で解除されるのはE忍者
    for(const p of alive("E"))p.flags.invisible=false;
    for(const p of alive("P")){p.flags.noAttack=false;p.flags.slowedVisual=false;p.flags.mikoBuff=false;}
    if(NET.on){
      G.turn="E";G.phase="action";
      netSend("go");
      netDispatch();
      return;
    }
    setTimeout(startAITurn,450);
  });
}
function explodeBombs(owner,cont){
  const ready=[],rest=[];
  for(const b of G.bombs){
    if(b.owner===owner){
      if(b.fuse<=0)ready.push(b);
      else{b.fuse--;rest.push(b);}
    }else rest.push(b);
  }
  G.bombs=rest;
  for(const b of ready){
    sfx("bomb");
    log(`爆弾が炸裂！`, "s");
    // 爆弾マス自身に乗っている駒へのダメージ
    const onBomb=at(b.r,b.c);
    if(onBomb)dealDamage(onBomb,1.5,null,"bomb");
    if(G.over)return;
    // 周囲8マス
    for(const [dr,dc] of ALL8){
      const t=at(b.r+dr,b.c+dc);
      if(t)dealDamage(t,1.5,null,"bomb");
      if(G.over)return;
    }
  }
  render();
  processRespawns(cont);
}

/* =========================================================
   能力（プレイヤーUI）
   ========================================================= */
function takeActionSlot(p){
  if(G.currentActor===p.id){G.acted=true;return true;}
  if(G.currentActor!==null){
    if(G.slotsLeft<=0)return false;
    if(actorCanStillAct()){log("行動中の駒の行動力をすべて使い切ってから切り替えてください","s");return false;}
    G.currentActor=null; // 前の駒が行動力を使い切っていれば自動で切替
  }
  if(G.slotsLeft<=0)return false;
  G.currentActor=p.id; G.slotsLeft--; G.acted=true;
  return true;
}
/* 行動中の駒にまだ消費可能な行動力が残っているか */
function actorCanStillAct(){
  if(G.currentActor===null)return false;
  const p=byId(G.currentActor);
  if(!p||p.dead)return false;
  if(p.ap<1)return false;
  // 冒険者：1マスでも移動していれば、残り行動力を捨てて通常攻撃へ移行してよい
  // （移動を強制せず、距離を詰めてから攻撃する運用を可能にする）
  if(p.type==="boken" && p.ap<(p.maxAp||2))return false;
  // stepOptions/jumpOptions は「行動力を余らせず確実に消費できる移動」だけを返す。
  // それが1つでもあるなら、まだ行動力を消費する義務が残っている。
  if(stepOptions(p).length>0)return true;
  if(jumpOptions(p).length>0)return true;
  // 行動力は残るが、どこへも動けず消費できない＝この駒では消費不能。攻撃フェーズへ進んでよい。
  return false;
}
/* 行動可能な駒が1体でも存在するか（手詰まり救済用） */
function hasAnyPlayerAction(){
  for(const p of alive("P")){
    if(stepOptions(p).length>0)return true;
    if(jumpOptions(p).length>0)return true;
    if(abilityButtons(p).some(b=>b.enabled))return true;
  }
  return false;
}
function abilityButtons(p){
  const B=[];
  const A=(label,enabled,fn)=>B.push({label,enabled,fn});
  const isMyTurnAction = (G.turn==="P"&&G.phase==="action"&&!G.over);
  if(!isMyTurnAction)return B;
  const canAct = G.slotsLeft>0||G.currentActor===p.id;
  switch(p.type){
    case "kyuhei":{
      const ts=rangedCellsFrom(p,p.r,p.c).filter(([r,c])=>{const t=visAt(r,c,"P");return t&&t.owner==="E";});
      A("遠距離攻撃（行1）",canAct&&p.ap>=1&&ts.length>0,()=>{
        UI.mode="ability"; UI.ability={type:"ranged",piece:p};
        UI.targets=new Set(ts.map(t=>t.join(",")));render();
      });break;}
    case "sogeki":{
      const ts=rangedCellsFrom(p,p.r,p.c).filter(([r,c])=>{const t=visAt(r,c,"P");return t&&t.owner==="E";});
      A("狙撃（行1）",canAct&&p.ap>=1&&ts.length>0,()=>{
        UI.mode="ability"; UI.ability={type:"ranged",piece:p};
        UI.targets=new Set(ts.map(t=>t.join(",")));render();
      });break;}
    case "jutsushi":{
      const ts=alive("E").filter(t=>!t.flags.invisible);
      A("行動阻害（行0・毎ターン1回）",canAct&&!p.flags.usedFree&&ts.length>0,()=>{
