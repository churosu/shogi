      if(isSupported(p.r,p.c))v+=18*defMul; // 援護のある位置での対峙は良い
    }
  }

  // === 学習：この端末のあなたがよくCPUを倒す駒の間合いには不用意に入らない ===
  if(LEARN_FX.conf>0){
    for(const f of pP){
      const df=LEARN_FX.danger[f.t]; if(!df)continue;
      const rng=(f.maxAp||1)+1;
      for(const e of eP){ if(Math.abs(e.r-f.r)+Math.abs(e.c-f.c)<=rng) v-=df*10; }
    }
  }
  // === 攻め圧＆初手優位：役割(戦法)に応じて前線への出方を変える ===
  for(const p of eP){
    if(pP.length){
      const dmin=dist(p,pP);
      const role=PIECE_ROLE[p.t]||"sortie";
      const adv=ROLE_ADVANCE[role]!==undefined?ROLE_ADVANCE[role]:10;
      v-=dmin*adv*LEARN_FX.advMul; // 出撃・強襲は前へ出る価値大、牽制・迎撃は小（後衛を保つ）
      // 迎撃・牽制の遠距離/罠役は、近づきすぎ（隣接）を軽くペナルティ（後方で運用）
      if((role==="intercept"||role==="control") && dmin===1 && SS.noNormal.has(p.t))v-=15;
      // 通常攻撃を先に当てられる間合い（隣接）で、返り討ちに遭わない駒は強く加点。
      // 「先手を取れる場面では接近して攻撃に転じる」ことを最優先で促す。
      const hitList=SS.noNormal.has(p.t)?[]:pP.filter(f=>ssHits(p,f));   // 攻撃範囲に捉えている敵（槍兵は斜め＋正面）
      if(hitList.length){
        const dgot=danger[p.r+","+p.c]||0;
        if(p.hp-dgot>0){
          v+=70; // 先制して生き残れる好位置（以前の45から強化）
          // 攻撃範囲の敵をこの先制で削れる／討てるなら追加で大きく加点
          for(const f of hitList){
            const dmg=ssAtk(p,"melee",f);
            if(ssKillable(f,dmg))v+=90;      // 先制で撃破できる＝勝ちに直結
            else v+=dmg*22;            // 削るだけでも次の先手の価値を上げる
          }
        }
      }
    }
  }
  for(const p of pP){ if(eP.length)v+=dist(p,eP)*6; }

  // === 弓兵・狙撃手の支援布陣 ===
  // 基本は迎撃（待ち）だが、味方と接敵している敵駒を射程に捉えられる位置に居るなら、
  // その敵を撃って味方のバトルを支援できる。そういう位置を積極的に評価する。
  for(const rg of eP.filter(x=>x.t==="kyuhei"||x.t==="sogeki")){
    const inRange=ssRangedCells({t:rg.t,o:"E"},rg.r,rg.c);
    for(const f of pP){
      // fが自軍E駒と隣接＝「接敵中」の敵か
      const engaged=eP.some(a=>a.id!==rg.id&&Math.abs(a.r-f.r)+Math.abs(a.c-f.c)===1);
      if(!engaged)continue;
      // その接敵中の敵が、この弓兵/狙撃手の射程に入っているか
      if(inRange.some(([rr,cc])=>rr===f.r&&cc===f.c)){
        v+=34;                       // 味方の戦闘を射線で支援できる好位置
        if(f.hp<=1)v+=40;            // 射撃で仕留められる敵なら特に価値大
        else v+=(3-f.hp)*10;         // 削れている敵ほど支援価値が高い
      }
    }
  }

  // === 狙撃手の立ち回り ===
  // 射程は斜め3マスだけ・行動力1（動いた手番は撃てない）。相手を斜めの射線に捉えて待つ位置を評価し、
  // 近接の相手に隣まで寄られる位置は避ける（間合い2以上を保つ）
  for(const sg of eP.filter(x=>x.t==="sogeki")){
    const cells=ssRangedCells(sg,sg.r,sg.c);
    for(const f of pP){
      if(f.t==="kemono"||f.invis)continue;
      if(!cells.some(([rr,cc])=>rr===f.r&&cc===f.c))continue;
      v+=22;                                                  // 射線に捉えている
      if(f.hp<=1&&!(f.t==="fushicho"&&!f.phoenix))v+=35;     // 次に撃てば倒せる
    }
    let md=99;
    for(const f of pP){ if(f.t==="kemono"&&false)continue; if(SS.noNormal.has(f.t))continue; md=Math.min(md,Math.abs(f.r-sg.r)+Math.abs(f.c-sg.c)); }
    if(md<=1)v-=70; else if(md===2)v-=25;
  }
  // === 隕石の待ち方：流星群の着弾候補（周囲8箇所）に相手が集まる位置で待つ。近接の相手に寄られる位置は避ける ===
  for(const ik of eP.filter(x=>x.t==="inseki")){
    let on=0;
    for(const [dr,dc] of METEOR_OFFSETS){ const t=ssAt(st,ik.r+dr,ik.c+dc); if(t&&t.o==="P"&&t.t!=="kemono"&&!t.invis)on++; }
    v+=on*12+(on>=2?25:0);
    let md=99;
    for(const f of pP){ if(SS.noNormal.has(f.t))continue; md=Math.min(md,Math.abs(f.r-ik.r)+Math.abs(f.c-ik.c)); }
    if(md<=1)v-=40;
  }

  // === 戦法：後衛で運用すべき駒は前線に晒さない ===
  // 聖職者は倒れると味方全員に1ダメージ＝狙われてはいけない。危険地帯を強く忌避し後方を保つ。
  for(const p of eP.filter(x=>x.t==="seishoku")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*90+60;          // 攻撃圏にいるだけで重く減点
    v-=(5-Math.min(5,dist(p,pP)))*10; // 敵に近いほど減点＝後方に置く
  }
  // 軍師は指揮役。HPを消費して2駒動かすので、前線で削られるのを避け後方に置く。
  for(const p of eP.filter(x=>x.t==="gunshi")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*70+40;
  }
  // 巫女は通常攻撃不可＋能力でHPを失う脆い支援役。「後衛最奥に隠れ対面戦闘を避ける」戦法に従い、
  // 攻撃圏を強く忌避し、盤面最奥(自陣side)を保たせる。
  for(const p of eP.filter(x=>x.t==="miko")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*100+70;          // 攻撃圏に晒すのは厳禁級
    // 敵に近いほど強く減点（対面戦闘を避け最奥へ）
    v-=(5-Math.min(5,dist(p,pP)))*14;
    // どの味方よりも後ろ（敵から遠い側）に居るのが理想
    let behindAlly=false;
    for(const q of eP){ if(q.id!==p.id && dist(q,pP)<dist(p,pP)){behindAlly=true;break;} }
    if(!behindAlly && eP.length>1)v-=25; // 前衛より前に出ていたら減点
  }
  // 巫女・聖職者・軍師・調教師など攻撃0の後衛は、無闇に前へ出ない（役割ロジックで概ね担保済み）

  // === 忍者の透明化：透明中は被弾無効で安全に敵陣へ切り込める貴重な先手駒 ===
  for(const p of eP.filter(x=>x.t==="ninja")){
    if(p.invis){
      // 透明忍者は敵に近いほど価値大（先手の起点／どこにいるか分からない牽制）
      const dmin=dist(p,pP);
      v+=20;                          // 透明化そのものが安全な前進手段
      v+=(6-Math.min(6,dmin))*8;      // 敵陣に切り込んでいるほど加点
      // 透明忍者の隣接に敵がいれば、次に踏み込まれた敵へ3ダメージの奇襲が狙える
      for(const f of pP){ if(Math.abs(p.r-f.r)+Math.abs(p.c-f.c)===1)v+=14; }
    }
  }
  // === 聖職者の祈祷余地：味方が削れているほど「全体+0.5回復」の価値が高い ===
  // （祈祷は探索では直接展開しないが、削れた味方が多い局面で聖職者を働かせたいので軽く誘導）
  for(const p of eP.filter(x=>x.t==="seishoku"&&!x.prayUsed)){
    let hurt=0;
    for(const a of eP){ if(a.id!==p.id && a.hp<3)hurt+=(3-a.hp); }
    if(hurt>0)v+=Math.min(20,hurt*6);  // 削れた味方が多いほど、祈祷の出番が近い＝聖職者を活かす
  }


  // 瀕死の相手は仕留めやすい→加点／自軍の瀕死は減点
  for(const p of pP)if(p.hp<=1)v+=60;
  for(const p of eP)if(p.hp<=1)v-=60;

  // === 討ち取り主導：低HPの敵「主力」を先手で仕留められる位置へ攻撃駒を寄せる ===
  // 被弾を恐れて逃げ回るより、確実に討てる相手を積極的に狙う（＝先手を取って勝ちに行く）。
  // 獣(kemono)は勝ち点にならないので対象外（＝獣ではなく倒せる主力を狙う）。
  const killTargets=pP.filter(f=>f.t!=="kemono" && f.hp<=1.5);
  if(killTargets.length){
    for(const e of eP){
      if(SS.noNormal.has(e.t))continue;         // 通常攻撃できる駒のみ
      for(const f of killTargets){
        const dmg=ssAtk(e,"melee",f);
        if(!ssKillable(f,dmg))continue;          // 一撃で討てる相手だけ（不死鳥の復活が残っていれば対象外）
        const d=Math.abs(e.r-f.r)+Math.abs(e.c-f.c);
        if(ssHits(e,f))v+=110;                    // 既に攻撃範囲＝この手番で討てる（最優先）
        else if(d<=(e.maxAp||1)+1) v+=55;         // 1手で討ち取り圏に入れる
        else           v+=Math.max(0,(6-d))*10;   // 近いほど寄せる価値
      }
    }
  }

  // === 追撃：近接強駒（剣士・戦士・騎馬・槍兵・吸血鬼）は逃げる敵を深追いして仕留める ===
  // 接敵した相手が逃げても、行動力差が無ければ追いつける。強駒ほど積極的に距離を詰める。
  const chasers=eP.filter(e=>["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(e.t));
  for(const e of chasers){
    // 最も近い敵主力（獣以外）への距離を詰めるほど加点
    let md=99, target=null;
    for(const f of pP){
      if(f.t==="kemono")continue;
      const d=Math.abs(e.r-f.r)+Math.abs(e.c-f.c);
      if(d<md){md=d;target=f;}
    }
    if(target){
      // 近いほど良い（追撃圧）。隣接なら攻撃できる好位置。
      if(md===1)      v+=28;
      else if(md===2) v+=16;
      else            v+=Math.max(0,(6-md))*4;
      // 相手が削れているほど深追いの価値が高い（あと一押しで討てる）
      if(target.hp<=1.5)v+=(2-Math.min(2,md))*20;
    }
  }

  // === 相性：後手でも殴り勝てるプレイヤー駒の隣に、脆いE駒を置かない ===
  for(const cs of pP.filter(x=>SS_COUNTER_STRONG.has(x.t)||(x.t==="yusha"&&x.heroBoost))){
    for(const e of eP){
      if(Math.abs(e.r-cs.r)+Math.abs(e.c-cs.c)===1){
        // 相手の反撃想定ダメージ
        const back=ssAtk(cs,"melee");
        if(e.hp-back<=0){
          // 覚醒勇者(攻撃3)は全駒を一撃で葬るので特に強く忌避
          v-=((cs.t==="yusha"&&cs.heroBoost)?150:90)*defMul;
        }
      }
    }
  }
  // 覚醒勇者の間合い（移動＋攻撃で届く範囲）にE駒を置かない：脅威マップにも反映済みだが追加で強調
  for(const y of pP.filter(x=>x.t==="yusha"&&x.heroBoost)){
    for(const e of eP){
      const man=Math.abs(e.r-y.r)+Math.abs(e.c-y.c);
      if(man<=2)v-=(3-man)*22*defMul; // 覚醒勇者に近いほど危険（次手番で3ダメージ圏内）
    }
  }

  // === 罠：踏むと1ダメージ＋次ターン行動力-1。これは「バトルの先手を奪われる」ことと同義で、
  //        このゲームでは先手を取られる＝非常に不利。罠は徹底的に回避する。===
  // AIは罠の正確な位置を知らず、罠師の位置から推定した「設置確率マップ」で警戒する。
  // 確率が高いマスほど強く避け、18%超のマスは最大限に警戒する（どうしても必要な時だけ通る）。
  if(st.trapProb&&st.trapProb.length){
    for(const e of eP){
      for(const tp of st.trapProb){
        const prob=tp.prob||0;
        if(e.r===tp.r&&e.c===tp.c){
          // 罠を踏む実害＝先手を奪われる＋1ダメージ。確率に応じて忌避するが、
          // 得点（撃破=5000）を妨げるほど過大にはしない。踏み抜かなければ無害なので。
          if(prob>=0.18) v-= 90 + prob*220;    // 高確率マスは避けたいが、得点機会があれば踏んでよい
          else           v-= prob*240;
          if(e.hp<=1)    v-= prob*180;          // 瀕死なら踏むと落ちる恐れ＝やや強め
        }else{
          const man=Math.abs(e.r-tp.r)+Math.abs(e.c-tp.c);
          if(man===1) v-= prob*60;
          else if(man===2) v-= prob*20;
        }
      }
    }
  }
  // 罠の通過：探索中にCPUの駒が「罠がありそうなマス」を通り抜けた危険度の累計
  if(st.trapPen) v-=st.trapPen;
  // 潜在的な罠ゾーン：罠師が次の手番に罠を置けるのは「今いるマスの周囲8マス」だけ。
  // その外側は安全なので、罠師の隣（次に動く時に踏みうる）だけを軽く警戒する。
  for(const trapper of pP.filter(x=>x.t==="wanashi")){
    for(const e of eP){
      const cheb=Math.max(Math.abs(e.r-trapper.r),Math.abs(e.c-trapper.c));
      if(cheb===1)v-= e.hp<=1?20:10;
      else if(cheb===2)v-= e.hp<=1?8:4;
    }
  }
  // CPUの罠：相手の駒が通りそうな位置（相手の駒の近く）にあるほど価値がある
  if(st.eTraps&&st.eTraps.length){
    for(const t of st.eTraps){
      for(const f of pP){
        const man=Math.abs(f.r-t.r)+Math.abs(f.c-t.c);
        if(man===1)v+=22; else if(man===2)v+=10;
      }
    }
  }
  // 次の手番に行動力-1を受ける駒（罠・術士）：動きが鈍る
  // 行動力1の駒は-1で完全に動けなくなる（弓兵・狙撃手は射撃も不可）ので価値が大きい
  for(const p of st.ps){
    if(!(p.cut||p.cutNext))continue;
    let w=(p.maxAp||1)<=1?40:25;
    if(p.t==="majo")w+=40;                 // 魔女の入替を止める
    if(p.t==="miko")w+=40;                 // 巫女の神楽（行動力+1）を止める
    if(p.o==="P")v+=w; else v-=w;
  }

  // === 透明化した忍者：正確な位置は不明。予測マップ(ninjaProb)で潜伏を警戒する。 ===
  // 自分から忍者のマスに踏み込まなければ何も起きないので、潜伏確率の高いマスへの
  // 踏み込みを、確率に応じて避ける（罠と同様の考え方）。
  if(st.ninjaProb&&st.ninjaProb.length){
    for(const e of eP){
      for(const np of st.ninjaProb){
        const prob=np.prob||0;
        if(e.r===np.r&&e.c===np.c){
          // 潜伏確率の高いマスに重なる＝3ダメージ被弾の恐れ。確率に応じて強く避ける。
          v-= prob*260;
          if(e.hp<=1.5)v-= prob*160; // 瀕死なら踏むと落ちる恐れ
        }
        // 隣に潜んでいそうでも、透明中の忍者は攻撃できない。1マス離れても忍者は透明のまま
        // 1マスずつ追ってこられるので、離れること自体に意味はない（隣接の減点はしない）。
      }
    }
  }



  // === 流星群（探索の末端でまだ着弾していないもの）===
  // 着弾マスは1つだけ選ばれ、そこに居る駒は即撃破。着弾までに相手が逃がせるのは1手番に1体だけ。
  // 着弾候補に立っている駒を価値の高い順に逃がし、逃がしきれない最も価値の高い駒が狙われるとして評価する。
  if(st.meteors&&st.meteors.length){
    for(const m of st.meteors){
      const foeSide=m.owner==="P"?"E":"P";
      const sign=m.owner==="E"?1:-1;
      v+=sign*(120+(m.hp||3)*80);   // 盤外にいる隕石本体の駒の価値（盤上の駒と同様に数える）
      const onCells=st.ps.filter(x=>x.o===foeSide&&m.cells.some(c=>c.r===x.r&&c.c===x.c))
        .map(x=>4000+(SS_PIECE_WORTH[x.t]||20)*4).sort((a,b)=>b-a);
      if(!onCells.length)continue;
      let moves; // 着弾までに相手が指せる手番数
      if(m.fuse>=1) moves=2; else moves=(st.side===m.owner)?0:1;
      // CPUの流星群：神の超越で連続手番なら相手は逃げられない。超能力者・宇宙人・魔女・軍師がいれば
      // 着弾の手番に相手の駒を候補マスへ動かせる（逃がせる数が1つ減るのと同じ）
      if(m.owner==="E"){
        if((st.eExtra||0)>0) moves=0;
        else if(st.ps.some(q=>q.o==="E"&&((q.t==="esper")||((q.t==="uchujin"||q.t==="majo"||q.t==="gunshi")&&q.hp>0.5)))) moves=Math.max(0,moves-1);
      }
      const loss=onCells[moves]||(moves<onCells.length?onCells[moves]:0);
      const pressure=moves>0?Math.min(onCells.length,moves)*30:0;  // 逃げるために手番を使わされる
      if(m.owner==="P") v-=loss+pressure; else v+=(loss+pressure)*0.9;
    }
  }
  // === 爆弾（設置済み）：爆発までに各陣営が逃がせる駒は「1手番に1体」だけ ===
  // 探索内で爆発そのものを再現しているので、ここでは「探索の末端でまだ爆発していない爆弾」を評価する。
  // 爆発までの手番数から、各陣営が逃がせる駒数を求め、逃がしきれない駒は確定被弾として扱う。
  if(st.bombs&&st.bombs.length){
    for(const b of st.bombs){
      for(const side of ["E","P"]){
        const inBlast=st.ps.filter(p=>p.o===side&&Math.max(Math.abs(p.r-b.r),Math.abs(p.c-b.c))<=1);
        if(!inBlast.length)continue;
        let moves;                                   // 爆発までにこの陣営が指せる手番数
        if(b.fuse>=1) moves=2;                       // まだ余裕がある（設置直後）
        else if(b.owner===st.side) moves=(side===st.side)?1:0; // この手番の終わりに爆発
        else moves=1;                                // 相手の手番の終わりに爆発：各陣営1手
        const loss=ssBlastLoss(st,b.r,b.c,inBlast,moves);
        if(side==="E") v-=loss; else v+=loss*0.9;    // 相手の駒が巻き込まれるのは好都合
      }
    }
  }

  // === 爆弾魔（まだ置かれていない爆弾）への警戒 ===
  // 相手の爆弾魔が次の手番で隣接マスに爆弾を置くと、こちらは爆発までに1体しか逃がせない。
  // 1つの爆風(3×3)に2体以上が入る配置は、逃がせない駒が確定で被弾するため大きく減点する。
  for(const bm of pP.filter(x=>x.t==="bakudan")){
    let worst=0;
    for(const [dr,dc] of ORTHO){
      const br=bm.r+dr, bc=bm.c+dc;
      if(br<0||br>5||bc<0||bc>5)continue;
      if(st.ps.some(p=>p.r===br&&p.c===bc))continue;
      if(st.bombs&&st.bombs.some(x=>x.r===br&&x.c===bc))continue;
      const hitE=eP.filter(e=>Math.max(Math.abs(e.r-br),Math.abs(e.c-bc))<=1);
      if(!hitE.length)continue;
      // 相手の番なら：置かれた後こちらは1手だけ。こちらの番なら：今の1手＋置かれた後の1手
      const lossE=ssBlastLoss(st,br,bc,hitE,st.side==="P"?1:2);
      const hitP=pP.filter(p=>Math.max(Math.abs(p.r-br),Math.abs(p.c-bc))<=1);
      const lossP=hitP.length?ssBlastLoss(st,br,bc,hitP,1):0; // 自軍を巻き込む位置には置きにくい
      // 2体以上が同じ爆風に入る＝1体しか逃がせず確定で被弾する形。形そのものを大きく嫌う
      const cluster=hitE.filter(e=>e.t!=="kemono").length;
      const val=lossE-lossP*0.6 + (cluster>=2 ? 300*(cluster-1) : 0);
      if(val>worst)worst=val;
    }
    if(worst>0) v-= worst*(st.side==="P"?1:0.35);
  }

  // === 相手が魔女を盤面に持つ場合の総合対策 ===
  // 魔女は「味方同士 or 敵同士の位置を入れ替える」。入替直後、入れ替わった相手駒は
  // 基本的に行動力不足で動けず“再配置されるだけ”だが、これにより相手は容易に逃げ／追撃でき、
  // こちらの瀕死駒は撤退が難しくなる。対策の最低条件は「必ず先手を取る」こと。
  if(pP.some(p=>p.t==="majo")){
    const pAtk=pP.filter(x=>["kenshi","senshi","kiba","souhei","kyuketsuki","ninja","sogeki","kyuhei"].includes(x.t)||(x.t==="yusha"&&x.heroBoost));
    let worstAtk=0;for(const a of pAtk)worstAtk=Math.max(worstAtk,ssAtk(a,"melee"));
    // 入替先候補＝魔女以外のプレイヤー駒の位置（そこへ相手アタッカーが飛んできうる）
    const anchors=pP.filter(a=>a.t!=="majo");

    for(const e of eP){
      // (1) どの位置に何が来ても対処できる備え：
      //     アタッカーが入替でe隣接に来ると先手を奪われる。特に瀕死ほど致命的。
      let adjAnchor=false;
      for(const anchor of anchors){
        if(Math.abs(e.r-anchor.r)+Math.abs(e.c-anchor.c)===1){adjAnchor=true;break;}
      }
      if(adjAnchor && pAtk.length){
        if(e.hp-worstAtk<=0) v-=70;   // 入替→即撃破されうる配置は強く避ける
        else                 v-=18;   // 先手を取られる不利
      }

      // (2) 瀕死のE駒は「逃がせなくなる」。魔女がいる間は前線／危険域に置かない。
      //     相手は入替で追ってこられるので、脆い駒ほど後方の安全地帯へ。
      if(e.hp<=1.5){
        const frontExposure=Math.max(0,(4-dist(e,pP))); // プレイヤー駒に近いほど危険
        v-=frontExposure*22;
        if(e.hp<=1)v-=frontExposure*14; // HP1は特に致命的
      }
    }

    // (3) 先手を取るための布石。各対策の有効度に応じて加点する。
    //  ・術士：相手の魔女の行動力を奪えば「そもそも入れ替えさせない」＝最有力の対策。
    //  ・悪霊：効果を受けていない駒は攻撃してくるので部分的（60点相当）。
    //  ・巫女：どの駒でも行動力2にして距離を詰められるが、巫女自身が前線に晒される（60点相当）。
    //  ・魔女：入れ替えを入れ替えで戻せる（相打ち）ほか、入替→通常攻撃の順を活かして
    //         火力の高い駒（剣士・低HP戦士・覚醒勇者・薬師・吸血鬼）を前線へ出撃させられる。
    const eJutsu=eP.find(p=>p.t==="jutsushi");
    const eWitch=pP.find(p=>p.t==="majo");
    if(eJutsu){
      v+=40; // 魔女封じの最有力手段
      // 術士が魔女に近い（次ターン減速が届く）ほど、入替そのものを止められる
      if(eWitch){
        const d=Math.abs(eJutsu.r-eWitch.r)+Math.abs(eJutsu.c-eWitch.c);
        if(d<=3)v+=(4-d)*10; // 魔女を射程に捉えているほど高評価
      }
    }
    if(eP.some(p=>p.t==="akuryo"))v+=16; // 60点相当：1体しか封じられない
    if(eP.some(p=>p.t==="miko"))  v+=16; // 60点相当：巫女自身が前線に出るリスクあり
    if(eP.some(p=>p.t==="majo"))  v+=22; // 入替を入替で相殺、かつ火力駒の出撃にも使える
  }

  // === 超能力者の周囲：押し出しで隊形を崩される。近接する脆いE駒を軽く警戒 ===
  for(const es of pP.filter(x=>x.t==="esper")){
    for(const e of eP){
      const man=Math.abs(e.r-es.r)+Math.abs(e.c-es.c);
      if(man<=2)v-=(3-man)*8;
    }
  }

  // === プレイヤーの妨害駒（術士・悪霊・呪詛師）への警戒 ===
  const pJutsu=pP.some(p=>p.t==="jutsushi");
  const pAkuryo=pP.some(p=>p.t==="akuryo");
  const pJuso=pP.some(p=>p.t==="jusoshi");
  if(pJutsu){
    // 相手の術士は次の手番にこちらの1体を減速できる。危険なマスにいて、
    // 減速されると安全なマスへ逃げきれない駒は、追い詰められる恐れがある。
    let worstJ=0;
    for(const p of eP){
      if(p.cut)continue;
      const dg=danger[p.r+","+p.c]||0;
      if(dg<=0)continue;
      const slowed={...p,cut:true};
      const canFlee=ssReach(st,slowed).some(d=>!(danger[d.r+","+d.c]>0));
      if(!canFlee){ const pen=dg>=p.hp?120:35; if(pen>worstJ)worstJ=pen; }
    }
    v-=worstJ;                         // 減速できるのは1体だけ＝最も痛い1体分
  }
  if(pAkuryo){
    for(const p of eP){
      if(!SS.noNormal.has(p.t)){
        const exposure=Math.max(0,(3-dist(p,pP)));
        v-=exposure*8; // 攻撃封じ対策：密着しすぎない
      }
    }
  }
  if(pJuso){
    // 呪詛師の全体-0.5は瀕死のE駒に致命的。瀕死駒が多いほど警戒
    let frail=0;for(const p of eP)if(p.hp<=1)frail++;
    v-=frail*35;
  }

  // === 軍師・巫女：相手の手数・機動が増える前提でE前衛の突出をやや抑制 ===
  if(pP.some(p=>p.t==="gunshi"||p.t==="miko")){
    for(const p of eP){
      const exposure=Math.max(0,(3-dist(p,pP)));
      v-=exposure*6;
    }
  }
  return v;
}

/* negamax + alpha-beta。時間制限・ノード上限つき */
let ssNodes=0, ssDeadline=0, ssAbort=false;
let ssNodeCap=2600000;
const SS_NODE_CAP_NORMAL=2600000;
const SS_NODE_CAP_STRONG=Number.MAX_SAFE_INTEGER; // つよいモードはノード上限を設けず、時間の許す限り深く読む
/* ===== 置換表：手順が違っても同じ局面になったら、読んだ結果を使い回す =====
   局面のキー → {d:読んだ深さ, v:値, f:0正確/1下限/2上限, b:最善だった子の並び順} */
/* 考える時間：相手(P)が1手番に打てる手の数で延ばす（騎馬・巫女などで手が増えると、同じ時間では浅くしか読めないため）。
   普段の局面（約12通り以下）は基本の時間、約36通り以上で上限の時間 */
let SS_TIME_FACTOR=0, SS_TIME_SCALE=1, SS_P_BRANCH=0;
function aiUpdateTimeFactor(){
  try{
    const st=ssFromGame("E"); st.side="P";
    SS_P_BRANCH=ssGenerate(st).length;
  }catch(e){ SS_P_BRANCH=0; }
  SS_TIME_FACTOR=Math.max(0,Math.min(1,(SS_P_BRANCH-12)/24));
}
function ssBudget(base,max){ return Math.round((base+(max-base)*SS_TIME_FACTOR)*SS_TIME_SCALE); }
let SS_TT=new Map();
const SS_TT_MAX=300000;
function ssKey(st){
  let k=st.side+st.kP+st.kE+"|"+(st.pPend||0)+(st.pExtra||0)+(st.pLock?1:0)+(st.ePend||0)+(st.eExtra||0)+(st.eLock?1:0)+"|"+Math.round((st.trapPen||0)*100)+"|";
  const ps=st.ps.slice().sort((a,b)=>a.id-b.id);
  for(const p of ps){
    k+=p.id+p.t+p.o+p.r+p.c+":"+p.hp+(p.cut?"c":"")+(p.cutNext?"n":"")+(p.noAtk?"a":"")+(p.henge?"h":"")+(p.healUsed?"u":"")+(p.prayUsed?"y":"")+(p.prayCnt?("q"+p.prayCnt):"")
      +(p.futoUsed?"f":"")+(p.heroBoost?"B":"")+(p.heroP?("P"+p.heroP.toFixed(2)):"")+(p.invis?"i":"")+(p.phoenix?"x":"")+(p.block?("b"+p.block.r+p.block.c):"")
      +"m"+p.maxAp+(p.esperMode==="diag"?"d":"")+(p.beastOf!=null?("o"+p.beastOf):"")+(p.maou!=null?("w"+p.maou):"")+";";
  }
  if(st.bombs&&st.bombs.length) k+="B"+st.bombs.map(b=>b.owner+b.r+b.c+b.fuse).sort().join("");
  if(st.eTraps&&st.eTraps.length) k+="T"+st.eTraps.map(t=>""+t.r+t.c).sort().join("");
  if(st.territories&&st.territories.length) k+="R"+st.territories.map(t=>t.owner+t.r+t.c).sort().join("");
  if(st.meteors&&st.meteors.length) k+="M"+st.meteors.map(m=>m.id+"."+m.fuse+"."+m.cells.length).join(",");
  if(st.trapProb) k+="p"+st.trapProb.length;
  return k;
}
/* 決着がつく手の追加読み（静止探索）：読みの最後の局面で、手番側が相手の駒を討ち取れるなら、
   その手（討ち取る手）だけをもう少し読む。「4手先で前に出たら5手目で取られていた」という見落としを防ぐ */
const SS_QDEPTH=2;
function ssCanKillSoon(st){
  // 手番側の駒が、今いる場所から1手番で討ち取れる相手がいるか（大まかな判定）
  const side=st.side;
  if(side==="P"){
    const d=ssPlayerThreat(st);
    for(const e of st.ps){ if(e.o!=="E"||e.t==="kemono"||e.invis)continue; const dm=d[e.r+","+e.c]||0; if(dm>0&&ssKillable(e,dm))return true; }
    return false;
  }
  const foes=st.ps.filter(f=>f.o==="P"&&f.t!=="kemono"&&!f.invis&&!f.guess);
  if(!foes.length)return false;
  const minHp=Math.min(...foes.map(f=>f.hp));
  if(minHp>3)return false;
  for(const q of st.ps){
    if(q.o!=="E"||q.t==="kemono")continue;
    const spots=ssReach(st,q); spots.push({r:q.r,c:q.c,apLeft:(q.maxAp||1)-(q.cut?1:0)});
    for(const d of spots){
      const from={...q,r:d.r,c:d.c,charged:!!d.charge};
      for(const f of foes){
        if(!SS.noNormal.has(q.t)&&!q.noAtk&&ssHits(from,f)&&ssKillable(f,ssAtk(from,"melee",f)))return true;
        if(SS.ranged.has(q.t)&&d.apLeft>=1&&ssRangedCells(from,d.r,d.c).some(([r,c])=>r===f.r&&c===f.c)&&ssKillable(f,ssAtk(from,"ranged",f)*(d.apLeft>=2?2:1)))return true;
      }
    }
  }
  return false;
}
function ssQuiesce(st,qd,alpha,beta){
  const stand=st._ev!==undefined?st._ev:ssEval(st);
  if(qd<=0||ssAbort||ssTerminal(st))return stand;
  if(!ssCanKillSoon(st))return stand;
  // 手番側は「討ち取らない（今の評価のまま）」も選べる＝stand pat
  if(st.side==="E"){ if(stand>=beta)return stand; if(stand>alpha)alpha=stand; }
  else { if(stand<=alpha)return stand; if(stand<beta)beta=stand; }
  if((++ssNodes&255)===0){ if(ssNodes>ssNodeCap||performance.now()>ssDeadline){ssAbort=true;return stand;} }
  const kills0=st.side==="E"?st.kE:st.kP;
  const caps=ssGenerate(st).filter(ch=>(st.side==="E"?ch.kE:ch.kP)>kills0);
  if(!caps.length)return stand;
  let best=stand;
  for(const ch of caps){
    let v;
    if(ssTerminal(ch)){ const e=ssEval(ch); v=e>0?e+qd*1000:e-qd*1000; }
    else v=ssQuiesce(ch,qd-1,alpha,beta);
    if(st.side==="E"){ if(v>best)best=v; if(best>alpha)alpha=best; }
    else { if(v<best)best=v; if(best<beta)beta=best; }
    if(alpha>=beta||ssAbort)break;
  }
  return best;
}
function ssSearch(st,depth,alpha,beta){
  if(ssAbort)return ssEval(st);
  if(ssTerminal(st)){
    // 勝ちは早いほど、負けは遅いほど良い（残り深さで差をつける）
    const v=ssEval(st);
    return v>0 ? v+depth*1000 : v-depth*1000;
  }
  if(depth<=0){
    return ssQuiesce(st,SS_QDEPTH,alpha,beta);
  }
  if((++ssNodes&255)===0){
    if(ssNodes>ssNodeCap||performance.now()>ssDeadline){ssAbort=true;return ssEval(st);}
  }
  // 置換表：同じ局面を同じ深さ以上で読んでいれば、その結果を使う
  const key=ssKey(st);
  const e=SS_TT.get(key);
  const a0=alpha,b0=beta;
  if(e&&e.d>=depth){
    if(e.f===0)return e.v;
    if(e.f===1&&e.v>alpha)alpha=e.v;
    else if(e.f===2&&e.v<beta)beta=e.v;
    if(alpha>=beta)return e.v;
  }
  let children=ssGenerate(st);
  let movedB=0;
  // ムーブオーダリング＆幅制限（深いほど狭く）。評価値は子ごとに1回だけ計算して使い回す
  const width=depth>=6?10:depth>=3?12:16;
  if(children.length>1){
    for(const ch of children) if(ch._ev===undefined) ch._ev=ssEval(ch);
    children.sort((a,b)=> (st.side==="E"? b._ev-a._ev : a._ev-b._ev) );
    // 前回この局面で最善だった手を最初に読む（枝刈りが効きやすくなる）
    if(e&&e.b>0&&e.b<children.length){ const bc=children.splice(e.b,1)[0]; children.unshift(bc); movedB=e.b; }
    if(children.length>width){
      // 手が多い局面では幅を広げる（最大24）。切り捨てる側でも、駒を倒す手は必ず読む
      let w=width;
      if(children.length>20) w=Math.max(width,Math.min(24,Math.ceil(children.length*0.6)));
      const kept=children.slice(0,w);
      const k0=st.side==="E"?st.kE:st.kP;
      for(let i=w;i<children.length;i++){ const ch=children[i]; if((st.side==="E"?ch.kE:ch.kP)>k0)kept.push(ch); }
      children=kept;
    }
  }
  let best, bestIdx=0;
  if(st.side==="E"){
    best=-Infinity;
    for(let i=0;i<children.length;i++){
      const v=ssSearch(children[i],depth-1,alpha,beta);
      if(v>best){best=v;bestIdx=i;}
      if(best>alpha)alpha=best;
      if(alpha>=beta)break;
      if(ssAbort)break;
    }
  }else{
    best=Infinity;
    for(let i=0;i<children.length;i++){
      const v=ssSearch(children[i],depth-1,alpha,beta);
      if(v<best){best=v;bestIdx=i;}
      if(best<beta)beta=best;
      if(alpha>=beta)break;
      if(ssAbort)break;
    }
  }
  if(!ssAbort && children.length){
    // 並び順の番号は「評価順に並べた後」のもの。最善手を先頭へ移していた場合は元の番号に戻す
    let origIdx=bestIdx;
    if(movedB>0){ if(bestIdx===0)origIdx=movedB; else if(bestIdx<=movedB)origIdx=bestIdx-1; }
    const f = best<=a0 ? 2 : (best>=b0 ? 1 : 0);
    if(SS_TT.size>SS_TT_MAX)SS_TT.clear();
    SS_TT.set(key,{d:depth,v:best,f,b:origIdx});
  }
  return best;
}
/* 最善のE手番を選ぶ。反復深化で目標プライまで、時間予算内で深掘り */

let aiMoveHistory=[]; // 直近のAI手のシグネチャ（新しいものほど後ろ）
const AI_HIST_MAX=12;
function aiMoveSig(plan){
  if(!plan)return "none";

function aiSigFromExec(plan){
  // aiExecutePlan形式（path配列）からシグネチャを作る
  if(!plan)return "none";
  const dest=(plan.path&&plan.path.length)?plan.path[plan.path.length-1]:null;

  const dr=dest?dest[0]:(p?p.r:"?"), dc=dest?dest[1]:(p?p.c:"?");

    // 千日手ペナルティ：同一行動が直近で3回以上出ていたら、その超過回数ぶん減点
    const rep=aiRepeatCount(aiMoveSig(plan));
    // 同じ手の繰り返し・往復は少しだけ嫌う（千日手のルールがあるので、粘る価値があれば繰り返してもよい）
    let repPenalty = rep>=2 ? (rep-1)*120 : 0;
    if(moved){
      const revisit=aiPosRevisitCount(mv.pieceId, mv.dr, mv.dc);
      if(revisit>=1)repPenalty += revisit*150;
    }
    // 千日手の最終手番：直近12手番に現れた盤面に戻る手は負けなので選ばない（ギリギリまで粘ってここで手を変える）
    let sennLose=false;
    if(sennChk){ sennLose = sennSeen(sennChk, ssSennSig(ns), 2); }
    // 術士で調教師を止める手：調教師は自分では戦わないので、獣がいるなら獣を止める方が良い。
    // ただし「止めた調教師に次の手番で確実に追いつき討ち取れる」ときだけは調教師を止めてよい
    if(mv.ability&&mv.ability.kind==="slow"){
      const tg=ns.ps.find(x=>x.id===mv.ability.targetId);
      if(tg&&tg.t==="chokyo"&&ns.ps.some(b=>b.t==="kemono"&&b.o===tg.o&&b.beastOf===tg.id)&&!ssTamerCatchable(ns,tg)) repPenalty+=260;
    }
    // 今すぐ討ち取れる手は、同じ評価の「後で討ち取る」手より優先（先送りすると逃げられる恐れ）
    // 今倒せる時は倒す方を少し優先（先送りすると逃げられる恐れ）。
    // ただし「あえて倒さず低HPのまま泳がせ、自分の駒が倒された後の出し直し（騎馬など）で2体まとめて倒しきる」
    // といった狙いは、読みの中で両者の出し直しを考えた上で選べるよう、優先は控えめにしている。
    repPenalty -= (ns.kE-root.kE)*150;
    // プレイヤーの流星群（次のプレイヤーの手番終了で着弾）の候補マスに、自分から駒を入れる手は避ける。
    // 読みの先で取り返せる見込みがあっても、確実に1体失う手は不確かな取り返しより重く見る
    if(root.meteors&&root.meteors.some(m=>m.owner==="P"&&(m.fuse||0)<=0)){
      const onM=st=>st.ps.filter(p=>p.o==="E"&&p.t!=="kemono"&&st.meteors&&st.meteors.some(m=>m.owner==="P"&&(m.fuse||0)<=0&&m.cells.some(c=>c.r===p.r&&c.c===p.c))).length;
      const nOn=onM(ns)-onM(root);
      if(nOn>0 && ns.kE<=root.kE) repPenalty+=nOn*700;
    }
    // 敗着の記憶：同一盤面なら候補から事実上除外、近い盤面でも強く避ける
    if(lessons.length) repPenalty += learnLessonPenalty(lessons, mv.pieceId, mv.dr, mv.dc, mv.ability?mv.ability.kind:"-", 50000, 1800,
      learnAbKey(learnAbDetail(mv.ability,id=>{const q=root.ps.find(x=>x.id===id);return q?[q.r,q.c]:null;}),false));
    return {state:ns, acts, plan, repPenalty, sennLose};
  });
  for(let i=applied.length-1;i>=0;i--) if(!applied[i]) applied.splice(i,1);
  if(!applied.length)return null;
  // 浅い評価の即時フォールバック（千日手ペナルティ込み）
  let fbBest=-Infinity, fbPlan=null;
  for(const a of applied){ if(!a.acts||a.sennLose)continue; const v=ssEval(a.state)-a.repPenalty+Math.random()*2; if(v>fbBest){fbBest=v;fbPlan=a.plan;} }
  if(!fbPlan){ for(const a of applied){const v=ssEval(a.state)-a.repPenalty;if(v>fbBest){fbBest=v;fbPlan=a.plan;}} }
  return {applied, fbPlan, fbBest};
}
/* 1段（1深さ）ぶんの探索を実行し、暫定最善手・順序・投了判定材料を更新 */
/* 根の手1つぶんを読む（同期版・時間分割版で共用）。時間切れなら false */
function ssRunDepthOne(applied, depth, idx, valById, S){
  const node=applied[idx];
  if(node.sennLose){ S.scored.push({idx,v:-2e7}); valById[idx]=-2e7; S.completedAny=true; return true; }
  // 根の手どうしでも枝刈り：今の最善より良くなりうるかだけを読む（同点の判定のため僅かに下げる）
  const lo = S.localBest===-Infinity ? -Infinity : S.localBest+(node.repPenalty||0)-1e-6;
  const raw=ssSearch(node.state, depth-1, lo, Infinity);
  if(ssAbort)return false;
  S.completedAny=true;
  // 千日手ペナルティを反映した実効スコアで手を選ぶ（ただし勝ち確定は割り引かない）
  const v = node.sennLose ? -2e7 : (raw>=1e6 ? raw : raw-(node.repPenalty||0));
  S.scored.push({idx,v});
  valById[idx]=v;
  // 同点なら先に読んだ手（前の深さで良かった順）を優先。ただし「何もしない手」は行動する手に置き換える
  const better = v>S.localBest+1e-9 || (Math.abs(v-S.localBest)<=1e-9 && node.acts && !S.localActs);
  if(S.localPlan===null || better){ if(node.acts || S.localPlan===null){ S.localBest=v; S.localPlan=node.plan; S.localActs=!!node.acts; } }
  return true;
}
function ssRunDepthFinish(order,S){
  let newOrder=order;
  if(S.completedAny){
    S.scored.sort((a,b)=>b.v-a.v);
    newOrder=S.scored.map(s=>s.idx).concat(order.filter(i=>!S.scored.find(s=>s.idx===i)));
  }
  return {completedAny:S.completedAny, localBest:S.localBest, localPlan:S.localPlan, newOrder, scored:S.scored};
}
/* 1段（1深さ）ぶんの探索を実行し、暫定最善手・順序・投了判定材料を更新 */
function ssRunDepth(applied, depth, order, valById){
  ssAbort=false; ssNodes=0;
  const S={localBest:-Infinity,localPlan:null,localActs:false,scored:[],completedAny:false};
  for(const idx of order){ if(!ssRunDepthOne(applied,depth,idx,valById,S))break; }
  return ssRunDepthFinish(order,S);
}
/* 時間分割版：根の手を少しずつ読み、合間に画面（考え中の顔）を更新できるようにする */
function ssRunDepthAsync(applied, depth, order, valById, done){
  ssAbort=false; ssNodes=0;
  const S={localBest:-Infinity,localPlan:null,localActs:false,scored:[],completedAny:false};
  let k=0;
  const run=()=>{
    const t=performance.now();
    while(k<order.length){
      if(!ssRunDepthOne(applied,depth,order[k],valById,S)){ done(ssRunDepthFinish(order,S)); return; }
      k++;
      if(k<order.length&&performance.now()-t>150){ aiThinkTick(); setTimeout(run,0); return; }
    }
    done(ssRunDepthFinish(order,S));
  };
  run();
}

function ssBestMove(maxDepth){
  ssNodeCap=SS_NODE_CAP_NORMAL;
  const prep=ssBestPrepare();
  if(!prep)return {resign:false, plan:null, allLose:false};
  const {applied, fbPlan}=prep;
  ssDeadline=performance.now()+ssBudget(6000,13000);
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  const valById={};
  for(let depth=2; depth<=maxDepth; depth++){
    const r=ssRunDepth(applied, depth, order, valById);
    order=r.newOrder;
    if(r.completedAny && r.localPlan){
      bestPlan=r.localPlan;
      if(r.localBest>=1e6)break;
    }
    if(performance.now()>ssDeadline)break;
  }
  const evaluated=Object.values(valById);
  const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
  return {resign:allLose, plan:bestPlan, allLose};
}
/* 非同期版：各深さの間で描画に譲る（スピナーを回し、UIをブロックしない） */
function ssBestMoveAsync(maxDepth, onDone){
  ssNodeCap=SS_NODE_CAP_NORMAL;
  const prep=ssBestPrepare();
  if(!prep){onDone({resign:false, plan:null, allLose:false});return;}
  const {applied, fbPlan}=prep;
  ssDeadline=performance.now()+ssBudget(6000,13000);
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  const valById={};
  let depth=2;
  aiThinkBegin(prep);
  const step=()=>{
    if(depth>maxDepth || performance.now()>ssDeadline){ finish(); return; }
    ssRunDepthAsync(applied, depth, order, valById, r=>{
      order=r.newOrder;
      if(r.completedAny && r.localPlan){
        bestPlan=r.localPlan;
        aiThinkDepth(r, depth, !ssAbort);
        if(r.localBest>=1e6){ finish(); return; }
      }
      if(ssAbort){ finish(); return; }
      depth++;
      setTimeout(step,0); // 描画に譲ってから次の深さへ
    });
  };
  const finish=()=>{
    const evaluated=Object.values(valById);
    const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
    onDone({resign:allLose, plan:bestPlan, allLose});
  };
  setTimeout(step,0);
}

/* 相手(P)が次の手番に、マス(r,c)の駒 target へ与えうる最大ダメージ。
   extra：行動力の上乗せ（巫女の神楽など）、staticOnly：攻撃役は動けない（念動などで手番を使う場合） */
function ssCellThreat(st,r,c,target,extra,staticOnly){
  let best=0;
  for(const p of st.ps){
    if(p.o!=="P"||p.dead||p.id===target.id)continue;
    const ranged=SS.ranged.has(p.t);
    if(SS.noNormal.has(p.t)&&!ranged)continue;
    const mover={...p,invis:false,maxAp:(p.maxAp||1)+extra};
    const dests=staticOnly?[{r:p.r,c:p.c,cost:0,apLeft:mover.maxAp-(p.cut?1:0)}]
      :[...ssReach(st,mover),{r:p.r,c:p.c,cost:0,apLeft:mover.maxAp-(p.cut?1:0)}];
    for(const d of dests){
      const from={...p,r:d.r,c:d.c,invis:false,charged:!!d.charge};
      if(!(target.block&&target.block.r===d.r&&target.block.c===d.c)&&ssNormalCells(from).some(([ar,ac])=>ar===r&&ac===c))
        best=Math.max(best,ssAtk(from,"melee",target));
      if(ranged&&d.apLeft>=1&&ssRangedCells(from,d.r,d.c).some(([ar,ac])=>ar===r&&ac===c))
        best=Math.max(best,d.apLeft>=2?2:1);
    }
  }
  return best;
}
/* 海賊が次の自分の手番まで生き残れるか。
   巫女（行動力+1）・軍師（2体行動）・神（超越で2連続の手番）と、
   超能力者（念動）・宇宙人（転移）で海賊自体を動かされる可能性も考える */
function ssKaizokuSurvives(st,kz){
  const pP=st.ps.filter(p=>p.o==="P"&&!p.dead);
  const miko=pP.some(p=>p.t==="miko"&&p.hp>0.5&&((p.maxAp||1)-(p.cut?1:0))>=1);
  const gun=pP.some(p=>p.t==="gunshi"&&p.hp>0.5&&((p.maxAp||1)-(p.cut?1:0))>=1);
  const extra=miko?1:0;
  let threat=ssCellThreat(st,kz.r,kz.c,kz,extra,false);
  // 海賊が動かされる先（念動：射程内なら周囲1マス、転移：上下1マス）
  const cells=[];
  const free=(r,c)=>r>=0&&r<6&&c>=0&&c<6&&!st.ps.some(q=>q.r===r&&q.c===c);
  for(const e of pP.filter(p=>p.t==="esper"&&((p.maxAp||1)-(p.cut?1:0))>=1)){
    const dr=kz.r-e.r, dc=kz.c-e.c;
    const inLine=(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))&&Math.max(Math.abs(dr),Math.abs(dc))<=2;
    if(inLine) for(const [a,b] of ALL8) if(free(kz.r+a,kz.c+b))cells.push([kz.r+a,kz.c+b]);
  }
  for(const u of pP.filter(p=>p.t==="uchujin"&&p.hp>0.5&&((p.maxAp||1)-(p.cut?1:0))>=1)){
    for(const a of [-1,1]) if(free(kz.r+a,kz.c))cells.push([kz.r+a,kz.c]);
  }
  for(const [r,c] of cells){
    // 動かすのに手番を使うので、他の駒は動けない（軍師・巫女がいれば動いて攻撃できる）
    const moved={...kz,r,c};
    threat=Math.max(threat,ssCellThreat(st,r,c,moved,extra,!(gun||miko)));
  }
  // 相手が超越の予約中なら、この後に2連続の手番が来る＝攻撃も2回
  if((st.pPend||0)>0||(st.pExtra||0)>0) threat*=2;
  return kz.hp-threat>0;
}
/* CPUの手番の通常攻撃を選ぶ（実際に指す手用）。
   海賊は「自分よりHPが高い相手（2ダメージ）」と「この手番で倒せる相手」の両方を狙える時、
   次の自分の手番まで生き残れるならHPの高い相手を、生き残れないなら倒せる相手を選ぶ */
function ssBestAttackPlanE(st){
  const list=[];
  for(const a of st.ps.filter(x=>x.o==="E"&&!SS.noNormal.has(x.t))){
    for(const [r,c] of ssNormalCells(a)){
      const t=st.ps.find(x=>x.r===r&&x.c===c&&x.o!=="E");
      if(!t||!ssTargetable(t,"E"))continue;
      if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
      const d=ssAtk(a,"melee",t);
      const kills=t.hp-d<=0&&!(t.t==="fushicho"&&!t.phoenix);
      let sc=(kills?1000:0)+d*200+(3-Math.max(0,t.hp-d))*40;
      if(t.t==="kemono")sc=sc*0.08-30;
      list.push({a,t,sc,kills,d});
    }
  }
  if(!list.length)return null;
  list.sort((x,y)=>y.sc-x.sc);
  let pick=list[0];
  if(pick.a.t==="kaizoku"&&pick.kills&&pick.t.t!=="kemono"){
    const alt=list.filter(x=>x.a.id===pick.a.id&&x.t.id!==pick.t.id&&!x.kills&&x.t.hp>pick.a.hp&&x.t.t!=="kemono").sort((x,y)=>y.t.hp-x.t.hp)[0];
    if(alt){
      const sim=ssClone(st);
      const a2=sim.ps.find(x=>x.id===alt.a.id), t2=sim.ps.find(x=>x.id===alt.t.id);
      ssDealDamage(sim,a2,t2,"melee"); ssRemoveDead(sim);
      if(ssKaizokuSurvives(sim,a2)) pick=alt;   // 生き残れるなら、HPの多い相手を削る
    }
  }
  const aid=pick.a.id,tid=pick.t.id;
  ssDealDamage(st,pick.a,pick.t,"melee");
  return {attackerId:aid,targetId:tid};
}
/* ベスト通常攻撃のプランを返す（state適用も行う） */
function ssBestAttackPlan(st,side){
  let best=null,bs=-1;
  for(const a of st.ps.filter(x=>x.o===side&&!SS.noNormal.has(x.t))){
    for(const [r,c] of ssNormalCells(a)){
      const t=st.ps.find(x=>x.r===r&&x.c===c&&x.o!==side);
      if(!t)continue;
      if(!ssTargetable(t,side))continue; // 透明忍者は攻撃不可
      if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
      const d=ssAtk(a,"melee",t);
      const kills=t.hp-d<=0&&!(t.t==="fushicho"&&!t.phoenix);
      let s=(kills?1000:0)+d*200+(3-Math.max(0,t.hp-d))*40;
      if(t.t==="kemono")s=s*0.08-30; // 獣は撃破価値が低い（即再召喚）→調教師本体を優先
      if(s>bs){bs=s;best={a,t};}
    }
  }
  if(best){
    const aid=best.a.id,tid=best.t.id;
    ssDealDamage(st,best.a,best.t,"melee");
    return {attackerId:aid,targetId:tid};
  }
  return null;
}

function aiMakePlan(){
  const threat=playerThreatMap();
  const foes=alive("P").filter(f=>!f.flags.invisible);
  const myList=alive("E");
  const cands=[];

  const baseSim=()=>G.pieces.filter(p=>!p.dead).map(p=>({
    id:p.id,type:p.type,owner:p.owner,r:p.r,c:p.c,hp:p.hp,
    block:p.flags.block,phoenix:p.flags.phoenix,noAttack:p.flags.noAttack,
    invisible:p.flags.invisible,heroBoost:p.flags.heroBoost
  }));

  function simAtkDamage(sp,kind){
    let d=1;
    if(sp.type==="kenshi"||sp.type==="souhei")d+=0.5;
    if(sp.type==="senshi"){if(sp.hp<=1)d+=2;else if(sp.hp<=2)d+=1;}
    if(sp.type==="yusha"&&sp.heroBoost&&kind==="melee")d=3;
    return d;
  }
  function simHit(sim,attacker,target,kind,events){
    if(target.invisible)return;
    if(target.block&&attacker&&attacker.r===target.block.r&&attacker.c===target.block.c)return;
    const d=simAtkDamage(attacker,kind);
    let eff=d;
    let killed=target.hp-d<=0;
    if(killed&&target.type==="fushicho"&&!target.phoenix){killed=false;target.hp=0.5;eff=d;}
    else target.hp=r2(target.hp-d);
    events.push({dmg:eff,killed,tHp:Math.max(0,target.hp),tType:target.type});
    if(killed)target.dead=true;
  }

  function evalPlan(mover,dest,apAfter,ability){
    const sim=baseSim();
    const sm=sim.find(x=>x.id===mover.id);
    sm.r=dest.r;sm.c=dest.c;
    const events=[];
    // ability
    if(ability&&ability.kind==="ranged"){
      const t=sim.find(x=>x.id===ability.targetId&&!x.dead);
      if(t)simHit(sim,sm,t,"ranged",events);
    }
    if(ability&&ability.kind==="curse"){
      sm.hp=r2(sm.hp-1.5);
      for(const t of sim.filter(x=>x.owner==="P"&&!x.dead&&!x.invisible)){
        let killed=t.hp-0.5<=0;
        if(killed&&t.type==="fushicho"&&!t.phoenix){killed=false;t.hp=0.5;}
        else t.hp=r2(t.hp-0.5);
        events.push({dmg:0.5,killed,tHp:Math.max(0,t.hp),tType:t.type});
        if(killed)t.dead=true;
      }
    }
    // best normal attack（駒1体で1回）
    let bestAtk=null,bestAtkScore=-1;
    for(const a of sim.filter(x=>x.owner==="E"&&!x.dead&&!x.noAttack&&!x.invisible)){
      if(PIECES[a.type].noNormal)continue;
      const dirs=a.type==="souhei"?DIAG:ORTHO;
      for(const [dr,dc] of dirs){
        const t=sim.find(x=>!x.dead&&x.owner==="P"&&!x.invisible&&x.r===a.r+dr&&x.c===a.c+dc);
        if(!t)continue;
        const d=simAtkDamage(a,"melee");
        let kills=t.hp-d<=0&&!(t.type==="fushicho"&&!t.phoenix);
        const s=(kills?900:0)+d*200+d*(3-Math.max(0,t.hp-d))*30;
        if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
        if(s>bestAtkScore){bestAtkScore=s;bestAtk={attackerId:a.id,targetId:t.id};}
      }
    }
    if(bestAtk){
      const a=sim.find(x=>x.id===bestAtk.attackerId);
      const t=sim.find(x=>x.id===bestAtk.targetId);
      if(a&&t&&!t.dead)simHit(sim,a,t,"melee",events);
    }
    // score
    let score=0,killsNow=G.kills.E;
    for(const e of events){
      if(e.killed&&e.tType!=="kemono"){
        killsNow++;score+=900;
        if(killsNow>=2)score+=100000;
      }else if(e.killed){score+=350;}
      else score+=e.dmg*230+e.dmg*(3-e.tHp)*45;
    }
    // 被脅威
    const risks=[];
    for(const m of sim.filter(x=>x.owner==="E"&&!x.dead)){
      const t=threat[m.r*6+m.c]||0;
      if(t<=0)continue;
      if(t>=m.hp)risks.push(820+(G.kills.P>=1?500:0));
      else risks.push(t*55);
    }
    risks.sort((a,b)=>b-a);
    if(killsNow<2){
      if(risks.length)score-=risks[0];
      for(let i=1;i<risks.length;i++)score-=risks[i]*0.3;
    }
    // 接近・位置
    for(const m of sim.filter(x=>x.owner==="E"&&!x.dead)){
      let md=99;
      for(const f of sim.filter(x=>x.owner==="P"&&!x.dead&&!x.invisible)){
        md=Math.min(md,Math.abs(m.r-f.r)+Math.abs(m.c-f.c));
      }
      if(md<99)score-=md*13;
    }
    score+=Math.random()*8;
    return {score,attack:bestAtk};
  }

  for(const p of myList){
    const reach=reachWithPaths(p);
    for(const key in reach){
      const [r,c]=key.split(",").map(Number);
      const info=reach[key];
      const apAfter=p.ap-info.cost;
      const tryC=(ability)=>{
        const ev=evalPlan(p,{r,c},apAfter,ability);
        cands.push({score:ev.score,pieceId:p.id,path:info.path,jump:info.jump,
                    ability,attack:ev.attack});
      };
      tryC(null);
      if((p.type==="kyuhei"||p.type==="sogeki")&&apAfter>=1){
        for(const [rr,cc] of rangedCellsFrom(p,r,c)){
          const t=foes.find(f=>f.r===rr&&f.c===cc);
          if(t)tryC({kind:"ranged",targetId:t.id});
        }
      }
      if(p.type==="jusoshi"&&p.hp>=1.5&&info.cost===0){
        tryC({kind:"curse"});
      }
    }
  }
  // 爆弾：爆風圏へ入る手／爆弾魔の設置圏で味方と固まる手を減点
  for(const c of cands){
    const p=byId(c.pieceId); if(!p)continue;
    const d=(c.path&&c.path.length)?c.path[c.path.length-1]:[p.r,p.c];
    c.score-=aiBombSpotPenalty(d[0],d[1],p.type,p.hp)*0.5;
    // 罠：移動経路と行き先の推定罠確率
    let miss=1; for(const [pr,pc] of (c.path||[])) miss*=1-trapProbAt(pr,pc);
    c.score-=(1-miss)*(p.hp<=1?400:200);
  }
  // 学習：過去に敗着となった手を減点
  const lessons=learnLessonsFor(ssFromGame("E"));
  if(lessons.length){
    for(const c of cands){
      const p=byId(c.pieceId); if(!p)continue;
      const d=(c.path&&c.path.length)?c.path[c.path.length-1]:[p.r,p.c];
      c.score-=learnLessonPenalty(lessons, c.pieceId, d[0], d[1], c.ability?c.ability.kind:"-", 5000, 400,
        learnAbKey(learnAbDetail(c.ability,id=>{const q=byId(id);return q&&!q.dead?[q.r,q.c]:null;}),false));
    }
  }
  // 千日手ペナルティ：直近で同一行動を繰り返している候補を減点（2回まではOK）
  for(const c of cands){
    if(c.score>=300) continue; // 撃破級の高評価手は割り引かない
    const rep=aiRepeatCount(aiSigFromExec(c));
    if(rep>=2)c.score-=(rep-1)*200;
  }
  cands.sort((a,b)=>b.score-a.score);
  if(cands.length===0)return null;
  // 行動必須ルール：移動も能力もない候補は、他に選択肢がない場合のみ許可
  const acting=cands.filter(c=>(c.path&&c.path.length>0)||c.ability);
  const pool=acting.length?acting:cands;
  // 難易度別：やさしいは上位からランダムでゆるい手、それ以外(フォールバック時)は最善手
  if(aiLevel!=="easy")return pool[0];
  // やさしい：上位の中からランダム
  const top=pool.filter(c=>c.score>=pool[0].score*0.8||pool.indexOf(c)<4);
  return top[Math.floor(Math.random()*Math.min(top.length,4))];
}

/* 保証フォールバック：どんな局面でも必ず「何かする」合法手を1つ返す。
   通常攻撃だけでも、無理なら1マス移動だけでも返し、パスを防ぐ。 */
function aiGuaranteedMove(){
  // ルール：必ずどれか1駒が「行動力を全て消費」する（通常攻撃だけ／中途半端な移動は不可）。
  // ① 行動力を使い切る移動を探す（移動距離＝その駒のAP）。ついでに通常攻撃も付ける。
  let anyMove=null;
  for(const p of alive("E")){
    if(p.ap<1)continue;
    const reach=reachWithPaths(p);
    for(const key in reach){
      if(key===p.r+","+p.c)continue;
      const info=reach[key];
      if(!info.path||info.path.length===0)continue;
      // 行動力を全消費する移動か（跳躍はAP2消費、通常移動はpath長=消費AP）
      const cost=info.jump?2:info.path.length;
      const full=(cost>=p.ap);
      const plan={pieceId:p.id, path:info.path, jump:!!info.jump, ability:null, attack:null};
      if(full)return plan;      // 全消費できる移動を最優先で採用
      if(!anyMove)anyMove=plan; // 部分消費でも一応キープ（後述の遠距離/能力より優先度低）
    }
  }
  // ② 行動力を使う能力：弓兵・狙撃手の遠距離（AP1全消費）
  for(const p of alive("E")){
    if(p.ap<1)continue;
    if(!(p.type==="kyuhei"||p.type==="sogeki"))continue;
    for(const [rr,cc] of rangedCellsFrom(p,p.r,p.c)){
      const t=visAt(rr,cc,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible)
        return {pieceId:p.id, path:[], jump:false, ability:{kind:"ranged",targetId:t.id}, attack:null};
    }
  }
  // ③ 全消費できる移動が無ければ、部分消費でも移動する（それでも行動力は消費する）
  if(anyMove)return anyMove;
  // 通常攻撃はAPを消費しないため「行動」にならない。移動も遠距離も無理なら手なし（null）を返す。
  return null;
}

/* 行動した駒にAPが残っていて、まだ移動できるなら使い切る（行動力全消費ルール）。
   残AP分だけ、最も安全な（プレイヤーの攻撃圏でない）マスへ動く。 */
function aiConsumeRemainingAP(pieceId){
  let guard=0;
  while(guard++<4){
    const p=byId(pieceId);
    if(!p||p.dead||p.ap<1)return;
    // 冒険者は1マスでも動いていれば、残APを捨てて通常攻撃へ移行してよい
    if(p.type==="boken" && p.ap<(p.maxAp||2)){ p.ap=0; return; }
    // 鷹は飛び越えたら、残りの行動力を捨てて攻撃へ移行してよい
    if(p.type==="taka" && p.flags.takaJumped){ p.ap=0; return; }
    const opts=stepOptions(p);
    const jopts=jumpOptions(p);
    if(opts.length===0 && jopts.length===0){ p.ap=0; return; } // これ以上動けない→待機扱いで残APを消費
    const threat=playerThreatMap();
    const trappers=alive("P").filter(f=>f.type==="wanashi");
    // 候補：通常移動（AP1）と跳躍（AP2）。安全なマスを優先
    let best=null, bestScore=-1e9;
    const evalCell=(r,c,cost)=>{
      const dmg=threat[r*6+c]||0;
      let s=-dmg*100;                 // 被弾しにくいマスを優先
      // 推定確率マップで罠を回避（18%超は決定的に嫌う）
      const tprob=trapProbAt(r,c);
      if(tprob>=0.18) s-= 350 + tprob*400;   // 最大警戒
      else if(tprob>0) s-= tprob*500;
      // 罠師の潜在罠ゾーン（周囲3マス）も避ける
      for(const tr of trappers){ const ch=Math.max(Math.abs(tr.r-r),Math.abs(tr.c-c)); if(ch===1)s-=15; else if(ch===2)s-=5; }
      // 透明忍者の潜伏予測マップ：踏み込むと3ダメージ。予測確率に応じて避ける。
      const nprob=ninjaProbAt(r,c);
      if(nprob>0) s-= nprob*260;
      // 相手に少し近づく（攻め圧）ボーナス
      let md=99;for(const f of alive("P"))if(!f.flags.invisible)md=Math.min(md,Math.abs(r-f.r)+Math.abs(c-f.c));
      s-=md*2;
      s+=Math.random()*3;
      return s;
    };
    for(const [r,c] of opts){ const s=evalCell(r,c,1); if(s>bestScore){bestScore=s;best={r,c,jump:false};} }
    for(const [r,c] of jopts){ const s=evalCell(r,c,p.type==="taka"?1:2)+5; if(s>bestScore){bestScore=s;best={r,c,jump:true};} }
    if(!best)return;
    const fr=p.r,fc=p.c;
    if(best.jump){
      if(!aiDoJump(p,best.r,best.c))return;
    }else{
      tryStep(p,best.r,best.c);
    }
    if(!p.dead)logMove(p,fr,fc);
  }
}
/* CPUの駒 q が、今いる場所で能力を1回使う（巫女の神楽で移動した後など）。行動力1を消費 */
function aiUseSkillNow(q,sk,plan){
  const adj4=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
  const k=sk.kind;
  if(k==="heal"||k==="poison"){
    if(q.flags.healUsed)return; const t=byId(sk.targetId); if(!t||t.dead||!adj4(q,t))return;
    q.ap--; q.flags.healUsed=true;
    if(k==="heal"&&t.owner==="E"){ healPiece(t,1); log(`敵の薬師が${pieceLabel(t)}を癒した`,"e"); sfx("heal"); }
    else if(k==="poison"&&t.owner==="P"&&!t.flags.invisible){ dealDamage(t,1,q,"poison"); log(`敵の薬師が${pieceLabel(t)}に毒を盛った`,"e"); sfx("hit"); }
  }else if(k==="summon"){
    if(alive("E").some(b=>b.type==="kemono"&&b.flags.beastOf===q.id))return;
    if(!inB(sk.sr,sk.sc)||visAt(sk.sr,sk.sc,"E")||wallAt(sk.sr,sk.sc)||Math.abs(sk.sr-q.r)+Math.abs(sk.sc-q.c)!==1)return;
    q.ap--; const b=makePiece("kemono","E",sk.sr,sk.sc); b.flags.beastOf=q.id; b.spawn=true; G.pieces.push(b);
    log("敵の調教師が獣を召喚した","e"); sfx("place");
    if(beastHitsHiddenNinja(b))return;
    if(plan&&plan.attack&&plan.attack.attackerId===SS_NEW_BEAST_ID)plan.attack.attackerId=b.id;
  }else if(k==="pray"){
    if(q.flags.prayUsed)return; q.ap--; prayCountUp(q);
    for(const t of alive("E"))if(t.id!==q.id)healPiece(t,0.5);
    log("敵の聖職者の祈り…敵軍全体のHPが0.5回復","e"); sfx("heal");
  }else if(k==="swap"){
    const a=byId(sk.aId), b=byId(sk.bId); if(!a||!b||a.dead||b.dead||a.owner!==b.owner)return;
    if((a.flags.invisible&&a.owner!=="E")||(b.flags.invisible&&b.owner!=="E"))return;
    q.ap--; q.hp=r2(q.hp-0.5);
    const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c;b.r=ar;b.c=ac;
    log(`敵の魔女の入替魔法！${PIECES[a.type].name}と${PIECES[b.type].name}が入れ替わった（魔女HP-0.5）`,"e"); sfx("swap");
    if(q.hp<=0)killPiece(q,null,"self");
  }else if(k==="psy"){
    const t=byId(sk.targetId); if(!t||t.dead||!inB(sk.tr,sk.tc)||at(sk.tr,sk.tc)||!esperTargets(q).includes(t))return;
    q.ap--; log(`敵の超能力者の念動！${pieceLabel(t)}を動かした`,"e");
    const fr=t.r,fc=t.c; enterSquare(t,sk.tr,sk.tc); sfx("move"); if(!t.dead)logMove(t,fr,fc);
  }else if(k==="warp"){
    if(q.hp<=0.5)return; q.ap--; q.hp=r2(q.hp-0.5);
    doWarp(sk); log(`敵の宇宙人が${warpText(sk)}転移させた（HP-0.5）`,"e"); sfx("teleport");
    if(q.hp<=0)killPiece(q,null,"self");
  }else if(k==="territory"){
    if(!inB(sk.tr,sk.tc)||visAt(sk.tr,sk.tc,"E")||wallAt(sk.tr,sk.tc)||territoryOwnerAt(sk.tr,sk.tc)==="P")return;
    if(Math.max(Math.abs(sk.tr-q.r),Math.abs(sk.tc-q.c))!==1)return;
    q.ap--; G.territories=(G.territories||[]).filter(t=>t.owner!=="E"); G.territories.push({r:sk.tr,c:sk.tc,owner:"E"});
    log("敵の領主が領地を宣言した（敵の駒しか入れない）","e"); sfx("place");
    territoryClearObjects(sk.tr,sk.tc,"E");
    territoryCatchHiddenNinja(sk.tr,sk.tc,"E",q);
  }else if(k==="bomb"){
    if(!inB(sk.tr,sk.tc)||visAt(sk.tr,sk.tc,"E")||territoryOwnerAt(sk.tr,sk.tc)!==null||G.bombs.some(b=>b.r===sk.tr&&b.c===sk.tc)||Math.abs(sk.tr-q.r)+Math.abs(sk.tc-q.c)!==1)return;
    q.ap--; G.bombs.push({owner:"E",r:sk.tr,c:sk.tc,fuse:1});
    log("敵の爆弾魔が爆弾を設置した（次の敵手番終了時に爆発）","e"); sfx("pick");
  }else if(k==="trap"){
    if(!inB(sk.tr,sk.tc)||visAt(sk.tr,sk.tc,"E")||territoryOwnerAt(sk.tr,sk.tc)!==null||G.traps.some(t=>t.r===sk.tr&&t.c===sk.tc&&t.owner==="E")||Math.max(Math.abs(sk.tr-q.r),Math.abs(sk.tc-q.c))!==1)return;
    q.ap--; if(springTrapOnHiddenNinja(sk.tr,sk.tc,"E"))return; const sid=trapSetterId(q);
    let mine=G.traps.filter(t=>t.setter===sid);
    while(mine.length>=2){const idx=G.traps.indexOf(mine[0]);if(idx>=0)G.traps.splice(idx,1);mine=G.traps.filter(t=>t.setter===sid);}
    G.traps.push({owner:"E",r:sk.tr,c:sk.tc,setter:sid});
    log("敵の罠師が罠を仕掛けた","e"); sfx("trap");
  }
}
/* 神楽を受けた駒tの最善の行き先を、探索用の評価関数で選ぶ（行動力+1後の状態で呼ぶ） */
function aiKaguraFollowup(t){
  const root=ssFromGame("E");
  const a=root.ps.find(x=>x.id===t.id); if(!a)return null;
  const mover={...a,maxAp:t.ap};
  const dests=ssReach(root,mover); dests.push({r:a.r,c:a.c,cost:0,apLeft:t.ap});
  let best=null,bv=-Infinity;
  for(const d of dests){
    const opts=[[]];
    if(SS.ranged.has(a.t)&&d.apLeft>=1){
      const tg=[];
      for(const [rr,cc] of ssRangedCells({...a,r:d.r,c:d.c},d.r,d.c)){
        const x=ssAt(root,rr,cc); if(x&&x.o==="P"&&!(x.block&&x.block.r===d.r&&x.block.c===d.c)&&ssTargetable(x,"E"))tg.push({tr:rr,tc:cc});
      }
      for(const x of tg)opts.push([x]);
      if(d.apLeft>=2)for(let i=0;i<tg.length;i++)for(let j=i;j<tg.length;j++)opts.push([tg[i],tg[j]]);
    }
    for(const shots of opts){
      const ns=ssClone(root);
      const na=ns.ps.find(x=>x.id===t.id); na.r=d.r; na.c=d.c;
      for(const sh of shots){ const x=ns.ps.find(q=>!q.dead&&q.r===sh.tr&&q.c===sh.tc&&q.o==="P"); if(x)ssDealDamage(ns,na,x,"ranged"); }
      ssBestAttackPlan(ns,"E"); ssRemoveDead(ns); ns.side="P";
      const v=ssEval(ns);
      if(v>bv){bv=v;best={tr:d.r,tc:d.c,shots};}
    }
  }
  return best;
}
function aiExecutePlan(plan){
  // プランが無い／何もしない場合でも、必ず合法手を探して行動させる（無為なターンエンド防止）
  if(!plan || planIsIdle(plan)){
    const g=aiGuaranteedMove();
    if(g)plan=g;
  }
  // 安全ガード：弓兵・狙撃手は行動力1で「移動」か「遠距離攻撃」のどちらか一方のみ。
  // 移動を伴うプランに遠距離攻撃が付いていたら、遠距離攻撃を無効化する。
  if(plan && plan.ability && plan.ability.kind==="ranged" && plan.path && plan.path.length>0){
    plan={...plan, ability:null};
  }
  learnNoteCpuMove(plan);            // 学習：この手番のCPUの手を記録
  aiRecordMove(aiSigFromExec(plan)); // 千日手検出用に手を記録
  if(plan&&plan.path&&plan.path.length){ // 往復検出用に到達マスを記録
    const d=plan.path[plan.path.length-1];
    aiRecordPos(plan.pieceId, d[0], d[1]);
  }
  const preIds=alive("E").map(p=>p.id);
  const preAP=aiTotalAP(preIds); // 実行前のE軍の総行動力（消費されたか検証するため）
  const steps=[];
  if(plan){
    const p=byId(plan.pieceId);
    if(p){
      const moFromR=p.r, moFromC=p.c; // 移動前の位置（ログ用）
      if(plan.jump&&plan.path.length){
        const [r,c]=plan.path[plan.path.length-1];
        steps.push(()=>{
          if(p.dead)return;
          if(plan.hops&&plan.hops.length>1){ aiRunHops(p,plan.hops); if(!p.dead)logMove(p,moFromR,moFromC); return; }
          if(!aiDoJump(p,r,c))return;
          if(!p.dead)logMove(p,moFromR,moFromC);
        });
      }else{
        for(const [r,c] of plan.path){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            if(visAt(r,c,"E"))return;
            tryStep(p,r,c);
          });
        }
        if(plan.path.length){
          steps.push(()=>{ if(!p.dead)logMove(p,moFromR,moFromC); });
        }
      }
      if(plan.ability){
        if(plan.ability.kind==="ranged"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            let t=plan.ability.targetId?byId(plan.ability.targetId):null;
            if(!t&&plan.ability.tr!=null)t=visAt(plan.ability.tr,plan.ability.tc,"E");
            if(!t||t.flags.invisible||t.owner!=="P")return;
            if(!rangedCellsFrom(p,p.r,p.c).some(([r,c])=>r===t.r&&c===t.c))return;
            p.ap--;
            performAttack(p,t,"ranged");
          });
        }else if(plan.ability.kind==="curse"){
          steps.push(()=>{
            if(p.dead||p.hp<1.5)return;
            log("敵の呪詛師が呪いを放った！（敵全体HP-0.5）","e");sfx("curse");
            for(const t of alive("P"))dealDamage(t,0.5,null,"curse");
            p.hp=r2(p.hp-1.5);
            if(p.hp<=0 && !p.dead) killPiece(p,null,"curse");
          });
        }else if(plan.ability.kind==="slow"){
          steps.push(()=>{
            if(p.dead||p.flags.usedFree)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.flags.invisible||t.owner!=="P")return;
            p.flags.usedFree=true;t.flags.apCut=true;
            log(`敵の術士の呪い…${pieceLabel(t)}の次ターン行動力-1`,"e");sfx("slow");
          });
        }else if(plan.ability.kind==="bind"){
          steps.push(()=>{
            if(p.dead||p.flags.usedFree)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.flags.invisible||t.owner!=="P")return;
            p.flags.usedFree=true;t.flags.noAttack=true;
            log(`敵の悪霊が取り憑いた…${pieceLabel(t)}は次の手番、通常攻撃不可`,"e");sfx("bind");
          });
        }else if(plan.ability.kind==="heal"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.healUsed)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.owner!=="E"||Math.abs(t.r-p.r)+Math.abs(t.c-p.c)!==1)return;
            p.ap--;p.flags.healUsed=true;
            healPiece(t,1);
            log(`敵の薬師が${pieceLabel(t)}を癒した`,"e");sfx("heal");
          });
        }else if(plan.ability.kind==="swap"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const a=byId(plan.ability.aId), b=byId(plan.ability.bId);
            if(!a||!b||a.owner!==b.owner)return;
            if((a.flags.invisible&&a.owner!=="E")||(b.flags.invisible&&b.owner!=="E"))return;
            p.ap--;
            p.hp=r2(p.hp-0.5); // 魔女はスキル使用でHP-0.5
            const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac;
            log(`敵の魔女の入替魔法！${PIECES[a.type].name}と${PIECES[b.type].name}が入れ替わった（魔女HP-0.5）`,"e");
            sfx("swap");

        }else if(plan.ability.kind==="bomb"){

            const {tr,tc}=plan.ability;
            if(!inB(tr,tc)||visAt(tr,tc,"E")||territoryOwnerAt(tr,tc)!==null||G.bombs.some(b=>b.r===tr&&b.c===tc))return;
            if(Math.abs(tr-p.r)+Math.abs(tc-p.c)!==1)return;   // 縦横の隣接マスのみ
            p.ap--;
            G.bombs.push({owner:"E",r:tr,c:tc,fuse:1});
            log("敵の爆弾魔が爆弾を設置した（次の敵手番終了時に爆発）","e");sfx("pick");
          });
        }else if(plan.ability.kind==="trap"){

            if(!inB(tr,tc)||visAt(tr,tc,"E")||territoryOwnerAt(tr,tc)!==null||G.traps.some(t=>t.r===tr&&t.c===tc&&t.owner==="E"))return;

            p.ap--;
            if(springTrapOnHiddenNinja(tr,tc,"E"))return;   // 透明の忍者がいたマス：罠は即発動
            const sid=trapSetterId(p);
            let mine=G.traps.filter(t=>t.setter===sid);
            while(mine.length>=2){const idx=G.traps.indexOf(mine[0]);if(idx>=0)G.traps.splice(idx,1);mine=G.traps.filter(t=>t.setter===sid);}
            G.traps.push({owner:"E",r:tr,c:tc,setter:sid});

          });
        }else if(plan.ability.kind==="summon"){

                if(md<bd){bd=md;best=[r,c];}
              }
              if(!best)return; sr=best[0];sc=best[1];
            }
            p.ap--;
            const b=makePiece("kemono","E",sr,sc);
            b.flags.beastOf=p.id; b.spawn=true;
            G.pieces.push(b);
            log("敵の調教師が獣を召喚した","e");sfx("place");
            if(beastHitsHiddenNinja(b))return;
            // 探索が「召喚した獣で攻撃」と読んでいれば、その攻撃を獣に割り当てる
            if(plan.attack&&plan.attack.attackerId===SS_NEW_BEAST_ID)plan.attack.attackerId=b.id;
          });
        }else if(plan.ability.kind==="kagura"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.hp<=0.5)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.dead||t.owner!=="E"||t.id===p.id||t.type==="miko")return;
            p.ap--;p.hp=r2(p.hp-0.5);
            t.ap++;t.flags.mikoBuff=true;
            log(`敵の巫女の神楽…${pieceLabel(t)}の行動力+1、続けて行動する（巫女HP-0.5）`,"e");sfx("buff");
            // 行き先：探索で決めたマス。無ければ（やさしいモード等）その場で最も良い行き先を評価して決める
            let ab=plan.ability;
            if(ab.tr==null){ const f=aiKaguraFollowup(t); ab={...ab,...(f||{})}; }
            // 先に撃ってから動く手
            for(const sh of (ab.shotsFirst||[])){
              if(t.dead||t.ap<1||G.over)break;
              const tg=visAt(sh.tr,sh.tc,"E");
              if(tg&&tg.owner==="P"&&!tg.flags.invisible&&rangedCellsFrom(t,t.r,t.c).some(([r,c])=>r===tg.r&&c===tg.c)){ t.ap--; performAttack(t,tg,"ranged"); }
            }
            if(ab.tr!=null && (ab.tr!==t.r||ab.tc!==t.c)){
              const reach=reachWithPaths(t);
              const info=reach[ab.tr+","+ab.tc];
              if(info){
                const fr=t.r,fc=t.c;
                if(info.jump){ if(info.hops&&info.hops.length>1)aiRunHops(t,info.hops); else aiDoJump(t,ab.tr,ab.tc); }
                else for(const [r,c] of info.path){ if(t.dead||t.ap<1||visAt(r,c,"E"))break; tryStep(t,r,c); }
                if(!t.dead)logMove(t,fr,fc);
              }
            }
            // 射撃（弓兵・狙撃手）：移動して1発、またはその場で2発
            for(const sh of (ab.shots||[])){
              if(t.dead||t.ap<1||G.over)break;
              const tg=visAt(sh.tr,sh.tc,"E");
              if(tg&&!tg.dead&&tg.owner==="P"&&!tg.flags.invisible&&rangedCellsFrom(t,t.r,t.c).some(([r,c])=>r===tg.r&&c===tg.c)){
                t.ap--; performAttack(t,tg,"ranged");
              }
            }
            // 移動しながら能力（神楽で行動力+1：1マス動いてから能力）
            if(!t.dead && ab.skill && t.ap>=1 && !G.over) aiUseSkillNow(t,ab.skill,plan);
            if(!t.dead && t.ap>0) aiConsumeRemainingAP(t.id); // 行動力は使い切る
          });
        }else if(plan.ability.kind==="kami"){
          steps.push(()=>{
            if(p.dead||p.ap<1||G.eExtraActive)return;

            log("敵の神が超越を発動した！あなたの手番の後、敵が2回続けて行動する","e");sfx("buff");
          });
        }else if(plan.ability.kind==="meteor"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.pendingMeteor)return;
            const cells=METEOR_OFFSETS.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>inB(r,c));
            if(!cells.length)return;

            p.flags.pendingMeteor=true; p.flags.invisible=true; p.flags.meteorOrigin={r:p.r,c:p.c};
            if(!G.meteors)G.meteors=[];
            G.meteors=G.meteors.filter(m=>m.id!==p.id);
            G.meteors.push({id:p.id,owner:"E",cells:cells.map(([r,c])=>({r,c})),fuse:1});
            p.r=-1; p.c=-1;
            log("敵の隕石が流星群を呼んだ…次の敵のターンエンドに、赤いマスのどこかへ着弾する","e");
            sfx("teleport");
          });
        }else if(plan.ability.kind==="henge"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.type!=="kitsune")return;
            const ab=plan.ability;
            const info0=PIECES[ab.toType]; if(!info0)return;

            log(`敵の狐が${info0.name}に変化した！（ターンエンドで狐に戻りHP-1）`,"e");sfx("buff");
            if(ab.tr!==p.r||ab.tc!==p.c){
              const info=reachWithPaths(p)[ab.tr+","+ab.tc];
              const fr=p.r,fc=p.c;
              if(info&&info.jump){ if(info.hops&&info.hops.length>1)aiRunHops(p,info.hops); else aiDoJump(p,ab.tr,ab.tc); }
              else{
                let path=info?info.path:null;
                if(path&&path.length<p.ap&&p.type!=="boken"){ const ex=aiExactPath(p,ab.tr,ab.tc,p.ap); if(ex)path=ex; }
                if(!path)path=aiExactPath(p,ab.tr,ab.tc,p.ap)||[];
                for(const [r,c] of path){ if(p.dead||p.ap<1||visAt(r,c,"E"))break; tryStep(p,r,c); }
              }
              if(!p.dead)logMove(p,fr,fc);
            }
            for(const sh of (ab.shots||[])){
              if(p.dead||p.ap<1||G.over)break;
              const tg=visAt(sh.tr,sh.tc,"E");
              if(tg&&tg.owner==="P"&&!tg.flags.invisible&&rangedCellsFrom(p,p.r,p.c).some(([r,c])=>r===tg.r&&c===tg.c)){ p.ap--; performAttack(p,tg,"ranged"); }
            }
          });
        }else if(plan.ability.kind==="psy"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const t=byId(plan.ability.targetId); const {tr,tc}=plan.ability;
            if(!t||t.dead||!inB(tr,tc)||at(tr,tc))return;
            if(!esperTargets(p).includes(t))return;
            p.ap--;
            log(`敵の超能力者の念動！${pieceLabel(t)}を動かした`,"e");
            const fr=t.r,fc=t.c; enterSquare(t,tr,tc); sfx("move");
            if(!t.dead)logMove(t,fr,fc);
          });
        }else if(plan.ability.kind==="warp"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.hp<=0.5)return;
            p.ap--; p.hp=r2(p.hp-0.5);
            doWarp(plan.ability);
            log(`敵の宇宙人が${warpText(plan.ability)}転移させた（HP-0.5）`,"e");
            sfx("teleport");
            if(p.hp<=0)killPiece(p,null,"self");
          });
        }else if(plan.ability.kind==="territory"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const {tr,tc}=plan.ability;
            if(!inB(tr,tc)||visAt(tr,tc,"E")||wallAt(tr,tc)||territoryOwnerAt(tr,tc)==="P")return;
            if(Math.max(Math.abs(tr-p.r),Math.abs(tc-p.c))!==1)return;
            p.ap--;
            if(!G.territories)G.territories=[];
            G.territories=G.territories.filter(t=>t.owner!=="E");
            G.territories.push({r:tr,c:tc,owner:"E"});
            log("敵の領主が領地を宣言した（敵の駒しか入れない）","e");sfx("place");
            territoryClearObjects(tr,tc,"E");
            territoryCatchHiddenNinja(tr,tc,"E",p);
          });
        }else if(plan.ability.kind==="futokoro"){
          steps.push(()=>{
            if(p.dead||p.flags.futokoroUsed)return;
            p.flags.futokoroUsed=true; p.ap++;
            const {tr,tc}=plan.ability;
            const info=reachWithPaths(p)[tr+","+tc];
            let path=info?info.path:null;
            if(path&&path.length<p.ap){ const ex=aiExactPath(p,tr,tc,p.ap); if(ex)path=ex; }
            if(!path)path=aiExactPath(p,tr,tc,p.ap)||[];
            const fr=p.r,fc=p.c;
            for(const [r,c] of path){ if(p.dead||p.ap<1||visAt(r,c,"E"))break; tryStep(p,r,c); }
            if(!p.dead)logMove(p,fr,fc);
          });
        }else if(plan.ability.kind==="gunshi"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.hp<=0.5)return;
            p.ap--; p.hp=r2(p.hp-0.5);
            log("敵の軍師の采配！このターン、敵は駒を2体行動させる（軍師HP-0.5）","e");sfx("pick");
            for(const m of plan.ability.moves){
              const q=byId(m.id); if(!q||q.dead)continue;
              const info=reachWithPaths(q)[m.r+","+m.c];
              let path=info?info.path:null, jump=info&&info.jump;
              if(!jump&&path&&path.length<q.ap&&!["boken"].includes(q.type)){ const ex=aiExactPath(q,m.r,m.c,q.ap); if(ex)path=ex; }
              const fr=q.r,fc=q.c;
              if(jump){ if(info.hops&&info.hops.length>1)aiRunHops(q,info.hops); else aiDoJump(q,m.r,m.c); }
              else if(path){ for(const [r,c] of path){ if(q.dead||q.ap<1||visAt(r,c,"E"))break; tryStep(q,r,c); } }
              if(!q.dead){ logMove(q,fr,fc); if(q.ap>0)aiConsumeRemainingAP(q.id); }
            }
          });
        }else if(plan.ability.kind==="pray"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.prayUsed)return;
            p.ap--; prayCountUp(p);
            for(const t of alive("E"))if(t.id!==p.id)healPiece(t,0.5);
            log("敵の聖職者の祈り…敵軍全体のHPが0.5回復","e");sfx("heal");
          });
        }else if(plan.ability.kind==="vanish"){
          // 透明化してから移動する（透明中は被弾無効なので安全に前進できる）
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.invisible)return;
            p.ap--;p.flags.invisible=true;
            log("敵の忍者が気配を消した…（どこに潜んだかは不明）","e");sfx("pick");
            // 探索で決めた潜伏先があれば、そこへ（透明中は斜め移動可）
            const ab=plan.ability;
            if(ab.tr!=null&&(ab.tr!==p.r||ab.tc!==p.c)&&p.ap>=1&&!visAt(ab.tr,ab.tc,"E")){ tryStep(p,ab.tr,ab.tc); return; }
            if(ab.tr!=null)return;
            // 透明化後、敵陣・前線へ向けて安全に前進する（透明中はALL8で斜め移動可）
            let guard=0;
            while(p.ap>=1 && guard++<2){
              // 敵に近づく方向へ、被弾を気にせず前進（透明中は無敵）
              let best=null,bs=-1e9;
              for(const [dr,dc] of moveDirs(p)){
                const nr=p.r+dr,nc=p.c+dc;
                if(!inB(nr,nc)||visAt(nr,nc,"E"))continue;
                if(!colorOk("E",p.id,nr,nc))continue;
                // 敵に近づくほど良い（先手の起点を作る）。罠だけは透明でも踏むので回避。
                let md=99;for(const f of alive("P"))md=Math.min(md,Math.abs(nr-f.r)+Math.abs(nc-f.c));
                let s=-md*10 - trapProbAt(nr,nc)*300;
                if(s>bs){bs=s;best=[nr,nc];}
              }
              if(!best)break;
              const fr=p.r,fc=p.c;
              tryStep(p,best[0],best[1]);
              if(!p.dead)logMove(p,fr,fc);
            }
          });
        }
      }
    }
    // 行動力の全消費ルール：行動した駒にAPが残っていて、まだ動けるなら使い切る（攻撃フェーズより前）
    if(p){
      steps.push(()=>{ aiConsumeRemainingAP(p.id); });
    }
    // 攻撃の直前に「まだ行動力を1も消費していない」なら、必ず先に移動して消費する。
    // 通常攻撃はターンエンド直前の1回だけ＝必ず全ての移動が終わってから行う。
    steps.push(()=>{
      if(aiTotalAP(preIds)>=preAP){        // このターンまだAPを消費していない
        aiForceAnyAction();          // 先に1駒の行動力を使い切る（移動が攻撃より前になる）
      }
    });
    if(plan.attack){
      steps.push(()=>{
        if(G.attackUsed)return; // 1ターン1回の通常攻撃制限
        const a=byId(plan.attack.attackerId);
        let t=byId(plan.attack.targetId);
        if(!a||a.flags.noAttack)return;
        // 予定ターゲットが消えていたら隣接の敵を再探索
        const cellOk=t&&!t.flags.invisible&&normalAttackCells(a).some(([r,c])=>r===t.r&&c===t.c);
        if(!cellOk){
          t=null;
          for(const [r,c] of normalAttackCells(a)){
            const x=visAt(r,c,"E");
            if(x&&x.owner==="P"){t=x;break;}
          }
        }
        if(t){G.attackUsed=true;performAttack(a,t,"melee");}
      });
    }
  }
  steps.push(()=>{});
  let i=0;
  const run=()=>{
    if(G.over)return;
    if(G.respawnQueue.length){processRespawns(run);return;}
    if(i>=steps.length){
      // 検証：このターンでE軍が実際に「行動力を消費」したか。
      // 通常攻撃は行動力を消費しないため、攻撃だけではターンエンドを認めない。
      const apConsumed = aiTotalAP(preIds)<preAP;
      if(!apConsumed){
        // 行動力を1も消費していない → 必ずどれか1駒の行動力を使い切る手を強制実行する
        if(aiForceAnyAction()){ render(); setTimeout(finishAITurn,300); return; }
        // ここに来るのは全駒が行動力0（もう誰も動けない）＝合法的に消費し切った状態のみ。
      }
      // 保険：この手番でまだ通常攻撃していないのに、隣接する敵を狙える駒（忍者など）があれば必ず攻撃する。
      // 探索の最善手に攻撃が含まれていなくても、無償の通常攻撃は取り逃さない。
      if(!G.attackUsed){ aiTryOneAttack(); render(); }
      finishAITurn();return;
    }
    const f=steps[i++];
    f();
    render();
    setTimeout(run,430);
  };
  run();
}
/* E軍の生存駒の総行動力。実行前後で減っていれば「行動力を消費した＝正しく行動した」。
   通常攻撃はAPを消費しないため、この値は変わらず、行動とみなされない。 */
function aiTotalAP(ids){
  // ids を渡すと、その駒たち（手番開始時に居た駒）だけで数える。
  // 手番中に召喚された獣や、倒れて再召喚された駒の行動力で「未消費」と誤判定しないため。
  let s=0;
  if(ids){ for(const id of ids){ const p=byId(id); if(p&&!p.dead&&p.owner==="E")s+=p.ap; } return s; }
  for(const p of G.pieces){ if(!p.dead && p.owner==="E") s+=p.ap; }
  return s;
}
/* 無為なターンを絶対に避けるための最終実行：保証手を1つ、その場で適用する。
   行動できれば true、全駒が完全に詰んでいれば false。 */
function aiForceAnyAction(){
  // 必ず「1駒の行動力を消費する」手を実行する。通常攻撃はAPを消費しないので行動とは認めない。
  // ① 行動力を全消費できる移動を最優先
  let fallbackMove=null;
  for(const p of alive("E")){
    if(p.ap<1)continue;
    const reach=reachWithPaths(p);
    for(const key in reach){
      if(key===p.r+","+p.c)continue;
      const info=reach[key];
      if(!info.path||info.path.length===0)continue;
      const cost=info.jump?2:info.path.length;
      if(cost>=p.ap){ // 全消費できる移動
        aiApplyMoveNow(p,info); aiConsumeRemainingAP(p.id); aiTryOneAttack(); return true;
      }
      if(!fallbackMove)fallbackMove={p,info};
    }
  }
  // ② 弓兵・狙撃手の遠距離攻撃（AP1消費）
  for(const p of alive("E")){
    if(p.ap<1||!(p.type==="kyuhei"||p.type==="sogeki"))continue;
    for(const [rr,cc] of rangedCellsFrom(p,p.r,p.c)){
      const t=visAt(rr,cc,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible){ p.ap--; performAttack(p,t,"ranged"); return true; }
    }
  }
  // ③ 全消費できる移動が無くても、APを消費する移動を必ず行い、残りも使い切る
  if(fallbackMove){ aiApplyMoveNow(fallbackMove.p,fallbackMove.info); aiConsumeRemainingAP(fallbackMove.p.id); aiTryOneAttack(); return true; }
  // ④ どの駒も行動力を消費できない（全駒が完全に移動不能）＝合法的にパスするしかない。
  //    通常攻撃だけでは「行動」にならないため、ここでは行動なしとして返す。
  return false;
}
function aiApplyMoveNow(p,info){
  const fr=p.r,fc=p.c;
  if(info.jump && p.ap>=2){
    const [r,c]=info.path[info.path.length-1];
    p.ap-=2; enterSquare(p,r,c); sfx("move");
  }else{
    for(const [r,c] of info.path){
      if(p.dead||p.ap<1)break;
      if(visAt(r,c,"E"))break;
      tryStep(p,r,c);
    }
  }
  if(!p.dead)logMove(p,fr,fc);
}
function aiTryOneAttack(){
  if(G.attackUsed)return false; // 1ターン1回の通常攻撃制限
  for(const a of alive("E")){
    if(PIECES[a.type].noNormal||a.flags.noAttack)continue;
    for(const [r,c] of normalAttackCells(a)){
      const t=visAt(r,c,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible){ G.attackUsed=true; performAttack(a,t,"melee"); return true; }
    }
  }
  return false;
}
function learnFlushPendingLoss(){
  const list=G.lrnPendingLoss||[]; G.lrnPendingLoss=[];
  if(G.kills.P>G.kills.E) for(const v of list) learnOnCpuLoss(v,true);
}
/* CPUの流星群：導火線0なら着弾（着弾マスはCPUが選ぶ）、それ以外は導火線-1 */
function aiMeteorPhase(cont){
  let ready=null;
  for(const m of (G.meteors||[])){
    if(m.owner!=="E")continue;
    if((m.fuse==null?0:m.fuse)<=0){ if(!ready)ready=m; }
    else m.fuse--;
  }
  if(!ready){cont();return;}
  let cells=ready.cells.filter(c=>inB(c.r,c.c)&&!wallAt(c.r,c.c));
  const valid=cells.filter(c=>meteorImpactColorOk("E",c.c));
  if(valid.length)cells=valid;
  const st=ssFromGame("E");
  const pick=ssMeteorPick(st,{owner:"E",cells:cells.map(c=>({r:c.r,c:c.c}))})||cells[0];
  if(!pick){ G.meteors=G.meteors.filter(m=>m!==ready); cont(); return; }
  resolveMeteorImpact(ready.id,pick.r,pick.c);
  render();
  processRespawns(()=>{ if(!G.over)cont(); });
}
function finishAITurn(){
  learnFlushPendingLoss();
  if(G.over)return;
  aiMeteorPhase(()=>finishAITurnCore());
}
function finishAITurnCore(){
  if(G.over)return;
  revertHengeFoxes("E"); // 変化中の敵の狐を元に戻す（HP-1）
  shieldPhase("E",()=>{
    explodeBombs("E",()=>{
      if(G.over)return;
      decayWalls(); // 壁は5回のターンエンドで消滅
      for(const p of alive("P")){ if(p.flags.invisible)clearNinjaProb(p.id); p.flags.invisible=false; }
      for(const p of alive("E")){p.flags.noAttack=false;p.flags.slowedVisual=false;p.flags.mikoBuff=false;}
      if(sennAfterTurn("E")){ render(); endGame("P"); return; }   // 千日手の判定
      // 敵の神の超越：連続ターンが残っていれば、もう一度敵の手番
      if(!NET.on && (G.eExtraTurns||0)>0){
        G.eExtraTurns--;
        log(`敵の超越：敵が続けて行動する（残り${G.eExtraTurns}回）`,"e");
        setTimeout(startAITurn,450);
        return;
      }
      if(!((G.ePendingExtra||0)>0)) G.eExtraActive=false;
      // 神の超越：相手（E）の手番が終わったので、予約されていた連続自分ターンを有効化する。
      // 次の自分のターン＝1回目。残りの (pPendingExtra-1) 回を連続ターン(pExtraTurns)として与える。
      if((G.pPendingExtra||0)>0){
        G.pExtraTurns=(G.pPendingExtra-1);
        G.pPendingExtra=0;
        log(`超越：ここから自分のターンを${G.pExtraTurns+1}回続けて行う`,"p");
      }
      setTimeout(startPlayerTurn,400);
    });
  });
}

/* ===== 考え中の顔：読みの状況に合わせて表情を変える =====
   1 余裕：すぐに良い手が見つかり、読むほど確信が強まっている
   2 ふむ：考え始め（まだ浅い読み）
   3 考え始め：悩みが解けつつある（最善手が落ち着いてきた）
   4 じっくり：上位の手どうしの差が小さく、どれにするか比べている
   5 はてな：相手（プレイヤー）の打てる手が多く、読む先が広い
   6 眉間にしわ：深く読むたびに最善手が入れ替わる
   7 焦り：どの手でも駒を失いそう（悪い読み筋しか見つからない）
   8 必死：焦りのまま時間が過ぎている
   9 限界：負けが読めている／時間ぎりぎりまで悪いまま
   10 決断：手を決めた（勝ちが見えた時もこれ）
   難しさの原因が解けていくと、表情は落ち着いた顔へ戻っていく */
let AI_THINK=null;
function aiSetFace(n,cause){
  if(!AI_THINK)AI_THINK={t0:performance.now(),total:6000,face:0,cause:""};
  if(AI_THINK.face===n)return;
  AI_THINK.face=n; AI_THINK.cause=cause||"";
  const el=document.getElementById("thinkFace");
  if(el){ el.innerHTML=thinkFaceSVG(n); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); el.title=cause||""; }
}
function aiThinkBegin(prep){
  if(!AI_THINK)AI_THINK={t0:performance.now(),total:6000,face:0,cause:""};
  const T=AI_THINK;
  T.prevPlan=null; T.stable=0; T.hard=false; T.depth=0; T.bestAt={}; T.best=null;
  try{ const st0=ssFromGame("E"); T.baseEval=ssEval(st0); }catch(e){ T.baseEval=0; }   // 今の局面の評価（手を指す前）
  T.nRoot=prep&&prep.applied?prep.applied.length:0;
  aiSetFace(2,"ふむ");
}
function aiThinkMood(){
  const T=AI_THINK; if(!T||T.best==null)return;
  const frac=Math.min(1,(performance.now()-T.t0)/Math.max(1,T.total));
  let n,cause;
  if(T.best>=1e6){ n=10; cause="勝ちが見えた"; }
  else if(T.best<=-1e6){ n=frac>0.5?9:8; cause="負けが読めている"; }
  else{
    const danger = T.baseEval-T.best>2500;          // 読むと駒を失う筋しか残らない
    const chance = T.best-T.baseEval>2500;          // 駒を取れる筋がはっきり見えている
    const unstable = T.depth>=3 && T.stable===0;     // 深く読むたびに最善手（と評価）が入れ替わる
    const close = T.margin<80;                       // 上位の手どうしの差が小さい
    const many = SS_P_BRANCH>24;                     // 相手の打てる手が多い
    if(T.depth<3&&!danger&&!chance){ n=2; cause="ふむ"; }   // まだ浅い読み：結論を出さない
    else if(chance&&!danger&&(T.stable>=1||T.depth<3)){ n=1; cause="良い手がすぐ見つかった"; }
    else if(danger){ n=frac>0.85&&unstable?9:frac>0.6?8:7; cause="駒を失いそうな局面"; }
    else if(unstable){ n=frac>0.7?7:6; cause="読むたびに最善手が変わる"; }
    else if(many&&T.stable<3){ n=5; cause="相手の手が多い"; }
    else if(close&&T.stable<3){ n=4; cause="候補の差が小さい"; }
    else if(T.hard){ n=3; cause="悩みが解けてきた"; }    // 難しかったが落ち着いてきた
    else if(T.depth>=3&&T.stable>=1&&T.margin>=200){ n=1; cause="すぐに良い手が見つかった"; }
    else { n=2; cause="ふむ"; }
    if(n>=4&&n<=9)T.hard=true;
  }
  aiSetFace(n,cause);
}
/* 1段読み終わるたびに、最善手の入れ替わり・候補の差・評価の悪さから表情を決める */
function aiThinkDepth(r,depth,complete){
  const T=AI_THINK; if(!T)return;
  if(complete){
    // 最善手が同じ、または最善の評価がほとんど変わらなければ「落ち着いている」
    // 読みの手数の偶奇で評価は上下しやすいので、評価は「2段前（同じ偶奇）」と比べる
    if(!T.bestAt)T.bestAt={};
    const prev2=T.bestAt[depth-2];
    // 「深く読んだら前の最善手に問題が見つかった（評価が2段前より下がった）」時だけ落ち着いていないとみなす。
    // 評価が上がった（良い筋が見つかった）時や、比べる段が無い時は落ち着いている扱い
    const same = !T.prevPlan || T.prevPlan===r.localPlan || prev2==null || r.localBest>prev2-150;
    T.stable = same ? (depth>=3?T.stable+1:0) : 0;
    T.prevPlan=r.localPlan; T.bestAt[depth]=r.localBest; T.depth=depth;
  }
  T.best=r.localBest;
  const vals=(r.scored||[]).map(x=>x.v).sort((a,b)=>b-a);
  T.margin = vals.length>=2 ? vals[0]-vals[1] : 9999;
  aiThinkMood();
}

    for(const b of G.bombs)if(b.r===r&&b.c===c){ addMk("mk-bomb","bomb","爆弾"); }
