/* ふつう・つよいモード：探索結果(ssBestMove)を aiExecutePlan が解釈できる形へ変換 */
/* 探索でモデル化済みの能力を持つ駒（これ以外は能力をヒューリスティックで補完） */
const SS_ABILITY_MODELED=new Set(["kyuhei","sogeki","jusoshi"]);
function deepPlanFromRes(res){
  if(!res||!res.plan)return {plan:null, resign:!!(res&&res.resign)};
  const best=res.plan;
  const p=byId(best.pieceId);
  if(!p)return {plan:null, resign:res.resign};
  const reach=reachWithPaths(p);
  const key=best.destR+","+best.destC;
  let path=[],jump=false;
  if(reach[key]){ path=reach[key].path||[]; jump=!!reach[key].jump; }
  else{ path=[]; }
  let ability=best.ability;
  if(!ability && !SS_ABILITY_MODELED.has(p.type)){
    ability=heuristicAbilityFor(p, best.destR, best.destC);
  }
  return {plan:{pieceId:best.pieceId, path, jump, ability, attack:best.attack, score:0}, resign:res.resign};
}
function deepPlan(){
  return deepPlanFromRes(ssBestMove(aiDepth));
}
function deepPlanAsync(onDone){
  ssBestMoveAsync(aiDepth, res=>onDone(deepPlanFromRes(res)));
}
/* つよいモード：有用な手を5候補に絞り、各手を15手先まで相手の応手も含めて徹底検証。
   自分が指した後の相手の立場での最善応手まで読み切り、最終結果が最良の手を選ぶ。 */
function deepPlanStrongAsync(onDone){
  ssBestMoveStrongAsync(res=>onDone(deepPlanFromRes(res)));
}
function ssBestMoveStrongAsync(onDone){
  ssNodeCap=SS_NODE_CAP_STRONG;
  const prep=ssBestPrepare();
  if(!prep){onDone({resign:false, plan:null, allLose:false});return;}
  const {applied, fbPlan}=prep;
  const STRONG_BUDGET=19000;               // 全体で最大約19秒（20秒以内に収める）
  const overallDeadline=performance.now()+STRONG_BUDGET;
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  const valById={};
  // フェーズ1：浅い反復深化で有用手を絞り込む（move orderingを作る）
  let depth=2;
  const SHALLOW_MAX=6;
  const shallowStep=()=>{
    if(depth>SHALLOW_MAX || performance.now()>overallDeadline-1000){ deepPhase(); return; }
    ssDeadline=performance.now()+2500;
    const r=ssRunDepth(applied, depth, order, valById);
    order=r.newOrder;
    if(r.completedAny && r.localPlan){
      bestPlan=r.localPlan;
      if(r.localBest>=1e6){ finish(); return; }
    }
    depth++;
    setTimeout(shallowStep,0);
  };
  // フェーズ2：上位5候補だけを15手先まで深く探索
  let di=0, deepOrder=[], deepDepth=8;
  const deepPhase=()=>{
    // 上位5手（move ordering順）に絞る
    deepOrder=order.slice(0, Math.min(5, order.length));
    deepIterate();
  };
  const deepIterate=()=>{
    if(deepDepth>AI_DEPTH_STRONG || performance.now()>overallDeadline){ finish(); return; }
    // 残り時間を各深さに割り当て
    ssDeadline=Math.min(overallDeadline, performance.now()+ (overallDeadline-performance.now()) );
    const r=ssRunDepth(applied, deepDepth, deepOrder, valById);
    deepOrder=r.newOrder.filter(i=>deepOrder.includes(i)); // 5候補内で並べ替え維持
    if(r.completedAny && r.localPlan){
      bestPlan=r.localPlan;
      if(r.localBest>=1e6){ finish(); return; }
    }
    deepDepth++;
    setTimeout(deepIterate,0);
  };
  const finish=()=>{
    // 5候補の評価値のみで投了判定
    const evaluated=deepOrder.length?deepOrder.map(i=>valById[i]).filter(v=>v!==undefined):Object.values(valById);
    const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
    onDone({resign:allLose, plan:bestPlan, allLose});
  };
  setTimeout(shallowStep,0);
}
/* 指定駒が dest に移動した「と仮定して」最も有効な能力を1つ選ぶ（簡易） */
/* 魔女の入替プラン：味方同士 or 敵同士を入れ替えて最も得をする組を選ぶ */
function witchPlan(witch){
  const eAll=alive("E").filter(p=>p.id!==witch.id);
  const pAll=alive("P").filter(p=>!p.flags.invisible);
  // あるマスがプレイヤーの通常攻撃圏内か（簡易判定）
  const inDanger=(r,c)=>{
    for(const f of pAll){
      const dr=Math.abs(f.r-r), dc=Math.abs(f.c-c), man=dr+dc;
      if(f.flags.noAttack)continue; // 封じ中は脅威が薄い
      if(f.type==="kyuhei"&&man<=2)return true;
      if(f.type==="sogeki"&&dr===dc&&dr<=3)return true;
      if(f.type==="souhei"&&((dr===1&&dc===1)||(dc===0&&dr===1)))return true; // 槍兵：斜め＋正面
      if(man===1)return true; // 通常隣接
    }
    return false;
  };
  const risk=p=>(inDanger(p.r,p.c)?1:0)*(4-p.hp);
  const distTo=(r,c)=>{let m=99;for(const f of pAll)m=Math.min(m,Math.abs(f.r-r)+Math.abs(f.c-c));return m;};
  // その位置(r,c)から、そのターンのうちに通常攻撃で敵を討てるか＆火力を評価
  const attackValueAt=(piece,r,c)=>{
    if(!SS_ATTACKER.has(piece.type))return 0;
    const dmg=ssAtk({t:piece.type,heroBoost:piece.flags.heroBoost},"melee")||1;
    let val=0;
    const dirs=piece.type==="souhei"?[...DIAG,[1,0]]:ORTHO;
    for(const [dr,dc] of dirs){
      const f=pAll.find(x=>x.r===r+dr&&x.c===c+dc);
      if(!f)continue;
      // 入替直後に通常攻撃できる（swap→attack→相手ターンの順）
      let s=dmg*8;
      if(f.hp-dmg<=0)s+=30;                 // 討ち取れるなら大きく加点
      if(piece.type==="kyuketsuki")s+=6;    // 吸血鬼：攻撃しつつ回復
      if(piece.type==="kusushi")s+=4;       // 薬師：毒で攻撃＋味方回復運用
      val=Math.max(val,s);
    }
    return val;
  };
  let best=null,bestGain=0.5; // しきい値：少しでも得なら使う
  // (a) 味方ペア入替：危険な味方を安全マスへ退避、かつ火力の高い駒を前線(敵隣接)へ出撃させる
  for(let i=0;i<eAll.length;i++)for(let j=i+1;j<eAll.length;j++){
    const a=eAll[i],b=eAll[j];
    const before=risk(a)+risk(b);
    const afterA=(inDanger(b.r,b.c)?1:0)*(4-a.hp);
    const afterB=(inDanger(a.r,a.c)?1:0)*(4-b.hp);
    const after=afterA+afterB;
    // 攻撃役ほど、また攻撃力(ssAtk)が高いほど前線(敵に近い)へ出す価値を重視
    const atkVal=p=>{const g={t:p.type,heroBoost:p.flags.heroBoost}; return SS_ATTACKER.has(p.type)?(ssAtk(g,"melee")||1):0;};
    const aggrBefore = atkVal(a)*(-distTo(a.r,a.c)) + atkVal(b)*(-distTo(b.r,b.c));
    const aggrAfter  = atkVal(a)*(-distTo(b.r,b.c)) + atkVal(b)*(-distTo(a.r,a.c));
    // 入替後、火力駒が敵隣接に来て即攻撃できるなら大きく加点（剣士/戦士/覚醒勇者/薬師/吸血鬼の出撃）
    const strikeGain = Math.max(attackValueAt(a,b.r,b.c), attackValueAt(b,a.r,a.c)) * 0.15;
    const gain=(before-after)+(aggrAfter-aggrBefore)*0.35 + strikeGain;
    if(gain>bestGain){bestGain=gain;best={kind:"swap",aId:a.id,bId:b.id};}
  }
  // (b) 敵ペア入替：脆い敵をこちらの攻撃役の隣（＝攻撃圏の先頭）へ引き出して討ち取る
  for(let i=0;i<pAll.length;i++)for(let j=i+1;j<pAll.length;j++){
    const a=pAll[i],b=pAll[j];
    const myAtk=eAll.filter(e=>SS_ATTACKER.has(e.type));
    // その駒を、味方アタッカーが「そのターンに討ち取れる」位置に置けるか
    const killableAt=(victim,r,c)=>{
      for(const e of myAtk){
        if(Math.abs(e.r-r)+Math.abs(e.c-c)!==1)continue;
        const dmg=ssAtk({t:e.type,heroBoost:e.flags.heroBoost},"melee")||1;
        if(victim.hp-dmg<=0)return true;      // 入替先で撃破可能
      }
      return false;
    };
    // a を b の位置へ、または b を a の位置へ入れ替えたとき討ち取れるか
    let gain=0;
    if(killableAt(a,b.r,b.c)) gain=Math.max(gain, 2.0+(3-a.hp)*0.5); // 敵を攻撃圏の先頭へ
    if(killableAt(b,a.r,a.c)) gain=Math.max(gain, 2.0+(3-b.hp)*0.5);
    if(gain>bestGain){bestGain=gain;best={kind:"swap",aId:a.id,bId:b.id};}
  }
  return best;
}
const SS_ATTACKER=new Set(["kenshi","senshi","kiba","souhei","kyuketsuki","yusha","ninja","fushicho","kusushi"]);

/* 戦法シート由来の駒タイプ（役割）。数値は「前線へ出る度合い」の係数。
   出撃=前線で戦う / 強襲=積極的に距離を詰める / 迎撃=待ち構える / 牽制=後衛で支援・妨害 */
const PIECE_ROLE={
  // 出撃（前線アタッカー）
  kenshi:"sortie", senshi:"sortie", tatehei:"sortie", kusushi:"sortie",
  souhei:"sortie", fushicho:"sortie", kyuketsuki:"sortie", yusha:"sortie", kemono:"sortie",
  // 強襲（積極的に間合いを詰める）
  kiba:"assault", ninja:"assault", boken:"assault",
  // 迎撃（攻めてきた相手を迎え撃つ／射線で牽制）
  kyuhei:"intercept", sogeki:"intercept",
  // 牽制（後衛で支援・妨害・盤面操作）
  jutsushi:"control", wanashi:"control", chokyo:"control", gunshi:"control",
  jusoshi:"control", miko:"control", esper:"control", seishoku:"control",
  majo:"control", bakudan:"control",
  // 悪霊は牽制寄りだが相対したら出撃級（タイマン最強）
  akuryo:"sortie"
};
/* 役割ごとの「敵へ近づく価値」係数（大きいほど前へ出る） */
const ROLE_ADVANCE={ sortie:12, assault:16, intercept:4, control:2 };

/* プレイヤー駒 f が次の手番に「移動→通常攻撃」で与えうる最大脅威を点数化。
   AI駒を撃破できるなら特大、ダメージのみなら中程度。悪霊の標的選定に使う。 */
function playerMeleeThreat(f){
  if(PIECES[f.type].noNormal||f.flags.invisible)return 0;
  const aiPieces=alive("E");
  if(!aiPieces.length)return 0;
  // f が到達しうるマス（行動力ぶん）＋その場
  const spots=reachSquares(f,f.maxAp,true);
  spots.push([f.r,f.c]);
  let best=0;
  for(const [mr,mc] of spots){
    const ghost={...f,r:mr,c:mc};
    // 移動先からの通常攻撃対象マス
    let dirs;
    if(f.type==="souhei")dirs=[...DIAG,[frontDr(f.owner),0]];
    else dirs=ORTHO;
    const dmg=atkDamage(ghost,"melee");
    for(const [dr,dc] of dirs){
      const tr=mr+dr, tc=mc+dc;
      const victim=aiPieces.find(e=>e.r===tr&&e.c===tc);
      if(!victim)continue;
      // 盾の防御方向は軽減されるが簡易化
      let score = dmg*45;                 // 与ダメージ
      if(victim.hp-dmg<=0) score += 260;  // 撃破できる位置は極めて危険
      score += (3-Math.max(0,victim.hp-dmg))*15; // 瀕死に追い込むほど加点
      if(score>best)best=score;
    }
  }
  return best;
}

function heuristicAbilityFor(p,dr,dc){
  const foes=alive("P").filter(f=>!f.flags.invisible);
  const allies=alive("E").filter(f=>f.id!==p.id);
  const adj=(r,c)=>ORTHO.some(([a,b])=>r+a===dr&&c+b===dc);
  switch(p.type){
    case "jutsushi":{ // 行動阻害（行0）：最も行動力の高い敵を狙う
      if(!foes.length)return null;
      // 相手が魔女を持つなら、魔女自身の行動力を奪う＝そもそも入れ替えさせないのが最有力。
      const witch=foes.find(f=>f.type==="majo");
      if(witch)return {kind:"slow",targetId:witch.id};
      const t=foes.slice().sort((a,b)=>b.maxAp-a.maxAp)[0];
      return {kind:"slow",targetId:t.id};
    }
    case "akuryo":{ // 攻撃封じ（行0）：通常攻撃の脅威が突出して高い駒のみを封じる
      if(!foes.length)return null;
      // 各プレイヤー駒の「次の手番の通常攻撃脅威」を算出
      let bestFoe=null, bestThreat=0;
      for(const f of foes){
        if(PIECES[f.type].noNormal)continue; // 通常攻撃しない駒は封じても無意味
        const th=playerMeleeThreat(f);
        if(th>bestThreat){bestThreat=th;bestFoe=f;}
      }
      // 脅威が高い（＝AI駒を撃破しうる／大ダメージ）場合のみ発動。低ければ移動を優先
      if(bestFoe && bestThreat>=100) return {kind:"bind",targetId:bestFoe.id};
      return null;
    }
    case "kusushi":{ // 薬師：①隣接敵を毒1で倒せるなら最優先 ②瀕死の味方を回復 ③隣接敵に毒
      const adjFoes=foes.filter(f=>Math.abs(f.r-dr)+Math.abs(f.c-dc)===1);
      // ①トドメ：毒1ダメで撃破できる敵（HP<=1。不死鳥の初回復活は考慮）
      const lethal=adjFoes.filter(f=>f.hp<=1&&!(f.type==="fushicho"&&!f.flags.phoenix))
                          .sort((a,b)=>a.hp-b.hp)[0];
      if(lethal)return {kind:"poison",targetId:lethal.id};
      // ②瀕死の味方を回復
      const hurt=allies.filter(a=>a.hp<3&&Math.abs(a.r-dr)+Math.abs(a.c-dc)===1)
                        .sort((a,b)=>a.hp-b.hp)[0];
      if(hurt)return {kind:"heal",targetId:hurt.id};
      // ③それ以外は隣接敵に毒（HPの低い順）
      const en=adjFoes.sort((a,b)=>a.hp-b.hp)[0];
      if(en)return {kind:"poison",targetId:en.id};
      return null;
    }
    case "wanashi":{ // 罠師：移動後の周囲8マスで、敵に最も近い空きマスに罠を設置
      const mine=G.traps.filter(t=>t.setter===p.id).length;
      const cells=ALL8.map(([a,b])=>[dr+a,dc+b])
        .filter(([r,c])=>inB(r,c)&&!at(r,c)&&!G.traps.some(t=>t.r===r&&t.c===c));
      if(!cells.length||!foes.length)return null;
      const distF=(r,c)=>{let m=99;for(const f of foes)m=Math.min(m,Math.abs(f.r-r)+Math.abs(f.c-c));return m;};
      cells.sort((A,B)=>distF(A[0],A[1])-distF(B[0],B[1]));
      const best=cells[0];
      if(distF(best[0],best[1])<=2 || mine<2){
        return {kind:"trap",tr:best[0],tc:best[1]};
      }
      return null;
    }
    case "majo":{ // 魔女：リスク回避 or 有利対面構築のための入替
      return witchPlan(p);
    }
    case "chokyo":{ // 調教師：敵との間に獣を召喚して対面戦闘。先制を取れる位置を最優先
      if(!foes.length)return null;
      const hasBeast=alive("E").some(b=>b.type==="kemono"&&b.flags.beastOf===p.id);
      if(hasBeast)return null;                 // 獣は盤面に1体まで
      if(p.ap<1)return null;
      // 召喚候補：調教師の隣接空きマス（獣は移動先ではなく現在位置周りに湧く）
      const cells=ORTHO.map(([a,b])=>[p.r+a,p.c+b]).filter(([r,c])=>inB(r,c)&&!at(r,c));
      if(!cells.length)return null;
      // 各候補を「召喚した獣がそのターンに先制攻撃できるか」「敵に近いか」で評価
      let best=null,bestScore=-1e9;
      for(const [r,c] of cells){
        let score=0;
        // 敵に近い（＝間に置いて対面できる）ほど良い
        let md=99;for(const f of foes)md=Math.min(md,Math.abs(f.r-r)+Math.abs(f.c-c));
        score-=md*10;
        // その位置から獣(ORTHO隣接)が先制攻撃できる敵がいれば大きく加点
        for(const f of foes){
          if(Math.abs(f.r-r)+Math.abs(f.c-c)===1){
            score+=120;                        // 召喚即先制の好位置
            if(f.hp<=1)score+=150;             // HP1の敵を先手で仕留められる
          }
        }
        if(score>bestScore){bestScore=score;best=[r,c];}
      }
      if(best)return {kind:"summon",sr:best[0],sc:best[1]};
      return null;
    }
    case "yusha":{ // 勇者：魔王が退場していれば近接特攻はsim側で扱う。ここでは何もしない
      return null;
    }
    case "miko":{ // 巫女：味方に+1行動。撤退／追撃／遠距離射撃／討ち取りを後押しする（HP0.5消費）
      if(p.ap<1||p.hp<=0.5)return null;
      const allies2=alive("E").filter(a=>a.id!==p.id&&a.type!=="miko");
      if(!allies2.length)return null;
      const threat=playerThreatMap();
      const enemyHasWitch=alive("P").some(f=>f.type==="majo");
      const foesV=alive("P").filter(f=>!f.flags.invisible);
      let best=null,bestScore=0;
      for(const a of allies2){
        const danger=threat[a.r*6+a.c]||0;
        let score=0;
        // ① 危険な位置の瀕死味方に+1行動＝早急に撤退させる
        if(a.hp<=1)score+=60;
        else if(a.hp<=1.5)score+=30;
        if(danger>0)score+=danger*40;
        if(enemyHasWitch)score+=25;
        // ② 遠距離駒（弓兵・狙撃手）に+1行動＝移動後に射撃 or 2回射撃できる
        if(a.type==="kyuhei"||a.type==="sogeki"){
          // 射程に敵がいる（すぐ撃てる）なら特に価値大（+1行動でもう一度撃つ／動いて撃つ）
          let canHit=false;
          for(const f of foesV){
            const inr=ssRangedCells({t:a.type,o:"E"},a.r,a.c).some(([rr,cc])=>rr===f.r&&cc===f.c);
            if(inr){canHit=true;break;}
          }
          score+= canHit?55:30;
        }
        // ③ 近接強駒に+1行動＝距離を詰めて先手／追撃、あるいは討ち取り
        if(["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(a.type)){
          const dmg=ssAtk({t:a.type,heroBoost:a.flags.heroBoost},"melee")||1;
          let md=99,tgt=null;
          for(const f of foesV){if(f.type==="kemono")continue;const d=Math.abs(a.r-f.r)+Math.abs(a.c-f.c);if(d<md){md=d;tgt=f;}}
          if(tgt){
            if(tgt.hp-dmg<=0 && md<=(a.maxAp||1)+1)score+=50; // +1行動で討ち取り圏に入る
            else if(md<=3)score+=25;                           // 距離を詰めて先手
          }
        }
        // 実際に動ける（隣接に空きがある）味方のみ有効
        const canMove=ORTHO.some(([dr,dc])=>inB(a.r+dr,a.c+dc)&&!at(a.r+dr,a.c+dc));
        if(!canMove && !(a.type==="kyuhei"||a.type==="sogeki"))score-=100;
        if(score>bestScore){bestScore=score;best=a;}
      }
      if(best&&bestScore>=40)return {kind:"kagura",targetId:best.id};
      return null;
    }
    case "seishoku":{ // 聖職者：味方全体のHP+0.5（1ゲーム1回）。急ぎの用が無い時に使う
      if(p.ap<1||p.flags.prayUsed)return null;
      const allies=alive("E").filter(a=>a.id!==p.id);
      if(!allies.length)return null;
      // 回復で「確定数（撃破に要する通常攻撃回数）」がズレる駒の数を数える。
      // HPが 0.5 増えると倒されにくくなる駒（＝端数がちょうど有効になる駒）を重視。
      let benefit=0, healable=0;
      for(const a of allies){
        if(a.hp>=3)continue;              // 満タンは回復されない（上限3）
        healable++;
        benefit+=1;                       // 1体でも回復価値あり
        // HPが .5 の端数を持つ／整数になる駒は確定数がズレやすい＝価値大
        const afterHp=Math.min(3,a.hp+0.5);
        if(Math.floor(afterHp)>Math.floor(a.hp))benefit+=1.2; // 整数の壁を越える＝耐久1段UP相当
        // 吸血鬼はHP2以下で使ってほしい（延命価値が高い）
        if(a.type==="kyuketsuki"&&a.hp<=2)benefit+=2.5;
        // 不死鳥が瀕死なら、復活させるより先に回復して延命する価値が高い
        if(a.type==="fushicho"&&a.hp<=1.5)benefit+=2.5;
      }
      if(healable===0)return null;
      // 複数体を同時回復できるほど加点（一度きりの祈祷を活かす）
      if(healable>=3)benefit+=2;
      else if(healable>=2)benefit+=1;
      // 「他に急務がない」判定：撃破できる隣接敵や、撃破されそうな味方の緊急退避が無いか
      const threat=playerThreatMap();
      const hasUrgentKill=alive("E").some(a=>{
        if(SS.noNormal.has(a.t)||a.flags.noAttack)return false;
        return ORTHO.some(([dr,dc])=>{const f=at(a.r+dr,a.c+dc);return f&&f.owner==="P"&&f.hp<=(ssAtk({t:a.t,heroBoost:a.flags.heroBoost},"melee")||1);});
      });
      const hasUrgentFlee=alive("E").some(a=>{const d=threat[a.r*6+a.c]||0;return d>0&&a.hp-d<=0;});
      if(hasUrgentKill||hasUrgentFlee)return null; // 急務がある時は祈祷しない
      if(benefit>=2)return {kind:"pray"};
      return null;
    }
    case "ninja":{ // 忍者：透明化（相手手番終了まで被弾無効）。透明化してから移動して安全に攻める
      if(p.ap<1||p.flags.invisible)return null;
      // すでに敵を討てる隣接位置なら、透明化より攻撃を優先（透明中は通常攻撃不可）
      const canStrike=ORTHO.some(([dr,dc])=>{const f=at(p.r+dr,p.c+dc);return f&&f.owner==="P"&&!f.flags.invisible;});
      if(canStrike)return null;
      // 敵陣・前線へ切り込む価値があるほど透明化して前進したい。
      // 近くに敵がいて危険、または敵陣へ潜り込めば先手を取れる状況で使う。
      const dmin=(()=>{let m=99;for(const f of alive("P"))if(!f.flags.invisible)m=Math.min(m,Math.abs(p.r-f.r)+Math.abs(p.c-f.c));return m;})();
      if(dmin<=4)return {kind:"vanish"}; // 敵が射程圏内＝透明化して安全に間合いを詰める
      return null;
    }
    default:
      return null; // 罠師/爆弾魔/軍師/魔女/超能力者/不死鳥 等は移動・通常攻撃で運用
  }
}

/* =========================================================
   深層探索：アルファベータ探索（ふつう10手／つよい15手先読み）
   独立した軽量シミュレータ上で手番交代を含む先読みを行う。
   サポート駒：剣士/弓兵/騎馬/戦士/盾兵/狙撃手/吸血鬼/呪詛師
   （AIプール＝この8種なので全手を厳密展開できる）
   ========================================================= */
const SS={ // 静的データ（全24種対応）
  // 通常攻撃を持たない駒
  noNormal:new Set(["kyuhei","sogeki","wanashi","miko","chokyo","majo"]),
  // 遠距離攻撃を「能力」として撃てる駒（探索で展開）
  ranged:new Set(["kyuhei","sogeki"]),
  // 行動力2の駒（騎馬・忍者・冒険者）
  ap2:new Set(["kiba","ninja","boken"]),
};
const SS_MAXAP={kiba:2,ninja:2,boken:2};
function ssClone(st){
  return {
    side:st.side, kP:st.kP, kE:st.kE, trapProb:st.trapProb, ninjaProb:st.ninjaProb, walls:st.walls,
    ps:st.ps.map(p=>({id:p.id,t:p.t,o:p.o,r:p.r,c:p.c,hp:p.hp,
      block:p.block?{r:p.block.r,c:p.block.c}:null,phoenix:p.phoenix,maxAp:p.maxAp,heroBoost:p.heroBoost,invis:p.invis}))
  };
}
/* 現局面を探索用stateへ変換（プレイヤー手番開始時点を想定） */
function ssFromGame(side){
  // 透明化した敵(P)忍者の正確な位置はAIに見せない。予測マップ(ninjaProb)で扱う。
  const hiddenFoeNinja = (side==="E");
  const ps=G.pieces.filter(p=>!p.dead && !(hiddenFoeNinja && p.owner==="P" && p.type==="ninja" && p.flags.invisible)).map(p=>({
    id:p.id,t:p.type,o:p.owner,r:p.r,c:p.c,hp:p.hp,
    block:p.flags.block?{r:p.flags.block.r,c:p.flags.block.c}:null,
    phoenix:!!p.flags.phoenix, maxAp:p.maxAp, heroBoost:!!p.flags.heroBoost,
    invis:!!p.flags.invisible
  }));
  // 罠の正確な位置はAIには見えない。罠師の位置から推定した「設置確率マップ」を持たせる。
  const trapProb=[];
  if(G.trapProb){
    for(const e of G.trapProb)for(const cl of e.cells)trapProb.push({r:cl.r,c:cl.c,prob:cl.prob});
  }
  // 透明忍者の潜伏位置も同様に「予測マップ」で持たせる（正確な位置は不明）。
  const ninjaProb=[];
  if(hiddenFoeNinja && G.ninjaProb){
    for(const e of G.ninjaProb)for(const cl of e.cells)ninjaProb.push({r:cl.r,c:cl.c,prob:cl.prob});
  }
  return {side, kP:G.kills.P, kE:G.kills.E, ps, trapProb, ninjaProb, walls:(G.walls||[]).map(w=>({r:w.r,c:w.c}))};
}
const ssAt=(st,r,c)=>st.ps.find(p=>p.r===r&&p.c===c);
function ssMoveDirs(t){ return (t==="kiba"||t==="ninja"||t==="kaizoku"||t==="taka")?ALL8:ORTHO; }
function ssColorOk(st,p,nr,nc){
  // 自陣3駒が同じ色の陣に偏ってはいけない（列0-2:左 / 3-5:右）
  const half=c=>c<3?0:1;
  const h=half(nc);
  let same=1;
  for(const q of st.ps){ if(q.o===p.o&&q.id!==p.id&&half(q.c)===h) same++; }
  return same<3;
}
function ssAtk(p,kind){
  let d=1;
  if(p.t==="kenshi")d+=0.5;
  if(p.t==="senshi"){if(p.hp<=1)d+=2;else if(p.hp<=2)d+=1;}
  if(p.t==="yusha"&&p.heroBoost&&kind==="melee")d=3;
  return d;
}
function ssRangedCells(p,r,c){
  const out=[];
  // 射線上に壁があると奥は狙えない。壁はAIの手番中は不変なので現在のG.wallsを参照。
  const rayPush=(dr,dc,maxK)=>{
    for(let k=1;k<=maxK;k++){
      const rr=r+dr*k, cc=c+dc*k;
      if(!inB(rr,cc))break;
      if(wallAt(rr,cc))break;
      out.push([rr,cc]);
    }
  };
  if(p.t==="kyuhei"){
    for(const [dr,dc] of ORTHO)rayPush(dr,dc,2);
    for(const [dr,dc] of DIAG)rayPush(dr,dc,1);
  }else if(p.t==="sogeki"){
    for(const [dr,dc] of DIAG)rayPush(dr,dc,3);
  }
  return out.filter(([rr,cc])=>inB(rr,cc));
}
function ssNormalCells(p){
  if(SS.noNormal.has(p.t))return [];
  let dirs;
  if(p.t==="souhei")dirs=[...DIAG,[frontDr(p.o),0]];
  else dirs=ORTHO;
  return dirs.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>inB(r,c));
}
/* ダメージ適用（撃破・不死鳥・吸血を処理）。撃破イベントを返す */
function ssDealDamage(st,attacker,target,kind){
  if(target.block&&attacker&&attacker.r===target.block.r&&attacker.c===target.block.c)return;
  let d=ssAtk(attacker,kind);
  let killed=target.hp-d<=0;
  if(killed&&target.t==="fushicho"&&!target.phoenix){
    target.phoenix=true;target.hp=0.5;killed=false;
  }else{
    target.hp=r2(target.hp-d);
  }
  if(attacker.t==="kyuketsuki"&&kind==="melee"&&attacker.hp<3){
    attacker.hp=r2(Math.min(3,attacker.hp+0.5));
  }
  if(killed){
    target.dead=true;
    if(target.o==="P")st.kE++; else st.kP++;
  }
}
function ssRemoveDead(st){ st.ps=st.ps.filter(p=>!p.dead); }
function ssTerminal(st){ return st.kP>=2||st.kE>=2; }

/* 1手番ぶんの合法手を列挙（移動+能力、その後ベスト通常攻撃を自動付与）
   戻り値：適用後stateの配列。手番側=st.side */
function ssGenerate(st){
  const side=st.side;
  const mine=st.ps.filter(p=>p.o===side);
  const out=[];
  const pushState=(ns)=>{
    // 手番内のベスト通常攻撃を1回付与
    ssBestAttack(ns,side);
    ssRemoveDead(ns);
    ns.side=(side==="P")?"E":"P";
    out.push(ns);
  };
  for(const p of mine){
    // 到達マス（BFS, 色制約あり）
    const dests=ssReach(st,p);
    for(const d of dests){
      // 移動のみ
      const ns=ssClone(st);
      const np=ns.ps.find(x=>x.id===p.id);
      np.r=d.r;np.c=d.c;
      pushState(ns);
      // 遠距離（弓兵・狙撃）：移動後に残APがあれば
      if(SS.ranged.has(p.t)&&d.apLeft>=1){
        const cells=ssRangedCells(np,d.r,d.c);
        for(const [rr,cc] of cells){
          const t=ssAt(ns,rr,cc);
          if(t&&t.o!==side&&!(t.block)&&ssTargetable(t,side)){
            const ns2=ssClone(st);
            const a2=ns2.ps.find(x=>x.id===p.id); a2.r=d.r;a2.c=d.c;
            const t2=ns2.ps.find(x=>x.r===rr&&x.c===cc&&x.o!==side);
            if(t2)ssDealDamage(ns2,a2,t2,"ranged");
            pushState(ns2);
          }
        }
      }
      // 呪詛師：その場（cost0）で全体-0.5（HP>=1.5、自壊すれば相手の勝ち点）
      if(p.t==="jusoshi"&&d.cost===0&&np.hp>=1.5){
        const ns3=ssClone(st);
        const a3=ns3.ps.find(x=>x.id===p.id);
        for(const t of ns3.ps.filter(x=>x.o!==side)){
          let killed=t.hp-0.5<=0;
          if(killed&&t.t==="fushicho"&&!t.phoenix){t.phoenix=true;t.hp=0.5;killed=false;}
          else t.hp=r2(t.hp-0.5);
          if(killed){t.dead=true;if(t.o==="P")ns3.kE++;else ns3.kP++;}
        }
        a3.hp=r2(a3.hp-1.5);
        if(a3.hp<=0){a3.dead=true;if(a3.o==="P")ns3.kE++;else ns3.kP++;}
        pushState(ns3);
      }
    }
  }
  if(out.length===0){ // 手詰まり：パス
    const ns=ssClone(st);ssBestAttack(ns,side);ssRemoveDead(ns);
    ns.side=(side==="P")?"E":"P";out.push(ns);
  }
  return out;
}
/* BFS到達（color制約・遮断あり）→ {r,c,cost,apLeft} */
function ssReach(st,p){
  const res={[p.r+","+p.c]:{cost:0}};
  let frontier=[{r:p.r,c:p.c}];
  const dirs=ssMoveDirs(p.t);
  const occupied=(r,c)=>st.ps.some(q=>q.id!==p.id&&q.r===r&&q.c===c);
  const wall=(r,c)=>st.walls&&st.walls.some(w=>w.r===r&&w.c===c); // 錬金術師の壁
  for(let s=0;s<p.maxAp;s++){
    const nf=[];
    for(const cur of frontier){
      for(const [dr,dc] of dirs){
        let nr=cur.r+dr,nc=cur.c+dc;
        let wrap=false;
        if(p.t==="boken"&&nc!==((nc+6)%6)){ nc=(nc+6)%6; wrap=true; } // 冒険者：左右ループ（コスト0）
        if(!inB(nr,nc))continue;
        const k=nr+","+nc;
        if(res[k])continue;
        if(occupied(nr,nc))continue;
        if(wall(nr,nc))continue;              // 壁のマスには入れない
        if(!ssColorOk(st,p,nr,nc))continue;
        const stepCost=wrap?0:1;
        res[k]={cost:res[cur.r+","+cur.c].cost+stepCost};
        nf.push({r:nr,c:nc});
      }
    }
    frontier=nf;
  }
  // 騎馬跳躍
  if(p.t==="kiba"&&p.maxAp>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(nr,nc))continue;
      if(wall(mr,mc))continue;                // 中間が壁なら飛び越え不可
      if(!occupied(mr,mc))continue;           // 中間に駒がある時のみ跳躍
      if(occupied(nr,nc))continue;
      if(wall(nr,nc))continue;                // 着地マスが壁なら不可
      if(!ssColorOk(st,p,nr,nc))continue;
      const k=nr+","+nc;
      if(!res[k]||res[k].cost>2)res[k]={cost:2};
    }
  }
  return Object.keys(res).map(k=>{
    const [r,c]=k.split(",").map(Number);
    return {r,c,cost:res[k].cost,apLeft:p.maxAp-res[k].cost};
  });
}
/* 手番側のベスト通常攻撃を1回だけ適用 */
/* 攻撃側sideから見て、この駒を狙えるか（敵の透明忍者は狙えない） */
function ssTargetable(t,bySide){ return !(t.invis && t.o!==bySide); }
function ssBestAttack(st,side){
  let best=null,bs=-1;
  for(const a of st.ps.filter(x=>x.o===side&&!SS.noNormal.has(x.t))){
    for(const [r,c] of ssNormalCells(a)){
      const t=st.ps.find(x=>x.r===r&&x.c===c&&x.o!==side);
      if(!t)continue;
      if(!ssTargetable(t,side))continue; // 透明忍者は攻撃不可
      if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
      const d=ssAtk(a,"melee");
      const kills=t.hp-d<=0&&!(t.t==="fushicho"&&!t.phoenix);
      let s=(kills?1000:0)+d*200+(3-Math.max(0,t.hp-d))*40;
      if(t.t==="kemono")s=s*0.08-30; // 獣は撃破価値が低い（即再召喚）→調教師本体を優先
      if(s>bs){bs=s;best={a,t};}
    }
  }
  if(best)ssDealDamage(st,best.a,best.t,"melee");
}

/* 静的評価（E視点：高いほどEに有利） */
/* 後手からでも殴り勝てる（防御側でも強い）駒 */
const SS_COUNTER_STRONG=new Set(["kenshi","senshi","kyuketsuki","fushicho","kusushi"]);
/* トラップ／不可視攻撃を仕掛けうる駒（居た場所の周囲が危険） */
const SS_TRAPPER=new Set(["wanashi","bakudan","ninja","esper"]);

/* プレイヤーの脅威マップ：各マスへ「次のプレイヤー手番で入りうる最大被ダメージ」を算出。
   移動→通常攻撃、遠距離、軍師/巫女による追加行動・射程延長も概算で加味する。 */
function ssPlayerThreat(st){
  if(st._danger)return st._danger;
  const danger={}; // "r,c" -> 予想被ダメージ
  const bump=(r,c,d)=>{const k=r+","+c;if(!danger[k]||danger[k]<d)danger[k]=d;};
  const pP=st.ps.filter(p=>p.o==="P");
  const hasMiko=pP.some(p=>p.t==="miko");     // 巫女：味方+1行動力
  const extraMove=(hasMiko?1:0);
  for(const p of pP){
    const mover={...p, maxAp:p.maxAp+extraMove};
    const reach=ssReach(st,mover);
    reach.push({r:p.r,c:p.c,cost:0,apLeft:mover.maxAp}); // その場も含む
    for(const d of reach){
      const from={...p,r:d.r,c:d.c};
      if(!SS.noNormal.has(p.t)){
        for(const [ar,ac] of ssNormalCells(from)){
          bump(ar,ac, ssAtk(from,"melee"));
        }
      }
      if(SS.ranged.has(p.t)&&d.apLeft>=1){
        for(const [ar,ac] of ssRangedCells(from,d.r,d.c)) bump(ar,ac,1);
      }
    }
  }
  st._danger=danger;
  return danger;
}

/* E駒 e が、爆弾魔 bm の爆風圏(bmからチェビシェフ2以内)の外へ、
   自分の行動力で移動して逃げられるか。逃げられれば true。 */
function ssCanEscapeBlast(st,e,bm){
  // 現在チェビシェフ距離。爆風圏を出るのに必要な最小マス数の下限は (3 - cheb) 以上。
  const cheb=Math.max(Math.abs(e.r-bm.r),Math.abs(e.c-bm.c));
  const needed=3-cheb;            // cheb2→1歩, cheb1→2歩, cheb0→3歩 で圏外(cheb>2)
  if(needed<=0)return true;       // 既に圏外
  if(e.maxAp<needed)return false; // 行動力が足りず物理的に逃げられない
  // 行動力が足りる場合のみBFSで実際に圏外へ出られるか確認
  const reach=ssReach(st,e);
  for(const d of reach){
    if(Math.max(Math.abs(d.r-bm.r),Math.abs(d.c-bm.c))>2)return true;
  }
  return false;
}
function ssEval(st){
  if(st.kE>=2)return 1e7;
  if(st.kP>=2)return -1e7;
  let v=(st.kE-st.kP)*5000;
  const eP=st.ps.filter(p=>p.o==="E"), pP=st.ps.filter(p=>p.o==="P");
  // 駒の存在＋HP総量（E加点・P減点）
  for(const p of eP)v+=120+p.hp*80;
  for(const p of pP){
    // 獣(kemono)は倒しても調教師HP-0.5＆即再召喚されるため、標的価値をほぼ無視する
    if(p.t==="kemono"){ v-=10; continue; }
    v-=120+p.hp*80;
  }
  const dist=(a,arr)=>{let m=99;for(const b of arr)m=Math.min(m,Math.abs(a.r-b.r)+Math.abs(a.c-b.c));return m;};

  // === 調教師の戦法：獣を召喚して対面戦闘。獣未召喚の調教師は戦力が遊んでいる ===
  for(const tamer of eP.filter(x=>x.t==="chokyo")){
    const myBeast=eP.find(b=>b.t==="kemono");
    if(!myBeast && pP.length){
      // まだ獣を出していない＝早く召喚すべき。敵が近いほど「早く出して対面したい」ので減点
      v-=30;
      const dEnemy=dist(tamer,pP);
      if(dEnemy<=3)v-=(4-dEnemy)*10; // 敵が接近しているのに獣未召喚はさらに損
    }
    // 調教師は強襲タイプ(騎馬・忍者・冒険者)が苦手。獣が距離を詰め返す前に本体を襲われる。
    // 強襲駒が近いほど強く警戒し、調教師を逃がす／距離を取る判断を促す。
    for(const f of pP){
      if(f.t==="kiba"||f.t==="ninja"||f.t==="boken"){
        const man=Math.abs(tamer.r-f.r)+Math.abs(tamer.c-f.c);
        if(man<=3)v-=(4-man)*22; // 強襲駒が接近＝調教師本体が危ない
      }
    }
  }
  // E側の獣が敵に先制攻撃できる位置にいれば加点（獣で先手を取る戦法）
  for(const b of eP.filter(x=>x.t==="kemono")){
    for(const f of pP){
      if(Math.abs(b.r-f.r)+Math.abs(b.c-f.c)===1){
        v+=20;                        // 獣が敵と対面＝牽制になっている
        if(f.hp<=1)v+=40;             // HP1の敵を獣で仕留めうる
      }
    }
  }

  const beasts=pP.filter(p=>p.t==="kemono");
  if(beasts.length){
    const tamers=pP.filter(p=>p.t==="chokyo");
    // 攻撃できる駒（特に強襲）は、獣を避けずに調教師本体へ寄せる。
    // 獣を倒しても勝ち点にならず即再召喚されるため、親（調教師）を討つのが本筋。
    const attackerTypes=new Set(["kenshi","senshi","kiba","souhei","kyuketsuki","ninja","boken","yusha","fushicho","kusushi"]);
    for(const e of eP){
      if(SS.noNormal.has(e.t)){
        // 通常攻撃を持たない脆い後衛だけは獣に近づきすぎない
        const db=dist(e,beasts);
        if(db<=2)v-=(3-db)*14;
        continue;
      }
      if(tamers.length){
        // 攻撃駒は調教師へ寄せる（獣は素通り／蹴散らしてよい）。強く引き寄せる。
        const dt=dist(e,tamers);
        const pull = attackerTypes.has(e.t)?16:9; // 強襲・近接は特に強く親へ向かう
        v-=dt*pull;
        // 調教師に隣接＝討ち取り目前なら大きく加点
        if(dt===1)v+=50;
      }
    }
  }

  // === スコア状況による守備倍率 ===
  // 勝ち点をプレイヤーに先行されている（kP>kE）＝あと1つ取られると負け。
  // この時は駒を失わないことの価値をやや引き上げるが、過度に守りに入って
  // 逃げ回るのは本末転倒（勝つには2点取る必要がある）なので控えめに。
  let defMul=1.0;
  if(st.kP>st.kE){
    defMul = (st.kP>=1) ? 1.35 : 1.2; // 以前は2.2/1.6で守りすぎだった
  }

  // === プレイヤーの脅威マップ：危険マスに居るE駒を強く割り引く ===
  const danger=ssPlayerThreat(st);
  for(const p of eP){
    const dmg=danger[p.r+","+p.c]||0;
    if(dmg>0){
      // 被弾の見込みを減点。撃破されうる（HP<=dmg）なら特に重く
      let pen=dmg*70;
      if(p.hp-dmg<=0){
        pen+=340; // 次手番で取られる位置
        // 後手からでも殴り勝てる駒は、あえて踏み込む価値があるので緩和
        if(SS_COUNTER_STRONG.has(p.t))pen-=120;
      }
      v-=pen*defMul;
    }
  }

  // === 追い詰め検知：脅威下のE駒の逃げ方を評価する ===
  // 重要：隣接戦闘から「ただ逃げる」だけでは、行動力差が無い限り追いつかれて不利になるだけ。
  //   逃げるなら“援護のある”マスへ逃げる必要がある：
  //   (A) 自軍の弓兵・狙撃手の射程に追手が入る位置（＝逃げ込めば追手を撃てる）
  //   (B) 自軍の剣士・戦士がカバー（隣接して反撃）に行ける位置
  //   これらを満たす退避は加点、満たさない「ただ逃げるだけ」の退避は評価しない。
  const eRanged=eP.filter(p=>p.t==="kyuhei"||p.t==="sogeki");
  const eCover =eP.filter(p=>p.t==="kenshi"||p.t==="senshi"||p.t==="souhei"||p.t==="kiba");
  // マス(r,c)に逃げた駒を追う「追手候補」＝そのマスに隣接攻撃で届くプレイヤー駒
  const pursuersOf=(r,c)=>pP.filter(f=>!SS.noNormal.has(f.t)&&Math.abs(f.r-r)+Math.abs(f.c-c)===1);
  // 追手がいる位置pに対して、自軍が援護（射程/カバー）できるか
  const isSupported=(r,c)=>{
    const pursuers=pursuersOf(r,c);
    if(!pursuers.length)return false;
    for(const pu of pursuers){
      // (A) 弓兵・狙撃手の射程に追手が入るか
      for(const rg of eRanged){
        if(ssRangedCells({t:rg.t,o:"E"},rg.r,rg.c).some(([rr,cc])=>rr===pu.r&&cc===pu.c))return true;
      }
      // (B) 剣士・戦士・槍兵・騎馬が、追手の隣接マスへ1手で入れるか（カバー）
      for(const cv of eCover){
        if(cv.id===undefined)continue;
        // 追手の隣接空きマスに、カバー駒が可動域(maxAp)内で到達できるか（簡易：チェビシェフ距離）
        const reach=cv.maxAp||1;
        for(const [dr,dc] of ORTHO){
          const ar=pu.r+dr, ac=pu.c+dc;
          if(!inB(ar,ac))continue;
          if(st.ps.some(q=>q.r===ar&&q.c===ac))continue; // 空きマスのみ
          const cheb=Math.max(Math.abs(cv.r-ar),Math.abs(cv.c-ac));
          const man=Math.abs(cv.r-ar)+Math.abs(cv.c-ac);
          const step=(cv.t==="kiba")?cheb:man; // 騎馬は斜め可
          if(step<=reach)return true;
        }
      }
    }
    return false;
  };
  for(const p of eP){
    const here=danger[p.r+","+p.c]||0;
    // 撃破圏内にいる駒だけを対象（HP<=被ダメ）
    if(here>0 && p.hp-here<=0){
      // ただし、この駒が隣接する敵を「先制で討てる」なら、逃げより攻撃が優先。
      // その場合は追い詰め減点を課さない（攻めに転じるべき局面）。
      let canKillNow=false;
      if(!SS.noNormal.has(p.t)){
        const dmg=ssAtk({t:p.t,heroBoost:p.heroBoost},"melee")||1;
        for(const f of pP){
          if(Math.abs(p.r-f.r)+Math.abs(p.c-f.c)===1 && f.hp-dmg<=0){canKillNow=true;break;}
        }
      }
      if(canKillNow)continue; // 先制撃破できるなら逃げ評価しない
      const dests=ssReach(st,p);
      let safeSupported=0, safeBare=0, total=0;
      for(const d of dests){
        if(d.r===p.r&&d.c===p.c)continue;
        total++;
        const dd=danger[d.r+","+d.c]||0;
        if(p.hp-dd>0){
          if(pursuersOf(d.r,d.c).length===0) safeSupported++;
          else if(isSupported(d.r,d.c))       safeSupported++;
          else                                safeBare++;
        }
      }
      if(total>0){
        if(safeSupported===0 && safeBare===0){
          v-=160*defMul;      // どこへ動いても取られる → ほぼ確定で失う
        }else if(safeSupported===0){
          v-=55*defMul;       // 逃げてもただ追われるだけ（以前-120→緩和）
        }else if(safeSupported<=1){
          v-=25*defMul;
        }
      }
    }
  }
  // 援護退避を促す加点：脅威下のE駒が「援護マス」に居るなら評価を上げる
  for(const p of eP){
    const here=danger[p.r+","+p.c]||0;
    if(here>0 && p.hp-here>0){ // 被弾圏だが今は生存（＝踏みとどまっている）
      if(isSupported(p.r,p.c))v+=18*defMul; // 援護のある位置での対峙は良い
    }
  }

  // === 攻め圧＆初手優位：役割(戦法)に応じて前線への出方を変える ===
  for(const p of eP){
    if(pP.length){
      const dmin=dist(p,pP);
      const role=PIECE_ROLE[p.t]||"sortie";
      const adv=ROLE_ADVANCE[role]!==undefined?ROLE_ADVANCE[role]:10;
      v-=dmin*adv; // 出撃・強襲は前へ出る価値大、牽制・迎撃は小（後衛を保つ）
      // 迎撃・牽制の遠距離/罠役は、近づきすぎ（隣接）を軽くペナルティ（後方で運用）
      if((role==="intercept"||role==="control") && dmin===1 && SS.noNormal.has(p.t))v-=15;
      // 通常攻撃を先に当てられる間合い（隣接）で、返り討ちに遭わない駒は強く加点。
      // 「先手を取れる場面では接近して攻撃に転じる」ことを最優先で促す。
      if(!SS.noNormal.has(p.t)&&dmin===1){
        const dgot=danger[p.r+","+p.c]||0;
        if(p.hp-dgot>0){
          v+=70; // 先制して生き残れる好位置（以前の45から強化）
          // 隣接する敵をこの先制で削れる／討てるなら追加で大きく加点
          for(const f of pP){
            if(SS.noNormal.has(p.t))break;
            if(Math.abs(p.r-f.r)+Math.abs(p.c-f.c)!==1)continue;
            const dmg=ssAtk({t:p.t,heroBoost:p.heroBoost},"melee")||1;
            if(f.hp-dmg<=0)v+=90;      // 先制で撃破できる＝勝ちに直結
            else v+=dmg*22;            // 削るだけでも次の先手の価値を上げる
          }
        }
      }
    }
  }
  for(const p of pP){ if(eP.length)v+=dist(p,eP)*6; }

  // === 弓兵・狙撃手の支援布陣 ===
  // 基本は迎撃（待ち）だが、味方と接敵している敵駒を射程に捉えられる位置に居るなら、
  // その敵を撃って味方のバトルを支援できる。そういう位置を積極的に評価する。
  for(const rg of eP.filter(x=>x.t==="kyuhei"||x.t==="sogeki")){
    const inRange=ssRangedCells({t:rg.t,o:"E"},rg.r,rg.c);
    for(const f of pP){
      // fが自軍E駒と隣接＝「接敵中」の敵か
      const engaged=eP.some(a=>a.id!==rg.id&&Math.abs(a.r-f.r)+Math.abs(a.c-f.c)===1);
      if(!engaged)continue;
      // その接敵中の敵が、この弓兵/狙撃手の射程に入っているか
      if(inRange.some(([rr,cc])=>rr===f.r&&cc===f.c)){
        v+=34;                       // 味方の戦闘を射線で支援できる好位置
        if(f.hp<=1)v+=40;            // 射撃で仕留められる敵なら特に価値大
        else v+=(3-f.hp)*10;         // 削れている敵ほど支援価値が高い
      }
    }
  }

  // === 戦法：後衛で運用すべき駒は前線に晒さない ===
  // 聖職者は倒れると味方全員に1ダメージ＝狙われてはいけない。危険地帯を強く忌避し後方を保つ。
  for(const p of eP.filter(x=>x.t==="seishoku")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*90+60;          // 攻撃圏にいるだけで重く減点
    v-=(5-Math.min(5,dist(p,pP)))*10; // 敵に近いほど減点＝後方に置く
  }
  // 軍師は指揮役。HPを消費して2駒動かすので、前線で削られるのを避け後方に置く。
  for(const p of eP.filter(x=>x.t==="gunshi")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*70+40;
  }
  // 巫女は通常攻撃不可＋能力でHPを失う脆い支援役。「後衛最奥に隠れ対面戦闘を避ける」戦法に従い、
  // 攻撃圏を強く忌避し、盤面最奥(自陣side)を保たせる。
  for(const p of eP.filter(x=>x.t==="miko")){
    const dgot=danger[p.r+","+p.c]||0;
    if(dgot>0)v-=dgot*100+70;          // 攻撃圏に晒すのは厳禁級
    // 敵に近いほど強く減点（対面戦闘を避け最奥へ）
    v-=(5-Math.min(5,dist(p,pP)))*14;
    // どの味方よりも後ろ（敵から遠い側）に居るのが理想
    let behindAlly=false;
    for(const q of eP){ if(q.id!==p.id && dist(q,pP)<dist(p,pP)){behindAlly=true;break;} }
    if(!behindAlly && eP.length>1)v-=25; // 前衛より前に出ていたら減点
  }
  // 巫女・聖職者・軍師・調教師など攻撃0の後衛は、無闇に前へ出ない（役割ロジックで概ね担保済み）

  // === 忍者の透明化：透明中は被弾無効で安全に敵陣へ切り込める貴重な先手駒 ===
  for(const p of eP.filter(x=>x.t==="ninja")){
    if(p.invis){
      // 透明忍者は敵に近いほど価値大（先手の起点／どこにいるか分からない牽制）
      const dmin=dist(p,pP);
      v+=20;                          // 透明化そのものが安全な前進手段
      v+=(6-Math.min(6,dmin))*8;      // 敵陣に切り込んでいるほど加点
      // 透明忍者の隣接に敵がいれば、次に踏み込まれた敵へ3ダメージの奇襲が狙える
      for(const f of pP){ if(Math.abs(p.r-f.r)+Math.abs(p.c-f.c)===1)v+=14; }
    }
  }
  // === 聖職者の祈祷余地：味方が削れているほど「全体+0.5回復」の価値が高い ===
  // （祈祷は探索では直接展開しないが、削れた味方が多い局面で聖職者を働かせたいので軽く誘導）
  for(const p of eP.filter(x=>x.t==="seishoku"&&!x.prayUsed)){
    let hurt=0;
    for(const a of eP){ if(a.id!==p.id && a.hp<3)hurt+=(3-a.hp); }
    if(hurt>0)v+=Math.min(20,hurt*6);  // 削れた味方が多いほど、祈祷の出番が近い＝聖職者を活かす
  }


  // 瀕死の相手は仕留めやすい→加点／自軍の瀕死は減点
  for(const p of pP)if(p.hp<=1)v+=60;
  for(const p of eP)if(p.hp<=1)v-=60;

  // === 討ち取り主導：低HPの敵「主力」を先手で仕留められる位置へ攻撃駒を寄せる ===
  // 被弾を恐れて逃げ回るより、確実に討てる相手を積極的に狙う（＝先手を取って勝ちに行く）。
  // 獣(kemono)は勝ち点にならないので対象外（＝獣ではなく倒せる主力を狙う）。
  const killTargets=pP.filter(f=>f.t!=="kemono" && f.hp<=1.5);
  if(killTargets.length){
    for(const e of eP){
      if(SS.noNormal.has(e.t))continue;         // 通常攻撃できる駒のみ
      const dmg=ssAtk({t:e.t,heroBoost:e.heroBoost},"melee")||1;
      for(const f of killTargets){
        if(f.hp-dmg>0)continue;                  // 一撃で討てる相手だけ
        const d=Math.abs(e.r-f.r)+Math.abs(e.c-f.c);
        if(d===1)      v+=110;                    // 既に隣接＝この手番で討てる（最優先）
        else if(d<=(e.maxAp||1)+1) v+=55;         // 1手で討ち取り圏に入れる
        else           v+=Math.max(0,(6-d))*10;   // 近いほど寄せる価値
      }
    }
  }

  // === 追撃：近接強駒（剣士・戦士・騎馬・槍兵・吸血鬼）は逃げる敵を深追いして仕留める ===
  // 接敵した相手が逃げても、行動力差が無ければ追いつける。強駒ほど積極的に距離を詰める。
  const chasers=eP.filter(e=>["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(e.t));
  for(const e of chasers){
    // 最も近い敵主力（獣以外）への距離を詰めるほど加点
    let md=99, target=null;
    for(const f of pP){
      if(f.t==="kemono")continue;
      const d=Math.abs(e.r-f.r)+Math.abs(e.c-f.c);
      if(d<md){md=d;target=f;}
    }
    if(target){
      // 近いほど良い（追撃圧）。隣接なら攻撃できる好位置。
      if(md===1)      v+=28;
      else if(md===2) v+=16;
      else            v+=Math.max(0,(6-md))*4;
      // 相手が削れているほど深追いの価値が高い（あと一押しで討てる）
      if(target.hp<=1.5)v+=(2-Math.min(2,md))*20;
    }
  }

  // === 相性：後手でも殴り勝てるプレイヤー駒の隣に、脆いE駒を置かない ===
  for(const cs of pP.filter(x=>SS_COUNTER_STRONG.has(x.t)||(x.t==="yusha"&&x.heroBoost))){
    for(const e of eP){
      if(Math.abs(e.r-cs.r)+Math.abs(e.c-cs.c)===1){
        // 相手の反撃想定ダメージ
        const back=ssAtk(cs,"melee");
        if(e.hp-back<=0){
          // 覚醒勇者(攻撃3)は全駒を一撃で葬るので特に強く忌避
          v-=((cs.t==="yusha"&&cs.heroBoost)?150:90)*defMul;
        }
      }
    }
  }
  // 覚醒勇者の間合い（移動＋攻撃で届く範囲）にE駒を置かない：脅威マップにも反映済みだが追加で強調
  for(const y of pP.filter(x=>x.t==="yusha"&&x.heroBoost)){
    for(const e of eP){
      const man=Math.abs(e.r-y.r)+Math.abs(e.c-y.c);
      if(man<=2)v-=(3-man)*22*defMul; // 覚醒勇者に近いほど危険（次手番で3ダメージ圏内）
    }
  }

  // === 罠：踏むと1ダメージ＋次ターン行動力-1。これは「バトルの先手を奪われる」ことと同義で、
  //        このゲームでは先手を取られる＝非常に不利。罠は徹底的に回避する。===
  // AIは罠の正確な位置を知らず、罠師の位置から推定した「設置確率マップ」で警戒する。
  // 確率が高いマスほど強く避け、18%超のマスは最大限に警戒する（どうしても必要な時だけ通る）。
  if(st.trapProb&&st.trapProb.length){
    for(const e of eP){
      for(const tp of st.trapProb){
        const prob=tp.prob||0;
        if(e.r===tp.r&&e.c===tp.c){
          // 罠を踏む実害＝先手を奪われる＋1ダメージ。確率に応じて忌避するが、
          // 得点（撃破=5000）を妨げるほど過大にはしない。踏み抜かなければ無害なので。
          if(prob>=0.18) v-= 90 + prob*220;    // 高確率マスは避けたいが、得点機会があれば踏んでよい
          else           v-= prob*240;
          if(e.hp<=1)    v-= prob*180;          // 瀕死なら踏むと落ちる恐れ＝やや強め
        }else{
          const man=Math.abs(e.r-tp.r)+Math.abs(e.c-tp.c);
          if(man===1) v-= prob*60;
          else if(man===2) v-= prob*20;
        }
      }
    }
  }
  // 潜在的な罠ゾーン：罠師が生存していると、まだ見えていない罠が仕掛けられている可能性がある。
  // 罠師の周辺（移動＋設置が届く範囲）に安易に侵入すると罠を踏むリスクが高いので警戒する。
  for(const trapper of pP.filter(x=>x.t==="wanashi")){
    for(const e of eP){
      // 罠師の可動域を考え、周囲3マス圏を潜在危険域とみなす
      const cheb=Math.max(Math.abs(e.r-trapper.r),Math.abs(e.c-trapper.c));
      if(cheb<=3){
        // 近いほど罠を踏むリスク大。既知の罠ほどではないが確実に警戒する
        v-=(4-cheb)*24;
        if(e.hp<=1)v-=(4-cheb)*10; // 瀕死駒は特に罠圏に入れたくない
      }
    }
  }

  // === 透明化した忍者：正確な位置は不明。予測マップ(ninjaProb)で潜伏を警戒する。 ===
  // 自分から忍者のマスに踏み込まなければ何も起きないので、潜伏確率の高いマスへの
  // 踏み込みを、確率に応じて避ける（罠と同様の考え方）。
  if(st.ninjaProb&&st.ninjaProb.length){
    for(const e of eP){
      for(const np of st.ninjaProb){
        const prob=np.prob||0;
        if(e.r===np.r&&e.c===np.c){
          // 潜伏確率の高いマスに重なる＝3ダメージ被弾の恐れ。確率に応じて強く避ける。
          v-= prob*260;
          if(e.hp<=1.5)v-= prob*160; // 瀕死なら踏むと落ちる恐れ
        }else{
          const cheb=Math.max(Math.abs(e.r-np.r),Math.abs(e.c-np.c));
          if(cheb===1) v-= prob*70;   // 高確率マスの隣は次に踏みうる
        }
      }
    }
  }



  // === 爆弾魔：次に隣接マスへ爆弾を置かれると、自分手番終了時に3×3へ1.5ダメージ ===
  // 爆風が届く範囲(爆弾魔の周囲2マス圏=設置マス＋その8近傍)に居るE駒について、
  // 爆発までに爆風圏外へ逃げられるかを考慮して警戒する。
  for(const bm of pP.filter(x=>x.t==="bakudan")){
    for(const e of eP){
      const cheb=Math.max(Math.abs(e.r-bm.r),Math.abs(e.c-bm.c));
      if(cheb>2)continue;              // 爆弾は隣接設置＋3×3爆風＝爆弾魔から最大2マス圏
      // このE駒が爆風圏(cheb<=2)から、自分の行動力で抜け出せるか
      const canEscape = ssCanEscapeBlast(st,e,bm);
      if(cheb<=1){
        // 至近は特に危険。逃げられないなら重く、逃げられても油断はしない
        v-= canEscape ? 22 : 85;
      }else{ // cheb===2
        v-= canEscape ? 7 : 36;
      }
      if(e.hp<=1.5 && !canEscape)v-=60; // 爆弾は1.5ダメージ→HP1.5以下は逃げないと落ちる
    }
  }

  // === 相手が魔女を盤面に持つ場合の総合対策 ===
  // 魔女は「味方同士 or 敵同士の位置を入れ替える」。入替直後、入れ替わった相手駒は
  // 基本的に行動力不足で動けず“再配置されるだけ”だが、これにより相手は容易に逃げ／追撃でき、
  // こちらの瀕死駒は撤退が難しくなる。対策の最低条件は「必ず先手を取る」こと。
  if(pP.some(p=>p.t==="majo")){
    const pAtk=pP.filter(x=>["kenshi","senshi","kiba","souhei","kyuketsuki","ninja","sogeki","kyuhei"].includes(x.t)||(x.t==="yusha"&&x.heroBoost));
    let worstAtk=0;for(const a of pAtk)worstAtk=Math.max(worstAtk,ssAtk(a,"melee"));
    // 入替先候補＝魔女以外のプレイヤー駒の位置（そこへ相手アタッカーが飛んできうる）
    const anchors=pP.filter(a=>a.t!=="majo");

    for(const e of eP){
      // (1) どの位置に何が来ても対処できる備え：
      //     アタッカーが入替でe隣接に来ると先手を奪われる。特に瀕死ほど致命的。
      let adjAnchor=false;
      for(const anchor of anchors){
        if(Math.abs(e.r-anchor.r)+Math.abs(e.c-anchor.c)===1){adjAnchor=true;break;}
      }
      if(adjAnchor && pAtk.length){
        if(e.hp-worstAtk<=0) v-=70;   // 入替→即撃破されうる配置は強く避ける
        else                 v-=18;   // 先手を取られる不利
      }

      // (2) 瀕死のE駒は「逃がせなくなる」。魔女がいる間は前線／危険域に置かない。
      //     相手は入替で追ってこられるので、脆い駒ほど後方の安全地帯へ。
      if(e.hp<=1.5){
        const frontExposure=Math.max(0,(4-dist(e,pP))); // プレイヤー駒に近いほど危険
        v-=frontExposure*22;
        if(e.hp<=1)v-=frontExposure*14; // HP1は特に致命的
      }
    }

    // (3) 先手を取るための布石。各対策の有効度に応じて加点する。
    //  ・術士：相手の魔女の行動力を奪えば「そもそも入れ替えさせない」＝最有力の対策。
    //  ・悪霊：効果を受けていない駒は攻撃してくるので部分的（60点相当）。
    //  ・巫女：どの駒でも行動力2にして距離を詰められるが、巫女自身が前線に晒される（60点相当）。
    //  ・魔女：入れ替えを入れ替えで戻せる（相打ち）ほか、入替→通常攻撃の順を活かして
    //         火力の高い駒（剣士・低HP戦士・覚醒勇者・薬師・吸血鬼）を前線へ出撃させられる。
    const eJutsu=eP.find(p=>p.t==="jutsushi");
    const eWitch=pP.find(p=>p.t==="majo");
    if(eJutsu){
      v+=40; // 魔女封じの最有力手段
      // 術士が魔女に近い（次ターン減速が届く）ほど、入替そのものを止められる
      if(eWitch){
        const d=Math.abs(eJutsu.r-eWitch.r)+Math.abs(eJutsu.c-eWitch.c);
        if(d<=3)v+=(4-d)*10; // 魔女を射程に捉えているほど高評価
      }
    }
    if(eP.some(p=>p.t==="akuryo"))v+=16; // 60点相当：1体しか封じられない
    if(eP.some(p=>p.t==="miko"))  v+=16; // 60点相当：巫女自身が前線に出るリスクあり
    if(eP.some(p=>p.t==="majo"))  v+=22; // 入替を入替で相殺、かつ火力駒の出撃にも使える
  }

  // === 超能力者の周囲：押し出しで隊形を崩される。近接する脆いE駒を軽く警戒 ===
  for(const es of pP.filter(x=>x.t==="esper")){
    for(const e of eP){
      const man=Math.abs(e.r-es.r)+Math.abs(e.c-es.c);
      if(man<=2)v-=(3-man)*8;
    }
  }

  // === プレイヤーの妨害駒（術士・悪霊・呪詛師）への警戒 ===
  const pJutsu=pP.some(p=>p.t==="jutsushi");
  const pAkuryo=pP.some(p=>p.t==="akuryo");
  const pJuso=pP.some(p=>p.t==="jusoshi");
  if(pJutsu){
    for(const p of eP){
      const exposure=(p.maxAp>=2?1.4:1.0)*Math.max(0,(4-dist(p,pP)));
      v-=exposure*9; // 減速されると痛い突出を抑制
    }
  }
  if(pAkuryo){
    for(const p of eP){
      if(!SS.noNormal.has(p.t)){
        const exposure=Math.max(0,(3-dist(p,pP)));
        v-=exposure*8; // 攻撃封じ対策：密着しすぎない
      }
    }
  }
  if(pJuso){
    // 呪詛師の全体-0.5は瀕死のE駒に致命的。瀕死駒が多いほど警戒
    let frail=0;for(const p of eP)if(p.hp<=1)frail++;
    v-=frail*35;
  }

  // === 軍師・巫女：相手の手数・機動が増える前提でE前衛の突出をやや抑制 ===
  if(pP.some(p=>p.t==="gunshi"||p.t==="miko")){
    for(const p of eP){
      const exposure=Math.max(0,(3-dist(p,pP)));
      v-=exposure*6;
    }
  }
  return v;
}

/* negamax + alpha-beta。時間制限・ノード上限つき */
let ssNodes=0, ssDeadline=0, ssAbort=false;
let ssNodeCap=2600000;
const SS_NODE_CAP_NORMAL=2600000;
const SS_NODE_CAP_STRONG=Number.MAX_SAFE_INTEGER; // つよいモードはノード上限を設けず、時間の許す限り深く読む
function ssSearch(st,depth,alpha,beta){
  if(ssAbort)return ssEval(st);
  if(ssTerminal(st)||depth<=0){
    return ssEval(st);
  }
  if((++ssNodes&255)===0){
    if(ssNodes>ssNodeCap||performance.now()>ssDeadline){ssAbort=true;return ssEval(st);}
  }
  let children=ssGenerate(st);
  // ムーブオーダリング＆幅制限（深いほど狭く）
  const width=depth>=6?10:depth>=3?12:16;
  if(children.length>width){
    children.sort((a,b)=> (st.side==="E"? ssEval(b)-ssEval(a) : ssEval(a)-ssEval(b)) );
    children=children.slice(0,width);
  }
  if(st.side==="E"){
    let best=-Infinity;
    for(const ch of children){
      const v=ssSearch(ch,depth-1,alpha,beta);
      if(v>best)best=v;
      if(best>alpha)alpha=best;
      if(alpha>=beta)break;
      if(ssAbort)break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const ch of children){
      const v=ssSearch(ch,depth-1,alpha,beta);
      if(v<best)best=v;
      if(best<beta)beta=best;
      if(alpha>=beta)break;
      if(ssAbort)break;
    }
    return best;
  }
}
/* 最善のE手番を選ぶ。反復深化で目標プライまで、時間予算内で深掘り */
/* === 千日手（同一行動の反復）回避 === */
let aiMoveHistory=[]; // 直近のAI手のシグネチャ（新しいものほど後ろ）
const AI_HIST_MAX=12;
function aiMoveSig(plan){
  if(!plan)return "none";
  const ab=plan.ability?plan.ability.kind:"-";
  return plan.pieceId+":"+plan.destR+","+plan.destC+":"+ab;
}
function aiSigFromExec(plan){
  // aiExecutePlan形式（path配列）からシグネチャを作る
  if(!plan)return "none";
  const dest=(plan.path&&plan.path.length)?plan.path[plan.path.length-1]:null;
  const p=byId(plan.pieceId);
  const dr=dest?dest[0]:(p?p.r:"?"), dc=dest?dest[1]:(p?p.c:"?");
  const ab=plan.ability?plan.ability.kind:"-";
  return plan.pieceId+":"+dr+","+dc+":"+ab;
}
function aiRecordMove(sig){
  aiMoveHistory.push(sig);
  if(aiMoveHistory.length>AI_HIST_MAX)aiMoveHistory.shift();
}
/* そのシグネチャが直近で何回出たか */
function aiRepeatCount(sig){
  let n=0;for(const s of aiMoveHistory)if(s===sig)n++;return n;
}
/* 駒ごとの直近の到達マス履歴（往復＝千日手の検出用） */
let aiPosHistory={}; // pieceId -> ["r,c", ...]（新しいものほど後ろ）
const AI_POS_MAX=6;
function aiRecordPos(pieceId,r,c){
  if(!aiPosHistory[pieceId])aiPosHistory[pieceId]=[];
  aiPosHistory[pieceId].push(r+","+c);
  if(aiPosHistory[pieceId].length>AI_POS_MAX)aiPosHistory[pieceId].shift();
}
/* その駒が「最近いたマス」に戻ろうとしている回数（往復のしつこさ） */
function aiPosRevisitCount(pieceId,r,c){
  const h=aiPosHistory[pieceId];if(!h)return 0;
  let n=0;for(const s of h)if(s===r+","+c)n++;return n;
}

function ssBestPrepare(){
  const root=ssFromGame("E");
  const side="E";
  const mine=root.ps.filter(p=>p.o===side);
  const rootMoves=[];
  for(const p of mine){
    const dests=ssReach(root,p);
    for(const d of dests){
      rootMoves.push({pieceId:p.id,dr:d.r,dc:d.c,cost:d.cost,apLeft:d.apLeft,ability:null});
      if(SS.ranged.has(p.t)&&d.apLeft>=1){
        const np={...p,r:d.r,c:d.c};
        for(const [rr,cc] of ssRangedCells(np,d.r,d.c)){
          const t=ssAt(root,rr,cc);
          if(t&&t.o!==side&&!t.block&&ssTargetable(t,side))rootMoves.push({pieceId:p.id,dr:d.r,dc:d.c,cost:d.cost,apLeft:d.apLeft,ability:{kind:"ranged",tr:rr,tc:cc}});
        }
      }
      if(p.t==="jusoshi"&&d.cost===0&&p.hp>=1.5){
        rootMoves.push({pieceId:p.id,dr:d.r,dc:d.c,cost:0,apLeft:d.apLeft,ability:{kind:"curse"}});
      }
    }
  }
  if(rootMoves.length===0)return null;
  const applied=rootMoves.map(mv=>{
    const ns=ssClone(root);
    const np=ns.ps.find(x=>x.id===mv.pieceId);
    const origin=root.ps.find(x=>x.id===mv.pieceId);
    np.r=mv.dr;np.c=mv.dc;
    if(mv.ability&&mv.ability.kind==="ranged"){
      const t=ns.ps.find(x=>x.r===mv.ability.tr&&x.c===mv.ability.tc&&x.o!=="E");
      if(t)ssDealDamage(ns,np,t,"ranged");
    }else if(mv.ability&&mv.ability.kind==="curse"){
      for(const t of ns.ps.filter(x=>x.o!=="E")){
        let killed=t.hp-0.5<=0;
        if(killed&&t.t==="fushicho"&&!t.phoenix){t.phoenix=true;t.hp=0.5;killed=false;}
        else t.hp=r2(t.hp-0.5);
        if(killed){t.dead=true;ns.kP++;}
      }
      np.hp=r2(np.hp-1.5);
      if(np.hp<=0){np.dead=true;ns.kP++;}
    }
    const atk=ssBestAttackPlan(ns,"E");
    ssRemoveDead(ns);
    ns.side="P";
    const jump=(np.t==="kiba"&&mv.cost===2&&(Math.abs(mv.dr-origin.r)+Math.abs(mv.dc-origin.c))>1);
    const moved=(mv.dr!==origin.r||mv.dc!==origin.c);
    const acts=moved||!!mv.ability||!!atk;
    const plan={pieceId:mv.pieceId,destR:mv.dr,destC:mv.dc,cost:mv.cost,jump,ability:mv.ability,attack:atk};
    // 千日手ペナルティ：同一行動が直近で3回以上出ていたら、その超過回数ぶん減点
    const rep=aiRepeatCount(aiMoveSig(plan));
    let repPenalty = rep>=2 ? (rep-1)*600 : 0; // 2回まではOK、3回目以降で強く嫌う
    // 往復検出：最近いたマスへ戻る手を強く抑制（無意味な往復を断つ）
    if(moved){
      const revisit=aiPosRevisitCount(mv.pieceId, mv.dr, mv.dc);
      if(revisit>=1)repPenalty += revisit*800; // 元いたマスへ戻る＝往復。強く嫌う
    }
    return {state:ns, acts, plan, repPenalty};
  });
  // 浅い評価の即時フォールバック（千日手ペナルティ込み）
  let fbBest=-Infinity, fbPlan=null;
  for(const a of applied){ if(!a.acts)continue; const v=ssEval(a.state)-a.repPenalty+Math.random()*2; if(v>fbBest){fbBest=v;fbPlan=a.plan;} }
  if(!fbPlan){ for(const a of applied){const v=ssEval(a.state)-a.repPenalty;if(v>fbBest){fbBest=v;fbPlan=a.plan;}} }
  return {applied, fbPlan, fbBest};
}
/* 1段（1深さ）ぶんの探索を実行し、暫定最善手・順序・投了判定材料を更新 */
function ssRunDepth(applied, depth, order, valById){
  ssAbort=false; ssNodes=0;
  let localBest=-Infinity, localPlan=null;
  const scored=[];
  let completedAny=false;
  for(const idx of order){
    const node=applied[idx];
    const raw=ssSearch(node.state, depth-1, -Infinity, Infinity);
    if(ssAbort)break;
    completedAny=true;
    // 千日手ペナルティを反映した実効スコアで手を選ぶ（ただし勝ち確定は割り引かない）
    const v = raw>=1e6 ? raw : raw-(node.repPenalty||0);
    scored.push({idx,v});
    valById[idx]=v;
    const better = v>localBest+1e-9 || (Math.abs(v-localBest)<=1e-9 && node.acts);
    if(localPlan===null || better){ if(node.acts || localPlan===null){ localBest=v; localPlan=node.plan; } }
  }
  let newOrder=order;
  if(completedAny){
    scored.sort((a,b)=>b.v-a.v);
    newOrder=scored.map(s=>s.idx).concat(order.filter(i=>!scored.find(s=>s.idx===i)));
  }
  return {completedAny, localBest, localPlan, newOrder};
}

function ssBestMove(maxDepth){
  ssNodeCap=SS_NODE_CAP_NORMAL;
  const prep=ssBestPrepare();
  if(!prep)return {resign:false, plan:null, allLose:false};
  const {applied, fbPlan}=prep;
  ssDeadline=performance.now()+6000;
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  const valById={};
  for(let depth=2; depth<=maxDepth; depth++){
    const r=ssRunDepth(applied, depth, order, valById);
    order=r.newOrder;
    if(r.completedAny && r.localPlan){
      bestPlan=r.localPlan;
      if(r.localBest>=1e6)break;
    }
    if(performance.now()>ssDeadline)break;
  }
  const evaluated=Object.values(valById);
  const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
  return {resign:allLose, plan:bestPlan, allLose};
}
/* 非同期版：各深さの間で描画に譲る（スピナーを回し、UIをブロックしない） */
function ssBestMoveAsync(maxDepth, onDone){
  ssNodeCap=SS_NODE_CAP_NORMAL;
  const prep=ssBestPrepare();
  if(!prep){onDone({resign:false, plan:null, allLose:false});return;}
  const {applied, fbPlan}=prep;
  ssDeadline=performance.now()+6000;
  let bestPlan=fbPlan;
  let order=applied.map((_,i)=>i);
  const valById={};
  let depth=2;
  const step=()=>{
    if(depth>maxDepth || performance.now()>ssDeadline){ finish(); return; }
    const r=ssRunDepth(applied, depth, order, valById);
    order=r.newOrder;
    if(r.completedAny && r.localPlan){
      bestPlan=r.localPlan;
      if(r.localBest>=1e6){ finish(); return; }
    }
    depth++;
    setTimeout(step,0); // 描画に譲ってから次の深さへ
  };
  const finish=()=>{
    const evaluated=Object.values(valById);
    const allLose = evaluated.length>0 && evaluated.every(v=>v<=-1e6);
    onDone({resign:allLose, plan:bestPlan, allLose});
  };
  setTimeout(step,0);
}

/* ベスト通常攻撃のプランを返す（state適用も行う） */
function ssBestAttackPlan(st,side){
  let best=null,bs=-1;
  for(const a of st.ps.filter(x=>x.o===side&&!SS.noNormal.has(x.t))){
    for(const [r,c] of ssNormalCells(a)){
      const t=st.ps.find(x=>x.r===r&&x.c===c&&x.o!==side);
      if(!t)continue;
      if(!ssTargetable(t,side))continue; // 透明忍者は攻撃不可
      if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
      const d=ssAtk(a,"melee");
      const kills=t.hp-d<=0&&!(t.t==="fushicho"&&!t.phoenix);
      let s=(kills?1000:0)+d*200+(3-Math.max(0,t.hp-d))*40;
      if(t.t==="kemono")s=s*0.08-30; // 獣は撃破価値が低い（即再召喚）→調教師本体を優先
      if(s>bs){bs=s;best={a,t};}
    }
  }
  if(best){
    const aid=best.a.id,tid=best.t.id;
    ssDealDamage(st,best.a,best.t,"melee");
    return {attackerId:aid,targetId:tid};
  }
  return null;
}

function aiMakePlan(){
  const threat=playerThreatMap();
  const foes=alive("P").filter(f=>!f.flags.invisible);
  const myList=alive("E");
  const cands=[];

  const baseSim=()=>G.pieces.filter(p=>!p.dead).map(p=>({
    id:p.id,type:p.type,owner:p.owner,r:p.r,c:p.c,hp:p.hp,
    block:p.flags.block,phoenix:p.flags.phoenix,noAttack:p.flags.noAttack,
    invisible:p.flags.invisible,heroBoost:p.flags.heroBoost
  }));

  function simAtkDamage(sp,kind){
    let d=1;
    if(sp.type==="kenshi")d+=0.5;
    if(sp.type==="senshi"){if(sp.hp<=1)d+=2;else if(sp.hp<=2)d+=1;}
    if(sp.type==="yusha"&&sp.heroBoost&&kind==="melee")d=3;
    return d;
  }
  function simHit(sim,attacker,target,kind,events){
    if(target.invisible)return;
    if(target.block&&attacker&&attacker.r===target.block.r&&attacker.c===target.block.c)return;
    const d=simAtkDamage(attacker,kind);
    let eff=d;
    let killed=target.hp-d<=0;
    if(killed&&target.type==="fushicho"&&!target.phoenix){killed=false;target.hp=0.5;eff=d;}
    else target.hp=r2(target.hp-d);
    events.push({dmg:eff,killed,tHp:Math.max(0,target.hp),tType:target.type});
    if(killed)target.dead=true;
  }

  function evalPlan(mover,dest,apAfter,ability){
    const sim=baseSim();
    const sm=sim.find(x=>x.id===mover.id);
    sm.r=dest.r;sm.c=dest.c;
    const events=[];
    // ability
    if(ability&&ability.kind==="ranged"){
      const t=sim.find(x=>x.id===ability.targetId&&!x.dead);
      if(t)simHit(sim,sm,t,"ranged",events);
    }
    if(ability&&ability.kind==="curse"){
      sm.hp=r2(sm.hp-1.5);
      for(const t of sim.filter(x=>x.owner==="P"&&!x.dead&&!x.invisible)){
        let killed=t.hp-0.5<=0;
        if(killed&&t.type==="fushicho"&&!t.phoenix){killed=false;t.hp=0.5;}
        else t.hp=r2(t.hp-0.5);
        events.push({dmg:0.5,killed,tHp:Math.max(0,t.hp),tType:t.type});
        if(killed)t.dead=true;
      }
    }
    // best normal attack（駒1体で1回）
    let bestAtk=null,bestAtkScore=-1;
    for(const a of sim.filter(x=>x.owner==="E"&&!x.dead&&!x.noAttack&&!x.invisible)){
      if(PIECES[a.type].noNormal)continue;
      const dirs=a.type==="souhei"?[...DIAG,[1,0]]:ORTHO;
      for(const [dr,dc] of dirs){
        const t=sim.find(x=>!x.dead&&x.owner==="P"&&!x.invisible&&x.r===a.r+dr&&x.c===a.c+dc);
        if(!t)continue;
        const d=simAtkDamage(a,"melee");
        let kills=t.hp-d<=0&&!(t.type==="fushicho"&&!t.phoenix);
        const s=(kills?900:0)+d*200+d*(3-Math.max(0,t.hp-d))*30;
        if(t.block&&a.r===t.block.r&&a.c===t.block.c)continue;
        if(s>bestAtkScore){bestAtkScore=s;bestAtk={attackerId:a.id,targetId:t.id};}
      }
    }
    if(bestAtk){
      const a=sim.find(x=>x.id===bestAtk.attackerId);
      const t=sim.find(x=>x.id===bestAtk.targetId);
      if(a&&t&&!t.dead)simHit(sim,a,t,"melee",events);
    }
    // score
    let score=0,killsNow=G.kills.E;
    for(const e of events){
      if(e.killed&&e.tType!=="kemono"){
        killsNow++;score+=900;
        if(killsNow>=2)score+=100000;
      }else if(e.killed){score+=350;}
      else score+=e.dmg*230+e.dmg*(3-e.tHp)*45;
    }
    // 被脅威
    const risks=[];
    for(const m of sim.filter(x=>x.owner==="E"&&!x.dead)){
      const t=threat[m.r*6+m.c]||0;
      if(t<=0)continue;
      if(t>=m.hp)risks.push(820+(G.kills.P>=1?500:0));
      else risks.push(t*55);
    }
    risks.sort((a,b)=>b-a);
    if(killsNow<2){
      if(risks.length)score-=risks[0];
      for(let i=1;i<risks.length;i++)score-=risks[i]*0.3;
    }
    // 接近・位置
    for(const m of sim.filter(x=>x.owner==="E"&&!x.dead)){
      let md=99;
      for(const f of sim.filter(x=>x.owner==="P"&&!x.dead&&!x.invisible)){
        md=Math.min(md,Math.abs(m.r-f.r)+Math.abs(m.c-f.c));
      }
      if(md<99)score-=md*13;
    }
    score+=Math.random()*8;
    return {score,attack:bestAtk};
  }

  for(const p of myList){
    const reach=reachWithPaths(p);
    for(const key in reach){
      const [r,c]=key.split(",").map(Number);
      const info=reach[key];
      const apAfter=p.ap-info.cost;
      const tryC=(ability)=>{
        const ev=evalPlan(p,{r,c},apAfter,ability);
        cands.push({score:ev.score,pieceId:p.id,path:info.path,jump:info.jump,
                    ability,attack:ev.attack});
      };
      tryC(null);
      if((p.type==="kyuhei"||p.type==="sogeki")&&apAfter>=1){
        for(const [rr,cc] of rangedCellsFrom(p,r,c)){
          const t=foes.find(f=>f.r===rr&&f.c===cc);
          if(t)tryC({kind:"ranged",targetId:t.id});
        }
      }
      if(p.type==="jusoshi"&&p.hp>=1.5&&info.cost===0){
        tryC({kind:"curse"});
      }
    }
  }
  // 千日手ペナルティ：直近で同一行動を繰り返している候補を減点（2回まではOK）
  for(const c of cands){
    if(c.score>=300) continue; // 撃破級の高評価手は割り引かない
    const rep=aiRepeatCount(aiSigFromExec(c));
    if(rep>=2)c.score-=(rep-1)*200;
  }
  cands.sort((a,b)=>b.score-a.score);
  if(cands.length===0)return null;
  // 行動必須ルール：移動も能力もない候補は、他に選択肢がない場合のみ許可
  const acting=cands.filter(c=>(c.path&&c.path.length>0)||c.ability);
  const pool=acting.length?acting:cands;
  // 難易度別：やさしいは上位からランダムでゆるい手、それ以外(フォールバック時)は最善手
  if(aiLevel!=="easy")return pool[0];
  // やさしい：上位の中からランダム
  const top=pool.filter(c=>c.score>=pool[0].score*0.8||pool.indexOf(c)<4);
  return top[Math.floor(Math.random()*Math.min(top.length,4))];
}

/* 保証フォールバック：どんな局面でも必ず「何かする」合法手を1つ返す。
   通常攻撃だけでも、無理なら1マス移動だけでも返し、パスを防ぐ。 */
function aiGuaranteedMove(){
  // ルール：必ずどれか1駒が「行動力を全て消費」する（通常攻撃だけ／中途半端な移動は不可）。
  // ① 行動力を使い切る移動を探す（移動距離＝その駒のAP）。ついでに通常攻撃も付ける。
  let anyMove=null;
  for(const p of alive("E")){
    if(p.ap<1)continue;
    const reach=reachWithPaths(p);
    for(const key in reach){
      if(key===p.r+","+p.c)continue;
      const info=reach[key];
      if(!info.path||info.path.length===0)continue;
      // 行動力を全消費する移動か（跳躍はAP2消費、通常移動はpath長=消費AP）
      const cost=info.jump?2:info.path.length;
      const full=(cost>=p.ap);
      const plan={pieceId:p.id, path:info.path, jump:!!info.jump, ability:null, attack:null};
      if(full)return plan;      // 全消費できる移動を最優先で採用
      if(!anyMove)anyMove=plan; // 部分消費でも一応キープ（後述の遠距離/能力より優先度低）
    }
  }
  // ② 行動力を使う能力：弓兵・狙撃手の遠距離（AP1全消費）
  for(const p of alive("E")){
    if(p.ap<1)continue;
    if(!(p.type==="kyuhei"||p.type==="sogeki"))continue;
    for(const [rr,cc] of rangedCellsFrom(p,p.r,p.c)){
      const t=visAt(rr,cc,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible)
        return {pieceId:p.id, path:[], jump:false, ability:{kind:"ranged",targetId:t.id}, attack:null};
    }
  }
  // ③ 全消費できる移動が無ければ、部分消費でも移動する（それでも行動力は消費する）
  if(anyMove)return anyMove;
  // 通常攻撃はAPを消費しないため「行動」にならない。移動も遠距離も無理なら手なし（null）を返す。
  return null;
}

/* 行動した駒にAPが残っていて、まだ移動できるなら使い切る（行動力全消費ルール）。
   残AP分だけ、最も安全な（プレイヤーの攻撃圏でない）マスへ動く。 */
function aiConsumeRemainingAP(pieceId){
  let guard=0;
  while(guard++<4){
    const p=byId(pieceId);
    if(!p||p.dead||p.ap<1)return;
    // 冒険者は1マスでも動いていれば、残APを捨てて通常攻撃へ移行してよい
    if(p.type==="boken" && p.ap<(p.maxAp||2)){ p.ap=0; return; }
    const opts=stepOptions(p);
    const jopts=jumpOptions(p);
    if(opts.length===0 && jopts.length===0){ p.ap=0; return; } // これ以上動けない→待機扱いで残APを消費
    const threat=playerThreatMap();
    const trappers=alive("P").filter(f=>f.type==="wanashi");
    // 候補：通常移動（AP1）と跳躍（AP2）。安全なマスを優先
    let best=null, bestScore=-1e9;
    const evalCell=(r,c,cost)=>{
      const dmg=threat[r*6+c]||0;
      let s=-dmg*100;                 // 被弾しにくいマスを優先
      // 推定確率マップで罠を回避（18%超は決定的に嫌う）
      const tprob=trapProbAt(r,c);
      if(tprob>=0.18) s-= 350 + tprob*400;   // 最大警戒
      else if(tprob>0) s-= tprob*500;
      // 罠師の潜在罠ゾーン（周囲3マス）も避ける
      for(const tr of trappers){ const ch=Math.max(Math.abs(tr.r-r),Math.abs(tr.c-c)); if(ch<=3)s-=(4-ch)*22; }
      // 透明忍者の潜伏予測マップ：踏み込むと3ダメージ。予測確率に応じて避ける。
      const nprob=ninjaProbAt(r,c);
      if(nprob>0) s-= nprob*260;
      // 相手に少し近づく（攻め圧）ボーナス
      let md=99;for(const f of alive("P"))if(!f.flags.invisible)md=Math.min(md,Math.abs(r-f.r)+Math.abs(c-f.c));
      s-=md*2;
      s+=Math.random()*3;
      return s;
    };
    for(const [r,c] of opts){ const s=evalCell(r,c,1); if(s>bestScore){bestScore=s;best={r,c,jump:false};} }
    for(const [r,c] of jopts){ const s=evalCell(r,c,2)+5; if(s>bestScore){bestScore=s;best={r,c,jump:true};} }
    if(!best)return;
    const fr=p.r,fc=p.c;
    if(best.jump){
      if(p.ap<2)return;
      p.ap-=2; enterSquare(p,best.r,best.c); sfx("move");
    }else{
      tryStep(p,best.r,best.c);
    }
    if(!p.dead)logMove(p,fr,fc);
  }
}
function aiExecutePlan(plan){
  // プランが無い／何もしない場合でも、必ず合法手を探して行動させる（無為なターンエンド防止）
  if(!plan || planIsIdle(plan)){
    const g=aiGuaranteedMove();
    if(g)plan=g;
  }
  // 安全ガード：弓兵・狙撃手は行動力1で「移動」か「遠距離攻撃」のどちらか一方のみ。
  // 移動を伴うプランに遠距離攻撃が付いていたら、遠距離攻撃を無効化する。
  if(plan && plan.ability && plan.ability.kind==="ranged" && plan.path && plan.path.length>0){
    plan={...plan, ability:null};
  }
  aiRecordMove(aiSigFromExec(plan)); // 千日手検出用に手を記録
  if(plan&&plan.path&&plan.path.length){ // 往復検出用に到達マスを記録
    const d=plan.path[plan.path.length-1];
    aiRecordPos(plan.pieceId, d[0], d[1]);
  }
  const preAP=aiTotalAP(); // 実行前のE軍の総行動力（消費されたか検証するため）
  const steps=[];
  if(plan){
    const p=byId(plan.pieceId);
    if(p){
      const moFromR=p.r, moFromC=p.c; // 移動前の位置（ログ用）
      if(plan.jump&&plan.path.length){
        const [r,c]=plan.path[plan.path.length-1];
        steps.push(()=>{
          if(p.dead||p.ap<2)return;
          p.ap-=2;
          log("敵の騎馬が跳躍した！","e");
          enterSquare(p,r,c);sfx("move");
          if(!p.dead)logMove(p,moFromR,moFromC);
        });
      }else{
        for(const [r,c] of plan.path){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            if(visAt(r,c,"E"))return;
            tryStep(p,r,c);
          });
        }
        if(plan.path.length){
          steps.push(()=>{ if(!p.dead)logMove(p,moFromR,moFromC); });
        }
      }
      if(plan.ability){
        if(plan.ability.kind==="ranged"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            let t=plan.ability.targetId?byId(plan.ability.targetId):null;
            if(!t&&plan.ability.tr!=null)t=visAt(plan.ability.tr,plan.ability.tc,"E");
            if(!t||t.flags.invisible||t.owner!=="P")return;
            if(!rangedCellsFrom(p,p.r,p.c).some(([r,c])=>r===t.r&&c===t.c))return;
            p.ap--;
            performAttack(p,t,"ranged");
          });
        }else if(plan.ability.kind==="curse"){
          steps.push(()=>{
            if(p.dead||p.hp<1.5)return;
            log("敵の呪詛師が呪いを放った！（敵全体HP-0.5）","e");sfx("curse");
            for(const t of alive("P"))dealDamage(t,0.5,null,"curse");
            p.hp=r2(p.hp-1.5);
            if(p.hp<=0 && !p.dead) killPiece(p,null,"curse");
          });
        }else if(plan.ability.kind==="slow"){
          steps.push(()=>{
            if(p.dead||p.flags.usedFree)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.flags.invisible||t.owner!=="P")return;
            p.flags.usedFree=true;t.flags.apCut=true;
            log(`敵の術士の呪い…${pieceLabel(t)}の次ターン行動力-1`,"e");sfx("slow");
          });
        }else if(plan.ability.kind==="bind"){
          steps.push(()=>{
            if(p.dead||p.flags.usedFree)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.flags.invisible||t.owner!=="P")return;
            p.flags.usedFree=true;t.flags.noAttack=true;
            log(`敵の悪霊が取り憑いた…${pieceLabel(t)}は次の手番、通常攻撃不可`,"e");sfx("bind");
          });
        }else if(plan.ability.kind==="heal"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.healUsed)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.owner!=="E"||Math.abs(t.r-p.r)+Math.abs(t.c-p.c)!==1)return;
            p.ap--;p.flags.healUsed=true;
            healPiece(t,1);
            log(`敵の薬師が${pieceLabel(t)}を癒した`,"e");sfx("heal");
          });
        }else if(plan.ability.kind==="swap"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const a=byId(plan.ability.aId), b=byId(plan.ability.bId);
            if(!a||!b||a.owner!==b.owner)return;
            if((a.flags.invisible&&a.owner!=="E")||(b.flags.invisible&&b.owner!=="E"))return;
            p.ap--;
            const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac;
            log(`敵の魔女の入替魔法！${PIECES[a.type].name}と${PIECES[b.type].name}が入れ替わった`,"e");
            sfx("swap");
          });
        }else if(plan.ability.kind==="poison"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.healUsed)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.owner!=="P"||t.flags.invisible||Math.abs(t.r-p.r)+Math.abs(t.c-p.c)!==1)return;
            p.ap--;p.flags.healUsed=true;
            dealDamage(t,1,p,"poison");
            log(`敵の薬師が${pieceLabel(t)}に毒を盛った`,"e");sfx("hit");
          });
        }else if(plan.ability.kind==="trap"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const {tr,tc}=plan.ability;
            if(!inB(tr,tc)||at(tr,tc)||G.traps.some(t=>t.r===tr&&t.c===tc))return;
            p.ap--;
            const mine=G.traps.filter(t=>t.setter===p.id);
            if(mine.length>=2){const idx=G.traps.indexOf(mine[0]);if(idx>=0)G.traps.splice(idx,1);}
            G.traps.push({owner:"E",r:tr,c:tc,setter:p.id});
            log("敵の罠師が罠を仕掛けた","e");sfx("trap");
          });
        }else if(plan.ability.kind==="summon"){
          steps.push(()=>{
            if(p.dead||p.ap<1)return;
            const hasBeast=alive("E").some(b=>b.type==="kemono"&&b.flags.beastOf===p.id);
            if(hasBeast)return;
            let {sr,sc}=plan.ability;
            // 予定マスが埋まっていたら、敵に最も近い空き隣接マスへ
            if(!inB(sr,sc)||at(sr,sc)){
              let best=null,bd=99;
              for(const [ddr,ddc] of ORTHO){
                const r=p.r+ddr,c=p.c+ddc;
                if(!inB(r,c)||at(r,c))continue;
                let md=99;for(const f of alive("P"))if(!f.flags.invisible)md=Math.min(md,Math.abs(f.r-r)+Math.abs(f.c-c));
                if(md<bd){bd=md;best=[r,c];}
              }
              if(!best)return; sr=best[0];sc=best[1];
            }
            p.ap--;
            const b=makePiece("kemono","E",sr,sc);
            b.flags.beastOf=p.id; b.spawn=true;
            G.pieces.push(b);
            log("敵の調教師が獣を召喚した","e");sfx("place");
            // 召喚した獣でそのターンのうちに先制攻撃を狙う（1ターン1回の通常攻撃制限内）
            if(!G.attackUsed){
              for(const [ar,ac] of normalAttackCells(b)){
                const t=visAt(ar,ac,"E");
                if(t&&t.owner==="P"&&!t.flags.invisible){ G.attackUsed=true; performAttack(b,t,"melee"); break; }
              }
            }
          });
        }else if(plan.ability.kind==="kagura"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.hp<=0.5)return;
            const t=byId(plan.ability.targetId);
            if(!t||t.owner!=="E"||t.id===p.id)return;
            p.ap--;p.hp=r2(p.hp-0.5);
            t.ap++;t.flags.mikoBuff=true;
            log(`敵の巫女の神楽…${pieceLabel(t)}の行動力+1`,"e");sfx("buff");
            // 付与された駒を安全なマスへ退避させる（脅威の低いマスへ、罠も回避）
            const threat=playerThreatMap();
            let best=null,bs=1e9;
            for(const [dr,dc] of moveDirs(t)){
              const nr=t.r+dr,nc=t.c+dc;
              if(!inB(nr,nc)||at(nr,nc))continue;
              if(!colorOk("E",t.id,nr,nc))continue;
              let s=(threat[nr*6+nc]||0)*100 + trapProbAt(nr,nc)*300;
              // プレイヤー駒から遠ざかる
              let md=99;for(const f of alive("P"))if(!f.flags.invisible)md=Math.min(md,Math.abs(nr-f.r)+Math.abs(nc-f.c));
              s-=md*3;
              if(s<bs){bs=s;best=[nr,nc];}
            }
            if(best&&t.ap>=1){
              const fr=t.r,fc=t.c;
              tryStep(t,best[0],best[1]);
              if(!t.dead)logMove(t,fr,fc);
            }
          });
        }else if(plan.ability.kind==="pray"){
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.prayUsed)return;
            p.ap--;p.flags.prayUsed=true;
            for(const t of alive("E"))if(t.id!==p.id)healPiece(t,0.5);
            log("敵の聖職者の祈り…敵軍全体のHPが0.5回復","e");sfx("heal");
          });
        }else if(plan.ability.kind==="vanish"){
          // 透明化してから移動する（透明中は被弾無効なので安全に前進できる）
          steps.push(()=>{
            if(p.dead||p.ap<1||p.flags.invisible)return;
            p.ap--;p.flags.invisible=true;
            log("敵の忍者が気配を消した…（どこに潜んだかは不明）","e");sfx("pick");
            // 透明化後、敵陣・前線へ向けて安全に前進する（透明中はALL8で斜め移動可）
            let guard=0;
            while(p.ap>=1 && guard++<2){
              // 敵に近づく方向へ、被弾を気にせず前進（透明中は無敵）
              let best=null,bs=-1e9;
              for(const [dr,dc] of moveDirs(p)){
                const nr=p.r+dr,nc=p.c+dc;
                if(!inB(nr,nc)||visAt(nr,nc,"E"))continue;
                if(!colorOk("E",p.id,nr,nc))continue;
                // 敵に近づくほど良い（先手の起点を作る）。罠だけは透明でも踏むので回避。
                let md=99;for(const f of alive("P"))md=Math.min(md,Math.abs(nr-f.r)+Math.abs(nc-f.c));
                let s=-md*10 - trapProbAt(nr,nc)*300;
                if(s>bs){bs=s;best=[nr,nc];}
              }
              if(!best)break;
              const fr=p.r,fc=p.c;
              tryStep(p,best[0],best[1]);
              if(!p.dead)logMove(p,fr,fc);
            }
          });
        }
      }
    }
    // 行動力の全消費ルール：行動した駒にAPが残っていて、まだ動けるなら使い切る（攻撃フェーズより前）
    if(p){
      steps.push(()=>{ aiConsumeRemainingAP(p.id); });
    }
    // 攻撃の直前に「まだ行動力を1も消費していない」なら、必ず先に移動して消費する。
    // 通常攻撃はターンエンド直前の1回だけ＝必ず全ての移動が終わってから行う。
    steps.push(()=>{
      if(aiTotalAP()>=preAP){        // このターンまだAPを消費していない
        aiForceAnyAction();          // 先に1駒の行動力を使い切る（移動が攻撃より前になる）
      }
    });
    if(plan.attack){
      steps.push(()=>{
        if(G.attackUsed)return; // 1ターン1回の通常攻撃制限
        const a=byId(plan.attack.attackerId);
        let t=byId(plan.attack.targetId);
        if(!a||a.flags.noAttack)return;
        // 予定ターゲットが消えていたら隣接の敵を再探索
        const cellOk=t&&!t.flags.invisible&&normalAttackCells(a).some(([r,c])=>r===t.r&&c===t.c);
        if(!cellOk){
          t=null;
          for(const [r,c] of normalAttackCells(a)){
            const x=visAt(r,c,"E");
            if(x&&x.owner==="P"){t=x;break;}
          }
        }
        if(t){G.attackUsed=true;performAttack(a,t,"melee");}
      });
    }
  }
  steps.push(()=>{});
  let i=0;
  const run=()=>{
    if(G.over)return;
    if(G.respawnQueue.length){processRespawns(run);return;}
    if(i>=steps.length){
      // 検証：このターンでE軍が実際に「行動力を消費」したか。
      // 通常攻撃は行動力を消費しないため、攻撃だけではターンエンドを認めない。
      const apConsumed = aiTotalAP()<preAP;
      if(!apConsumed){
        // 行動力を1も消費していない → 必ずどれか1駒の行動力を使い切る手を強制実行する
        if(aiForceAnyAction()){ render(); setTimeout(finishAITurn,300); return; }
        // ここに来るのは全駒が行動力0（もう誰も動けない）＝合法的に消費し切った状態のみ。
      }
      finishAITurn();return;
    }
    const f=steps[i++];
    f();
    render();
    setTimeout(run,430);
  };
  run();
}
/* E軍の生存駒の総行動力。実行前後で減っていれば「行動力を消費した＝正しく行動した」。
   通常攻撃はAPを消費しないため、この値は変わらず、行動とみなされない。 */
function aiTotalAP(){
  let s=0;
  for(const p of G.pieces){ if(!p.dead && p.owner==="E") s+=p.ap; }
  return s;
}
/* 無為なターンを絶対に避けるための最終実行：保証手を1つ、その場で適用する。
   行動できれば true、全駒が完全に詰んでいれば false。 */
function aiForceAnyAction(){
  // 必ず「1駒の行動力を消費する」手を実行する。通常攻撃はAPを消費しないので行動とは認めない。
  // ① 行動力を全消費できる移動を最優先
  let fallbackMove=null;
  for(const p of alive("E")){
    if(p.ap<1)continue;
    const reach=reachWithPaths(p);
    for(const key in reach){
      if(key===p.r+","+p.c)continue;
      const info=reach[key];
      if(!info.path||info.path.length===0)continue;
      const cost=info.jump?2:info.path.length;
      if(cost>=p.ap){ // 全消費できる移動
        aiApplyMoveNow(p,info); aiConsumeRemainingAP(p.id); aiTryOneAttack(); return true;
      }
      if(!fallbackMove)fallbackMove={p,info};
    }
  }
  // ② 弓兵・狙撃手の遠距離攻撃（AP1消費）
  for(const p of alive("E")){
    if(p.ap<1||!(p.type==="kyuhei"||p.type==="sogeki"))continue;
    for(const [rr,cc] of rangedCellsFrom(p,p.r,p.c)){
      const t=visAt(rr,cc,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible){ p.ap--; performAttack(p,t,"ranged"); return true; }
    }
  }
  // ③ 全消費できる移動が無くても、APを消費する移動を必ず行い、残りも使い切る
  if(fallbackMove){ aiApplyMoveNow(fallbackMove.p,fallbackMove.info); aiConsumeRemainingAP(fallbackMove.p.id); aiTryOneAttack(); return true; }
  // ④ どの駒も行動力を消費できない（全駒が完全に移動不能）＝合法的にパスするしかない。
  //    通常攻撃だけでは「行動」にならないため、ここでは行動なしとして返す。
  return false;
}
function aiApplyMoveNow(p,info){
  const fr=p.r,fc=p.c;
  if(info.jump && p.ap>=2){
    const [r,c]=info.path[info.path.length-1];
    p.ap-=2; enterSquare(p,r,c); sfx("move");
  }else{
    for(const [r,c] of info.path){
      if(p.dead||p.ap<1)break;
      if(visAt(r,c,"E"))break;
      tryStep(p,r,c);
    }
  }
  if(!p.dead)logMove(p,fr,fc);
}
function aiTryOneAttack(){
  if(G.attackUsed)return false; // 1ターン1回の通常攻撃制限
  for(const a of alive("E")){
    if(PIECES[a.type].noNormal||a.flags.noAttack)continue;
    for(const [r,c] of normalAttackCells(a)){
      const t=visAt(r,c,"E");
      if(t&&t.owner==="P"&&!t.flags.invisible){ G.attackUsed=true; performAttack(a,t,"melee"); return true; }
    }
  }
  return false;
}
function finishAITurn(){
  if(G.over)return;
  shieldPhase("E",()=>{
    explodeBombs("E",()=>{
      if(G.over)return;
      decayWalls(); // 壁は3回のターンエンドで消滅
      for(const p of alive("P")){ if(p.flags.invisible)clearNinjaProb(p.id); p.flags.invisible=false; }
      for(const p of alive("E")){p.flags.noAttack=false;p.flags.slowedVisual=false;p.flags.mikoBuff=false;}
      setTimeout(startPlayerTurn,400);
    });
  });
}
