   描画
   ========================================================= */
function setPhaseBar(html){$("#phaseBar").innerHTML=html;}
function render(){
  const board=$("#board");
  board.innerHTML="";
  // 選択駒の移動ハイライト計算
  let moveSet=new Set(),jumpSet=new Set(),atkSet=new Set();
  if(!G.over){
    if(UI.mode==="action"&&UI.sel!==null){
      const p=byId(UI.sel);
      if(p&&p.owner==="P"){
        const can=(G.currentActor===null&&G.slotsLeft>0)||G.currentActor===p.id;
        if(can){
          moveSet=new Set(stepOptions(p).map(x=>x.join(",")));
          jumpSet=new Set(jumpOptions(p).map(x=>x.join(",")));
        }
      }
    }
    if(UI.mode==="attack"&&UI.sel!==null){
      const p=byId(UI.sel);
      if(p&&p.owner==="P"&&!p.flags.noAttack){
        for(const [r,c] of normalAttackCells(p)){
          const t=visAt(r,c,"P");
          if(t&&t.owner==="E")atkSet.add(r+","+c);
        }
      }
    }
  }
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){
    const cell=document.createElement("div");
    cell.className="cell "+(c<3?"L":"R")+(r===5?" homeP":r===0?" homeE":"");
    const key=r+","+c;
    if(UI.targets.has(key)&&UI.mode==="meteorTarget")cell.classList.add("hl-meteor");
    else if(UI.targets.has(key))cell.classList.add("hl-tgt");
    if(moveSet.has(key))cell.classList.add("hl-move");
    if(jumpSet.has(key))cell.classList.add("hl-jump");
    if(atkSet.has(key))cell.classList.add("hl-atk");
    // 着弾待ちの隕石の候補マスは常に赤く警告表示（相手手番中も見える）
    if(G.meteors&&G.meteors.some(m=>m.cells.some(cc=>cc.r===r&&cc.c===c))&&UI.mode!=="meteorTarget")cell.classList.add("hl-meteor-warn");
    const hl=document.createElement("div");hl.className="hl";cell.appendChild(hl);
    // markers（爆弾・罠・盾をセル下部に横並びで整頓表示）
    const mkRow=document.createElement("div");mkRow.className="mkRow";
    const addMk=(cls,txt,title)=>{
      const m=document.createElement("div");m.className="marker "+cls;
      m.textContent=txt;m.title=title||"";mkRow.appendChild(m);
    };
    for(const t of G.traps)if(t.r===r&&t.c===c&&t.owner==="P"){ addMk("mk-trap","✕","罠"); }
    for(const b of G.bombs)if(b.r===r&&b.c===c){ addMk("mk-bomb","💣","爆弾"); }
    if(wallAt(r,c)){
      cell.classList.add("wallCell");
      const w=G.walls.find(x=>x.r===r&&x.c===c);
      if(w){
        const lifeRow=document.createElement("div");
        lifeRow.className="wallLife";
        const life=(w.life==null?3:w.life);
        for(let i=0;i<life;i++){ const s=document.createElement("i"); lifeRow.appendChild(s); }
        cell.appendChild(lifeRow);
      }
    }
    for(const p of G.pieces)if(!p.dead&&p.flags.block&&p.flags.block.r===r&&p.flags.block.c===c){ addMk("mk-block","🛡","盾の防御"); }
    if(mkRow.children.length)cell.appendChild(mkRow);
    const p=at(r,c);
    if(p&&p.flags.pendingMeteor){ /* 着弾待ちの隕石は空へ昇っているので盤上に描画しない */ }
    else if(p&&!(p.flags.invisible&&p.owner==="E")){
      const d=document.createElement("div");
      d.className="piece "+p.owner;
      if(p.flags.invisible)d.classList.add("invis");
      if(UI.sel===p.id)cell.classList.add("hl-sel");
      if(G.currentActor===p.id)d.classList.add("actorNow");
      if(p.flash){d.classList.add("flash");p.flash=false;}
      if(p.spawn){d.classList.add("spawn");p.spawn=false;}
      // 魔王オーラ：自分の勇者が指定した魔王だけ、自分にのみ紫に光る
      if(isPlayerMaou(p))d.classList.add("maouAura");
      // 覚醒した勇者：キラキラ光るエフェクト
      if(p.type==="yusha" && p.flags.heroBoost)d.classList.add("awakened");
      // 術士の効果を受けた駒：灰色で重たそうな見た目（相手ターン中も、適用ターン中も表示継続）
      if(p.flags.apCut||p.flags.slowedVisual)d.classList.add("slowed");
      // 悪霊に取り憑かれた駒：顔面蒼白＋周囲を白い幽霊が公転
      if(p.flags.noAttack){
        d.classList.add("haunted");
        const gh=document.createElement("div");gh.className="hauntGhost";
        gh.innerHTML='<div class="hitodama"></div>';
        d.appendChild(gh);
      }
      // 巫女の加護を受けた駒：やる気に満ちた見た目（温かい光＋立ち上る気）
      if(p.flags.mikoBuff){
        d.classList.add("motivated");
        const au=document.createElement("div");au.className="motiAura";
        au.innerHTML='<i></i><i></i><i></i>';
        d.appendChild(au);
      }
      const kj=document.createElement("div");kj.className="kj";kj.textContent=PIECES[p.type].k;
      d.appendChild(kj);
      // 超能力者：射程モード（十字／斜め）を両者に表示
      if(p.type==="esper"){
        const em=document.createElement("div");
        em.className="espMark "+(p.flags.esperMode==="diag"?"diag":"ortho");
        if(p.flags.esperMode==="diag"){
          em.innerHTML='<span class="ul">◤</span><span class="ur">◥</span><span class="dl">◣</span><span class="dr">◢</span>';
        }else{
          em.innerHTML='<span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span>';
        }
        d.appendChild(em);
      }
      const hpRow=document.createElement("div");hpRow.className="hpRow";
      const full=Math.floor(p.hp),halfHp=p.hp-full>=0.5;
      for(let i=0;i<full;i++){const b=document.createElement("i");hpRow.appendChild(b);}
      if(halfHp){const b=document.createElement("i");b.className="half";hpRow.appendChild(b);}
      d.appendChild(hpRow);
      if(p.owner==="P"&&G.turn==="P"&&(G.phase==="action")&&p.ap>0){
        const apRow=document.createElement("div");apRow.className="apRow";
        for(let i=0;i<p.ap;i++){const b=document.createElement("i");apRow.appendChild(b);}
        d.appendChild(apRow);
      }
      const badges=document.createElement("div");badges.className="badges";
      if(p.flags.invisible)badges.appendChild(badgeEl("透"));
      if(p.flags.noAttack)badges.appendChild(badgeEl("縛"));
      if(p.flags.apCut)badges.appendChild(badgeEl("遅"));
      if(p.flags.heroBoost)badges.appendChild(badgeEl("覚"));
      d.appendChild(badges);
      cell.appendChild(d);
    }
    cell.onclick=()=>onCell(r,c);
    board.appendChild(cell);
  }
  renderCtrl();
  renderInfo();
  updateScore();
  scheduleWatch();
}
function badgeEl(t){const s=document.createElement("span");s.textContent=t;return s;}

function renderCtrl(){
  const ctrl=$("#ctrl");
  ctrl.innerHTML="";
  const btn=(label,cls,fn,dis)=>{
    const b=document.createElement("button");
    b.className="act"+(cls?" "+cls:"");
    b.textContent=label;b.disabled=!!dis;b.onclick=fn;
    ctrl.appendChild(b);
  };
  if(G.over){btn("もう一度戦う","primary",()=>showStart());return;}
  if(G.turn==="P"){
    if(UI.mode==="action"){
      if(G.currentActor!==null&&G.slotsLeft>0){
        btn("この駒の行動を終える","",()=>{G.currentActor=null;UI.sel=null;render();},actorCanStillAct());
      }
      const mustAct=!G.acted&&hasAnyPlayerAction();
      const apLeft=actorCanStillAct();
      btn(mustAct?"攻撃フェーズへ（要：駒1体の行動）":apLeft?"攻撃フェーズへ（行動力を使い切る）":"攻撃フェーズへ","primary",()=>gotoAttackPhase(),mustAct||apLeft);
      // 何か動かした後なら手番をやり直せる（攻撃フェーズ移行前まで）
      if(G.acted && turnSnapshot){
        btn("↩ 手番をやり直す","",()=>restoreTurnSnapshot());
      }
    }else if(UI.mode==="ability"){
      btn("キャンセル","",()=>{clearAbility();render();});
    }else if(UI.mode==="attack"){
      btn("攻撃しない（手番終了）","danger",()=>{
        UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
        render();afterPlayerAttack();
      });
    }else if(UI.mode==="shield"){
      btn("変更しない","",()=>{UI.extra.next();});
      if(UI.extra.piece.flags.block)btn("防御を解除","danger",()=>{
        UI.extra.piece.flags.block=null;UI.extra.next();
      });
    }
  }
}
function renderInfo(){
  const el=$("#infoPanel");
  let p=UI.sel!==null?byId(UI.sel):null;
  if(UI.mode==="ability"&&UI.ability)p=UI.ability.piece;
  if(!p){
    if(UI.mode==="ai")el.innerHTML='<span style="color:var(--sub)">敵軍が思考しています…</span>';
    else el.innerHTML='<span style="color:var(--sub)">駒を選択すると詳細が表示されます。</span>';
    return;
  }
  const I=PIECES[p.type];
  let html=`<span class="pname">${I.name}</span>
    <span class="stat">${p.owner==="P"?"自軍":"敵軍"}／HP ${fmt(p.hp)}／行動力 ${p.ap}/${p.maxAp}</span>`;
  // 現在ついているバフ・デバフを表示
  const st=pieceStatuses(p);
  if(st.length){
    html+='<div class="statusRow">';
    for(const s of st) html+=`<span class="statusTag ${s.cls}">${s.label}</span>`;
    html+='</div>';
  }
  html+=`<div class="desc">${I.desc}</div>`;
  el.innerHTML=html;
  if(p.owner==="P"&&UI.mode!=="ability"){
    const btns=abilityButtons(p);
    if(btns.length){
      const wrap=document.createElement("div");wrap.className="abilBtns";
      for(const b of btns){
        const bb=document.createElement("button");
        bb.className="act";bb.textContent=b.label;bb.disabled=!b.enabled;
        bb.onclick=b.fn;
        wrap.appendChild(bb);
      }
      el.appendChild(wrap);
    }
  }
  if(UI.mode==="ability"){
    const note=document.createElement("div");
    note.style.cssText="margin-top:6px;color:var(--gold);font-size:12px";
    note.textContent="光っているマス／駒を選択してください（盤外をタップでキャンセル）";
    el.appendChild(note);
  }
}

/* =========================================================
   モーダル
   ========================================================= */
function openModal(title,bodyHtml,buttons){
  $("#modalTitle").textContent=title;
  $("#modalBody").innerHTML=bodyHtml;
  const bt=$("#modalBtns");bt.innerHTML="";
  for(const b of buttons||[]){
    const e=document.createElement("button");
    e.className="act"+(b.cls?" "+b.cls:"");
    e.textContent=b.label;e.onclick=b.fn;
    bt.appendChild(e);
  }
  $("#modalBack").classList.remove("hidden");
}
function closeModal(){$("#modalBack").classList.add("hidden");}
let pickerArgs=null;
function openPiecePicker(title,cb){
  pickerArgs={title,cb};
  // 勇者は1駒制限：自軍に既に勇者がいれば選べない
  const hasYusha=alive("P").some(p=>p.type==="yusha");
  // 対人戦（オンライン）でのみ、仮追加の駒も選べる
  // 仮追加の駒はプレイヤー専用。CPU戦・対人戦どちらでもプレイヤーの選択肢に出す
  // （openPiecePickerはプレイヤーの配置・再配置でのみ呼ばれる）。CPUはPICKABLEのみ使う。
  const list = PICKABLE.concat(PVP_PIECES);
  let html='<div class="pickGrid">';
  for(const t of list){
    const I=PIECES[t];
    const locked=(t==="yusha"&&hasYusha);
    html+=`<div class="pCard${locked?" locked":""}${I.pvpOnly?" pvpCard":""}" data-t="${t}"${locked?' data-locked="1"':""}>
      <div class="t"><span class="nm">${I.name}${I.pvpOnly?' <span class="pvpTag">仮</span>':''}</span><span class="ap">行動力${I.ap}</span></div>
      <div class="d">${locked?"すでに勇者が場にいるため選べません":I.desc}</div></div>`;
  }
  html+="</div>";
  openModal(title,html,[{label:"盤面を確認する",fn:()=>{closeModal();showPeekBack();}}]);
  $("#modalBody").querySelectorAll(".pCard").forEach(card=>{
    if(card.dataset.locked){ card.onclick=()=>{}; return; } // 勇者ロック中は反応しない
    card.onclick=()=>{sfx("pick");pickerArgs=null;hidePeekBack();closeModal();cb(card.dataset.t);};
  });
}
function showPeekBack(){
  hidePeekBack();
  const b=document.createElement("button");
  b.id="peekBack";b.className="act primary";b.textContent="▲ 駒の選択に戻る";
  b.onclick=()=>{hidePeekBack();if(pickerArgs)openPiecePicker(pickerArgs.title,pickerArgs.cb);};
  document.body.appendChild(b);
}
function hidePeekBack(){
  const b=document.getElementById("peekBack");
  if(b)b.remove();
}

function showHelp(){
  let rows="";
  for(const t of PICKABLE){
    const I=PIECES[t];
    rows+=`<tr><th>${I.name}<br><small style="color:var(--sub)">行${I.ap}</small></th><td>${I.desc}</td></tr>`;
  }
  openModal("ルール",`
   <div class="ruleSec"><h3>勝利条件</h3><p>相手の駒を<b>2つ</b>倒したら勝利。駒は倒されると即座に新しい駒を手前の段に召喚できます（種類変更可）。</p></div>
   <div class="ruleSec"><h3>盤面と色の制約</h3><p>6×6の盤は左右で色が分かれています。<b>自分の主力3駒が同じ色の陣に全て揃う配置・移動は禁止</b>です。</p></div>
   <div class="ruleSec"><h3>ターンの流れ</h3><p>① 行動フェーズ：<b>必ず駒1体を選び、行動力を消費して</b>移動（1マス=行動力1）や能力使用を行います（行動できる駒が1体もいない場合のみスキップ可）。<br>② 攻撃フェーズ：駒1体（移動した駒以外でも可）で通常攻撃。基本は縦横の隣接マスに1ダメージ。<br>③ ターンエンド。全駒HP3、HP0以下で撃破。</p></div>
   <div class="ruleSec"><h3>駒一覧（全24種）</h3><table>${rows}</table></div>
   <div class="ruleSec"><h3>このアプリでの裁定メモ</h3>
     <p>・行動フェーズでは選んだ駒の行動力をすべて消費するまで攻撃フェーズに進めません（移動先や能力対象が一切ない場合を除く）。<br>・射程内に敵がいない遠距離攻撃など、対象のない能力は使用できません。<br>・敵の駒をタップすると効果を確認できます。<br>・術士／悪霊の能力は行動力0で使用できます（毎ターン1回）。残った行動力は移動か「待機」で消費します。<br>・薬師の調合と聖職者の祈祷は各1回限り。<br>・勇者は再召喚時にも魔王を指定できます。<br>・盾兵の防御指定は毎ターン攻撃フェーズ後に変更可（縦横4マスから選択）。<br>・移動と能力は行動力の範囲で同一ターンに併用できます。</p></div>
  `,[{label:"閉じる",cls:"primary",fn:closeModal}]);
}

function showStart(){
  cleanupNet();
  openModal("攻 城 戦",`
    <p style="text-align:center;letter-spacing:.1em;color:#d9cdb2">三つの駒で戦場へ。<br>敵の駒を二つ討ち取れば勝利。</p>
    <label id="randomDealToggle" style="display:flex;align-items:center;justify-content:center;gap:8px;
      margin:4px 0 10px;padding:8px;background:var(--panel2);border-radius:8px;cursor:pointer;font-size:14px">
      <input type="checkbox" id="rndChk" style="width:18px;height:18px">
      <span>🎲 ランダム配布モード（両者の駒3つを完全ランダムで配布）</span>
    </label>
    <div class="ruleSec"><h3>ソロプレイ（AI対戦）</h3>
      <div class="choiceList">
        <button class="act" id="lvEasy">やさしい — 時々ゆるい手を指す</button>
        <button class="act" id="lvNormal">ふつう — 10手先を読む深層思考</button>
        <button class="act" id="lvStrong">つよい — 15手先まで相手の応手も含め徹底検証（最大20秒）</button>
      </div>
    </div>
    <div class="ruleSec"><h3>オンライン対戦（ルームコード）</h3>
      <div class="choiceList">
        <button class="act primary" id="btnHost">ルームを作る — コードを発行</button>
        <button class="act primary" id="btnJoin">ルームに参加 — コードを入力</button>
      </div>
      <p style="color:var(--sub);font-size:12px;margin:6px 0 0">同じコードを入力した相手とリアルタイムで対戦できます。先手はランダムに決まります。オンラインではルームを作った側のランダム配布設定が適用されます。</p>
    </div>
    <p style="color:var(--sub);font-size:12px;text-align:center">右上の「？」でいつでもルールと駒一覧を確認できます。</p>
  `,[]);
  const rc=$("#rndChk"); if(rc)rc.checked=randomDeal;
  const syncRnd=()=>{randomDeal=$("#rndChk").checked;};
  $("#lvEasy").onclick=()=>{syncRnd();aiLevel="easy";closeModal();newGame();};
  $("#lvNormal").onclick=()=>{syncRnd();aiLevel="normal";closeModal();newGame();};
  $("#lvStrong").onclick=()=>{syncRnd();aiLevel="strong";closeModal();newGame();};
  $("#btnHost").onclick=()=>{syncRnd();closeModal();hostRoom();};
  $("#btnJoin").onclick=()=>{syncRnd();closeModal();joinRoom();};
}

/* ---------- boot ---------- */
$("#helpBtn").onclick=showHelp;
$("#muteBtn").onclick=()=>{soundOn=!soundOn;$("#muteBtn").textContent=soundOn?"♪":"✕";};
showStart();
</script>
</body>
</html>
