/* CPUの詐欺師の偽装先：通常攻撃できない後衛に見せかけ、近づいてきた相手を殴る */
function aiPickDisguise(){
  const opts=["kyuhei","sogeki","miko","majo","chokyo","seishoku","gunshi"];
  return opts[Math.floor(Math.random()*opts.length)];
}
/* ---- 魔王指定 ---- */
/* CPUの勇者が選ぶ魔王：倒しやすい相手ほど早く覚醒できる（HPが低い・通常攻撃のない後衛・行動力1を優先。獣は除く） */
function aiPickMaou(list){
  const c=list.filter(p=>p.type!=="kemono"); const pool=c.length?c:list;
  const score=p=>p.hp*10 + (p.maxAp||1)*4 + (PIECES[p.type].noNormal?-6:0) + (p.type==="fushicho"?15:0) + (p.type==="tatehei"?5:0);
  return pool.slice().sort((a,b)=>score(a)-score(b))[0];
}
function startMaouPhase(){
  // 敵AIの勇者がいれば、こっそりプレイヤーの駒1体を魔王に指定
  for(const h of alive("E").filter(p=>p.type==="yusha"&&!p.flags.maouId&&!p.flags.heroBoost)){
    const targets=alive("P");
    if(targets.length){
      // 主力（行動力2や高HP）を狙う
      const t=aiPickMaou(targets);
      h.flags.maouId=t.id;
      log("敵の勇者が密かに魔王を指定した…","e",true);
    }
  }
  const heroes=alive("P").filter(p=>p.type==="yusha" && !p.flags.maouId && !p.flags.heroBoost);
  if(heroes.length===0){ startPlayerTurn(); return; }
  promptMaou(heroes,0,()=>startPlayerTurn());
}
function promptMaou(heroes,i,done){
  if(i>=heroes.length){done();return;}
  const hero=heroes[i];
  UI={mode:"maou",sel:hero.id,targets:new Set(alive("E").map(p=>p.r+","+p.c)),ability:null,
      extra:{cb:(target)=>{
        hero.flags.maouId=target.id;
        log(`勇者は密かに魔王を指定した…`,"p",true);
        UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
        render();
        promptMaou(heroes,i+1,done);
      }}};
  setPhaseBar(`<span class="turnP">勇者：敵駒1つを「魔王」に指定してください（相手には非公開）</span>`);
  render();
}

/* =========================================================
   ダメージ / 死亡 / リスポーン
   ========================================================= */
const BYPASS=new Set(["bomb","curse","chain","trap","ninja","meteor"]);
function dealDamage(target,dmg,src,kind){
  if(!target||target.dead) return false;
  // 流星群発動中の隕石は空へ昇っているため、狙撃手・弓兵・通常攻撃では狙えない
  if(target.flags.pendingMeteor && kind!=="meteor"){
    return false;
  }
  if(target.flags.invisible && !BYPASS.has(kind)){
    log(`${pieceLabel(target)}は透明で攻撃を無効化！`,target.owner==="P"?"p":"e");
    return false;
  }
  if(target.flags.block && src && (kind==="melee"||kind==="ranged")
     && src.r===target.flags.block.r && src.c===target.flags.block.c){
    log(`${pieceLabel(target)}は盾でそのマスからの攻撃を防いだ！`,target.owner==="P"?"p":"e");
    return false;
  }
  target.hp=r2(target.hp-dmg);
  target.flash=true;
  sfx(kind==="heal"?"heal":"hit");
  log(`${pieceLabel(target)}に${fmt(dmg)}ダメージ（残HP ${fmt(Math.max(0,target.hp))}）`,src&&src.owner==="P"?"p":"e");
  if(src && src.type==="kyuketsuki" && src.owner!==target.owner && !src.dead && kind==="melee" && src.hp<3){
    healPiece(src,0.5);
  }
  if(target.hp<=0){ killPiece(target,src,kind); }
  return true;
}
function healPiece(p,amount){
  if(!p||p.dead)return;
  p.hp=Math.min(p.maxHp||3,r2(p.hp+amount));
  sfx("heal");
  log(`${pieceLabel(p)}のHPが${fmt(amount)}回復（HP ${fmt(p.hp)}）`,p.owner==="P"?"p":"e");
}
/* 隕石の着弾を解決する。meteorId=隕石駒、(ir,ic)=選ばれた着弾マス。 */
function resolveMeteorImpact(meteorId, ir, ic){
  const p=byId(meteorId);
  G.meteors=(G.meteors||[]).filter(m=>m.id!==meteorId);
  log(`[[meteor]] 隕石が ${cellName(ir,ic)} に着弾！`,p&&p.owner==="P"?"p":"e");
  sfx("bomb");
  spawnShatterAt(ir,ic,p?p.owner:"P");
  // 着弾マスが相手の領地なら破壊する
  const meteorOwner = p?p.owner:"P";
  if(G.territories&&G.territories.length){
    const before=G.territories.length;
    G.territories=G.territories.filter(t=>!(t.r===ir&&t.c===ic&&t.owner!==meteorOwner));
    if(G.territories.length<before)log("流星群が相手の領地を破壊した！","s");
  }
  // ① 着弾マスにいる駒は撃破（隕石本体を除く）。
  //    隕石はそのマスへ移動するので、不死鳥であっても即kill（灰から蘇らせない）。重なりを防ぐ。
  const direct=at(ir,ic);
  let hitFoe=false;   // 相手の駒に直撃・余波を当てたか（当てたら反動なし）
  if(direct && direct.id!==meteorId && p && direct.owner!==p.owner) hitFoe=true;
  if(direct && direct.id!==meteorId){
    if(direct.type==="fushicho")direct.flags.phoenix=true; // 蘇生を使い切った扱いにして即撃破
    killPiece(direct,p,"meteor");
  }
  // ② 隕石駒を着弾マスへ移動させ、消えていた状態を解除する
  if(p){
    p.flags.pendingMeteor=false;
    p.flags.invisible=false;
    p.flags.meteorOrigin=null;
    p.r=ir; p.c=ic;               // 着弾マスへ移動
  }
  // ③ 着弾マスの周囲十字4マスに0.5ダメージ
  for(const [dr,dc] of ORTHO){
    const r=ir+dr,c=ic+dc;
    if(!inB(r,c))continue;
    const t=at(r,c);
    if(t && t.id!==meteorId){ if(dealDamage(t,0.5,p,"meteor") && p && t.owner!==p.owner) hitFoe=true; }
  }
  // ④ 反動：相手の駒に直撃か余波を当てた時はなし。当てなかった時は0.5
  if(p && !p.dead && !hitFoe){ dealDamage(p, 0.5, null,"meteor"); }
  // 狐が隕石に変化していた場合は、着弾して盤上に戻った時点で狐に戻る（HP-1）
  if(p && !p.dead && p.flags.henge){ revertHengeFoxes(p.owner); }
}
function killPiece(p,src,kind){
  if(p.type==="fushicho" && !p.flags.phoenix){
    p.flags.phoenix=true; p.hp=0.5;
    log(`${pieceLabel(p)}は灰から蘇った！（HP0.5・失点なし）`,p.owner==="P"?"p":"e");
    return;
  }
  p.dead=true;
  learnRecordKill(p,src);
  spawnShatterAt(p.r,p.c,p.owner); // 砕け散る演出
  sfx("death");
  log(`◆ ${pieceLabel(p)}は倒れた！`,p.owner==="P"?"e":"p");
  // 罠師が倒れたら、その罠師の罠を全て解除
  if(p.type==="wanashi"){
    const before=G.traps.length;
    G.traps=G.traps.filter(t=>t.setter!==p.id);
    if(G.traps.length<before)log("罠師の死により、仕掛けられていた罠が消えた","s");
    clearTrapProbForSetter(p.id); // 推定確率マップも消す
  }
  // 忍者が倒れたら潜伏位置の予測を消す
  if(p.type==="ninja")clearNinjaProb(p.id);
  // 調教師が倒れたら、その調教師が召喚した獣も消滅
  if(p.type==="chokyo"){
    for(const beast of G.pieces){
      if(!beast.dead && beast.type==="kemono" && beast.flags.beastOf===p.id){
        beast.dead=true;
        spawnShatterAt(beast.r,beast.c,beast.owner);
        log("調教師の死により、獣も消え去った","s");
      }
    }
  }
  // 魔王チェック
  for(const h of G.pieces){
    if(!h.dead && h.type==="yusha" && h.flags.maouId===p.id && !h.flags.heroBoost){
      h.flags.heroBoost=true;
      healPiece(h,1);
      log(`★ 魔王が場を去った！${pieceLabel(h)}が覚醒（近接攻撃3）`,h.owner==="P"?"p":"e");
    }
  }
  // 聖職者の道連れ
  if(p.type==="seishoku"){
    log(`${pieceLabel(p)}の殉教…味方全てに1ダメージ`,"s");
    for(const o of alive(p.owner)) dealDamage(o,1,null,"chain");
  }
  if(p.type==="kemono"){
    const t=byId(p.flags.beastOf);
    if(t){ log("獣の死により調教師が傷ついた","s"); dealDamage(t,0.5,null,"chain"); }
    return; // 失点・再召喚なし
  }
  const scorer=opp(p.owner);
  G.kills[scorer]++;
  updateScore();
  if(p.owner==="E" && G.kills.P>G.kills.E) learnOnCpuLoss(p); // CPUが撃破数で負けた → 敗着を分析・記憶
  if(G.kills[scorer]>=2){ G.over=true; afterShatter(()=>endGame(scorer)); return; }
  G.respawnQueue.push(p.owner);
}
function updateScore(){
  $("#scoreP").textContent=G.kills.P;
  $("#scoreE").textContent=G.kills.E;
}
function endGame(winner){
  G.over=true; G.winner=winner;
  if(NET.on){
    NET.overShown=true;
    if(!NET.applying&&!NET.sentOver){NET.sentOver=true;netSend("go");}
  }
  UI={mode:"over",sel:null,targets:new Set(),ability:null,extra:{}};
  sfx(winner==="P"?"win":"lose");
  const learnedNow=learnActive()&&!G.learnDone;
  learnRecordGameEnd(winner);
  setPhaseBar(winner==="P"?'<span class="turnP">勝利！</span>':'<span class="turnE">敗北…</span>');
  render();
  setTimeout(()=>{
    openModal("勝敗決す",
      `<div id="overBanner" class="${winner==="P"?"":"lose"}">${winner==="P"?"勝 利":"敗 北"}</div>
       <p style="text-align:center;color:var(--sub)">自軍 ${G.kills.P} — ${G.kills.E} 敵軍</p>
       ${learnedNow?`<p style="text-align:center;color:var(--sub);font-size:12px">${icon("learn")} CPUがこの対局を学習しました（記録${learnAgg().games}戦・記憶した敗着${learnAgg().lessons}局面）</p>`:""}`,
      [{label:"もう一度戦う",cls:"primary",fn:()=>{closeModal();showStart();}}]);
  },600);
}

/* ---- respawn ---- */
function processRespawns(cont){
  if(G.over)return;
  if(G.respawnQueue.length===0){cont();return;}
  // 砕け散る演出が終わってから召喚フェーズへ
  afterShatter(()=>{
    if(G.over)return;
    if(G.respawnQueue.length===0){cont();return;}
    if(NET.on&&G.respawnQueue[0]==="E"){
      NET.cont=cont;NET.lock=true;
      netSend("respawn");
      waitBar("相手が駒を召喚中…");
      return;
    }
    const owner=G.respawnQueue.shift();
    if(owner==="E"){
      aiRespawn();
      render();
      setTimeout(()=>processRespawns(cont),400);
    }else{
      openPiecePicker("駒が倒された — 新たな駒を召喚",(type)=>{
        UI={mode:"respawn-place",sel:null,targets:new Set(),ability:null,extra:{type,cont}};
        const cells=[];
        for(let c=0;c<6;c++){
          if(at(5,c)||territoryOwnerAt(5,c)==="E")continue;
          if(mains("P").length>=2 && !respawnColorOk("P",c))continue;
          cells.push("5,"+c);
        }
        if(cells.length===0){for(let c=0;c<6;c++)if(!at(5,c))cells.push("5,"+c);}
        UI.targets=new Set(cells);
        setPhaseBar('<span class="turnP">召喚するマスを選択（手前の段）</span>');
        render();
      });
    }
  });
}
function respawnColorOk(owner,c){
  const ms=mains(owner);
  if(ms.length<2)return true;
  return !(ms.every(p=>half(p.c)===half(c)));
}
function placeRespawn(r,c){
  const {type,cont}=UI.extra;
  const p=makePiece(type,"P",r,c);
  G.pieces.push(p);
  learnRecordPick(type);
  sfx("place");
  if(type!=="sagishi")log(`自軍：${PIECES[type].name}を召喚`,"p"); // 詐欺師は偽装先確定後にログ
  UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
  const after=()=>{
    render();
    if(type==="yusha" && !p.flags.maouId){
      promptMaou([p],0,()=>processRespawns(cont));
    }else processRespawns(cont);
  };
  if(type==="esper") askEsperMode(p,after);
  else if(type==="sagishi") askDisguise(p,after,"召喚");
  else after();
}
function aiRespawn(){
  const threat=playerThreatMap();
  // 召喚可能な列
  const cols=[];
  for(let c=0;c<6;c++){
    if(at(0,c)||territoryOwnerAt(0,c)==="P")continue;   // 相手の領地には召喚できない
    if(mains("E").length>=2 && !respawnColorOk("E",c))continue;
    cols.push(c);
  }
  if(cols.length===0){for(let c=0;c<6;c++)if(!at(0,c)&&territoryOwnerAt(0,c)!=="P")cols.push(c);}
  if(cols.length===0)return;

  // 評価対象の駒タイプ（戦術的に意味のある候補＋汎用アタッカー）
  let CANDIDATES=["kenshi","senshi","kiba","souhei","kyuhei","sogeki","kyuketsuki",
                    "esper","jutsushi","akuryo","tatehei","fushicho","yusha","bakudan",
                    "ninja","boken","wanashi","kusushi","miko","seishoku","majo","chokyo","jusoshi","gunshi",
                    "inoshishi","kaizoku","taka",
                    "inseki","uchujin","ryoushu","sagishi","kitsune","kami"];  // 新規駒もCPUが選んで使う
  if(alive("E").some(p=>p.type==="yusha"))CANDIDATES=CANDIDATES.filter(t=>t!=="yusha"); // 勇者は1駒まで
  // プレイヤーの駒情報
  const foes=alive("P").filter(f=>!f.flags.invisible);
  // 危機にある自軍（次のプレイヤー手番で撃破されうる駒）
  const myPieces=alive("E");
  const inPeril=myPieces.filter(p=>{
    const dmg=threat[p.r*6+p.c]||0; return dmg>0 && p.hp-dmg<=0;
  });

  // 駒の種類ごとに最も良い列を求め、種類は点数に応じた確率で選ぶ（討ち取りなど大きな好機はほぼ確実に選ぶ）
  const perType=[];
  for(const type of CANDIDATES){
    let bs=-1e9,bc=null;
    for(const c of cols){
      const s=aiEvalRespawn(type,0,c,threat,foes,inPeril);
      if(s>bs){bs=s;bc=c;}
    }
    if(bc!==null)perType.push({type,s:bs,c:bc});
  }
  let best=null;
  const pickedType=aiSoftPick(perType,AI_RESPAWN_TEMP);
  if(pickedType){ const x=perType.find(y=>y.type===pickedType); best={type:x.type,c:x.c}; }
  if(!best){ best={type:aiWeightedPick([]), c:cols[0]}; }

  const p=makePiece(best.type,"E",0,best.c);
  if(best.type==="esper")p.flags.esperMode=aiEsperModeFor(0,best.c,foes);
  if(best.type==="sagishi")p.flags.disguiseAs=aiPickDisguise();
  G.pieces.push(p);
  // 敵勇者なら魔王を指定
  if(best.type==="yusha" && foes.length){
    const t=aiPickMaou(foes);
    p.flags.maouId=t.id;
    log("敵の勇者が密かに魔王を指定した…","e",true);
  }
  log(`敵軍：${PIECES[p.flags.disguiseAs||best.type].name}を召喚`,"e");
  sfx("place");
}
/* 超能力者の射程モードを、押し出したい相手が多い方向で選ぶ */
function aiEsperModeFor(r,c,foes){
  let ortho=0,diag=0;
  for(const f of foes){
    const dr=Math.abs(f.r-r),dc=Math.abs(f.c-c),man=dr+dc;
    if(man<=2 && (f.r===r||f.c===c))ortho++;
    if(man<=2 && dr===dc)diag++;
  }
  return diag>ortho?"diag":"ortho";
}
/* 召喚した駒が「そのターン（＝次の敵手番）」にできる動きを見積もって点数化 */
/* 実盤面で、駒(type)を(r,c)に置いた時の爆弾リスク（召喚・やさしいモード用） */
function aiBombSpotPenalty(r,c,type,hp){
  hp=hp==null?(type==="kemono"?1:3):hp;
  const worth=SS_PIECE_WORTH[type]||10;
  const lethal=hp-1.5<=0 && !(type==="fushicho");
  let pen=0;
  // 設置済みの爆弾（敵味方とも巻き込む）の爆風圏
  for(const b of (G.bombs||[])){
    if(Math.max(Math.abs(r-b.r),Math.abs(c-b.c))<=1) pen+= lethal ? 900 : 160+worth;
  }
  // 相手の爆弾魔が次に置ける位置の爆風圏（爆弾魔から2マス圏）
  for(const bm of alive("P").filter(x=>x.type==="bakudan")){
    const cheb=Math.max(Math.abs(r-bm.r),Math.abs(c-bm.c));
    if(cheb>2)continue;
    // 既に同じ爆風に入りうる味方が居れば、2体まとめて狙われる（1体しか逃がせない）
    const mates=alive("E").filter(e=>e.type!=="kemono"&&Math.max(Math.abs(e.r-bm.r),Math.abs(e.c-bm.c))<=2&&Math.max(Math.abs(e.r-r),Math.abs(e.c-c))<=2).length;
    pen+= (cheb<=1?40:20) + mates*120;
  }
  return pen;
}
function aiEvalRespawn(type,r,c,threat,foes,inPeril){
  const info=PIECES[type];
  let score=0;
  // 基本：召喚位置が危険でないほど良い（脆い駒を的にしない）
  const hereThreat=threat[r*6+c]||0;
  score-=hereThreat*40;
  score-=aiBombSpotPenalty(r,c,type);  // 爆風圏・爆弾魔の設置圏への召喚を避ける
  // プレイヤーの流星群の着弾候補マスには出さない（出した直後のプレイヤーの手番終了で着弾し、倒される）
  { const mf=pMeteorAt(r,c); if(mf!==null) score-= mf<=0 ? 5000 : 1500; }
  // 罠：召喚マスの周り（次に動くマス）に罠がありそうなら避ける
  { let tp=0; for(const [dr2,dc2] of ORTHO){ if(inB(r+dr2,c+dc2))tp+=trapProbAt(r+dr2,c+dc2); } score-=tp*60+trapProbAt(r,c)*80;
    for(const tr of alive("P").filter(f=>f.type==="wanashi")){ if(Math.max(Math.abs(tr.r-r),Math.abs(tr.c-c))===1)score-=15; } }
  // 仮の駒（移動・攻撃range計算用）
  const ghost={type,owner:"E",r,c,ap:info.ap,maxAp:info.ap,hp:type==="kemono"?1:3,flags:{}};
  // 到達できるマス（次の手番に動ける範囲。ここでは簡易にmaxAp歩）
  const reach=reachSquares(ghost,info.ap,true);

  // === 攻撃系：低HPのプレイヤー駒を仕留められるか ===
  if(!info.noNormal){
    // 新規召喚（HP3）での実際の通常攻撃ダメージ
    let dmg=1;
    if(type==="kenshi"||type==="souhei")dmg=1.5;   // 剣士・槍兵：+0.5
    else if(type==="yusha"&&false)dmg=1; // 召喚直後の勇者は未覚醒
    // 戦士はHP3なので加算なし（=1）。覚醒勇者は召喚では無いので考慮不要
    let bestKill=0, bestHit=0;
    for(const [mr,mc] of reach){
      const dirs=type==="souhei"?DIAG:ORTHO;
      for(const [dr,dc] of dirs){
        const tr=mr+dr,tc=mc+dc;
        const f=foes.find(x=>x.r===tr&&x.c===tc);
        if(!f)continue;
        if(f.hp-dmg<=0)bestKill=Math.max(bestKill,f.hp); // この駒なら仕留められる
        else bestHit=Math.max(bestHit,dmg);
      }
    }
    if(bestKill>0)score+=900+bestKill*60; // 召喚即撃破は最高評価（HPの高い相手を倒せるほど加点）
    else if(bestHit>0)score+=120+bestHit*30;
  }
  // 遠距離アタッカー（弓・狙撃）：射程に低HP駒が入るか
  if(type==="kyuhei"||type==="sogeki"){
    let kill=0,hit=0;
    for(const [mr,mc] of reach){
      for(const [rr,cc] of rangedCellsFrom(ghost,mr,mc)){
        const f=foes.find(x=>x.r===rr&&x.c===cc);
        if(!f)continue;
        if(f.hp-1<=0)kill=Math.max(kill,1);else hit=Math.max(hit,1);
      }
    }
    if(kill)score+=760; else if(hit)score+=140;
  }

  // === 危機対応：味方が追い詰められている時の対抗策 ===
  if(inPeril.length>0){
    // 超能力者：射程2以内の脅威駒を押し出して味方を守れる
    if(type==="esper"){
      // 危機の味方を脅かすプレイヤー駒が、超能力者の射程(2)内にいるか
      let usable=0;
      for(const f of foes){
        const man=Math.abs(f.r-r)+Math.abs(f.c-c);
        if(man<=2)usable++;
      }
      if(usable>0)score+=520+inPeril.length*60;
    }
    // 術士：相手の主力を減速（次ターンの追撃を鈍らせる）
    if(type==="jutsushi"){
      score+=380+inPeril.length*50;
    }
    // 悪霊：相手アタッカーの通常攻撃を封じる
    if(type==="akuryo"){
      score+=360+inPeril.length*50;
    }
    // 盾兵：壁として味方を守る配置
    if(type==="tatehei"){
      score+=180+inPeril.length*30;
    }
  }
  // 不死鳥：一度は失点なしで復活できる粘り（過剰選出を抑えるため控えめに）
  if(type==="fushicho")score+=25;
  // 勇者：魔王付与で将来の覚醒が狙える
  if(type==="yusha")score+=50;

  // === 相手構成へのカウンター（相性を見て選ぶ）===
  const foeTypes=foes.map(f=>aiSeenType(f));   // 詐欺師は偽装先に見える
  const isRanged=(type==="kyuhei"||type==="sogeki");
  for(const ft of foeTypes) score+=aiSetupCounter(type,ft)*1.4;   // 配置と同じ相性表を使う
  // 相手構成に合わせた重み付け（基本の強さ）。過度に強い駒に偏らないよう控えめ。
  score+=(AI_WEIGHTS[type]||2)*4;
  // 点を先行されている時（取り返しが必要）は攻撃的な駒を優先
  if(G.kills.P>G.kills.E && ["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(type))score+=30;

  // 汎用：前に出て攻め圧をかけられる（相手主力への距離）
  if(foes.length){
    let md=99;for(const f of foes)md=Math.min(md,Math.abs(r-f.r)+Math.abs(c-f.c));
    score-=md*3;
  }
  // 微小なランダムで硬直を防ぐ
  score+=learnPieceBonus(type); // 学習：この端末での戦績が良い駒を優先
  score+=Math.random()*8;
  return score;
}

/* =========================================================
   移動・トラップ・忍者
   ========================================================= */
function moveDirs(p){
  if(p.type==="kiba") return ALL8;
  if(p.type==="kaizoku") return ALL8;      // 海賊：周囲8マスへ移動可
  if(p.type==="taka") return ALL8;         // 鷹：常時8方向へ移動可
  if(p.type==="ninja"&&p.flags.invisible) return ALL8;
  return ORTHO;
}
/* 駒pが (r,c) へ1マス移動した後、残る行動力(apAfter)を確実に消費できるか（さらに動けるか）を判定。
   apAfterが0なら常にOK。1以上残るなら、その位置からさらに合法移動が1つでもあればOK。 */
function canSpendAPAfterStep(p, r, c, apAfter){
  if(apAfter<=0)return true;
  // (r,c)から行動力apAfterを「最後まで」使い切れる経路があるか、深さ優先で探索する。
  // 浅い1手先だけの判定だと、途中で行き止まりになる経路を誤って許可してしまう
  //（＝行動力3の猪が3マス移動できない不具合の原因）。
  const or=p.r, oc=p.c, oap=p.ap;
  // 訪問中のマス集合（往復による無限ループと、同一マス再訪を防ぐ）
  const canFrom=(cr,cc,ap,visited)=>{
    if(ap<=0)return true;
    // 通常移動（1マス＝AP1）
    for(const [dr,dc] of moveDirs(p)){
      let nr=cr+dr,nc=cc+dc;
      if(p.type==="boken" && (nc<0||nc>5))continue; // 端ワープはAP消費しないので数えない
      if(!inB(nr,nc))continue;
      if(visAt(nr,nc,p.owner))continue;
      if(wallAt(nr,nc))continue;
      if(territoryBlocks(p.owner,nr,nc))continue;
      const key=nr+","+nc;
      if(visited.has(key))continue;
      // pの本来位置は空きとして扱う（既にvisAtで除外されないため明示不要）
      visited.add(key);
      // 色制約チェック用にpを仮移動
      p.r=nr;p.c=nc;
      const okColor=colorOk(p.owner,p.id,nr,nc);
      p.r=or;p.c=oc;
      if(okColor && canFrom(nr,nc,ap-1,visited)){ visited.delete(key); return true; }
      visited.delete(key);
    }
    // 騎馬の跳躍（AP2消費）
    if(p.type==="kiba" && ap>=2){
      for(const [dr,dc] of ALL8){
        const mr=cr+dr,mc=cc+dc,jr=cr+dr*2,jc=cc+dc*2;
        if(!inB(mr,mc)||!inB(jr,jc))continue;
        if(wallAt(mr,mc))continue;
        if(!visAt(mr,mc,p.owner))continue;
        if(visAt(jr,jc,p.owner))continue;
        if(wallAt(jr,jc))continue;
        const key=jr+","+jc;
        if(visited.has(key))continue;
        p.r=jr;p.c=jc;const okColor=colorOk(p.owner,p.id,jr,jc);p.r=or;p.c=oc;
        if(okColor){ visited.add(key); if(canFrom(jr,jc,ap-2,visited)){visited.delete(key);return true;} visited.delete(key); }
      }
    }
    return false;
  };
  const visited=new Set([r+","+c]);
  const result=canFrom(r,c,apAfter,visited);
  p.r=or; p.c=oc; p.ap=oap;
  return result;
}
function stepOptions(p){
  const out=[];
  // 冒険者の端ワープ（左右端の行き来）は行動力を消費しない。
  // 2マス移動してAP0になった後でも、端にいれば1度だけ反対の端へワープできる。
  if(p.type==="boken" && !p.flags.bokenWrapUsed){
    if(p.c===0 || p.c===5){
      const wc = p.c===0 ? 5 : 0;
      if(inB(p.r,wc) && !visAt(p.r,wc,p.owner) && !wallAt(p.r,wc) && colorOk(p.owner,p.id,p.r,wc)){
        out.push([p.r,wc]);
      }
    }
  }
  if(p.ap<1)return out;
  for(const [dr,dc] of moveDirs(p)){
    let nr=p.r+dr,nc=p.c+dc;
    let isWrap=false;
    if(p.type==="boken" && (nc<0||nc>5)){ nc=(nc+6)%6; isWrap=true; } // 端ワープ（AP消費なし）
    if(isWrap)continue; // ワープは上で別途追加済み（重複回避）
    if(!inB(nr,nc))continue;
    if(visAt(nr,nc,p.owner))continue;
    if(wallAt(nr,nc))continue;               // 壁のあるマスには入れない
    if(territoryBlocks(p.owner,nr,nc))continue; // 相手の領地には入れない
    if(!colorOk(p.owner,p.id,nr,nc))continue;
    const apAfter = p.ap-1;
    // 移動後に行動力が余り、かつそこから一切動けない「行き止まり」マスは候補から外す。
    // ただし冒険者は1マス移動後に攻撃へ移行できるため、行き止まりでも候補に残す。
    const canStopEarly=(p.type==="boken");
    if(!canStopEarly && !canSpendAPAfterStep(p, nr, nc, apAfter))continue;
    out.push([nr,nc]);
  }
  return out;
}
function jumpOptions(p){
  const out=[];
  // 騎馬：隣接1マスの「駒」を飛び越えて2マス先へ（行動力2）。壁は飛び越えられない。
  if(p.type==="kiba"&&p.ap>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(nr,nc))continue;
      if(wallAt(mr,mc))continue;               // 中間が壁なら飛び越え不可
      if(!visAt(mr,mc,p.owner))continue;       // 中間に駒がある時のみ跳躍
      if(visAt(nr,nc,p.owner))continue;
      if(wallAt(nr,nc))continue;               // 着地マスが壁なら不可
      if(territoryBlocks(p.owner,nr,nc))continue; // 相手の領地には着地不可
      if(!colorOk(p.owner,p.id,nr,nc))continue;
      out.push([nr,nc]);
    }
    return out;
  }
  // 鷹：1体の駒（または壁）を飛び越えて、すぐ先の空きマスに着地する（行動力1）。
  //     着地先の隣にさらに飛び越えられる駒（壁）がある場合は行動力+1され、その1で再度跳躍/移動できる。
  if(p.type==="taka"&&p.ap>=1){
    const obstacle=(r,c)=>at(r,c)||wallAt(r,c); // 駒か壁が障害物
    for(const [dr,dc] of ALL8){
      const or=p.r+dr, oc=p.c+dc;               // 隣接＝飛び越える障害物のマス
      if(!inB(or,oc))continue;
      if(!obstacle(or,oc))continue;             // 隣が空き＝跳躍ではない（通常移動の範囲）
      const lr=p.r+dr*2, lc=p.c+dc*2;           // 障害物のすぐ先＝着地マス
      if(!inB(lr,lc))continue;
      if(obstacle(lr,lc))continue;              // 着地先が障害物なら不可（連続駒はまとめて越えられない）
      if(!colorOk(p.owner,p.id,lr,lc))continue;
      out.push([lr,lc]);
    }
    return out;
  }
  return out;
}
/* 鷹が(lr,lc)に着地した後、隣接に「さらに飛び越えられる駒（1体先が空き）」があるか判定 */
function takaCanChainFrom(p,lr,lc){
  const obstacle=(r,c)=>at(r,c)||wallAt(r,c);
  for(const [dr,dc] of ALL8){
    const or=lr+dr, oc=lc+dc;            // 隣接の障害物
    if(!inB(or,oc)||!obstacle(or,oc))continue;
    const nr=lr+dr*2, nc=lc+dc*2;        // その先の着地マス
    if(!inB(nr,nc)||obstacle(nr,nc))continue;
    if(!colorOk(p.owner,p.id,nr,nc))continue;
    return true;                          // 1つでも再跳躍できる方向があれば行動力+1の対象
  }
  return false;
}
/* マスに入る処理（罠・透明忍者を解決）戻り値: "ok"|"bounced"|"dead" */
/* 設置物を置いたマスに、相手の透明の忍者が潜んでいた場合の処理 */
function hiddenNinjaAt(r,c,placer){
  const h=at(r,c);
  return (h&&h.type==="ninja"&&h.flags.invisible&&h.owner!==placer)?h:null;
}
// 罠：その場で即発動（1ダメ・次のターン行動力-1）。罠は消費されるので盤面には残らない
function springTrapOnHiddenNinja(r,c,placer){
  const h=hiddenNinjaAt(r,c,placer); if(!h)return false;
  h.flags.invisible=false; clearNinjaProb(h.id);
  sfx("trap");
  log(`罠を仕掛けたマスに透明の忍者が潜んでいた！ ${pieceLabel(h)}は罠にかかった（1ダメ・次のターン行動力-1）`,"s");
  h.flags.apCut=true;
  dealDamage(h,1,null,"trap");
  return true;
}
// 獣を召喚したマスに相手の透明の忍者がいた：踏み込んだのと同じく、忍者が露見して獣は倒れる
function beastHitsHiddenNinja(b){
  const h=hiddenNinjaAt(b.r,b.c,b.owner); if(!h)return false;
  h.flags.invisible=false; clearNinjaProb(h.id);
  log("獣を召喚したマスには透明の忍者が潜んでいた！","s"); sfx("trap");
  dealDamage(b,3,null,"ninja");
  return true;
}
// 領地にしたマスの爆弾・罠は壊れる（相手の罠は見えないので、見える側にだけ知らせる）
function territoryClearObjects(r,c,placer){
  const nb=G.bombs.filter(b=>b.r===r&&b.c===c).length;
  if(nb){ G.bombs=G.bombs.filter(b=>!(b.r===r&&b.c===c)); log("領地化で、そのマスの爆弾が壊れた","s"); }
  const tr=G.traps.filter(t=>t.r===r&&t.c===c);
  if(tr.length){
    G.traps=G.traps.filter(t=>!(t.r===r&&t.c===c));
    if(tr.some(t=>t.owner==="P")) log("領地化で、あなたの罠が壊れた","p",true);
  }
  trapProbOnSafe(r,c);   // このマスにはもう罠が無い（CPUの推定からも除く）
}
// 領地：相手の領地に入っていることになるので即死
function territoryCatchHiddenNinja(r,c,placer,src){
  const h=hiddenNinjaAt(r,c,placer); if(!h)return;
  h.flags.invisible=false; clearNinjaProb(h.id);
  log(`領地にした場所に透明の忍者が潜んでいた！ ${pieceLabel(h)}は領地に侵入していたため即死`,"s");
  sfx("trap");
  h.hp=0; killPiece(h,src,"territory");
}
function enterSquare(p,nr,nc){
  const prevR=p.r,prevC=p.c;
  // 相手の領地には入れない（自分の領地・領地なしは進入可）
  if(territoryBlocks(p.owner,nr,nc))return "bounced";
  // 透明忍者チェック：透明中の「忍者」のマスに踏み込むと忍者が露見し、踏み込んだ駒が撃破される。
  // ※隕石（流星群中）は空へ昇っているだけなので、このロジックの対象外（即死させない）。
  const hidden=at(nr,nc);
  if(hidden && hidden!==p && hidden.flags.invisible && hidden.type==="ninja" && hidden.owner!==p.owner){
    hidden.flags.invisible=false;
    clearNinjaProb(hidden.id); // 露見したので予測不要
    log(`そこには透明の忍者が潜んでいた！`,"s");
    sfx("trap");
    dealDamage(p,3,null,"ninja");
    return p.dead?"dead":"bounced";
  }
  p.r=nr;p.c=nc;
  // 罠チェック
  const ti=G.traps.findIndex(t=>t.r===nr&&t.c===nc&&t.owner!==p.owner);
  if(ti>=0){
    const sprung=G.traps[ti];
    G.traps.splice(ti,1);
    // 発動して位置が判明：その罠の推定（最も可能性が高かった設置記録）を丸ごと消し、
    // 他の記録からもこのマスを除く（ここにはもう罠が無い）
    if(p.owner==="E")trapProbOnSprung(nr,nc);
    sfx("trap");
    log(`${pieceLabel(p)}は罠にかかった！（1ダメ・次のターン行動力-1）`,"s");
    p.flags.apCut=true; // 次のターン開始時に行動力-1
    p.ap=0;             // 罠にかかったら、その駒はその場で停止（残り行動力を失う）
    dealDamage(p,1,null,"trap");
    if(p.dead)return "dead";
  }else if(p.owner==="E"){
    trapProbOnSafe(nr,nc);   // CPUの駒が踏んで何も起きなかった＝このマスに罠は無い
  }
  return "ok";
}
function tryStep(p,nr,nc){
  // 冒険者の左右端ワープ（列0↔5をまたぐ横移動）は行動力を消費しない（1ターン1回）
  const isWrap = p.type==="boken" && nr===p.r && Math.abs(nc-p.c)===5;
  // 猪の突進：行動力ぶん連続で直進した直後の通常攻撃のみ攻撃力上昇。方向転換すると不発。
  if(p.type==="inoshishi"){
    const dr=nr-p.r, dc=nc-p.c; // この1歩の方向（±1マス想定）
    const f=p.flags;
    if(f.chargeDir && f.chargeDir[0]===dr && f.chargeDir[1]===dc){
      f.chargeSteps=(f.chargeSteps||0)+1; // 同じ方向へ継続
    }else{
      f.chargeDir=[dr,dc]; f.chargeSteps=1; // 新しい方向で歩き直し
    }
    // 行動力ぶん（ap2なら2マス、巫女で+1されたap3なら3マス）連続直進で突進準備完了
    f.chargeReady=(f.chargeSteps>=(p.maxAp||2));
  }
  if(!isWrap)p.ap--;
  else p.flags.bokenWrapUsed=true;
  const res=enterSquare(p,nr,nc);
  if(res==="ok")sfx(isWrap?"teleport":"move");
  return res;
}

/* =========================================================
   攻撃
   ========================================================= */
/* 聖職者の祈り：ゲーム中2回まで（2回使うと prayUsed） */
function prayCountUp(p){ p.flags.prayCount=(p.flags.prayCount||0)+1; if(p.flags.prayCount>=2)p.flags.prayUsed=true; }
function atkDamage(p,kind,target){
  let d=1;
  const et = p.type;  // 変化中の狐は p.type 自体が変化先になっているため、そのまま判定する
  if(et==="kenshi")d+=0.5;
  if(et==="souhei")d+=0.5;   // 槍兵：斜めからの一撃は1.5
  if(et==="senshi"){ if(p.hp<=1)d+=2; else if(p.hp<=2)d+=1; }
  if(et==="yusha"&&p.flags.heroBoost&&kind==="melee")d=3;
  // 猪：通常攻撃は基本0.5ダメ。直進2マス移動直後（chargeReady）の突進攻撃のみ2ダメ。
  if(et==="inoshishi"){
    d = (p.flags.chargeReady && kind==="melee") ? 2 : 0.5;
  }
  // 海賊：通常攻撃の相手が自分よりHPが高い時（同数は不可）、与ダメ+1（合計2）
  if(et==="kaizoku" && kind==="melee" && target && target.hp>p.hp)d+=1;
  return d;
}
/* 宇宙人の転移：列colの駒を dir 方向(-1=上/+1=下)へ「1マスだけ」移動させる。
   端に到達している駒・進行先が壁の駒・進行先が動けない駒で塞がれている駒は動かない。
   先頭（進行方向側）の駒から順に判定し、空いた／空く予定のマスへ1マス詰める。 */
function warpColumn(col, dir){
  const wallAtCell=(r)=>(G.walls||[]).some(w=>w.r===r&&w.c===col);
  // 進行方向の先頭から順に処理する行の並び
  const rowsInOrder = dir<0 ? [0,1,2,3,4,5] : [5,4,3,2,1,0];
  // このターンの移動後にそのマスが埋まるか（移動先の衝突判定に使う）
  const willOccupy=new Set();
  // まず現在駒がいるマスを記録（動かない駒はそのまま埋まり続ける）
  const moves=[]; // {p, nr}
  const stayed=new Set(); // 動かないと確定した行
  for(const r of rowsInOrder){
    const p=at(r,col);
    if(!p)continue;
    const nr=r+dir;
    // 端・盤外・壁・「動かないと確定した駒」で塞がれていれば移動不可
    if(nr<0||nr>5 || wallAtCell(nr) || stayed.has(nr)){
      stayed.add(r);
      continue;
    }
    // 進行先(nr)にいる駒は、先に処理済みで既に動いた（stayedに無い）なら空く
    const ahead=at(nr,col);
    if(ahead && !moves.some(m=>m.p===ahead)){
      // 進行先の駒がまだ動いていない＝塞がれている
      stayed.add(r);
      continue;
    }
    moves.push({p, nr});
  }
  // 実際に移動を適用（先頭から順に処理済みなので衝突しない）。
  // enterSquare経由にすることで、移動先に相手の罠があれば正しく発動する。
  // 先頭の駒が領地などで弾かれて動けなかった場合、その後ろの駒はそのマスへ入れない（重なり防止）
  for(const m of moves){ if(at(m.nr,col))continue; enterSquare(m.p, m.nr, col); }
}
/* 宇宙人の転移（横）：行rowの駒を dir 方向(-1=左/+1=右)へ1マス。
   左右の境界（3列目と4列目の間）をまたぐ移動で、その駒の陣営の主力3体が片側に集まってしまう場合、その駒は境界の手前で止まる */
function warpRow(row, dir){
  const wallAtCell=(c)=>(G.walls||[]).some(w=>w.r===row&&w.c===c);
  const colsInOrder = dir<0 ? [0,1,2,3,4,5] : [5,4,3,2,1,0];
  const moves=[], stayed=new Set(), planned=new Map();   // planned: 駒id → 移動後の列
  const half=c=>c<3?0:1;
  const crossOk=(p,nc)=>{
    if(p.type==="kemono")return true;
    const ms=mains(p.owner); if(ms.length<3)return true;
    const colOf=q=>planned.has(q.id)?planned.get(q.id):q.c;
    // 既に全主力が同じ側なら縛らない（ほかの移動と同じ扱い）
    if(ms.every(q=>half(colOf(q))===half(colOf(ms[0]))))return true;
    return !ms.every(q=>half(q.id===p.id?nc:colOf(q))===half(nc));
  };
  for(const c of colsInOrder){
    const p=at(row,c); if(!p)continue;
    const nc=c+dir;
    if(nc<0||nc>5||wallAtCell(nc)||stayed.has(nc)){ stayed.add(c); continue; }
    const ahead=at(row,nc);
    if(ahead && !moves.some(m=>m.p===ahead)){ stayed.add(c); continue; }
    if(half(c)!==half(nc) && !crossOk(p,nc)){ stayed.add(c); continue; }   // 境界の手前で止まる
    moves.push({p,nc}); planned.set(p.id,nc);
  }
  for(const m of moves){ if(at(row,m.nc))continue; enterSquare(m.p, row, m.nc); }
}
/* 転移を実行（縦／横） */
function doWarp(ab){ if(ab.axis==="row")warpRow(ab.row,ab.dir); else warpColumn(ab.col,ab.dir); }
function warpText(ab){ return ab.axis==="row" ? `${ab.row+1}行目を${ab.dir<0?"左":"右"}へ` : `${ab.col+1}列目を${ab.dir<0?"上":"下"}へ`; }
function normalAttackCells(p){
  if(PIECES[p.type].noNormal)return [];
  if(p.flags.invisible)return []; // 忍者：透明中は通常攻撃不可
  let dirs;
  if(p.type==="souhei") dirs=DIAG;
  else dirs=ORTHO;
  return dirs.map(([dr,dc])=>[p.r+dr,p.c+dc]).filter(([r,c])=>inB(r,c));
}
function rangedCellsFrom(p,r,c){
  const out=[];
  // 射線上に壁があると、その壁のマス以降（奥）は狙えない（壁が射線を遮る）。
  const rayPush=(dr,dc,maxK)=>{
    for(let k=1;k<=maxK;k++){
      const rr=r+dr*k, cc=c+dc*k;
      if(!inB(rr,cc))break;
      if(wallAt(rr,cc))break; // 壁にぶつかったら、その先は射線が通らない
      out.push([rr,cc]);
    }
  };
  if(p.type==="kyuhei"){
    // 縦横は2マス直線（射線判定あり）、斜めは1マス
    for(const [dr,dc] of ORTHO)rayPush(dr,dc,2);
    for(const [dr,dc] of DIAG)rayPush(dr,dc,1);
  }else if(p.type==="sogeki"){
    // 斜め3マス直線（射線判定あり）
    for(const [dr,dc] of DIAG)rayPush(dr,dc,3);
  }
  return out.filter(([rr,cc])=>inB(rr,cc));
}
function performAttack(attacker,target,kind){
  const d=atkDamage(attacker,kind,target);
  log(`${pieceLabel(attacker)}の${kind==="ranged"?"遠距離攻撃":"攻撃"}！`,attacker.owner==="P"?"p":"e");
  dealDamage(target,d,attacker,kind);
  // 猪：突進ダメージは「移動直後の1回」だけ。攻撃したら突進状態を解除。
  if(attacker.type==="inoshishi"){ attacker.flags.chargeReady=false; attacker.flags.chargeDir=null; attacker.flags.chargeSteps=0; }
}

/* =========================================================
   千日手
   ・各手番の終了時に盤面を記録し、6〜12手番前（自分の手番3〜6回前）のどれかと全く同じなら千日手。
     1つの駒の往復（4手番周期）も、2〜3つの駒を順に動かす往復（8〜12手番周期）も検知できる。
   ・千日手になったら警告。そこから両者とも自分の手番3回以内に「直近12手番に無かった盤面」に
     変えないと、先に3回目を迎えた側が負け。どちらかが盤面を変えれば警告は解除。
   ========================================================= */
const SENN_SPAN=6, SENN_WINDOW=12, SENN_TURNS=3;
/* 盤面 sig が、次に記録される位置から見て offset 手番前（minOff〜SENN_WINDOW、自分の手番どうし＝偶数）に現れているか */
function sennSeen(H,sig,minOff){
  const n=H.length; // sig は H[n] として記録される予定
  for(let k=minOff;k<=SENN_WINDOW;k+=2){ if(n-k>=0&&H[n-k]===sig)return true; }
  return false;
}
function sennSigFrom(pieces,bombs,traps,terrs,walls,kills){
  const P=pieces.map(p=>`${p.id}:${p.type}:${p.owner}:${p.r},${p.c}:${p.hp}`).sort().join("|");
  const B=bombs.map(b=>`${b.owner}${b.r}${b.c}${b.fuse}`).sort().join(",");
  const T=traps.map(t=>`${t.owner}${t.r}${t.c}`).sort().join(",");
  const R=terrs.map(t=>`${t.owner}${t.r}${t.c}`).sort().join(",");
  const W=walls.map(w=>`${w.r}${w.c}`).sort().join(",");
  return `${P}#${B}#${T}#${R}#${W}#${kills.P}-${kills.E}`;
}
function sennSig(){
  return sennSigFrom(G.pieces.filter(p=>!p.dead).map(p=>({id:p.id,type:p.type,owner:p.owner,r:p.r,c:p.c,hp:p.hp})),
    G.bombs||[],G.traps||[],G.territories||[],G.walls||[],G.kills);
}
/* 探索用の状態（CPUの手番終了後）から同じ形式の盤面署名を作る。
   相手の罠・透明の駒の実位置はCPUの読みには無いので、現在の実盤面の値を使う（手番中は動かないため） */
function ssSennSig(ns){
  const real=new Map(G.pieces.filter(p=>!p.dead).map(p=>[p.id,p]));
  const ps=[];
  for(const q of ns.ps){
    if(q.dead||q.guess)continue;
    ps.push({id:q.id,type:q.t,owner:q.o,r:q.r,c:q.c,hp:q.hp});
  }
  for(const p of real.values()) if(p.owner==="P"&&p.flags.invisible&&!ps.some(x=>x.id===p.id)&&ns.ps.some(q=>q.guess&&q.id===p.id&&!q.dead))
    ps.push({id:p.id,type:p.type,owner:p.owner,r:p.r,c:p.c,hp:(ns.ps.find(q=>q.id===p.id)||p).hp});
  const traps=[...(G.traps||[]).filter(t=>t.owner==="P"),...(ns.eTraps||[]).map(t=>({owner:"E",r:t.r,c:t.c}))];
  return sennSigFrom(ps,ns.bombs||[],traps,ns.territories||[],G.walls||[],{P:ns.kP,E:ns.kE});
}
/* side の手番終了時に呼ぶ。side が千日手で負けたら true（judge=false なら判定だけしない） */
function sennAfterTurn(side,judge=true){
  if(!G.sennHist)G.sennHist=[];
  const sig=sennSig();
  const H=G.sennHist;
  // 検知：6〜12手番前のどれかと同じ。警告中の継続判定：直近12手番（2手番前〜）に同じ盤面があれば「変えていない」
  const same = G.senn ? sennSeen(H,sig,2) : sennSeen(H,sig,SENN_SPAN);
  H.push(sig);
  if(H.length>40)H.shift();
  const who=s=>s==="P"?"あなた":"敵";
  if(!G.senn){
    if(same){
      G.senn={left:{P:SENN_TURNS,E:SENN_TURNS}};
      log(`⚠ 千日手です（少し前と盤面が全く同じ）。これから自分の手番3回以内に手を変えないと負けになります`,"s");
      sfx("curse");
    }
    return false;
  }
  if(!same){
    G.senn=null;
    log(`千日手が解消されました（${who(side)}が手を変えた）`,"s");
    return false;
  }
  G.senn.left[side]--;
  if(G.senn.left[side]<=0){
    if(!judge)return false;
    log(`千日手のまま手を変えなかったため、${who(side)}の負けです`,"s");
    return true;
  }
  if(side==="E") log(`⚠ 千日手が続いています：あなたは残り${G.senn.left.P}手番以内に手を変えないと負け（敵は残り${G.senn.left.E}手番）`,"s");
  return false;
}
/* 次の自分の手番が千日手の最終手番（盤面を変えないと負け）か */
function sennLastChance(side){ return !!(G.senn&&G.senn.left[side]<=1); }

/* =========================================================
   ターン進行（プレイヤー）
   ========================================================= */
function startPlayerTurn(){
  if(G.over)return;
  learnSnap("P");
  G.turn="P"; G.phase="action";
  G.slotsLeft=1; G.currentActor=null; G.attackUsed=false; G.acted=false;
  for(const p of alive("P")){
    p.ap=Math.max(0,p.maxAp-(p.flags.apCut?1:0));
    if(p.flags.apCut){log(`${pieceLabel(p)}は術で行動力が下がっている`,"s");p.flags.slowedVisual=true;}
    else p.flags.slowedVisual=false;
    p.flags.apCut=false;
    p.flags.usedFree=false;
    p.flags.bokenWrapUsed=false;
    p.flags.chargeDir=null; p.flags.chargeSteps=0; p.flags.chargeReady=false;
    p.flags.takaJumped=false;
    if(p.type==="tatehei")p.flags.block=null; // 盾は毎ターン更新（手番開始でリセット）
  }
  UI={mode:"action",sel:null,targets:new Set(),ability:null,extra:{}};
  // 手番開始時点のスナップショットを保存（攻撃フェーズ移行前ならやり直し可能）
  saveTurnSnapshot();
  setPhaseBar('<span class="turnP">あなたの手番 — 行動フェーズ（駒1体を選んで移動／能力）</span>'
    +(G.senn?`<span class="turnE">　⚠ 千日手：残り${G.senn.left.P}手番以内に盤面を変えないと負け${G.senn.left.P<=1?"（この手番が最後）":""}</span>`:""));
  render();
}
let turnSnapshot=null;
function saveTurnSnapshot(){
  if(NET.on){turnSnapshot=null;return;} // オンライン対戦ではやり直し不可
  turnSnapshot=JSON.stringify({
    pieces:G.pieces, traps:G.traps, bombs:G.bombs,
    kills:G.kills, pid:pid,
    meteors:G.meteors||[], walls:G.walls||[], territories:G.territories||[]
  });
}
function restoreTurnSnapshot(){
  if(!turnSnapshot)return;
  const s=JSON.parse(turnSnapshot);
  G.pieces=s.pieces.map(p=>({...p,flags:{...p.flags}}));
  G.traps=s.traps; G.bombs=s.bombs; G.kills=s.kills; pid=s.pid;
  // 流星群の着弾判定・壁・領地もやり直し前の状態に戻す（残留バグの防止）
  G.meteors=(s.meteors||[]).map(m=>({...m}));
  G.walls=(s.walls||[]).map(w=>({...w}));
  G.territories=(s.territories||[]).map(t=>({...t}));
  G.slotsLeft=1; G.currentActor=null; G.attackUsed=false; G.acted=false;
  G.phase="action"; G.turn="P";
  UI={mode:"action",sel:null,targets:new Set(),ability:null,extra:{}};
  log("手番をやり直しました","s");
  render();
}
function gotoAttackPhase(){
  if(!G.acted&&hasAnyPlayerAction()){
    log("先に駒1体を選んで移動か能力で行動力を消費してください","s");
    return;
  }
  if(actorCanStillAct()){
    log("選んだ駒の行動力をすべて使い切ってください","s");
    return;
  }
  G.phase="attack";
  UI={mode:"attack",sel:null,targets:new Set(),ability:null,extra:{}};
  setPhaseBar('<span class="turnP">攻撃フェーズ — 攻撃する駒を選択（スキップ可）</span>');
  render();
}
function afterPlayerAttack(){
  processRespawns(()=>{
    if(G.over)return;
    shieldPhase("P",()=>finishPlayerTurn());
  });
}
function shieldPhase(owner,cont){
  const shields=alive(owner).filter(p=>p.type==="tatehei");
  if(shields.length===0){cont();return;}
  if(owner==="E"){ // AIは脅威の高い方向を防ぐ
    for(const s of shields)aiSetShield(s);
    cont();return;
  }
  let i=0;
  const next=()=>{
    if(i>=shields.length){UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};cont();return;}
    const s=shields[i++];
    const opts=ORTHO.map(([dr,dc])=>[s.r+dr,s.c+dc]).filter(([r,c])=>inB(r,c));
    UI={mode:"shield",sel:s.id,targets:new Set(opts.map(o=>o.join(","))),ability:null,
        extra:{piece:s,next}};
    setPhaseBar('<span class="turnP">盾兵 — 防御するマスを指定（毎ターン設定。スキップすると今ターンは無防備）</span>');
    render();
  };
  next();
}
function finishPlayerTurn(){
  if(G.over)return;
  // 隕石の着弾：爆弾と同じタイミング。自分のターンエンドに fuse<=0 のものが着弾し、
  // それ以外は fuse を1減らす（＝設置の次の自分のターンエンドで着弾）。
  let readyMeteor=null;
  if(G.meteors&&G.meteors.length){
    for(const m of G.meteors){
      if(m.owner!=="P")continue;
      if((m.fuse==null?0:m.fuse)<=0){ if(!readyMeteor)readyMeteor=m; }
      else m.fuse--;
    }
  }
  if(readyMeteor){
    let cells=readyMeteor.cells.filter(c=>inB(c.r,c.c));
    // 着弾で全主力3体が同色陣に偏るマスは除外する
    const valid=cells.filter(c=>meteorImpactColorOk("P",c.c));
    // 偏らない候補が1つでもあればそれだけを提示。全て偏る場合のみ全候補を許可（詰み回避）
    if(valid.length>0)cells=valid;
    // 着弾地点は必ず手動で選択する（オンライン・CPU戦とも）。
    UI={mode:"meteorTargetEnd",sel:null,targets:new Set(cells.map(c=>c.r+","+c.c)),ability:{meteorId:readyMeteor.id},extra:{}};
    setPhaseBar('<span class="turnP">'+icon("meteor")+' 流星群が着弾します — 着弾地点を選択してください（赤いマス）</span>');
    render();
    return; // 着弾地点の選択後に finishPlayerTurnCore() でターン終了処理を続ける
  }
  finishPlayerTurnCore();
}
function finishPlayerTurnCore(){
  if(G.over)return;
  revertHengeFoxes("P"); // 変化中の自軍の狐を元に戻す（HP-1）
  explodeBombs("P",()=>{
    if(G.over)return;
    decayWalls(); // 壁は5回のターンエンドで消滅
    // 相手（E）所有の透明解除：Pの手番終了で解除されるのはE忍者
    for(const p of alive("E"))p.flags.invisible=false;
    for(const p of alive("P")){p.flags.noAttack=false;p.flags.slowedVisual=false;p.flags.mikoBuff=false;}
    if(sennAfterTurn("P")){ render(); endGame("E"); return; }   // 千日手の判定
    // 神の超越：連続ターンが残っていれば、相手に渡さずもう一度自分のターンを行う（CPU戦のみ）。
    if(!NET.on && (G.pExtraTurns||0)>0){
      G.pExtraTurns--;
      log(`超越：続けて自分のターン（残り${G.pExtraTurns}回）`,"p");
      setTimeout(startPlayerTurn,450);
      return;
    }
    // 連続ターンを使い切った（または元から無い）→ 相手へ手番を渡す。
    // 超越の再発動ロックは、予約中（超越を使ったターンの直後）は解除しない＝2連続ターンを終えるまで使えない。
    if(!((G.pPendingExtra||0)>0)) G.pExtraActive=false;
    // 敵の超越の予約：あなたの手番が終わったので、ここから敵が2回続けて行動する
    if(!NET.on && (G.ePendingExtra||0)>0){
      G.eExtraTurns=G.ePendingExtra-1; G.ePendingExtra=0;
      log(`敵の超越：ここから敵が${G.eExtraTurns+1}回続けて行動する`,"e");
    }
    if(NET.on){
      G.turn="E";G.phase="action";
      netSend("go");
      netDispatch();
      return;
    }
    setTimeout(startAITurn,450);
  });
}
function explodeBombs(owner,cont){
  const ready=[],rest=[];
  for(const b of G.bombs){
    if(b.owner===owner){
      if(b.fuse<=0)ready.push(b);
      else{b.fuse--;rest.push(b);}
    }else rest.push(b);
  }
  G.bombs=rest;
  for(const b of ready){
    sfx("bomb");
    log(`爆弾が炸裂！`, "s");
    // 爆弾マスと周囲8マスの罠は壊れる（どちらの罠も。ログには出さない）
    const inBlast=(r,c)=>Math.max(Math.abs(r-b.r),Math.abs(c-b.c))<=1;
    G.traps=G.traps.filter(t=>!inBlast(t.r,t.c));
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) if(inB(b.r+dr,b.c+dc)) trapProbOnSafe(b.r+dr,b.c+dc);
    // 爆弾マス自身に乗っている駒へのダメージ
    const onBomb=at(b.r,b.c);
    if(onBomb)dealDamage(onBomb,1.5,null,"bomb");
    if(G.over)return;
    // 周囲8マス
    for(const [dr,dc] of ALL8){
      const t=at(b.r+dr,b.c+dc);
      if(t)dealDamage(t,1.5,null,"bomb");
      if(G.over)return;
    }
  }
  render();
  processRespawns(cont);
}

/* =========================================================
   能力（プレイヤーUI）
   ========================================================= */
function takeActionSlot(p){
  if(G.currentActor===p.id){G.acted=true;return true;}
  if(G.currentActor!==null){
    if(G.slotsLeft<=0)return false;
    if(actorCanStillAct()){log("行動中の駒の行動力をすべて使い切ってから切り替えてください","s");return false;}
    G.currentActor=null; // 前の駒が行動力を使い切っていれば自動で切替
  }
  if(G.slotsLeft<=0)return false;
  G.currentActor=p.id; G.slotsLeft--; G.acted=true;
  return true;
}
/* 行動中の駒にまだ消費可能な行動力が残っているか */
function actorCanStillAct(){
  if(G.currentActor===null)return false;
  const p=byId(G.currentActor);
  if(!p||p.dead)return false;
  if(p.ap<1)return false;
  // 冒険者：1マスでも移動していれば、残り行動力を捨てて通常攻撃へ移行してよい
  // （移動を強制せず、距離を詰めてから攻撃する運用を可能にする）
  if(p.type==="boken" && p.ap<(p.maxAp||2))return false;
  // 鷹：跳躍で行動済みなら、（連続跳躍で得た）残り行動力を捨てて攻撃へ移行してよい
  if(p.type==="taka" && p.flags.takaJumped)return false;
  // stepOptions/jumpOptions は「行動力を余らせず確実に消費できる移動」だけを返す。
  // それが1つでもあるなら、まだ行動力を消費する義務が残っている。
  if(stepOptions(p).length>0)return true;
  if(jumpOptions(p).length>0)return true;
  // 行動力は残るが、どこへも動けず消費できない＝この駒では消費不能。攻撃フェーズへ進んでよい。
  return false;
}

function esperTargets(p){
  const dirs=p.flags.esperMode==="diag"?DIAG:ORTHO;
  const out=[];
  for(const [dr,dc] of dirs)for(let k=1;k<=2;k++){
    const t=at(p.r+dr*k,p.c+dc*k);
    if(t)out.push(t);
  }
  return out;
}

/* 能力ターゲット解決 */
function resolveAbilityClick(r,c){
  const ab=UI.ability;
  const p=ab.piece;
  const key=r+","+c;
  if(!UI.targets.has(key)){ // キャンセル扱い
    UI.mode="action";UI.ability=null;UI.targets=new Set();render();return;
  }
  switch(ab.type){
    case "ranged":{
      const t=visAt(r,c,"P");
      if(!t||t.owner!=="E"){clearAbility();render();return;}
      if(!takeActionSlot(p))break;
      p.ap--;
      performAttack(p,t,"ranged");
      clearAbility();
      // 遠距離攻撃で敵を倒すと相手の召喚処理が入る。その後に手番が進まなくなる不具合を防ぐため、
      // 弓兵・狙撃手（通常攻撃を持たない）は行動力を使い切ったら攻撃フェーズへ自動で進める。
      processRespawns(()=>{
        if(G.over)return;
        if(G.turn==="P" && G.phase==="action" && !actorCanStillAct() && PIECES[p.type].noNormal){
          gotoAttackPhase();
        }else{
          render();
        }
      });
      return;}
    case "slow":{
      if(!takeActionSlot(p))break;
      p.flags.usedFree=true;
      const t=visAt(r,c,"P");
      if(t){t.flags.apCut=true;log(`術士の呪い…${pieceLabel(t)}の次ターン行動力-1`,"p");sfx("slow");}
      break;}
    case "bind":{
      if(!takeActionSlot(p))break;
      p.flags.usedFree=true;
      const t=visAt(r,c,"P");
      if(t){t.flags.noAttack=true;log(`悪霊が取り憑いた…${pieceLabel(t)}は次の手番、通常攻撃不可`,"p");sfx("bind");}
      break;}
    case "trap":{
      if(!takeActionSlot(p))break;
      p.ap--;
      const sid=trapSetterId(p); // 狐が罠師をコピーしている場合はコピー元の罠師ID
      // この罠師の罠は最大2つ。3つ目を置く時は、超過分（最古から）を撤去してから設置する。
      let mine=G.traps.filter(t=>t.setter===sid);
      while(mine.length>=2){
        const oldest=mine[0];
        const idx=G.traps.indexOf(oldest);
        if(idx>=0)G.traps.splice(idx,1);
        mine=G.traps.filter(t=>t.setter===sid);
      }
      if(springTrapOnHiddenNinja(r,c,"P"))break;   // 透明の忍者がいたマス：罠は即発動
      G.traps.push({owner:"P",r,c,setter:sid});
      // AIには罠の正確な位置は見えない。罠師の位置から周囲8マスの設置確率を推定して保存する
      recordTrapProbability(sid, p.r, p.c);
      log("罠を仕掛けた（敵には見えない）","p",true);sfx("pick");
      break;}
    case "wall":{
      if(!takeActionSlot(p))break;
      p.flags.usedFree=true; p.hp=r2(p.hp-0.5);   // 行動力は消費しない（毎ターン1回・HP0.5）
      // そのマスに透明忍者がいれば撃破してから壁を設置
      const occ=at(r,c);
      if(occ&&occ.flags.invisible&&occ.type==="ninja"){
        clearNinjaProb(occ.id);
        log("壁の錬成が透明の忍者を捉えた！","p");
        killPiece(occ,p,"wall");
      }
      if(!G.walls)G.walls=[];
      // 壁は盤面に1つまで（誰が作ったかに関わらず）。既存の壁は置き換える。
      G.walls=[];
      // 5回のターンエンドを経過すると破壊される（life=5）
      G.walls.push({r,c,life:5});
      log("錬金術師が壁を錬成した（5ターンで消滅）","p",true);sfx("place");
      clearAbility();
      processRespawns(()=>render());

      if(!takeActionSlot(p))break;
      p.ap--; p.hp=r2(p.hp-0.5);
      doWarp(wab);

      sfx("teleport");

      p.ap--;
      if(!G.territories)G.territories=[];
      // 自軍(P)の領地は最大1つ。新しく作ると古い領地は消える。
      G.territories=G.territories.filter(t=>t.owner!=="P");
      G.territories.push({r,c,owner:"P"});
      log("領主が領地を宣言した（自分の駒しか入れない）","p",true);sfx("place");
      territoryClearObjects(r,c,"P");
      territoryCatchHiddenNinja(r,c,"P",p);   // 透明の忍者がいたマス：即死
      clearAbility();
      processRespawns(()=>render());
      return;}
    case "henge":{
      const t=at(r,c);
      if(!t||t.id===p.id){ clearAbility();render();return; }
      if(!takeActionSlot(p))break;
      p.ap--;
      // 変化：狐が選んだ駒の種類になる。ターンエンドで狐に戻るため、元が狐であることを記録。
      const toType=t.type;
      const newInfo=PIECES[toType];
      p.flags.henge=true;              // 変化中フラグ（ターンエンドで解除・HP-1）
      p.type=toType;                   // 種類そのものを変化先にする（能力・動き・与ダメも追従）
      p.maxAp=newInfo.ap;              // 行動力を変化先の最大値に
      // 変化直後はこのターンの残り行動力を変化先ぶん使えるようにする（移動・能力に使用可）
      p.ap=newInfo.ap;
      // 変化先が勇者なら魔王化前提はないので heroBoost は付与しない（通常の勇者として振る舞う）
      log(`狐が${newInfo.name}に変化した！（ターンエンドで狐に戻りHP-1）`,"p",true);
      sfx("buff");
      clearAbility();
      processRespawns(()=>render());
      return;}
    case "medicine":{
      const t=at(r,c);
      if(!t)break;
      if(!takeActionSlot(p))break;
      p.ap--;p.flags.healUsed=true;
      if(t.owner==="P"){healPiece(t,1);}
      else{log("薬師は毒を盛った！","p");dealDamage(t,1,p,"curse");}
      clearAbility();
      processRespawns(()=>render());
      return;}
    case "beast":{
      if(!takeActionSlot(p))break;
      p.ap--;
      const b=makePiece("kemono","P",r,c);
      b.flags.beastOf=p.id;
      G.pieces.push(b);
      if(beastHitsHiddenNinja(b))break;   // 透明の忍者のマスに召喚した：獣は倒れる
      G.slotsLeft++;            // 召喚したターンから獣を行動させられる
      G.currentActor=null;      // 行動駒のロックを解除して獣を選べるように
      UI.sel=b.id;              // 召喚した獣を選択状態に
      log("調教師が獣を召喚した（HP1）。このターンから獣を動かせる","p");sfx("place");
      break;}
    case "kagura":{
      const t=at(r,c);
      if(!t||t.owner!=="P")break;
      if(!takeActionSlot(p))break;
      p.ap--;p.hp=r2(p.hp-0.5);
      t.ap++;G.slotsLeft++;
      t.flags.mikoBuff=true;   // やる気バフ（巫女の加護）— 描画用
      G.currentActor=null;UI.sel=t.id;
      log(`巫女の神楽…${pieceLabel(t)}の行動力+1、続けて行動できる（巫女HP-0.5）`,"p");sfx("buff");
      break;}
    case "psy1":{
      const t=at(r,c);
      if(!t)break;
      const cells=ALL8.map(([dr,dc])=>[t.r+dr,t.c+dc])
        .filter(([rr,cc])=>inB(rr,cc)&&!at(rr,cc)
          &&(t.owner!=="P"||t.type==="kemono"||colorOk("P",t.id,rr,cc))
          &&(t.owner!=="E"||colorOk("E",t.id,rr,cc)));
      if(cells.length===0)break;
      UI.ability={type:"psy2",piece:p,target:t};
      UI.targets=new Set(cells.map(x=>x.join(",")));
      render();return;}
    case "psy2":{
      if(!takeActionSlot(p))break;
      p.ap--;
      const t=ab.target;
      log(`超能力者の念動！${pieceLabel(t)}を動かした`,"p");
      enterSquare(t,r,c);
      sfx("move");
      clearAbility();
      processRespawns(()=>render());
      return;}
    case "swap1":{
      const t=at(r,c);
      if(!t)break;
      const partners=G.pieces.filter(x=>!x.dead&&x.owner===t.owner&&x.id!==t.id&&!(x.flags.invisible&&x.owner!=="P"));
      if(partners.length===0)break;
      UI.ability={type:"swap2",piece:p,first:t};
      UI.targets=new Set(partners.map(x=>x.r+","+x.c));
      render();return;}
    case "swap2":{
      const t=at(r,c);
      if(!t||t.owner!==ab.first.owner)break;
      if(!takeActionSlot(p))break;
      p.ap--;
      p.hp=r2(p.hp-0.5);   // 魔女はスキル使用でHP-0.5
      const a=ab.first;
      const ar=a.r,acn=a.c;
      a.r=t.r;a.c=t.c;t.r=ar;t.c=acn;
      log(`魔女の入替魔法！${PIECES[a.type].name}と${PIECES[t.type].name}が入れ替わった（魔女HP-0.5）`,"p");
      sfx("swap");
      if(p.hp<=0)killPiece(p,null,"self"); // HP消費で倒れる場合
      break;}
    case "bomb":{
      if(!takeActionSlot(p))break;
      p.ap--;
      G.bombs.push({owner:"P",r,c,fuse:1});
      log("爆弾を設置した（次の自分手番終了時に爆発）","p");sfx("pick");
      break;}
  }
  clearAbility();
  render();
}
function clearAbility(){
  UI.mode=(G.phase==="action")?"action":"attack";
  UI.ability=null;UI.targets=new Set();
}

   盤面クリック
   ========================================================= */
function onCell(r,c){
  if(G.over)return;
  const key=r+","+c;
  switch(UI.mode){
    case "setup-place":
      if(UI.targets.has(key))placePlayerPiece(r,c);
      return;
    case "respawn-place":
      if(UI.targets.has(key))placeRespawn(r,c);
      return;
    case "maou":{
      if(!UI.targets.has(key))return;
      const t=at(r,c);
      if(t&&t.owner==="E")UI.extra.cb(t);
      return;}
    case "shield":{
      const s=UI.extra.piece;
      if(UI.targets.has(key)){
        s.flags.block={r,c};
        log("盾兵が防御方向を構えた","p");sfx("pick");
        UI.extra.next();
      }
      return;}
    case "ability":
      resolveAbilityClick(r,c);return;
    case "meteorTarget":{
      // 着弾候補（赤いマス）から1つ選んで着弾させる
      if(!UI.targets.has(key))return;
      const meteorId=UI.ability&&UI.ability.meteorId;
      resolveMeteorImpact(meteorId,r,c);
      // 着弾後は通常の行動フェーズへ（隕石は行動力を消費して昇っていたので、この手番は隕石以外で行動）
      UI={mode:"action",sel:null,targets:new Set(),ability:null,extra:{}};
      setPhaseBar('<span class="turnP">あなたの手番 — 行動フェーズ（駒1体を選んで移動／能力）</span>');
      processRespawns(()=>{ saveTurnSnapshot(); render(); if(NET.on){netSend("go");} });
      return;}
    case "meteorTargetEnd":{
      // ターンエンド時の着弾：着弾地点を選び、着弾後にターン終了処理を続ける
      if(!UI.targets.has(key))return;
      const meteorId=UI.ability&&UI.ability.meteorId;
      resolveMeteorImpact(meteorId,r,c);
      UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
      render();
      processRespawns(()=>{ if(G.over)return; finishPlayerTurnCore(); });
      return;}
    case "watch":{
      const p=at(r,c);
      if(p&&!(p.flags.invisible&&p.owner==="E")){UI.sel=p.id;sfx("pick");}
      else UI.sel=null;
      render();return;}
    case "action":{
      const p=at(r,c);
      // 自駒選択
      if(p&&p.owner==="P"){
        if(G.currentActor!==null&&G.currentActor!==p.id&&G.slotsLeft<=0){
          // 行動中の駒以外は選べない（情報表示のみ）
          UI.sel=p.id;sfx("pick");render();return;
        }
        UI.sel=p.id;sfx("pick");render();return;
      }
      // 敵駒選択（効果の確認のみ）
      if(p&&p.owner==="E"&&!p.flags.invisible){
        UI.sel=p.id;sfx("pick");render();return;
      }
      // 移動先クリック
      if(UI.sel!==null){
        const a=byId(UI.sel);
        if(a&&a.owner==="P"){
          const steps=stepOptions(a).map(x=>x.join(","));
          const jumps=jumpOptions(a).map(x=>x.join(","));
          const canActHere=G.slotsLeft>0||G.currentActor===a.id;
          if(canActHere&&steps.includes(key)){
            if(!takeActionSlot(a))return;
            const fr=a.r,fc=a.c;
            tryStep(a,r,c);
            if(!a.dead)logMove(a,fr,fc);
            else if(G.currentActor===a.id)G.currentActor=null; // 行動中の駒が死んだら主体を解除（進行不能を防ぐ）
            processRespawns(()=>render());
            return;
          }
          if(canActHere&&jumps.includes(key)){
            if(!takeActionSlot(a))return;
            const fr=a.r,fc=a.c;
            if(a.type==="taka"){
              a.ap-=1;
              a.flags.takaJumped=true;   // 跳躍で行動済み＝以後は残行動力を捨てて攻撃してもよい
              enterSquare(a,r,c);
              // 着地先の隣にさらに飛び越えられる駒があれば行動力+1（その1で再跳躍/移動できる）
              if(!a.dead && takaCanChainFrom(a,a.r,a.c)){ a.ap+=1; log("鷹が飛び越えた！さらに跳べる（行動力+1）","p"); }
              else log("鷹が飛び越えた！","p");
            }
            else { a.ap-=2; log("騎馬が跳躍した！","p"); enterSquare(a,r,c); }
            sfx("move");
            if(!a.dead)logMove(a,fr,fc);
            else if(G.currentActor===a.id)G.currentActor=null; // 行動中の駒が死んだら主体を解除
            processRespawns(()=>render());
            return;
          }
        }
      }
      UI.sel=null;render();return;}
    case "attack":{
      const p=at(r,c);
      if(p&&p.owner==="P"){
        UI.sel=p.id;sfx("pick");render();return;
      }
      if(UI.sel!==null){
        const a=byId(UI.sel);
        if(a&&a.owner==="P"&&!a.flags.noAttack){
          const cells=normalAttackCells(a).map(x=>x.join(","));
          if(cells.includes(key)){
            const t=visAt(r,c,"P");
            if(t&&t.owner==="E"){
              G.attackUsed=true;
              performAttack(a,t,"melee");
              UI={mode:"idle",sel:null,targets:new Set(),ability:null,extra:{}};
              render();
              afterPlayerAttack();
              return;
            }
          }
        }
      }
      // 敵駒選択（効果の確認のみ）
      if(p&&p.owner==="E"&&!p.flags.invisible){
        UI.sel=p.id;sfx("pick");render();return;
      }
      UI.sel=null;render();return;}
  }
}

/* =========================================================
   CPUの学習（端末内保存）
   ・localStorageの固定キーに保存するため、HTMLを更新しても同じURLなら消えない
   ・直近30戦ぶんの対戦記録を保持（古いものから削除）。統計はこの30戦から集計
   ・CPUが撃破数で負けた瞬間、倒れた駒の過去15手の盤面から「決定的だった局面」と
     その時CPUが指した「敗着」を特定して記憶。同じ／近い盤面ではその手を候補から外す
   ========================================================= */
const LEARN_KEY="koujousen.cpuLearn";
const LEARN_MAX_GAMES=30;   // 対戦記録の保持数
const LEARN_PLY_MAX=15;     // 敗着分析で遡る手数
const LEARN_NEAR_MAX=4;     // 近似盤面とみなす盤面差の上限
let LEARN=null, LEARN_AGG=null;
let LEARN_FX={advMul:1, danger:{}, conf:0};   // 探索で使う学習係数（AI手番開始時に更新）
function learnDefault(){return {v:2,hist:[]};}
function learnNewRec(){return {t:Date.now(),res:"",kP:0,kE:0,pPick:{},pKill:{},eRes:{},pAdv:0,pRet:0,eTypes:[],lessons:[]};}
function learnFixRec(r){
  // 項目が増減しても壊れないよう、型が合う項目だけ取り込む
  const b=learnNewRec();
  for(const k in b){ const v=r[k]; if(v!==undefined && v!==null && typeof v===typeof b[k] && Array.isArray(v)===Array.isArray(b[k])) b[k]=v; }
  if(r.legacy){ b.legacy=true; b.n=+r.n||0; b.cpuWins=+r.cpuWins||0; b.pWins=+r.pWins||0; }
  b.lessons=b.lessons.filter(l=>l&&Array.isArray(l.b)&&l.mv&&typeof l.mv.t==="string");
  return b;
}
function learnLoad(){
  if(LEARN)return LEARN;
  const L=learnDefault();
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LEARN_KEY)||"null"); }catch(e){}
  if(d&&typeof d==="object"){
    if(Array.isArray(d.hist)){
      L.hist=d.hist.filter(r=>r&&typeof r==="object").map(learnFixRec).slice(-LEARN_MAX_GAMES);
    }else if(typeof d.games==="number"&&d.games>0){
      // 旧形式（累計のみ）からの引き継ぎ：1件の「過去の累計」記録として保持
      L.hist.push(learnFixRec({legacy:true,n:Math.min(d.games,LEARN_MAX_GAMES),cpuWins:d.cpuWins,pWins:d.pWins,
        pPick:d.pPick,pKill:d.pKill,eRes:d.eRes,pAdv:d.pAdv,pRet:d.pRet}));
    }
  }
  LEARN=L; LEARN_AGG=null; return L;
}
function learnSave(){
  LEARN_AGG=null;
  const L=learnLoad();
  for(let tries=0;tries<6;tries++){
    try{ localStorage.setItem(LEARN_KEY,JSON.stringify(L)); return; }
    catch(e){
      // 容量不足：古い記録の盤面履歴から削っていく
      const r=L.hist.find(h=>h.lessons.some(l=>l.plies));
      if(r){ for(const l of r.lessons)delete l.plies; continue; }
      if(L.hist.length>1){ L.hist.shift(); continue; }
      return;
    }
  }
}
function learnActive(){ return !(typeof NET!=="undefined"&&NET.on); }  // CPU戦のみ学習
function learnInc(obj,k,n){ obj[k]=(obj[k]||0)+(n||1); }
/* 今の対局の記録（初回アクセス時に作成して履歴へ追加。30戦を超えたら古いものを削除） */
function learnCur(){
  const L=learnLoad();
  if(!G.learnRec || !L.hist.includes(G.learnRec)){
    // 途中で放棄された中身のない記録は掃除
    L.hist=L.hist.filter(r=>r.legacy||r.res||r.lessons.length);
    G.learnRec=learnNewRec();
    L.hist.push(G.learnRec);
    while(L.hist.length>LEARN_MAX_GAMES)L.hist.shift();
  }
  return G.learnRec;
}
/* 30戦ぶんの記録から統計を集計 */
function learnAgg(){
  if(LEARN_AGG)return LEARN_AGG;
  const L=learnLoad();
  const A={games:0,cpuWins:0,pWins:0,pPick:{},pKill:{},eRes:{},pAdv:0,pRet:0,lessons:0,records:L.hist.length};
  const er=t=>A.eRes[t]||(A.eRes[t]={g:0,w:0,k:0,d:0});
  for(const r of L.hist){
    const done=(r.res==="E"||r.res==="P");
    if(r.legacy){ A.games+=r.n; A.cpuWins+=r.cpuWins; A.pWins+=r.pWins; }
    else if(done){ A.games++; if(r.res==="E")A.cpuWins++; else A.pWins++; }
    for(const t in r.pPick)learnInc(A.pPick,t,r.pPick[t]);
    for(const t in r.pKill)learnInc(A.pKill,t,r.pKill[t]);
    A.pAdv+=r.pAdv; A.pRet+=r.pRet;
    for(const t in r.eRes){ const s=r.eRes[t]||{}, a=er(t); a.k+=s.k||0; a.d+=s.d||0; a.g+=s.g||0; a.w+=s.w||0; }
    if(done&&!r.legacy) for(const t of r.eTypes){ const a=er(t); a.g++; if(r.res==="E")a.w++; }
    A.lessons+=r.lessons.length;
  }
  return LEARN_AGG=A;
}
/* 学習度：対戦数に応じて0→1へ（10戦で最大）。対戦するほど学習結果を強く使う */
function learnConf(){ return Math.min(1,learnAgg().games/10); }
function learnRecordPick(type){
  if(!learnActive()||(typeof randomDeal!=="undefined"&&randomDeal))return;
  learnInc(learnCur().pPick,type); learnSave();
}
function learnRecordKill(victim,src){
  if(!learnActive()||!src||!victim||src.owner===victim.owner)return;
  if(victim.type==="kemono"||src.type==="kemono")return;
  const R=learnCur(), er=t=>R.eRes[t]||(R.eRes[t]={k:0,d:0});
  if(victim.owner==="E"){ learnInc(R.pKill,src.type); er(victim.type).d++; }
  else { er(src.type).k++; }
  learnSave();
}
function learnRecordMove(p,fr){
  if(!learnActive()||!p||p.owner!=="P")return;
  const R=learnCur();
  if(p.r<fr)R.pAdv++; else if(p.r>fr)R.pRet++;   // 上（敵陣側）へ＝前進
}
function learnRecordGameEnd(winner){
  if(!learnActive()||G.learnDone)return;
  G.learnDone=true;
  const R=learnCur();
  R.res=winner; R.kP=G.kills.P; R.kE=G.kills.E;
  R.eTypes=(G.eTypesUsed||[]).slice();
  learnSave();
}
/* CPU駒の戦績ボーナス（よく勝つ／よく倒す駒を選びやすく） */
function learnPieceBonus(type){
  const r=learnAgg().eRes[type]; if(!r)return 0;
  let perf=((r.k-r.d)+(2*r.w-r.g))/(r.g+3);
  perf=Math.max(-1.5,Math.min(1.5,perf));
  return perf*22*learnConf();
}
/* あなたが選びそうな駒（よく使う駒＋CPUをよく倒した駒）を重み付きで返す */
function learnPredictedFoes(){
  const A=learnAgg(), w={};
  let tp=0; for(const t in A.pPick)tp+=A.pPick[t];
  let tk=0; for(const t in A.pKill)tk+=A.pKill[t];
  for(const t in A.pPick) w[t]=(w[t]||0)+A.pPick[t]/Math.max(1,tp);
  for(const t in A.pKill) w[t]=(w[t]||0)+0.6*A.pKill[t]/Math.max(1,tk);
  return Object.keys(w).filter(t=>PIECES[t]).map(t=>({type:t,w:w[t]})).sort((a,b)=>b.w-a.w).slice(0,4);
}
/* 探索で使う学習係数を更新（AI手番開始時） */
function learnRefreshFX(){
  const A=learnAgg(), conf=learnConf();
  const mv=A.pAdv+A.pRet;
  let advMul=1;
  if(mv>=30){
    const aggr=A.pAdv/mv;
    if(aggr>0.62)advMul=1-0.15*conf;        // 攻めてくる相手：待ち構えて迎撃寄りに
    else if(aggr<0.42)advMul=1+0.15*conf;   // 守る相手：こちらから詰める
  }
  let tk=0; for(const t in A.pKill)tk+=A.pKill[t];
  const danger={};
  if(tk>=3){ for(const t in A.pKill) danger[t]=Math.min(0.5,A.pKill[t]/tk)*conf; }
  LEARN_FX={advMul,danger,conf};
}

/* ---------- 敗着の記憶 ---------- */
/* 手番開始時の盤面を記録（直近15手＋現在） */
function learnSnap(side){
  if(!learnActive()||!G||G.over)return;
  if(!G.lrnPly)G.lrnPly=[];
  G.lrnPly.push({side, st:ssFromGame("P"), mv:null});   // 分析用に完全情報で保存
  while(G.lrnPly.length>LEARN_PLY_MAX+1)G.lrnPly.shift();
}
/* CPUがその手番で指した手を記録 */
function learnNoteCpuMove(plan){
  if(!learnActive()||!plan||!G.lrnPly||!G.lrnPly.length)return;
  const ply=G.lrnPly[G.lrnPly.length-1];
  if(ply.side!=="E"||ply.mv)return;
  const p=byId(plan.pieceId); if(!p)return;
  const d=(plan.path&&plan.path.length)?plan.path[plan.path.length-1]:[p.r,p.c];
  ply.mv={pid:p.id,t:p.type,fr:p.r,fc:p.c,dr:d[0],dc:d[1],ab:plan.ability?plan.ability.kind:"-",
          ak:learnAbDetail(plan.ability,id=>{const q=byId(id);return q&&!q.dead?[q.r,q.c]:null;})};
}
/* 能力の「どこへ／誰に」を盤面の位置で表す（同じ能力でも対象が違えば別の手として覚えるため） */
function learnAbDetail(ab,posOf){
  if(!ab)return null;
  const cells=[]; let x="";
  if(ab.tr!=null)cells.push([ab.tr,ab.tc]);
  if(ab.sr!=null)cells.push([ab.sr,ab.sc]);
  for(const id of [ab.targetId,ab.aId,ab.bId]){ if(id==null)continue; const ps=posOf(id); if(ps)cells.push(ps); }
  for(const sh of (ab.shots||[]))cells.push([sh.tr,sh.tc]);
  for(const m of (ab.moves||[]))cells.push([m.r,m.c]);
  if(ab.col!=null)x="col"+ab.col+":"+ab.dir;
  if(ab.row!=null)x="row"+ab.row+":"+ab.dir;
  if(ab.toType)x+="to:"+ab.toType;
  return {cells,x};
}
function learnAbKey(ak,mir){
  if(!ak)return null;
  const cells=ak.cells.map(([r,c])=>[r,mir?5-c:c]).map(a=>a.join(",")).sort().join(";");
  let x=ak.x||"";
  if(mir&&x.startsWith("col")){ const m=x.match(/^col(\d+):(-?\d+)(.*)$/); if(m)x="col"+(5-+m[1])+":"+m[2]+m[3]; }
  return cells+"|"+x;
}
/* 盤面の記号化（CPUから見える駒のみ：透明化した相手の忍者は除く） */
function learnSig(st){
  return st.ps.filter(p=>!(p.o==="P"&&p.invis)).map(p=>[p.o==="E"?1:0,p.t,p.r,p.c,p.hp])
    .sort((a,b)=>(a[0]-b[0])||(a[1]<b[1]?-1:a[1]>b[1]?1:0)||(a[2]-b[2])||(a[3]-b[3]));
}
function learnMirrorSig(b){ return b.map(x=>[x[0],x[1],x[2],5-x[3],x[4]]); }
function learnMirrorMv(m){ return {...m,fc:5-m.fc,dc:5-m.dc}; }
function learnSameBoard(a,b){ return a.length===b.length && a.every((x,i)=>x[0]===b[i][0]&&x[1]===b[i][1]&&x[2]===b[i][2]&&x[3]===b[i][3]&&x[4]===b[i][4]); }
/* 盤面差：同じ陣営・同じ駒種どうしを近い順に対応づけ、位置ずれ＋HP差を合計。対応しない駒は1体3 */
function learnBoardDist(a,b,cap){
  const used=new Array(b.length).fill(false);
  let d=0;
  for(const x of a){
    let bi=-1,bd=1e9;
    for(let i=0;i<b.length;i++){
      if(used[i])continue; const y=b[i];
      if(y[0]!==x[0]||y[1]!==x[1])continue;
      const dd=Math.abs(y[2]-x[2])+Math.abs(y[3]-x[3])+Math.abs(y[4]-x[4]);
      if(dd<bd){bd=dd;bi=i;}
    }
    if(bi<0)d+=3; else {used[bi]=true; d+=bd;}
    if(d>cap)return d;
  }
  for(const u of used)if(!u)d+=3;
  return d;
}
/* CPUが撃破数で負けた時：倒れた駒の過去15手から決定的な局面と敗着を特定して記憶 */
function learnOnCpuLoss(victim,force){
  if(!learnActive()||!G.lrnPly||!G.lrnPly.length)return;
  // CPU自身の手番中に倒れた（例：魔女の入替で自滅）場合は、その手番で取り返せたかを見てから判断する
  if(!force && G.turn==="E"){ (G.lrnPendingLoss||(G.lrnPendingLoss=[])).push(victim); return; }
  const plies=G.lrnPly.slice(-(LEARN_PLY_MAX+1));
  // CPUの手の直後、その駒が「相手の次の手番で討ち取られうる」状態になっていたか
  const lethalAfter=i=>{
    const nx=plies[i+1]; if(!nx)return true;              // その手番中に倒れた
    const v=nx.st.ps.find(x=>x.id===victim.id); if(!v)return true;
    const dg=ssPlayerThreat(ssClone(nx.st))[v.r+","+v.c]||0;
    return dg>=v.hp-1e-9;
  };
  // 直近から遡り、危険な状態が続いている区間の「最初のCPUの手」＝決定的な局面
  let di=-1;
  for(let i=plies.length-1;i>=0;i--){
    const pl=plies[i];
    if(!pl.st.ps.some(x=>x.id===victim.id))break;          // まだ召喚されていない
    if(pl.side!=="E"||!pl.mv)continue;
    if(lethalAfter(i)){ di=i; continue; }
    if(di<0)di=i;                                          // 予測外の撃破：直前のCPUの手を敗着とみなす
    break;
  }
  if(di<0)return;
  const pl=plies[di];
  const b=learnSig(pl.st);
  const R=learnCur();
  // 同じ盤面・同じ手が既に記憶済みなら重みを上げるだけ
  for(const r of learnLoad().hist)for(const l of r.lessons){
    if(l.mv.t===pl.mv.t&&l.mv.fr===pl.mv.fr&&l.mv.fc===pl.mv.fc&&l.mv.dr===pl.mv.dr&&l.mv.dc===pl.mv.dc&&l.mv.ab===pl.mv.ab&&learnSameBoard(l.b,b)){
      l.n=Math.min(9,(l.n||1)+1); learnSave();
      log(`敵軍AIは同じ敗着を再び記憶に刻んだ（${PIECES[victim.type].name}の喪失）`,"s");
      return;
    }
  }
  R.lessons.push({b, mv:pl.mv, vt:victim.type, n:1, kP:G.kills.P, kE:G.kills.E,
    back:plies.length-1-di,                                 // 撃破の何手前の局面か
    plies:plies.map(x=>({s:x.side,b:learnSig(x.st),mv:x.mv}))});  // 撃破までの15手の盤面
  learnSave();
  const mvTxt=`${PIECES[pl.mv.t].name}の${cellName(pl.mv.fr,pl.mv.fc)}→${cellName(pl.mv.dr,pl.mv.dc)}`;
  log(`[[learn]] 敵軍AIは敗着を記憶した：${plies.length-1-di}手前の${mvTxt}`,"s");
}
/* 現局面に当てはまる記憶（敗着）を列挙：同じ盤面・近い盤面・左右反転した盤面 */
function learnLessonsFor(root){
  if(!learnActive())return [];
  const cur=learnSig(root);
  const out=[];
  for(const r of learnLoad().hist)for(const l of r.lessons){
    for(const mir of [false,true]){
      const mv=mir?learnMirrorMv(l.mv):l.mv;
      // 敗着を指した駒が同じ位置に居ることが前提
      const mover=root.ps.find(p=>p.o==="E"&&p.t===mv.t&&p.r===mv.fr&&p.c===mv.fc);
      if(!mover)continue;
      const d=learnBoardDist(mir?learnMirrorSig(l.b):l.b,cur,LEARN_NEAR_MAX);
      if(d>LEARN_NEAR_MAX)continue;
      const sim=d===0?1:d<=1?0.7:d<=2?0.5:d<=3?0.35:0.2;
      out.push({pid:mover.id,dr:mv.dr,dc:mv.dc,ab:mv.ab,akKey:l.mv.ak?learnAbKey(l.mv.ak,mir):null,sim,exact:d===0,n:Math.min(3,l.n||1)});
    }
  }
  return out;
}
/* 候補手に対する敗着ペナルティ（同一盤面の敗着は事実上候補から除外） */
function learnLessonPenalty(lessons,pid,dr,dc,ab,exactPen,nearPen,akKey){
  let pen=0;
  for(const l of lessons){
    if(l.pid!==pid||l.dr!==dr||l.dc!==dc||l.ab!==(ab||"-"))continue;
    if(l.akKey&&akKey&&l.akKey!==akKey)continue;   // 同じ能力でも対象・行き先が違えば別の手
    pen=Math.max(pen, l.exact?exactPen:nearPen*l.sim*l.n);
  }
  return pen;
}

function aiWeightedPick(exclude){
  const pool=PICKABLE.filter(t=>!(exclude||[]).includes(t));
  let total=0;for(const t of pool)total+=(AI_WEIGHTS[t]||2);
  let r=Math.random()*total;
  for(const t of pool){r-=(AI_WEIGHTS[t]||2);if(r<=0)return t;}
  return pool[0];
}
function aiPickComposition(){
  // 実際の駒種は配置時に盤面を見て決めるため、ここではプレースホルダのみ返す
  return [null,null,null];
}
function aiPickRespawnType(){
  // 撃破されて出し直す駒は、盤面の相性を見て選ぶ（相手の主力に強い駒を出す）。
  // ランダム選出戦では「1点取られた後に何を出すか」が重要なので、相手構成へのカウンターを重視。
  const foes=alive("P").filter(p=>!p.flags.invisible);
  const mine=alive("E").map(p=>p.type);
  const hasRanged=mine.some(t=>t==="kyuhei"||t==="sogeki");
  const behind = G.kills.P>G.kills.E; // 点を先行されている（＝取り返しに行く必要）
  let best=null,bestScore=-1e9;
  for(const type of PICKABLE){
    if(type==="yusha"&&mine.includes("yusha"))continue; // 勇者は1体まで
    let s=(AI_WEIGHTS[type]||2)*3 + Math.random()*8;
    const isRanged=(type==="kyuhei"||type==="sogeki");
    // 遠距離が盤面に無ければ1枚は欲しいが、既にあるなら増やしすぎない
    if(!hasRanged && isRanged)s+=25;
    if(hasRanged && isRanged)s-=35;
    // 同種の重複を避ける
    s-=mine.filter(t=>t===type).length*50;
    // --- 相手構成へのカウンター ---
    for(const f of foes){
      const ft=aiSeenType(f);
      s+=aiSetupCounter(type,ft);   // 配置と同じ相性表
      // 相手が瀕死なら、それを仕留められる火力を出す
      if(f.hp<=1 && ["kenshi","senshi","kiba","kyuketsuki"].includes(type))s+=18;
    }
    // 点を取り返しに行く必要がある時は、攻撃的な駒を優先
    if(behind && ["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(type))s+=20;
    if(s>bestScore){bestScore=s;best=type;}
  }
  return best||aiWeightedPick([]);
}
/* 初手配置：今出ている駒（自分・相手）を考慮して、この手番で置く駒種を選ぶ */
/* 後手（先に殴られた側）からでも殴り勝てる駒。不死鳥は復活が残っている時 */
const AI_LATE_STRONG=["kenshi","senshi","kyuketsuki","kusushi","fushicho","kaizoku"];
/* 相手の駒 ft に対する、駒 type の相性点（配置・召喚で共通） */
function aiSetupCounter(type,ft){
  // 自動対戦のデータによる相性の補正（手作りの相性表が主。データは小さめに足す）
  let s=Math.max(-18,Math.min(18,((AI_SIM_COUNTER[type]&&AI_SIM_COUNTER[type][ft])||0)*150));
  const isRanged=(type==="kyuhei"||type==="sogeki");
  const highAp=["kiba","ninja","boken","inoshishi"].includes(type);   // 行動力2の駒
  // 相手の近接主力（後手でも殴り勝てる駒）：触らずに削る遠距離、足を止める術士、攻撃を封じる悪霊
  if(["kenshi","senshi","kyuketsuki","fushicho","kusushi"].includes(ft)){
    if(isRanged)s+=40;
    if(type==="jutsushi"||type==="akuryo")s+=30;
    if(type==="esper")s+=15;
  }
  // 相手の機動の強襲（騎馬・忍者・冒険者・鷹）：先に殴られても殴り勝てる駒で迎え撃つ
  if(["kiba","ninja","boken","taka"].includes(ft)){
    if(AI_LATE_STRONG.includes(type))s+=35;
  }
  // 相手の遠距離（弓・狙撃）：行動力に関わる駒（巫女・術士）と、行動力の高い駒で一気に詰める
  if(ft==="kyuhei"||ft==="sogeki"){
    if(highAp)s+=35;
    if(type==="kaizoku"||type==="taka")s+=25;   // 8方向・飛び越えで射線外から寄る
    if(type==="miko")s+=35;                      // 味方の行動力+1で射程まで踏み込ませる
    if(type==="jutsushi")s+=30;                  // 遠距離の行動力を0にして射撃させない
  }
  // 相手の術士：減らされた行動力を巫女で補う
  if(ft==="jutsushi"){
    if(type==="miko")s+=35;
  }
  // 相手の巫女（2マス移動・移動しながら能力・2回射撃が可能になる要注意駒）：
  // 術士で巫女を止める、機動駒で後衛の巫女を突く
  if(ft==="miko"){
    if(type==="jutsushi")s+=35;
    if(highAp||type==="kaizoku"||type==="taka")s+=20;
  }
  // 相手が超能力者・魔女など盤面操作系なら、粘る駒や妨害で対応
  if(ft==="esper"||ft==="majo"){
    if(type==="fushicho")s+=20;
    if(type==="jutsushi")s+=18;
  }
  // 相手が勇者を置いたら（将来の覚醒に備え）粘りを少し評価
  if(ft==="yusha"){
    if(type==="fushicho")s+=18;
  }
  // 盾兵には飛び越え・8方向機動で背後を取る
  if(ft==="tatehei"){
    if(type==="taka")s+=30;
    if(type==="kaizoku"||type==="kiba")s+=20;
  }
  // 調教師：獣ではなく本体を突ける強襲
  if(ft==="chokyo"){
    if(type==="kiba"||type==="ninja"||type==="boken")s+=20;
  }
  return s;
}
function aiChooseSetupType(){
  const myPlaced=alive("E").map(p=>p.type);      // 自分が既に置いた駒
  const foesPlaced=alive("P").map(p=>aiSeenType(p));    // 相手が既に置いた駒（詐欺師は偽装先に見える）
  const idx=G.setupCount.E;                        // 何体目か（0,1,2）
  const remaining=3-idx;                           // 残り配置数（この手番含む）
  const hasRanged=myPlaced.some(t=>t==="kyuhei"||t==="sogeki");

  let CANDS=["kenshi","senshi","kiba","souhei","kyuhei","sogeki","kyuketsuki",
               "tatehei","jutsushi","akuryo","esper","fushicho","yusha","wanashi",
               "jusoshi","majo","bakudan","miko","gunshi","kusushi","chokyo",
               "boken","seishoku","ninja",
               "inoshishi","kaizoku","taka",
                    "inseki","uchujin","ryoushu","sagishi","kitsune","kami"];  // 新規駒もCPUが選んで使う
  if(myPlaced.some(t=>t==="yusha"))CANDS=CANDS.filter(t=>t!=="yusha"); // 勇者は1駒まで
  const scored=[];
  for(const type of CANDS){
    let s=(AI_WEIGHTS[type]||2)*5;               // 基本の強さ（対人戦ティア＋シミュレーション）
    s+=Math.random()*10;

    // --- 遠距離の確保：遠距離が無ければ優先するが、毎回必須にはしない ---
    const isRanged=(type==="kyuhei"||type==="sogeki");
    if(!hasRanged){
      if(isRanged) s+= (remaining===1?30:12); // 遠距離が無ければ少しだけ優先（以前は+60/+120で毎回必ず選んでいた）
    }else{
      if(isRanged) s-=25; // 既に遠距離持ち → もう1枚は控えめに抑制
    }

    // --- 同種の重複を避ける（多様性）---
    const dup=myPlaced.filter(t=>t===type).length;
    s-=dup*70;

    // --- 相手の駒への相性（カウンター）---
    for(const ft of foesPlaced) s+=aiSetupCounter(type,ft);
    // --- 学習：あなたが次に出してきそうな駒（よく使う・よくCPUを倒す駒）にも先回りで備える ---
    const lc=learnConf();
    if(lc>0){ for(const pf of learnPredictedFoes()){ if(!foesPlaced.includes(pf.type)) s+=aiSetupCounter(type,pf.type)*pf.w*lc*1.5; } }
    s+=learnPieceBonus(type); // 学習：この端末で戦績の良い駒を優先
    // --- 自軍の編成シナジー ---
    // 前衛アタッカーが居るなら、支援・妨害役を足すとバランスが良い
    const myAttackers=myPlaced.filter(t=>["kenshi","senshi","kiba","souhei","kyuketsuki"].includes(t)).length;
    if(myAttackers>=1 && ["jutsushi","akuryo","esper","kusushi","miko","gunshi","majo"].includes(type))s+=20;
    // まだアタッカーが居ないなら近接/遠距離アタッカーを優先
    if(myAttackers===0 && ["kenshi","senshi","kiba","souhei","kyuketsuki","kaizoku","taka","inoshishi","boken","ninja"].includes(type))s+=15;

    scored.push({type,s});
  }
  // 最高点の駒だけを選ぶと毎回同じ編成になるため、点数に応じた確率で選ぶ（全ての駒に出番がある）
  return aiSoftPick(scored,AI_SETUP_TEMP)||aiWeightedPick([]);
}
/* 点数に応じた確率で選ぶ（点数差 temp ごとに選ばれやすさ約2.7倍） */
const AI_SETUP_TEMP=12, AI_RESPAWN_TEMP=22;
function aiSoftPick(list,temp){
  if(!list.length)return null;
  const mx=Math.max(...list.map(x=>x.s));
  const w=list.map(x=>Math.exp((x.s-mx)/temp));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0)return list[i].type; }
  return list[0].type;
}
function aiPlaceSetup(){
  // 盤面を見てこの手番の駒種を決定
  const type=aiChooseSetupType();
  const prefer=[1,4,2,3,0,5];
  let col=null;
  for(const c of prefer){
    if(at(0,c)||territoryOwnerAt(0,c)==="P")continue;
    if(G.setupCount.E===2&&!colorOkPlacement("E",c))continue;
    col=c;break;
  }
  if(col===null){for(let c=0;c<6;c++)if(!at(0,c)){col=c;break;}}
  const p=makePiece(type,"E",0,col);
  if(type==="esper")p.flags.esperMode=aiEsperModeFor(0,col,alive("P").filter(f=>!f.flags.invisible));
  if(type==="sagishi")p.flags.disguiseAs=aiPickDisguise();
  if(type==="yusha" && alive("P").length){
    const t=aiPickMaou(alive("P"));
    p.flags.maouId=t.id;
    log("敵の勇者が密かに魔王を指定した…","e",true);
  }
  G.pieces.push(p);

  log(`敵軍：${PIECES[p.flags.disguiseAs||type].name}を配置`,"e");
  sfx("place");
}

/* --- 脅威マップ：プレイヤーが次ターンに攻撃できるマスと最大ダメージ --- */
function playerThreatMap(){
  const map={};
  const mark=(r,c,d)=>{if(!inB(r,c))return;const k=r*6+c;if(!map[k]||map[k]<d)map[k]=d;};
  for(const f0 of alive("P")){
    const f=aiSeenType(f0)!==f0.type?{...f0,type:aiSeenType(f0),maxAp:PIECES[aiSeenType(f0)].ap}:f0; // 詐欺師は偽装先として見る
    if(f.flags.invisible)continue; // AIは透明駒を知らない
    if(f.type==="kemono")continue; // 獣は脅威マップに含めない（倒す価値がなく、逃げる対象にしない）
    const reach=reachSquares(f,f.maxAp,true);
    const dM=atkDamage(f,"melee"),dR=atkDamage(f,"ranged");
    for(const [r,c] of reach){
      if(!PIECES[f.type].noNormal){
        const dirs=f.type==="souhei"?DIAG:ORTHO;
        for(const [dr,dc] of dirs)mark(r+dr,c+dc,dM);
      }
      if(f.type==="kyuhei"||f.type==="sogeki"){
        for(const [rr,cc] of rangedCellsFrom(f,r,c))mark(rr,cc,dR);
      }
    }
  }
  // プレイヤーの流星群：着弾候補のマスは「そこに居ると倒される」マス、その十字は0.5ダメ
  for(const m of (G.meteors||[])){
    if(m.owner!=="P")continue;
    for(const cl of m.cells){ mark(cl.r,cl.c,9); for(const [dr,dc] of ORTHO)mark(cl.r+dr,cl.c+dc,0.5); }
  }
  return map;
}
/* プレイヤーの流星群の着弾候補マスか（fuse：着弾までの残り。0なら次のプレイヤーの手番終了時に着弾） */
function pMeteorAt(r,c){
  let best=null;
  for(const m of (G.meteors||[])){ if(m.owner!=="P")continue; if(m.cells.some(cl=>cl.r===r&&cl.c===c)){ const f=m.fuse==null?0:m.fuse; if(best===null||f<best)best=f; } }
  return best;
}
/* BFS到達範囲（自駒・敵駒で遮断、色制約は緩く無視可） */
function reachSquares(p,maxSteps,loose){
  const seen=new Set([p.r+","+p.c]);
  const out=[[p.r,p.c]];
  let frontier=[[p.r,p.c]];
  const dirs=moveDirs(p);
  for(let s=0;s<maxSteps;s++){
    const nf=[];
    for(const [r,c] of frontier){
      for(const [dr,dc] of dirs){
        let nr=r+dr,nc=c+dc;
        if(p.type==="boken")nc=(nc+6)%6;
        if(!inB(nr,nc))continue;
        const k=nr+","+nc;
        if(seen.has(k))continue;
        if(visAt(nr,nc,p.owner))continue;
        if(!loose&&!colorOk(p.owner,p.id,nr,nc))continue;
        seen.add(k);nf.push([nr,nc]);out.push([nr,nc]);
      }
    }
    frontier=nf;
  }
  return out;
}
/* BFS（経路つき・色制約あり） */
function reachWithPaths(p){
  const start=p.r+","+p.c;
  const res={[start]:{cost:0,path:[]}};
  let frontier=[[p.r,p.c]];
  const dirs=moveDirs(p);
  for(let s=0;s<p.ap;s++){
    const nf=[];
    for(const [r,c] of frontier){
      const cur=res[r+","+c];
      for(const [dr,dc] of dirs){
        let nr=r+dr,nc=c+dc;
        if(p.type==="boken")nc=(nc+6)%6;
        if(!inB(nr,nc))continue;
        const k=nr+","+nc;
        if(res[k]){
          // CPU：同じ手数なら、罠がありそうなマスを避けた経路を採用
          if(p.owner==="E"&&res[k].cost===cur.cost+1&&(cur.risk||0)<(res[k].prisk||0)-1e-9){
            res[k].path=[...cur.path,[nr,nc]]; res[k].prisk=cur.risk||0;
            res[k].risk=1-(1-(cur.risk||0))*(1-trapProbAt(nr,nc));
          }
          continue;
        }
        if(visAt(nr,nc,p.owner))continue;
        if(!colorOk(p.owner,p.id,nr,nc))continue;
        const pr=cur.risk||0;
        res[k]={cost:cur.cost+1,path:[...cur.path,[nr,nc]],prisk:pr,risk:p.owner==="E"?1-(1-pr)*(1-trapProbAt(nr,nc)):0};
        nf.push([nr,nc]);
      }
    }
    frontier=nf;
  }
  // 騎馬の跳躍
  if(p.type==="kiba"&&p.ap>=2){
    for(const [dr,dc] of ALL8){
      const mr=p.r+dr,mc=p.c+dc,nr=p.r+dr*2,nc=p.c+dc*2;
      if(!inB(mr,mc)||!inB(nr,nc))continue;
      if(!visAt(mr,mc,p.owner))continue;
      if(visAt(nr,nc,p.owner))continue;
      if(!colorOk(p.owner,p.id,nr,nc))continue;
      const k=nr+","+nc;
      if(!res[k]||res[k].cost>2)res[k]={cost:2,path:[[nr,nc]],jump:true};
    }
  }
  // 鷹の飛び越え（行動力1）。連続飛び越え（着地の隣にさらに障害物があれば行動力+1）も経路(hops)つきで
  if(p.type==="taka"&&p.ap>=1){
    const obstacle=(r,c)=>{ const q=at(r,c); return (q&&q.id!==p.id)||wallAt(r,c); };
    const canLand=(r,c)=>inB(r,c)&&!obstacle(r,c)&&!territoryBlocks(p.owner,r,c)&&colorOk(p.owner,p.id,r,c);
    const jumpsFrom=(r0,c0)=>{ const o=[]; for(const [dr,dc] of ALL8){ if(!inB(r0+dr,c0+dc)||!obstacle(r0+dr,c0+dc))continue; const lr=r0+dr*2,lc=c0+dc*2; if(canLand(lr,lc))o.push([lr,lc]); } return o; };
    const put=(r,c,hops)=>{ const k=r+","+c; if(!res[k]||res[k].cost>1||(res[k].hops&&res[k].hops.length>hops.length))res[k]={cost:1,path:[[r,c]],jump:true,hops}; };
    const walk=(r0,c0,hops,depth)=>{
      put(r0,c0,hops);
      const js=jumpsFrom(r0,c0); if(!js.length||depth>3)return;   // 連続できなければここで終わり
      for(const [lr,lc] of js){ if(hops.some(h=>h.r===lr&&h.c===lc))continue; walk(lr,lc,[...hops,{r:lr,c:lc,jump:true}],depth+1); }
      for(const [dr,dc] of ALL8){ const sr=r0+dr,sc=c0+dc; if(canLand(sr,sc))put(sr,sc,[...hops,{r:sr,c:sc,jump:false}]); }
    };
    for(const [nr,nc] of jumpsFrom(p.r,p.c)) walk(nr,nc,[{r:nr,c:nc,jump:true}],1);
  }
  return res;
}
/* 鷹の連続飛び越えの経路を実行 */
function aiRunHops(p,hops){
  for(const h of hops){
    if(p.dead)return;
    if(h.jump){ if(!aiDoJump(p,h.r,h.c))return; }
    else { if(p.ap<1||visAt(h.r,h.c,"E"))return; tryStep(p,h.r,h.c); }
  }
}
/* CPUの跳躍を実行（騎馬：行動力2／鷹：行動力1＋連続跳躍で+1）。実ゲームのプレイヤー操作と同じ処理 */
function aiDoJump(p,r,c){
  const cost=p.type==="taka"?1:2;
  if(p.ap<cost)return false;
  p.ap-=cost;
  if(p.type==="taka")p.flags.takaJumped=true;
  enterSquare(p,r,c); sfx("move");
  if(p.type==="taka"&&!p.dead&&takaCanChainFrom(p,p.r,p.c)){ p.ap+=1; log("敵の鷹が飛び越えた！さらに跳べる","e"); }
  else log(`敵の${PIECES[p.type].name}が${p.type==="taka"?"飛び越えた":"跳躍した"}！`,"e");
  return true;
}

/* やさしいモード：全候補手を1手先の評価で並べ、70%で最善・20%で2番手・10%で3番手を選ぶ */
function aiEasyPlan(){
  const prep=ssBestPrepare(); if(!prep)return null;
  const sc=prep.applied.filter(a=>a.acts).map(a=>({a,v:ssEval(a.state)-a.repPenalty})).sort((x,y)=>y.v-x.v);
  if(!sc.length)return null;
  const r=Math.random(); let i=r<0.7?0:r<0.9?1:2;
  if(i>=sc.length)i=0;
  if(sc[0].v>=1e6)i=0;   // 勝ちが決まる手だけは見逃さない
  return deepPlanFromRes({plan:sc[i].a.plan}).plan;
}
/* プランが「何もしない（移動なし・攻撃なし・能力なし）」かどうか */
function planIsIdle(plan){
  if(!plan)return true;
  const hasMove=plan.path&&plan.path.length>0;
  return !hasMove && !plan.ability && !plan.attack;
}
