    return;
  }
  // 詐欺師の表示：敵軍のものは偽装先として、自軍のものは詐欺師＋偽装先の注記を表示
  let I=PIECES[p.type];
  let extraNote="";
  if(p.type==="sagishi" && p.flags.disguiseAs){
    if(p.owner==="E"){ I=PIECES[p.flags.disguiseAs]; } // 相手には偽装先の情報を見せる
    else { extraNote=`<div class="desc" style="color:#e7c457">（${PIECES[p.flags.disguiseAs].name}として偽装中）</div>`; }
  }
  let html=`<span class="pname">${I.name}</span>
    <span class="stat">${p.owner==="P"?"自軍":"敵軍"}／HP ${fmt(p.hp)}／行動力 ${p.ap}/${p.maxAp}</span>`;
  // 現在ついているバフ・デバフを表示
  const st=pieceStatuses(p);
  if(st.length){
    html+='<div class="statusRow">';
    for(const s of st) html+=`<span class="statusTag ${s.cls}">${s.label}</span>`;
    html+='</div>';
  }
  html+=`<div class="desc">${I.desc}</div>`+extraNote;
  el.innerHTML=html;
  if(p.owner==="P"&&UI.mode!=="ability"){
    const btns=abilityButtons(p);
    if(btns.length){
      const wrap=document.createElement("div");wrap.className="abilBtns";
      for(const b of btns){
        const bb=document.createElement("button");
        bb.className="act";bb.innerHTML=b.label;bb.disabled=!b.enabled;
        bb.onclick=b.fn;
        wrap.appendChild(bb);
      }
      el.appendChild(wrap);
    }
  }
  if(UI.mode==="ability"){
    const note=document.createElement("div");
    note.style.cssText="margin-top:6px;color:var(--gold);font-size:12px";
    note.textContent="光っているマス／駒を選択してください（盤外をタップでキャンセル）";
    el.appendChild(note);
  }
}

/* =========================================================
   モーダル
   ========================================================= */
function openModal(title,bodyHtml,buttons){
  $("#modalTitle").textContent=title;
  { const m=$("#modal"); if(m&&m.classList)m.classList.remove("wide"); }
  $("#modalBody").innerHTML=bodyHtml;
  const bt=$("#modalBtns");bt.innerHTML="";
  for(const b of buttons||[]){
    const e=document.createElement("button");
    e.className="act"+(b.cls?" "+b.cls:"");
    e.textContent=b.label;e.onclick=b.fn;
    bt.appendChild(e);
  }
  $("#modalBack").classList.remove("hidden");
}
function closeModal(){$("#modalBack").classList.add("hidden");}
let pickerArgs=null;
const PK_ROLES=[
  {k:"all",label:"全て",col:""},
  {k:"sortie",label:"近接",col:"#d9a441"},
  {k:"assault",label:"強襲",col:"#e0603e"},
  {k:"intercept",label:"遠距離",col:"#5aa0e6"},
  {k:"control",label:"支援・妨害",col:"#9a7ae0"},
];
function pkRoleOf(t){ return (typeof PIECE_ROLE!=="undefined"&&PIECE_ROLE[t])||"sortie"; }
function pkRoleCol(t){ const r=PK_ROLES.find(x=>x.k===pkRoleOf(t)); return r?r.col:"#d9a441"; }
function openPiecePicker(title,cb,opts){
  opts=opts||{};
  pickerArgs={title,cb,opts};
  // 勇者は1駒制限：自軍に既にいれば選べない（隕石の個数制限は解除）
  const hasYusha=(typeof G!=="undefined"&&G&&G.pieces)?alive("P").some(p=>p.type==="yusha"):false;
  const excludeSet=new Set(opts.exclude||[]);
  const list = PICKABLE.filter(t=>!excludeSet.has(t));
  let role="all", query="", selT=null;
  const isLocked=t=>(t==="yusha"&&hasYusha);
  const tilesHtml=()=>{
    const q=query.trim().toLowerCase();
    let html='<div class="pickGrid2">', shown=0;
    for(const t of list){
      const I=PIECES[t];
      if(role!=="all" && pkRoleOf(t)!==role)continue;
      if(q){ const hay=(I.name+" "+(I.k||"")+" "+(I.desc||"")).toLowerCase(); if(!hay.includes(q))continue; }
      shown++;
      html+=`<div class="pTile${isLocked(t)?" locked":""}${selT===t?" sel":""}" data-t="${t}">
        <i class="pr" style="background:${pkRoleCol(t)}"></i><span class="pa">${I.ap}</span>
        <div class="pIcon">${I.k||I.name[0]}</div><div class="pn">${I.name}</div></div>`;
    }
    if(shown===0)html+='<div style="grid-column:1/-1;padding:12px;opacity:.7">該当する駒がありません</div>';
    return html+"</div>";
  };
  const detailHtml=()=>{
    if(!selT)return '<div class="pkDetail empty">駒をタップすると詳細を表示（もう一度タップで決定）</div>';
    const I=PIECES[selT], lk=isLocked(selT);
    const roleLabel=(PK_ROLES.find(x=>x.k===pkRoleOf(selT))||{}).label||"";
    const meta=`行動力${I.ap}・HP${I.maxHp||3}${I.noNormal?"・通常攻撃不可":""}・${roleLabel}`;
    return `<div class="pkDetail"><div class="pIcon big">${I.k||I.name[0]}</div><div class="dx">
      <div class="dn">${I.name}<span class="dm">${meta}</span></div>
      <div class="dd">${lk?"すでに勇者が場にいるため選べません":I.desc}</div>
      ${lk?"":`<button class="act primary go" id="pkGo">${I.name}に決定</button>`}</div></div>`;
  };
  const chipsHtml=()=>PK_ROLES.map(r=>`<span class="pkChip${role===r.k?" on":""}" data-r="${r.k}">${r.col?`<i style="background:${r.col}"></i>`:""}${r.label}</span>`).join("");
  const html=`<div class="pkTop"><input id="pieceSearch" type="text" placeholder="駒を検索（名前・能力）" autocomplete="off"></div>
    <div class="pkChips" id="pkChips">${chipsHtml()}</div>
    <div id="pickCards">${tilesHtml()}</div><div id="pkDet">${detailHtml()}</div>`;
  openModal(title,html,[{label:"盤面を確認する",fn:()=>{closeModal();showPeekBack();}}]);
  { const m=$("#modal"); if(m&&m.classList)m.classList.add("wide"); }
  const choose=t=>{ if(!t||isLocked(t))return; sfx("pick");pickerArgs=null;hidePeekBack();closeModal();cb(t); };
  const refresh=()=>{
    const pc=$("#pickCards"); if(pc)pc.innerHTML=tilesHtml();
    const dt=$("#pkDet"); if(dt)dt.innerHTML=detailHtml();
    const ch=$("#pkChips"); if(ch)ch.innerHTML=chipsHtml();
    bind();
  };
  const bind=()=>{
    $("#modalBody").querySelectorAll(".pTile").forEach(el=>{
      el.onclick=()=>{
        const t=el.dataset.t;
        if(selT===t && !isLocked(t)){ choose(t); return; } // 2回目のタップで決定
        selT=t; refresh();
      };
    });
    $("#modalBody").querySelectorAll(".pkChip").forEach(el=>{ el.onclick=()=>{ role=el.dataset.r; refresh(); }; });
    const go=$("#pkGo"); if(go)go.onclick=()=>choose(selT);
  };
  bind();
  const sb=$("#pieceSearch");
  if(sb){ sb.oninput=()=>{ query=sb.value; refresh(); }; }
}
function showPeekBack(){
  hidePeekBack();
  const b=document.createElement("button");
  b.id="peekBack";b.className="act primary";b.innerHTML=icon("tri")+" 駒の選択に戻る";
  b.onclick=()=>{hidePeekBack();if(pickerArgs)openPiecePicker(pickerArgs.title,pickerArgs.cb,pickerArgs.opts);};
  document.body.appendChild(b);
}
function hidePeekBack(){
  const b=document.getElementById("peekBack");
  if(b)b.remove();
}

function showHelp(){
  let rows="";
  for(const t of PICKABLE){
    const I=PIECES[t];
    rows+=`<tr><th>${I.name}<br><small style="color:var(--sub)">行${I.ap}</small></th><td>${I.desc}</td></tr>`;
  }
  openModal("ルール",`
   <div class="ruleSec"><h3>勝利条件</h3><p>相手の駒を<b>2つ</b>倒したら勝利。駒は倒されると即座に新しい駒を手前の段に召喚できます（種類変更可）。</p></div>
   <div class="ruleSec"><h3>盤面と色の制約</h3><p>6×6の盤は左右で色が分かれています。<b>自分の主力3駒が同じ色の陣に全て揃う配置・移動は禁止</b>です。</p></div>
   <div class="ruleSec"><h3>ターンの流れ</h3><p>① 行動フェーズ：<b>必ず駒1体を選び、行動力を消費して</b>移動（1マス=行動力1）や能力使用を行います（行動できる駒が1体もいない場合のみスキップ可）。<br>② 攻撃フェーズ：駒1体（移動した駒以外でも可）で通常攻撃。基本は縦横の隣接マスに1ダメージ。<br>③ ターンエンド。全駒HP3、HP0以下で撃破。</p></div>
   <div class="ruleSec"><h3>駒一覧（全24種）</h3><table>${rows}</table></div>
   <div class="ruleSec"><h3>このアプリでの裁定メモ</h3>
     <p>・行動フェーズでは選んだ駒の行動力をすべて消費するまで攻撃フェーズに進めません（移動先や能力対象が一切ない場合を除く）。<br>・射程内に敵がいない遠距離攻撃など、対象のない能力は使用できません。<br>・敵の駒をタップすると効果を確認できます。<br>・術士／悪霊の能力は行動力0で使用できます（毎ターン1回）。残った行動力は移動か「待機」で消費します。<br>・薬師の調合と聖職者の祈祷は各1回限り。<br>・勇者は再召喚時にも魔王を指定できます。<br>・盾兵の防御指定は毎ターン攻撃フェーズ後に変更可（縦横4マスから選択）。<br>・移動と能力は行動力の範囲で同一ターンに併用できます。</p></div>
  `,[{label:"閉じる",cls:"primary",fn:closeModal}]);
}

function showStart(){
  cleanupNet();
  openModal("攻 城 戦",`
    <p style="text-align:center;letter-spacing:.1em;color:#d9cdb2">三つの駒で戦場へ。<br>敵の駒を二つ討ち取れば勝利。</p>
    <div id="dealModeBox" style="margin:4px 0 10px;padding:8px;background:var(--panel2);border-radius:8px;font-size:14px">
      <div style="text-align:center;margin-bottom:6px">${icon("dice")} 駒の決め方</div>
      <label class="dealOpt"><input type="radio" name="dealMode" value="free"> 自由に選ぶ（3体とも交互に選出）</label>
      <label class="dealOpt"><input type="radio" name="dealMode" value="half"> 半ランダム（2体ずつ無作為に配り、3体目を先手から選ぶ）</label>
      <label class="dealOpt"><input type="radio" name="dealMode" value="random"> ランダム配布（3体とも無作為）</label>
    </div>
    ${learnSummaryHtml()}
    <div class="ruleSec"><h3>ソロプレイ（AI対戦）</h3>
      <div class="choiceList">
        <button class="act" id="lvEasy">やさしい — 時々ゆるい手を指す</button>
        <button class="act" id="lvNormal">ふつう — 数手先まで読む（最大6秒・相手の手が多い局面は最大13秒）</button>
        <button class="act" id="lvStrong">つよい — 時間いっぱい（最大20秒・相手の手が多い局面は最大30秒）深く読む</button>
      </div>
    </div>
    <div class="ruleSec"><h3>オンライン対戦（ルームコード）</h3>
      <div class="choiceList">
        <button class="act primary" id="btnHost">ルームを作る — コードを発行</button>
        <button class="act primary" id="btnJoin">ルームに参加 — コードを入力</button>
      </div>
      <p style="color:var(--sub);font-size:12px;margin:6px 0 0">同じコードを入力した相手とリアルタイムで対戦できます。先手はランダムに決まります。オンラインではルームを作った側の「駒の決め方」が適用されます。</p>
    </div>
    <p style="color:var(--sub);font-size:12px;text-align:center">右上の「？」でいつでもルールと駒一覧を確認できます。</p>
  `,[]);
  learnBindButtons();
  { const r=document.querySelector(`input[name="dealMode"][value="${dealMode}"]`); if(r)r.checked=true; }
  const syncRnd=()=>{ const r=document.querySelector('input[name="dealMode"]:checked'); dealMode=r?r.value:"free"; randomDeal=(dealMode==="random"); };
  $("#lvEasy").onclick=()=>{syncRnd();aiLevel="easy";closeModal();newGame();};
  $("#lvNormal").onclick=()=>{syncRnd();aiLevel="normal";closeModal();newGame();};
  $("#lvStrong").onclick=()=>{syncRnd();aiLevel="strong";closeModal();newGame();};
  $("#btnHost").onclick=()=>{syncRnd();closeModal();hostRoom();};
  $("#btnJoin").onclick=()=>{syncRnd();closeModal();joinRoom();};
}

/* ---------- boot ---------- */
$("#helpBtn").onclick=showHelp;
const syncMuteIcon=()=>{$("#muteBtn").innerHTML=icon(soundOn?"soundOn":"soundOff");};
syncMuteIcon();
$("#muteBtn").onclick=()=>{soundOn=!soundOn;syncMuteIcon();};
{ const zl=$("#zoneLabel"); if(zl)zl.innerHTML=`<span>${icon("tri",-90)} 左陣</span><span>右陣 ${icon("tri",90)}</span>`; }
showStart();
</script>
